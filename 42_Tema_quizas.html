<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic 42 — Workplace Security Measures</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>Topic 42 — Workplace Security Measures</h1><div class="subtitle">Endpoint equipment, mobile devices, centralized management and remote work security</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 42 temos tema?", "a": ["Darbo vietų apsaugos priemonės", "ZTNA", "Tinklo perimetro apsauga", "DNS ir DHCP"], "c": 0}, {"q": "Kokia paskaitos trukmė?", "a": ["8 valandos", "2 valandos", "6 valandos", "4 valandos"], "c": 1}, {"q": "Koks paskaitos formatas?", "a": ["Teorija", "Teorija + praktika", "Tik praktika", "Diskusija + egzaminas"], "c": 0}, {"q": "Kuri tema nagrinėjama paskaitoje?", "a": ["Tik DNS", "Darbo vietų įranga", "Tik serverių apsauga", "Tik tinklo ugniasienės"], "c": 1}, {"q": "Kuri kita tema nagrinėjama?", "a": ["Tik el. paštas", "Virtualios darbo vietos", "Tik duomenų centrai", "Tik fiziniai serveriai"], "c": 1}, {"q": "Kokia darbo iš namų tema nagrinėjama?", "a": ["Darbo iš namų kuriami iššūkiai ir jų mitigavimas", "Tik Wi-Fi", "Tik SaaS kūrimas", "Tik VPN protokolai"], "c": 0}, {"q": "Kokia dažniausia darbo vietos įrangos kombinacija?", "a": ["Darbo išduotas nešiojamasis kompiuteris ir mobilusis telefonas", "Tik mobilusis telefonas", "Stacionarus kompiuteris ir serveris", "Planšetė ir spausdintuvas"], "c": 0}, {"q": "Kokia periferinė įranga minima?", "a": ["Tik projektorius", "Tik USB atmintinė", "Monitorius, klaviatūra ir pelė", "Tik skaitytuvas"], "c": 2}, {"q": "Kodėl stacionarūs kompiuteriai mažiau populiarūs?", "a": ["Jie neturi operacinės sistemos", "Jie negali naudoti interneto", "Jie suteikia mažiau lankstumo dirbti ne iš biuro", "Jie negali naudoti aplikacijų"], "c": 2}, {"q": "Kas tipiškai įdiegta darbuotojo kompiuteryje?", "a": ["Tik naršyklė", "Tik VPN", "Tik antivirusinė", "Operacinė sistema ir bendradarbiavimo aplikacijos"], "c": 3}, {"q": "Kuri aplikacijų kategorija minima kaip bendradarbiavimo priemonė?", "a": ["Tik DNS klientas", "Tik SIEM", "El. paštas ir nuotolinių susitikimų programinė įranga", "Tik FTP"], "c": 2}, {"q": "Koks biuro programinės įrangos tipas minimas?", "a": ["Tik VPN klientas", "Biuro programų paketas", "Tik grafikos redaktorius", "Tik IDE"], "c": 1}, {"q": "Ar kai kuriais atvejais naudojama specifinė programinė įranga?", "a": ["Taip, pagal konkrečias darbo funkcijas", "Ne", "Tik IT skyriuje", "Tik serveriuose"], "c": 0}, {"q": "Kas įprastai administruoja kompiuterio operacinę sistemą?", "a": ["Tik interneto tiekėjas", "Tik gamintojas", "Tik pats darbuotojas", "Centralizuotai organizacijos IT skyrius arba IT partneris"], "c": 3}, {"q": "Ką dar galima pasiekti iš darbo kompiuterio be vietinės programinės įrangos?", "a": ["Tik DHCP", "Tik BIOS", "Nutolusias įmonės serveriuose ar SaaS esančias aplikacijas", "Tik vietinius failus"], "c": 2}, {"q": "Kokios operacinės sistemos tipiškai naudojamos mobiliuosiuose įrenginiuose?", "a": ["Linux arba BSD", "DOS arba UNIX", "Android arba iOS", "Windows Server arba Ubuntu Server"], "c": 2}, {"q": "Kodėl mobiliųjų įrenginių apsauga ypač svarbi?", "a": ["Telefonai nenaudojami darbui", "Telefonai negali būti pamesti", "Telefonai neturi aplikacijų", "Iš telefono galima pasiekti visas ar beveik visas įmonės aplikacijas"], "c": 3}, {"q": "Kokia papildoma funkcija gali būti atliekama mobiliuoju telefonu?", "a": ["SIEM funkcija", "STP valdiklio funkcija", "DNS serverio funkcija", "MFA įrenginio funkcija"], "c": 3}, {"q": "Kokia dar funkcija kai kuriais atvejais gali būti atliekama telefonu?", "a": ["DHCP serveris", "DNS resolveris", "Praėjimo kontrolė", "VPN koncentratorius"], "c": 2}, {"q": "Ar mobilusis įrenginys gali būti naudojamas ir asmeniniams, ir darbo reikalams?", "a": ["Taip", "Ne", "Tik Android", "Tik iOS"], "c": 0}, {"q": "Koks idealus požiūris į darbo ir asmeninius mobiliuosius telefonus?", "a": ["Naudoti tik asmeninį telefoną", "Juos visiškai atskirti", "Naudoti vieną bendrą profilį", "Nenaudoti MFA"], "c": 1}, {"q": "Kokia alternatyva gali būti naudojama, jei telefonai neatskiriami?", "a": ["Tik antivirusinė", "Atskiras darbinis telefono profilis arba atskiros darbinės aplikacijos", "Tik VPN", "Tik DNS"], "c": 1}, {"q": "Ką reiškia resursų izoliavimas darbiniame profilyje?", "a": ["Darbinės aplikacijos ištrinamos", "Visos aplikacijos gali prieiti prie visko", "Tik asmeninės aplikacijos turi prieigą", "Darbinės aplikacijos negali prieiti prie asmeninių aplikacijų ir atvirkščiai"], "c": 3}, {"q": "Kokia sistema naudojama telefonų valdymui?", "a": ["SIEM", "NAC", "DLP", "MDM"], "c": 3}, {"q": "Ką reiškia MDM?", "a": ["Mobile Domain Manager", "Main Device Module", "Mobile Device Management", "Managed Data Monitoring"], "c": 2}, {"q": "Kokia tapatybių valdymo priemonė minima kompiuterių apsaugai?", "a": ["Active Directory", "Nmap", "Wireshark", "OpenVPN"], "c": 0}, {"q": "Kuri kita tapatybių sistema minima?", "a": ["OPNsense", "Apache", "MySQL", "Entra ID"], "c": 3}, {"q": "Kuri kita priemonė minima centralizuotam tapatybių valdymui?", "a": ["LACP", "GCPW", "SPF", "DMARC"], "c": 1}, {"q": "Kokia priemonė naudojama centralizuotam konfigūracijos parametrų valdymui?", "a": ["ARP", "AD GPO", "DNS", "SMTP"], "c": 1}, {"q": "Kuri kita konfigūracijos valdymo priemonė minima?", "a": ["OpenVPN", "Wireshark", "WireGuard", "Ivanti"], "c": 3}, {"q": "Kuri kita konfigūracijos valdymo priemonė minima?", "a": ["Intune", "Apache", "Nmap", "Kerberos"], "c": 0}, {"q": "Kuri automatizavimo priemonė minima konfigūracijai valdyti?", "a": ["SMTP", "STP", "IMAP", "Ansible"], "c": 3}, {"q": "Kokia prieigos teisių praktika rekomenduojama?", "a": ["Nenaudoti tapatybių valdymo", "Leisti visus vartotojus", "Griežta prieigos teisių kontrolė ir administratoriaus teisių draudimas lokaliame įrenginyje", "Visiems suteikti administratoriaus teises"], "c": 2}, {"q": "Kokia duomenų saugos priemonė minima kompiuteriui?", "a": ["Tik DNS", "Tik DHCP", "Tik MAC spoofing", "Kaupiklio šifravimas"], "c": 3}, {"q": "Kokia priežiūros priemonė minima?", "a": ["Reguliarus operacinės sistemos ir programinės įrangos atnaujinimas", "Tik DNS atnaujinimas", "Atnaujinimų išjungimas", "Tik BIOS keitimas"], "c": 0}, {"q": "Kokia papildoma programinė įranga gali būti naudojama nuo grėsmių?", "a": ["Tik DNS", "Tik SMTP", "Antivirusinės sistemos, EDR ir ZTNA agentai", "Tik DHCP"], "c": 2}, {"q": "Kokia kita fizinė apsaugos priemonė minima kompiuteriams?", "a": ["Tik VPN", "Tik IP adresų keitimas", "Tik DNS", "Fizinių įrenginių prijungimo apribojimai"], "c": 3}, {"q": "Kas yra GPO?", "a": ["Klasikinės Active Directory sistemos dalis, skirta konfigūruoti vartotojų ir Windows įrenginių parametrus", "VPN protokolas", "DNS įrašas", "Antivirusinė sistema"], "c": 0}, {"q": "Ką gali konfigūruoti GPO?", "a": ["Tik DHCP", "Tik DNS", "Operacinės sistemos nustatymus ir aplikacijų diegimą", "Tik VPN"], "c": 2}, {"q": "Kokia fizinės darbo vietos grėsmė ypač aktuali viešose vietose?", "a": ["STP loop", "Jautrios informacijos nuskaitymas žiūrint per darbuotojo petį", "DNS spoofing", "DHCP exhaustion"], "c": 1}, {"q": "Kokia priemonė naudojama apsisaugoti nuo žvilgsnio per petį?", "a": ["Fizinis ekrano privatumo filtras", "Tik DNS", "Tik VPN", "Tik antivirusinė"], "c": 0}, {"q": "Ką dar gali turėti kai kurie kompiuteriai?", "a": ["Integruotą DHCP", "Integruotą SIEM", "Integruotą DNS", "Integruotą ePrivacy funkciją"], "c": 3}, {"q": "Kas yra Glance Privacy Guard pagal medžiagą?", "a": ["MDM sistema", "Funkcija, galinti automatiškai paslėpti informaciją, kai kamera aptinka per petį stebintį žmogų", "VPN protokolas", "Antivirusinė"], "c": 1}, {"q": "Kodėl reikia fiziškai saugoti ir patį kompiuterį?", "a": ["Jis turi vertę kaip inventorius, be informacijos jame", "Tik dėl VPN", "Nes jame nėra informacijos", "Tik dėl DNS"], "c": 0}, {"q": "Kokia fizinė priemonė minima kompiuteriui prirakinti?", "a": ["MDM", "USB raktas", "Kensington spyna", "VPN"], "c": 2}, {"q": "Koks pagrindinis darbo iš namų iššūkis?", "a": ["Namuose nėra interneto", "Namuose dažnai nėra daugumos biure įdiegtų saugumo sprendimų", "Namuose nėra kompiuterių", "Namuose neveikia SaaS"], "c": 1}, {"q": "Ko organizacijos tikisi iš darbuotojų dirbant iš namų?", "a": ["Kad nebūtų naudojamos aplikacijos", "Kad užduotys būtų atliekamos taip pat sėkmingai kaip biure", "Kad būtų naudojamas tik telefonas", "Kad nebūtų naudojamas internetas"], "c": 1}, {"q": "Koks idealus darbo iš namų principas?", "a": ["Darbuotojas turi kiekvieną kartą kreiptis į IT", "Darbuotojas turi naudoti tik asmeninį kompiuterį", "Darbuotojas turi išjungti saugos priemones", "Darbuotojas turėtų dirbti įprastai su minimaliu papildomu įsikišimu"], "c": 3}, {"q": "Ką turi užtikrinti darbo vietos konfigūracija?", "a": ["Visišką prieigą prie visko", "Tik DNS", "Tik VPN", "Priimtiną saugumo lygį arba neleisti prieiti prie jautrios įmonės informacijos"], "c": 3}, {"q": "Kur gali būti talpinamos įmonės informacinės sistemos?", "a": ["Vidiniame įmonės tinkle arba viešai/SaaS aplinkoje", "Tik telefone", "Tik vietiniame kompiuteryje", "Tik USB"], "c": 0}, {"q": "Ko reikia norint pasiekti vidiniame tinkle esančias sistemas iš išorės?", "a": ["Tik GPO", "Tik MDM", "Atsidurti organizacijos vidiniame tinkle, pvz., naudojant VPN", "Tik DNS"], "c": 2}, {"q": "Kokią papildomą apsaugą VPN suteikia naudojantis viešu interneto ryšiu?", "a": ["Tik DNS vardų keitimą", "Tik antivirusinę", "Tik DHCP", "Papildomą apsaugos sluoksnį"], "c": 3}, {"q": "Kokiai aplikacijų kategorijai gali būti taikomas ZTNA?", "a": ["SaaS tipo aplikacijoms, pasiekiamoms per viešąjį internetą", "Tik USB aplikacijoms", "Tik vietinėms DOS programoms", "Tik BIOS"], "c": 0}, {"q": "Kokią prieigą gali suteikti ZTNA?", "a": ["Prieigą tik iš įmonės patvirtintų ir valdomų įrenginių, atitinkančių saugumo kriterijus", "Tik iš viešo Wi-Fi", "Tik iš asmeninių telefonų", "Prieigą iš bet kurio įrenginio"], "c": 0}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
