<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}

*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}

</style></head><body><div class="container">

<script>

 SaaS atveju"], "c": 2}, {"q": "Ar aplikacija gali būti pasiekiama per viešąjį internetą ir vis tiek naudojama ZTNA principu?", "a": ["Tik su VPN", "Tik su DHCP", "Ne", "Taip"], "c": 3}, {"q": "Su kokia sistema ZTNA sprendimai reikalauja integracijos?", "a": ["Tik DNS sistema", "Tapatybės sistema", "Tik DHCP sistema", "Tik SIEM"], "c": 1}, {"q": "Koks papildomas komponentas gali būti reikalingas ZTNA sprendimui?", "a": ["Reverse Proxy", "STP bridge", "DNS cache", "DHCP relay"], "c": 0}, {"q": "Kas dar gali būti naudojama vartotojo įrenginyje ZTNA sprendimui?", "a": ["Naršyklės įskiepis arba agentas", "Tik FTP klientas", "Tik antivirusinė", "Tik DNS klientas"], "c": 0}, {"q": "Ar ZTNA yra griežtai apibrėžtas terminas?", "a": ["Ne", "Tik OpenZiti atveju", "Taip", "Tik VPN atveju"], "c": 0}, {"q": "Ką reiškia tai, kad ZTNA nėra griežtai apibrėžtas terminas?", "a": ["Egzistuoja skirtingos sprendimo implementacijos", "ZTNA negalima įdiegti", "Yra tik vienas ZTNA produktas", "ZTNA veikia tik su VPN"], "c": 0}, {"q": "Kuri architektūra išskiriama kaip ZTNA sprendimas?", "a": ["Tik DHCP", "Tik DNS", "Tik tradicinis LAN", "Programiškai apibrėžtas perimetras (SDP)"], "c": 3}, {"q": "Kuri architektūra minima kaip ZTNA implementacija?", "a": ["Tik MPLS", "Pilno tinklo overlay tinklas", "Tik Wi-Fi", "Tik Ethernet"], "c": 1}, {"q": "Kuri proxy architektūra minima?", "a": ["DHCP proxy", "ARP proxy", "Atgaliniai proxy", "Forward-only DNS"], "c": 2}, {"q": "Kokia prieigos valdymo sistema minima tarp ZTNA architektūrų?", "a": ["Privilegijuotos prieigos valdymo (PAM) sistemos", "DLP", "EDR", "SIEM"], "c": 0}, {"q": "Kokia ugniasienės pagrindu paremta ZTNA architektūra minima?", "a": ["Cloud DHCP", "Perimetro DNS", "Host-based ugniasienėmis paremtas valdymas", "MAC spoofing"], "c": 2}, {"q": "Kokia kita ZTNA architektūra minima?", "a": ["Tapatybėmis paremtas tinklas", "MAC adresais paremtas DNS", "SMTP tinklas", "VLAN-only tinklas"], "c": 0}, {"q": "Nuo ko pradedamas ZTNA sprendimo diegimo pasiruošimas?", "a": ["DNS perkėlimu", "VPN išjungimu", "Reikalavimų surinkimu ir analize", "Aplikacijų trynimu"], "c": 2}, {"q": "Koks kitas svarbus ZTNA diegimo etapas?", "a": ["Tik IP adresų keitimas", "Technologinio sprendimo parinkimas", "Tik ugniasienės perkrovimas", "Tik vartotojų mokymas"], "c": 1}, {"q": "Kas identifikuojama prieš ZTNA diegimą?", "a": ["Tik MAC adresai", "Tik DNS įrašai", "Išankstiniai kriterijai ir trūkumai", "Tik slaptažodžiai"], "c": 2}, {"q": "Ką reikia inventorizuoti?", "a": ["Aplikacijas", "Tik kompiuterius", "Tik VPN klientus", "Tik ugniasienes"], "c": 0}, {"q": "Kas atliekama su inventorizuotomis aplikacijomis?", "a": ["Prioritetizavimas ir migravimo plano sudarymas", "Tik IP pakeitimas", "Jų ištrynimas", "Tik DNS pakeitimas"], "c": 0}, {"q": "Koks etapas atliekamas prieš sprendimo diegimą?", "a": ["Tik DNS valymas", "Sprendimo dizaino kūrimas", "Tik testinių vartotojų kūrimas", "Tik VPN blokavimas"], "c": 1}, {"q": "Kas atliekama sukūrus sprendimo dizainą?", "a": ["Tik dokumentacijos trynimas", "Tik DHCP perkrovimas", "Tik DNS migracija", "Sprendimo diegimas ir testavimas"], "c": 3}, {"q": "Koks galutinis vienas iš išvardytų pasiruošimo/diegimo etapų?", "a": ["STP konfigūravimas", "MAC spoofing", "SMTP išjungimas", "Aplikacijų konfigūravimas"], "c": 3}, {"q": "Kas yra OpenZiti pagal medžiagą?", "a": ["Atviro kodo tapatybe paremta valdymo sistema", "Komercinė antivirusinė", "Ugniasienė", "DNS serveris"], "c": 0}, {"q": "Kas prižiūri OpenZiti diegimą pagal pateiktą medžiagą?", "a": ["Tik Microsoft", "Tik DNS tiekėjas", "Tik OpenZiti tiekėjas", "Klientas"], "c": 3}, {"q": "Ar egzistuoja mokama ir SaaS OpenZiti versijos?", "a": ["Tik nemokama versija", "Ne", "Tik SaaS", "Taip"], "c": 3}, {"q": "Kokie pagrindiniai OpenZiti komponentai išvardyti?", "a": ["Tik proxy ir VPN", "Tik SIEM ir SOAR", "Tinklo valdiklis, srauto maršrutizatoriai, GUI, klientai ir BrowZer komponentai", "Tik DNS ir DHCP"], "c": 2}, {"q": "Koks OpenZiti komponentas valdo tinklo sprendimo logiką?", "a": ["BrowZer", "Tinklo valdiklis", "Klientas", "GUI tik"], "c": 1}, {"q": "Koks komponentas perduoda/maršrutizuoja srautą?", "a": ["DNS serveriai", "DHCP serveriai", "Srauto maršrutizatoriai", "SMTP serveriai"], "c": 2}, {"q": "Ar OpenZiti turi atskirai diegiamą grafinę vartotojo sąsają?", "a": ["Taip", "Tik Windows", "Tik SaaS versijoje", "Ne"], "c": 0}, {"q": "Kas yra OpenZiti klientai?", "a": ["Ugniasienės zonos", "Komponentai, naudojami klientų pusėje", "DNS įrašai", "Tapatybės politikos"], "c": 1}, {"q": "Kas yra BrowZer komponentai?", "a": ["VPN protokolai", "DNS serveriai", "DHCP klientai", "Komponentai, skirti konfigūracijai, kai autentifikacija vyksta tik naršyklėje"], "c": 3}, {"q": "Kokie loginiai OpenZiti elementai išskiriami atskirai?", "a": ["LAN, WAN ir VPN", "DNS, DHCP ir ARP", "Servisai, tapatybės ir politikos", "TCP, UDP ir IP"], "c": 2}, {"q": "Kuris iš šių yra OpenZiti loginis elementas?", "a": ["VLAN", "MX įrašas", "DNS zona", "Servisas"], "c": 3}, {"q": "Kuris kitas OpenZiti loginis elementas išskiriamas?", "a": ["TCP portas", "Tapatybė", "MAC adresas", "DHCP lease"], "c": 1}, {"q": "Kuris dar vienas OpenZiti loginis elementas išskiriamas?", "a": ["DNS cache", "IP kaukė", "Politika", "STP root"], "c": 2}, {"q": "Kokio tipo serveriuose pagal praktinę užduotį diegiami OpenZiti komponentai?", "a": ["Tik Windows Server", "Tik tinklo komutatoriuose", "Linux serveriuose", "Tik macOS"], "c": 2}, {"q": "Kiek Linux serverių aprašoma praktinėje veikloje?", "a": ["Trys", "Du", "Vienas", "Keturi"], "c": 1}, {"q": "Kam skirtas vienas iš praktikos Linux serverių?", "a": ["Tik DHCP", "Tik DNS", "Tik el. paštui", "OpenZiti komponentams diegti"], "c": 3}, {"q": "Kas veikia kitame Linux serveryje?", "a": ["DNS serveris", "SIEM", "Internetinė aplikacija", "SMTP serveris"], "c": 2}, {"q": "Kaip prie praktinės infrastruktūros prisijungiama?", "a": ["Per Guacamole", "Per DNS", "Per FTP", "Per SMTP"], "c": 0}, {"q": "Kaip diegiami OpenZiti komponentai?", "a": ["Kaip BIOS komponentai", "Kaip Docker konteineriai", "Kaip DNS įrašai", "Kaip Windows registry raktai"], "c": 1}, {"q": "Pagal ką diegiami OpenZiti Docker konteineriai?", "a": ["Pagal DHCP dokumentaciją", "Pagal SMTP specifikaciją", "Pagal DNS standartą", "Pagal OpenZiti dokumentaciją"], "c": 3}, {"q": "Koks OpenZiti komponentas turi atskirą diegimo quickstartą?", "a": ["OpenZiti valdiklis", "DNS serveris", "DHCP serveris", "STP valdiklis"], "c": 0}, {"q": "Koks kitas komponentas turi atskirą diegimo quickstartą?", "a": ["Web konsolė", "SMTP serveris", "DHCP relay", "VPN klientas"], "c": 0}, {"q": "Kas konfigūruojama, kad web serveris būtų pasiekiamas per OpenZiti?", "a": ["DHCP serveris", "DNS serveris", "SMTP serveris", "Web serveris"], "c": 3}, {"q": "Koks pagrindinis skirtumas tarp VPN ir ZTNA pagal pateiktą medžiagą?", "a": ["ZTNA neveikia su aplikacijomis", "ZTNA leidžia granuliariai valdyti prieigą prie konkrečių aplikacijų", "VPN nereikalauja autentifikacijos", "VPN visada suteikia granuliarią aplikacijų kontrolę"], "c": 1}, {"q": "Kuo ZTNA skiriasi nuo klasikinio tinklo segmento prieigos?", "a": ["Pakanka būti saugioje zonoje", "Pakanka būti LAN", "Prieiga vertinama konkrečiai aplikacijai", "Pakanka turėti IP adresą"], "c": 2}, {"q": "Kokia ZTNA prieigos kontrolės savybė pabrėžiama?", "a": ["Nuolatinis verifikavimas", "Tik IP patikra", "Tik MAC patikra", "Vienkartinė autorizacija"], "c": 0}, {"q": "Kokia tapatybės infrastruktūra svarbi ZTNA sprendimui?", "a": ["Tik DHCP", "Tapatybės sistema", "Tik STP", "Tik DNS"], "c": 1}, {"q": "Kuris komponentas gali būti naudojamas kaip tarpininkas tarp vartotojo ir aplikacijos?", "a": ["DHCP relay", "Reverse Proxy", "STP bridge", "DNS resolver"], "c": 1}, {"q": "Kuri ZTNA implementacija orientuota į programiškai apibrėžtą perimetrą?", "a": ["S2S", "PAM", "SDP", "P2P"], "c": 2}, {"q": "Kuri implementacija sudaro pilno tinklo overlay tinklą?", "a": ["Pilno tinklo overlay", "SDP", "Host firewall", "PAM"], "c": 0}, {"q": "Kuri implementacija paremta privilegijuotos prieigos valdymu?", "a": ["PAM", "SDP", "DNS", "DHCP"], "c": 0}, {"q": "Kuri implementacija paremta kompiuterio ugniasiene?", "a": ["SDP", "Host-based ugniasienėmis paremtas valdymas", "Reverse DNS", "S2S"], "c": 1}, {"q": "Kuri implementacija orientuota į tapatybes?", "a": ["DNS tinklas", "MAC tinklas", "DHCP tinklas", "Tapatybėmis paremtas tinklas"], "c": 3}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
