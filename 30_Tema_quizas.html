<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>30 tema — Asimetrinė kriptografija</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">

, "SHA-256", "CBC"], "c": 1}, {"q": "Kuris dar yra pateiktas kaip asimetrinis algoritmas?", "a": ["DES", "RC4", "AES", "ECDSA"], "c": 3}, {"q": "Kaip asimetrinis šifravimas susijęs su skaitmeniniu parašu?", "a": ["Jis įgalina skaitmeninio parašo funkcionalumą", "Jis naudojamas tik failų suspaudimui", "Jis panaikina parašo poreikį", "Jis pakeičia visas hash funkcijas"], "c": 0}, {"q": "Kaip asimetrinis šifravimas susijęs su skaitmeniniais sertifikatais?", "a": ["Sertifikatai naudojami tik Linux", "Sertifikatai nenaudoja raktų", "Sertifikatai yra tik hash reikšmės", "Jis įgalina jų funkcionalumą"], "c": 3}, {"q": "Koks asimetrinio šifravimo trūkumas nurodytas?", "a": ["Jis nenaudoja raktų", "Jis negali būti naudojamas internete", "Jis nenaudoja autentifikacijos", "Jis ženkliai lėtesnis už simetrinį šifravimą"], "c": 3}, {"q": "Kaip tipiškai naudojami asimetrinis ir simetrinis šifravimas kartu?", "a": ["Asimetrinis naudojamas kartu su simetriniu", "Visada naudojamas tik asimetrinis", "Jie negali būti naudojami kartu", "Visada naudojamas tik simetrinis"], "c": 0}, {"q": "Koks algoritmas pateikiamas kaip Diffie–Hellman pavyzdys?", "a": ["Diffie–Hellman", "AES", "RC4", "DES"], "c": 0}, {"q": "Kuo abi Diffie–Hellman pusės viešai apsikeičia pradžioje?", "a": ["Privataus rakto failais", "Sertifikatais", "a ir b slaptomis reikšmėmis", "p ir g reikšmėmis"], "c": 3}, {"q": "Kas Diffie–Hellman procese yra a ir b?", "a": ["Slaptos reikšmės", "Vieši raktai", "Vieši sertifikatai", "Hash reikšmės"], "c": 0}, {"q": "Ką šalys apsikeičia po slaptų a ir b reikšmių sugeneravimo?", "a": ["Sertifikatų grandinėmis", "Viešais raktais A ir B", "Privačiais raktais", "Hash reikšmėmis"], "c": 1}, {"q": "Ką abi šalys apskaičiuoja Diffie–Hellman proceso pabaigoje?", "a": ["Viešą IP adresą", "Bendrą hash funkciją", "Bendrą sertifikatą", "Bendrą slaptą raktą"], "c": 3}, {"q": "Ką reiškia p Diffie–Hellman aprašyme?", "a": ["Parašą", "Privatų raktą", "Pirminį skaičių", "Protokolą"], "c": 2}, {"q": "Kokiose ribose, pagal medžiagą, parenkamos slaptos reikšmės a ir b?", "a": ["Tarp 2048 ir 4096", "Tarp 0 ir 1", "Tik 128", "Tarp 1 ir p"], "c": 3}, {"q": "Kas yra sertifikato CA?", "a": ["Certificate Authority", "Cipher Algorithm", "Cryptographic Address", "Certificate Algorithm"], "c": 0}, {"q": "Koks pagrindinis skirtumas tarp SSH raktų ir X.509 sertifikatų porų pateikiamas medžiagoje?", "a": ["Sertifikatų atveju egzistuoja sertifikatų išdavėjas CA", "SSH nenaudoja raktų", "X.509 nenaudoja viešo rakto", "SSH visada naudoja CA"], "c": 0}, {"q": "Kas yra CA atsakomybė?", "a": ["Sertifikatų pasirašymas", "VPN tunelio kūrimas", "Failų suspaudimas", "Linux paketų diegimas"], "c": 0}, {"q": "Kas pasitiki CA pagal pateiktą modelį?", "a": ["Abi susitarimo pusės", "Tik serveris", "Tik naršyklė", "Tik klientas"], "c": 0}, {"q": "Kaip CA apibūdinamas pateiktame palyginime?", "a": ["Kaip skaitmeninis notaras", "Kaip ugniasienė", "Kaip DNS serveris", "Kaip failų serveris"], "c": 0}, {"q": "Kam skirta viešojo rakto infrastruktūra (PKI)?", "a": ["Sertifikatų išdavimui ir šalių verifikavimui", "Tik failų kopijavimui", "Tik procesų valdymui", "Tik tinklo maršrutizavimui"], "c": 0}, {"q": "Kas yra PKI komponentas?", "a": ["CA serverių hierarchija", "NFS", "VNC", "Cron"], "c": 0}, {"q": "Kas dar priklauso PKI sričiai?", "a": ["Tik failų sistemos", "Tik VPN tuneliai", "Tik vartotojų grupės", "Viešo/privataus raktų poros"], "c": 3}, {"q": "Ką reiškia CSR?", "a": ["Certificate System Router", "Cipher Security Rule", "Central Server Request", "Certificate Service Request"], "c": 3}, {"q": "Kas gali būti atliekama su išduotu sertifikatu?", "a": ["Jis automatiškai tampa viešu raktu", "Jis negali būti pakeistas ar atšauktas", "Jis tampa slaptažodžiu", "Jis gali būti atšauktas"], "c": 3}, {"q": "Kas dažnai būdinga Root CA?", "a": ["Jis visada viešai prieinamas Internetu", "Jis yra kliento naršyklė", "Jis naudojamas tik VNC", "Jis dažnai būna atjungtas nuo Interneto"], "c": 3}, {"q": "Kas yra sertifikatų atšaukimas?", "a": ["Naujo sertifikato sukūrimas", "Išduoto sertifikato galiojimo panaikinimas", "Hash funkcijos pakeitimas", "Raktų suspaudimas"], "c": 1}, {"q": "Ką CSR Common Name lauke nurodo serverio atveju?", "a": ["CA privatų raktą", "Serverio MAC adresą", "Pilną domeno vardą (FQDN)", "Organizacijos slaptažodį"], "c": 2}, {"q": "Kas turi sutapti su Common Name pagal pateiktą aprašymą?", "a": ["Serverio slaptažodis", "Tai, ką įvedama web naršyklėje", "Failo hash", "CA vardas"], "c": 1}, {"q": "Ką apibūdina CSR Organization laukas?", "a": ["CA slaptažodį", "Serverio IP adresą", "Privatų raktą", "Teisinį organizacijos pavadinimą"], "c": 3}, {"q": "Ką apibūdina Organizational Unit?", "a": ["Šifravimo algoritmą", "Serverio operacinę sistemą", "DNS zoną", "Organizacijos padalinį, tvarkantį sertifikatą"], "c": 3}, {"q": "Ką nurodo Country laukas?", "a": ["Serverio portą", "Sertifikato hash", "Dviejų raidžių ISO šalies kodą", "Pilną miesto pavadinimą"], "c": 2}, {"q": "Kuris CSR elementas įtraukiamas į sertifikatą?", "a": ["Privatus raktas", "Vartotojo slaptažodis", "Viešasis raktas", "VPN raktas"], "c": 2}, {"q": "Koks yra skaitmeninio parašo procesas pagal pateiktą seką?", "a": ["Hash iššifruojamas privačiu gavėjo raktu", "Apskaičiuojama failo hash reikšmė ir ji užšifruojama siuntėjo privačiu raktu", "Failas užkoduojamas Base64", "Failas šifruojamas CA viešu raktu"], "c": 1}, {"q": "Kuo pasirašoma failo hash reikšmė?", "a": ["Gavėjo privačiu raktu", "Vartotojo slaptažodžiu", "CA viešu raktu", "Siuntėjo privačiu raktu"], "c": 3}, {"q": "Kas kartu siunčiama gavėjui?", "a": ["Tik CA slaptažodis", "Originalus failas ir jo skaitmeninis parašas", "Tik privatus raktas", "Tik hash reikšmė"], "c": 1}, {"q": "Kuo gavėjas gali iššifruoti skaitmeninį parašą?", "a": ["Tik CA raktu", "Privatiu raktu", "Tik slaptažodžiu", "Viešu raktu"], "c": 3}, {"q": "Kam naudojamas TLS?", "a": ["Tik vartotojų grupėms", "Tik paketų diegimui", "Tik failų saugojimui diske", "Duomenų š ų institucija paminėta medžiagoje?", "a": ["OpenVPN", "Apache NFS", "Microsoft DNS", "Let's Encrypt"], "c": 3}, {"q": "Kas yra steganografija?", "a": ["Hash funkcija", "Informacijos slėpimas atviroje, neįprastoje vietoje", "Informacijos šifravimas viešu raktu", "VPN protokolas"], "c": 1}, {"q": "Ar steganografija pati savaime yra duomenų šifravimas?", "a": ["Tik naudojant TLS", "Ne", "Taip, visada", "Tik naudojant RSA"], "c": 1}, {"q": "Kur gali būti slepiama informacija steganografijoje?", "a": ["Tik RAM", "Tik duomenų bazėje", "Nuotraukoje", "Tik DNS"], "c": 2}, {"q": "Kur dar gali būti slepiama informacija?", "a": ["Tik IP pakete", "Tik sertifikate", "Tik procesoriaus registre", "Audio įraše"], "c": 3}, {"q": "Kas nutinka paveikslėliui slepiant vis daugiau informacijos?", "a": ["Jis tampa mažesnis", "Jis vis labiau skiriasi nuo originalo", "Jis tampa juodai baltas", "Jis automatiškai užšifruojamas"], "c": 1}, {"q": "Kur dažnai įterpiama informacija paveikslėlyje?", "a": ["Į monitorių", "Į failo pavadinimą", "Į mažiausio svarbumo taškus", "Į DNS"], "c": 2}, {"q": "Kas gali būti analizuojama norint rasti informaciją audio faile?", "a": ["Tik failo pavadinimas", "Tik IP adresas", "Tik CPU apkrova", "Spektrograma"], "c": 3}, {"q": "Kokia programa paminėta spektrogramų peržiūrai?", "a": ["Apache", "OpenSSL", "Certbot", "Audacity"], "c": 3}, {"q": "Kas yra kriptoanalizė?", "a": ["Failų kopijavimo metodas", "VPN protokolas", "Mokslas apie nešifruoto teksto identifikavimą iš šifrogramos, kai nežinomas raktas", "Sertifikatų išdavimo procesas"], "c": 2}, {"q": "Koks dar gali būti kriptoanalizės uždavinys?", "a": ["Failo suspaudimas", "Šifravimo rakto paieška", "DNS konfigūravimas", "Vartotojo kūrimas"], "c": 1}, {"q": "Ar kriptografinis algoritmas dažniausiai yra žinomas?", "a": ["Tik TLS atveju", "Ne", "Tik RSA atveju", "Taip"], "c": 3}, {"q": "Kas yra ciphertext-only attack?", "a": ["Kai stebima tik energija", "Kai žinoma tik plaintext", "Kai žinoma tik šifruota žinutė", "Kai užpuolikas pasirenka raktą"], "c": 2}, {"q": "Kas yra known plaintext attack?", "a": ["Kai žinoma ir užšifruota, ir originali žinutė", "Kai užpuolikas pasirenka tik raktą", "Kai žinoma tik šifrograma", "Kai stebimas garsas"], "c": 0}, {"q": "Kas yra chosen plaintext attack?", "a": ["Kai naudojamas tik žodynas", "Kai žinoma tik šifrograma", "Kai stebima elektromagnetinė radiacija", "Kai galima tiekti pasirinktą tekstą šifravimui ir gauti šifrogramas"], "c": 3}, {"q": "Kas yra man-in-the-middle attack?", "a": ["Visų raktų išbandymas", "Garsų analizė", "Raktų spėjimas iš žodyno", "Bandymas įsiterpti tarp dviejų komunikuojančių šalių"], "c": 3}, {"q": "Kas yra dictionary attack?", "a": ["Rakto spėjimas iš sudaryto galimų raktų sąrašo", "Įsiterpimas į ryšį", "Stebėjimas per mikrofoną", "Visų įmanomų raktų bandymas"], "c": 0}, {"q": "Kas yra brute force attack?", "a": ["Rakto spėjimas tik iš žodyno", "Garso analizė", "Rakto spėjimas bandant visas reikšmes iš eilės", "Tinklo srauto perėmimas"], "c": 2}, {"q": "Kas yra side-channel attack?", "a": ["Tik slaptažodžio spėjimas", "Tik VPN ataka", "Tiesioginis algoritmo pakeitimas", "Netiesioginis informacijos išgavimas"], "c": 3}, {"q": "Ar side-channel atakai būtina pažeidžiamumo kriptografinio algoritmo kode?", "a": ["Ne", "Tik TLS atveju", "Tik RSA atveju", "Taip, visada"], "c": 0}, {"q": "Kokia side-channel ataka analizuoja kompiuterio garsus?", "a": ["Laiko ataka", "Akustinė kriptoanalizė", "Elektromagnetinė kriptoanalizė", "Optinė kriptoanalizė"], "c": 1}, {"q": "Kokia side-channel ataka stebi elektromagnetinę radiaciją?", "a": ["Elektromagnetinė kriptoanalizė", "Energijos", "Optinė", "Akustinė"], "c": 0}, {"q": "Kokia ataka gali stebėti klaviatūros paspaudimus arba HDD aktyvumo indikatorių?", "a": ["Elektromagnetinė", "Akustinė", "Optinė kriptoanalizė", "Dictionary"], "c": 2}, {"q": "Kas stebima energijos sunaudojimo side-channel atakoje?", "a": ["Energijos sunaudojimas", "Tik failo dydis", "Tik IP adresas", "Tik DNS užklausos"], "c": 0}, {"q": "Kas stebima laiko skaičiavimo atakose?", "a": ["Kiek laiko užtrunka viena ar kita operacija", "Tik procesoriaus temperatūra", "Tik failo dydis", "Tik tinklo pralaidumas"], "c": 0}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
