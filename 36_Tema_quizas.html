<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}

.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>Topic 36 — SIEM Deployment in an Organization</h1><div class="subtitle">SIEM, SOAR, organizational deployment and Microsoft Sentinel</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 36 temos tema?", "a": ["Centralizuotas logų stebėjimas", "WordPress diegimas", "SIEM sistemos diegimas organizacijoje", "Saugus programinės įrangos kūrimas"], "c": 2}, {"q": "Kokia paskaitos trukmė?", "a": ["6 valandos", "2 valandos", "8 valandos", "4 valandos"], "c": 1}, {"q": "Koks paskaitos formatas?", "a": ["Egzaminas", "Tik teorija", "Tik praktika", "Teorija + praktika"], "c": 3}, {"q": "Kokios dvi pagrindinės sistemos nagrinėjamos?", "a": ["SAML ir OAuth", "SAST ir DAST", "SIEM ir SOAR", "VPN ir TOR"], "c": 2}, {"q": "Kokia dar tema nagrinėjama?", "a": ["Organizacinis SIEM diegimas", "Kriptografijos istorija", "Fizinė sauga", "Linux failų sistemos"], "c": 0}, {"q": "Kokia technologinė platforma nagrinėjama praktikoje?", "a": ["Apache2", "WordPress", "Kerberos", "Microsoft Sentinel"], "c": 3}, {"q": "Ką reiškia SIEM?", "a": ["Security Infrastructure Event Module", "System Incident Event Manager", "Security Incident and Event Management", "Secure Identity and Event Monitoring"], "c": 2}, {"q": "Koks pagrindinis SIEM tikslas?", "a": ["Tik saugoti failus", "Aptikti, atpažinti ir reaguoti į grėsmes bei potencialius saugumo incidentus", "Tik valdyti vartotojų slaptažodžius", "Tik konfigūruoti ugniasienę"], "c": 1}, {"q": "Iš kokių sistemų evoliucionavo SIEM?", "a": ["WordPress sistemų", "Centralizuotų žurnalinių įrašų valdymo sistemų", "VPN sistemų", "DNS serverių"], "c": 1}, {"q": "Ką SIEM sistemos analizuoja?", "a": ["Žurnalinius įrašus", "Tik DNS zonas", "Tik vartotojų sąrašus", "Tik PDF failus"], "c": 0}, {"q": "Kokias taisykles gali naudoti SIEM analizei?", "a": ["Tik rankiniu būdu sukurtus vartotojus", "Tik DNS taisykles", "Iš anksto aprašytas taisykles", "Tik atsitiktines taisykles"], "c": 2}, {"q": "Kokie algoritmai gali būti naudojami SIEM sistemose?", "a": ["Tik šifravimo algoritmai", "Tik maršrutizavimo algoritmai", "Tik kompresijos algoritmai", "Mašininio mokymosi algoritmai"], "c": 3}, {"q": "Kam naudojamas SIEM taisyklių ir ML derinys?", "a": ["Tik failams archyvuoti", "Potencialioms saugumo grėsmėms identifikuoti", "Tik svetainių kūrimui", "Tik vartotojų registracijai"], "c": 1}, {"q": "Kokias išorines sistemas SIEM taip pat pasitelkia?", "a": ["Tik WordPress", "Tik NFS sistemas", "Tik DNS sistemas", "Threat Intelligence sistemas"], "c": 3}, {"q": "Kam naudojama Threat Intelligence informacija?", "a": ["Tik vartotojų sąsajai", "Tik duomenų bazėms kurti", "Tik failams suspausti", "Naujoms atakoms identifikuoti pagal jų braižą"], "c": 3}, {"q": "Ką reiškia SOAR?", "a": ["Security Orchestration, Automation and Response", "Security Online Access Routing", "System Orchestration and Authentication Rules", "Secure Operations and Audit Response"], "c": 0}, {"q": "Kas yra pagrindinė SOAR funkcija?", "a": ["Tik vartotojų autentifikacija", "Tik kodo analizė", "Automatinis reagavimas į aptiktus incidentus", "Tik žurnalų saugojimas"], "c": 2}, {"q": "Kaip SOAR dažnai naudojamas kartu su SIEM?", "a": ["SOAR pakeičia visas SIEM funkcijas", "SOAR papildo SIEM", "Jie negali veikti kartu", "SIEM pakeičia SOAR"], "c": 1}, {"q": "Koks SOAR vaidmuo incidento pradžioje?", "a": ["Tik programinės įrangos kūrimas", "Pirminio reagavimo į incidentą sprendimas", "Tik vartotojų administravimas", "Tik ilgalaikis archyvavimas"], "c": 1}, {"q": "Koks veiksmas pateikiamas kaip SOAR pavyzdys?", "a": ["Ištrinti visą duomenų bazę", "Pakeisti visus vartotojų slaptažodžius", "Išjungti internetą visoje organizacijoje", "Atjungti serverio tinklo adapterį"], "c": 3}, {"q": "Kas pirmiausia identifikuoja ransomware veikimą pateiktame scenarijuje?", "a": ["DNS", "Apache2", "SIEM sistema", "WordPress"], "c": 2}, {"q": "Kas automatiškai paleidžiama po grėsmės aptikimo?", "a": ["WordPress diegimas", "Naujas vartotojas", "TLS sertifikato išdavimas", "Tinklo adapterį atjungiantis scenarijus"], "c": 3}, {"q": "Koks tokio veiksmo tikslas?", "a": ["Padidinti tinklo greitį", "Pakeisti OS", "Ištrinti logus", "Užkirsti kelią tolimesniam ransomware plitimui"], "c": 3}, {"q": "Kam gali būti perduodama tolimesnė analizė?", "a": ["Tik galutiniam vartotojui", "Saugumo operacijų inžinieriui", "Tik duomenų bazės vartotojui", "Tik DNS administratoriui"], "c": 1}, {"q": "Ko reikalauja SIEM diegimas organizacijoje?", "a": ["Tik naujo serverio", "Tik antivirusinės", "Techninio ir organizacinio pasiruošimo", "Tik vartotojų mokymų"], "c": 2}, {"q": "Kaip SIEM diegimas įprastai traktuojamas?", "a": ["Kaip tik programavimo užduotis", "Kaip vienos komandos kasdienė užduotis", "Kaip vienkartinis logų eksportas", "Kaip atskiras projektas"], "c": 3}, {"q": "Kuris yra techninio SIEM diegimo aspektas?", "a": ["Tik darbuotojų atostogos", "Tik biudžeto ataskaita", "Tik fizinės apsaugos testas", "Programinės įrangos išsirinkimas"], "c": 3}, {"q": "Kuris dar yra techninio SIEM diegimo aspektas?", "a": ["Tik dokumentų archyvavimas", "Tik rinkodara", "Sistemos dizainas", "Tik vartotojų apklausa"], "c": 2}, {"q": "Kuris dar yra techninio SIEM diegimo aspektas?", "a": ["Tik fizinė apsauga", "Tik personalo atranka", "Tik mokymosi planas", "Testavimas"], "c": 3}, {"q": "Kuris dar yra techninio SIEM diegimo aspektas?", "a": ["Duomenų šaltinių parinkimas", "Tik slaptažodžių politika", "Tik DNS registracija", "Tik svetainės dizainas"], "c": 0}, {"q": "Kuris dar yra techninio SIEM diegimo aspektas?", "a": ["Konfigūracija", "Tik serverio pirkimas", "Tik teisinis auditas", "Tik darbuotojų vertinimas"], "c": 0}, {"q": "Kas turi būti paruošta organizaciniu požiūriu?", "a": ["Operacinė komanda arba apmokyta egzistuojanti komanda", "Tik duomenų bazė", "Tik VPN", "Tik naujas domenas"], "c": 0}, {"q": "Ar pirminė SIEM konfigūracija paprastai lieka nekintama?", "a": ["Taip, ji niekada nekeičiama", "Taip, ją galima nustatyti tik vieną kartą", "Tik Sentinel atveju", "Ne, ją dažniausiai reikia tobulinti ateityje"], "c": 3}, {"q": "Ko tikėtina sulaukti pirminio testavimo metu?", "a": ["Nė vieno rezultato", "Tik tikrų incidentų", "Tik tinklo gedimų", "Daug false-positive rezultatų"], "c": 3}, {"q": "Ką dar gali sugeneruoti pirminis SIEM testavimas?", "a": ["Tik DNS įrašus", "Tik atsargines kopijas", "Nenumatytų incidentų", "Tik vartotojų paskyras"], "c": 2}, {"q": "Kas yra Microsoft Sentinel?", "a": ["Azure viešajame debesyje veikianti SIEM ir SOAR platforma", "WordPress įskiepis", "Windows Event Viewer papildinys", "Linux logų failas"], "c": 0}, {"q": "Kur veikia Microsoft Sentinel?", "a": ["Azure viešajame debesyje", "Tik WordPress serveryje", "Tik lokaliame Windows serveryje", "Tik Ubuntu"], "c": 0}, {"q": "Kuo paremtas Sentinel žurnalinių įrašų saugojimas?", "a": ["Log Analytics Workspace", "Active Directory", "Apache2", "MySQL"], "c": 0}, {"q": "Ar Sentinel gali priimti informaciją tik iš Azure?", "a": ["Taip, tik iš Linux", "Ne, jis gali priimti informaciją ir iš kitų debesijos tiekėjų bei infrastruktūros komponentų", "Taip, tik iš Azure", "Taip, tik iš Windows"], "c": 1}, {"q": "Koks infrastruktūros pavyzdys paminėtas kaip Sentinel duomenų šaltinis?", "a": ["Tik FTP serveriai", "Kubernetes klasteriai", "Tik WordPress", "Tik DNS"], "c": 1}, {"q": "Koks šaltinis nurodytas pagalbai diegiant Sentinel?", "a": ["MCRA", "SCA", "CIS", "OWASP ASVS"], "c": 0}, {"q": "Kas yra Data Connectors Sentinel sistemoje?", "a": ["Tik vartotojų paskyros", "Sąsajos skirtingiems informacijos gavimo šaltiniams prijungti", "Automatiniai atsarginiai kopijavimo įrankiai", "Tik ugniasienės taisyklės"], "c": 1}, {"q": "Kas yra pagrindinis žurnalų variklis Sentinel sistemoje?", "a": ["Playbooks", "Threat Intelligence", "Workbooks", "Log Analytics Workspace"], "c": 3}, {"q": "Kas yra Threat Intelligence Sentinel komponentuose?", "a": ["Pagrindinis žurnalų variklis", "Išoriniai informacijos apie grėsmes šaltiniai", "Automatinio reagavimo scenarijus", "Žurnalų vizualizavimo įrankis"], "c": 1}, {"q": "Kas yra Security Analytics?", "a": ["Automatinis scenarijus", "Analitinis variklis grėsmėms ir anomalijoms identifikuoti", "Žurnalų saugojimo vieta", "Duomenų jungtis"], "c": 1}, {"q": "Kas yra Workbooks?", "a": ["Threat Intelligence šaltinis", "Įvykių vizualizavimo priemonė", "Žurnalų agentas", "Automatinio reagavimo taisyklė"], "c": 1}, {"q": "Kas yra Playbooks?", "a": ["Threat Intelligence duomenys", "Automatizuoti scenarijai, aktyvuojami aptikus numatytą incidentą", "Vizualizacijos", "Žurnalų saugyklos"], "c": 1}, {"q": "Kuris Sentinel komponentas skirtas skirtingiems informacijos šaltiniams prijungti?", "a": ["Workbooks", "Data Connectors", "Security Analytics", "Playbooks"], "c": 1}, {"q": "Kuris komponentas skirtas įvykiams vizualizuoti?", "a": ["Data Connectors", "Workbooks", "Log Analytics Workspace", "Threat Intelligence"], "c": 1}, {"q": "Kuris komponentas skirtas automatizuoti veiksmus?", "a": ["Security Analytics", "Playbooks", "Data Connectors", "Workbooks"], "c": 1}, {"q": "Koks pirmasis nurodytas praktinės veiklos žingsnis?", "a": ["Log Analytics Workspace sukūrimas", "Playbook ištrynimas", "Incidento uždarymas", "Threat Intelligence pašalinimas"], "c": 0}, {"q": "Koks praktinis komponentas kuriamas toliau?", "a": ["MySQL vartotojas", "WordPress įskiepis", "Apache serveris", "Sentinel Playbook"], "c": 3}, {"q": "Koks Azure jungiklis sukonfigūruojamas praktikoje?", "a": ["Azure Activity Connector", "Azure DNS Connector", "Azure WordPress Connector", "Azure SSH Connector"], "c": 0}, {"q": "Kas sukuriama analitikai Sentinel praktikoje?", "a": ["Analitikos taisyklės", "Tik duomenų bazės", "Tik vartotojai", "Tik TLS sertifikatai"], "c": 0}, {"q": "Kokia paskutinė praktinės veiklos dalis nurodyta?", "a": ["Incidentų valdymas", "DNS konfigūracija", "WordPress diegimas", "Linux grūdinimas"], "c": 0}, {"q": "Kodėl SIEM sistemai svarbu pasirinkti tinkamus duomenų šaltinius?", "a": ["Kad nereikėtų operacinės komandos", "Kad nereikėtų taisyklių", "Kad sistema galėtų analizuoti reikalingus saugumo įvykius", "Kad nereikėtų testavimo"], "c": 2}, {"q": "Koks SIEM diegimo aspektas susijęs su sistemos struktūra?", "a": ["Tik logų trynimas", "Dizainas", "Tik vartotojų mokymas", "Tik incidentų uždarymas"], "c": 1}, {"q": "Koks procesas padeda nustatyti, ar SIEM veikia tinkamai?", "a": ["Tik archyvavimas", "Testavimas", "Tik vartotojų registracija", "Tik slaptažodžių keitimas"], "c": 1}, {"q": "Kodėl SIEM taisykles gali reikėti tobulinti po pradinio diegimo?", "a": ["Nes Sentinel neveikia Azure", "Nes SIEM negali saugoti logų", "Dėl false-positive rezultatų ir realaus veikimo patirties", "Nes logai neturi laiko žymų"], "c": 2}, {"q": "Koks organizacinis elementas būtinas sėkmingam SIEM naudojimui?", "a": ["Tik vartotojų sąrašas", "Tik duomenų bazė", "Tik vienas administratorius be mokymų", "Apmokyta operacinė komanda"], "c": 3}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
