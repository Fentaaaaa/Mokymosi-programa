<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>13 Tema – Saugumo įvykių stebėjimo priemonės</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#4f46e5}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#818cf8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:25px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}
button{font:inherit}#themeBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.progress{color:var(--muted);font-size:14px;margin-bottom:12px}.question{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:20px}
.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.answer.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.answer.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444}body.dark .answer.correct{background:#14532d;color:#dcfce7}
body.dark .answer.wrong{background:#7f1d1d;color:#fee2e2}.next{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;cursor:pointer;font-weight:700;font-size:16px}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:46px;font-weight:800;margin:10px 0}
.small{color:var(--muted)}.hidden{display:none}.restart{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
</style></head><body><div class="container">
<div class="top"><div><h1>13 Tema – Saugumo įvykių stebėjimo priemonės</h1><div class="subtitle">10 random questions per attempt</div></div>
<button id="themeBtn">🌙 Dark mode</button></div>
<div id="quiz" class="card"><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="answers" id="answers"></div>
<button class="next" id="next" disabled>Kitas klausimas →</button></div>
<div id="result" class="card result hidden"><h2>Quiz baigtas!</h2><div class="score" id="score"></div><div class="small" id="percent"></div>
<button class="restart" onclick="startQuiz()">Bandyti dar kartą</button></div></div>
<script>
const bank=[{"q": "Koks yra pagrindinis saugumo įvykių stebėjimo tikslas?", "a": ["Tik didinti tinklo spartą", "Tik valdyti vartotojų paskyras", "Realiuoju laiku aptikti, analizuoti ir reaguoti į kibernetines grėsmes", "Tik archyvuoti senus dokumentus"], "c": 2}, {"q": "Kas yra saugumo įvykių stebėjimas?", "a": ["Priemonės ir procesai nuolatiniam tinklų, sistemų ir programų stebėjimui", "Tik vartotojų mokymas", "Tik antivirusinės programos naudojimas", "Vienkartinis tinklo auditas"], "c": 0}, {"q": "Ką NIS2 kontekste reiškia nuolatinis stebėjimas?", "a": ["Realaus laiko incidentų aptikimo sistemų diegimą", "Tik atsarginių kopijų kūrimą", "Metinį žurnalų patikrinimą", "Tik rankinį incidentų registravimą"], "c": 0}, {"q": "Ką organizacija turi gebėti atlikti aptikus kibernetinį įvykį?", "a": ["Tik informuoti vartotoją", "Tik išsaugoti įvykį žurnale", "Greitai aptikti, analizuoti ir reaguoti", "Tik perkrauti serverį"], "c": 2}, {"q": "Kam reikalingas saugumo įvykių registravimas?", "a": ["Tik vartotojų autentifikacijai", "Analizei ir atitikties tikslams", "Tik tinklo spartai didinti", "Tik programinės įrangos diegimui"], "c": 1}, {"q": "Koks yra ankstyvo aptikimo tikslas?", "a": ["Pakeisti visus tinklo įrenginius", "Sumažinti darbuotojų skaičių", "Pašalinti visas senas sistemas", "Identifikuoti grėsmes prieš joms padarant didelę žalą"], "c": 3}, {"q": "Kaip stebėjimas pagerina reagavimą į incidentus?", "a": ["Neleidžia registruoti įvykių", "Automatiškai panaikina visas grėsmes", "Suteikia galimybę greitai reaguoti ir sumažinti incidentų padarinius", "Pašalina būtinybę tirti incidentus"], "c": 2}, {"q": "Kokius informacinių sistemų aspektus padeda saugoti įvykių stebėjimas?", "a": ["Tik integralumą", "Tik konfidencialumą", "Integralumą, konfidencialumą ir prieinamumą", "Tik prieinamumą"], "c": 2}, {"q": "Kaip stebėjimas gali padėti išvengti duomenų nutekėjimų?", "a": ["Išjungdamas visas išorines jungtis", "Nenaudodamas žurnalų", "Leisdamas anksčiau aptikti įtartiną veiklą", "Pašalindamas vartotojų paskyras"], "c": 2}, {"q": "Kas yra SIEM?", "a": ["VPN tipas", "Saugumo informacijos ir įvykių valdymo sprendimas", "Belaidžio tinklo protokolas", "Atsarginių kopijų sistema"], "c": 1}, {"q": "Ką SIEM renka?", "a": ["Tik vartotojų vardus", "Tik atsargines kopijas", "Tik Wi-Fi slaptažodžius", "Žurnalus iš įvairių šaltinių, pvz., ugniasienių, serverių ir programų"], "c": 3}, {"q": "Ką SIEM daro su surinktais įvykiais?", "a": ["Tik ištrina senus įrašus", "Tik suspaudžia žurnalus", "Tik perkelia juos į kitą serverį", "Koreliuoja įvykius realiuoju laiku, kad aptiktų anomalijas"], "c": 3}, {"q": "Ką SIEM gali generuoti?", "a": ["Tik vartotojų paskyras", "Įspėjimus apie įtartiną veiklą", "Tik atsargines kopijas", "Tik VPN tunelius"], "c": 1}, {"q": "Kuris sprendimas paminėtas kaip SIEM pavyzdys?", "a": ["Aircrack-ng", "Splunk", "WireGuard", "OpenVPN"], "c": 1}, {"q": "Kuris iš šių taip pat yra paminėtas kaip SIEM priemonė?", "a": ["QRadar", "VXLAN", "BGP", "WPA3"], "c": 0}, {"q": "Kas yra IDPS?", "a": ["Tinklo adresavimo protokolas", "Duomenų bazės sistema", "VPN technologija", "Įsiskverbimo aptikimo ir prevencijos sistema"], "c": 3}, {"q": "Ką stebi tinklo IDPS?", "a": ["Tik failų pavadinimus", "Tik fizinius serverius", "Tik vartotojų slaptažodžius", "Tinklo srautą dėl kenkėjiškos veiklos"], "c": 3}, {"q": "Ką stebi sisteminė IDPS?", "a": ["Tik Wi-Fi signalą", "Tik DNS užklausas", "Tik interneto maršrutus", "Individualias sistemas dėl įtartino elgesio požymių"], "c": 3}, {"q": "Kas yra EDR?", "a": ["VPN protokolas", "BGP maršrutizavimo sistema", "Tinklo kabelių valdymo sistema", "Galinių taškų aptikimo ir reagavimo priemonė"], "c": 3}, {"q": "Ką EDR stebi?", "a": ["Tik interneto tiekėjus", "Tik DNS serverius", "Tik ugniasienės taisykles", "Įrenginių, pvz., nešiojamųjų kompiuterių ir serverių, veiklą"], "c": 3}, {"q": "Ką EDR leidžia atlikti be įprasto stebėjimo?", "a": ["Tik valdyti VPN", "Tik keisti IP adresus", "Tik kurti vartotojus", "Proaktyviai ieškoti grėsmių tinkle"], "c": 3}, {"q": "Kuo SIEM naudingas atitikties ataskaitoms?", "a": ["Neleidžia rinkti žurnalų", "Automatiškai panaikina auditą", "Tikrina tik Wi-Fi", "Centralizuoja žurnalų valdymą ir palengvina ataskaitų teikimą"], "c": 3}, {"q": "Kuo IDPS yra svarbus?", "a": ["Tik stebi darbuotojų produktyvumą", "Tik kuria atsargines kopijas", "Padeda aptikti žinomus grėsmių modelius ir įtartinus veiksmus", "Tik valdo vartotojų slaptažodžius"], "c": 2}, {"q": "Kuo EDR išsiskiria stebėjimo požiūriu?", "a": ["Stebi tik maršrutizatorius", "Stebi tik debesijos tiekėjus", "Stebi tik DNS", "Suteikia išsamesnį vaizdą apie galinių taškų veiklą"], "c": 3}, {"q": "Kas yra UEBA?", "a": ["Vartotojų ir subjektų elgsenos analizė", "VPN autentifikavimo protokolas", "Ugniasienės valdymo sistema", "Duomenų bazės atsarginių kopijų sistema"], "c": 0}, {"q": "Kaip UEBA aptinka anomalijas?", "a": ["Tik pagal IP adresą", "Remdamasi vartotojų ir subjektų elgsenos modeliais", "Tik pagal įrenginio spalvą", "Tik pagal failo dydį"], "c": 1}, {"q": "Kokią grėsmę gali padėti aptikti UEBA?", "a": ["Potencialias vidines grėsmes", "Tik kabelių gedimus", "Tik elektros tiekimo sutrikimus", "Tik fizines vagystes"], "c": 0}, {"q": "Kaip AI/ML naudojamas saugumo stebėjime?", "a": ["Tik vartotojų paskyroms kurti", "Tik dokumentams archyvuoti", "Tik VPN tuneliams sukurti", "Neįprastiems modeliams, galintiems rodyti grėsmes, identifikuoti"], "c": 3}, {"q": "Ką AI/ML gali atlikti incidentų kontekste?", "a": ["Tik registruoti darbuotojus", "Automatiškai reaguoti į tam tikrus incidentus", "Tik kurti atsargines kopijas", "Tik keisti tinklo kabelius"], "c": 1}, {"q": "Kokia grėsmių žvalgybos integracijos nauda?", "a": ["Stebėjimo priemonės gauna išorines grėsmių žvalgybos žinutes realiuoju laiku", "Pašalinamas SIEM", "Išjungiamas žurnalų rinkimas", "Nereikia incidentų reagavimo"], "c": 0}, {"q": "Ką gali atlikti grėsmių žvalgybos numatomoji analizė?", "a": ["Prognozuoti galimus išpuolius pagal pasaulines grėsmių tendencijas", "Tik valdyti VPN", "Tik keisti slaptažodžius", "Tik ištrinti įvykių žurnalus"], "c": 0}, {"q": "Kodėl UEBA naudinga?", "a": ["Ji gali aptikti sudėtingas atakas, kurios praeina pro tradicines gynybos sistemas", "Ji pakeičia visas ugniasienes", "Ji veikia tik be žurnalų", "Ji pašalina poreikį stebėti tinklą"], "c": 0}, {"q": "Kuo AI/ML gali būti naudingas įspėjimų valdyme?", "a": ["Gali panaikinti visus žurnalus", "Gali išjungti visus įspėjimus", "Gali padidinti aptikimo galimybes ir sumažinti klaidingus pavojaus signalus", "Gali pakeisti NIS2"], "c": 2}, {"q": "Koks pirmas svarbus žingsnis diegiant stebėjimo priemones?", "a": ["Išjungti žurnalus", "Iškart įdiegti visas įmanomas priemones", "Nustatyti stebėjimo tikslus", "Pakeisti visus serverius"], "c": 2}, {"q": "Į ką reikia sutelkti dėmesį identifikuojant kritinius išteklius?", "a": ["Į tik viešąsias svetaines", "Į tik darbuotojų telefonus", "Į svarbiausias sistemas", "Į tik seniausius kompiuterius"], "c": 2}, {"q": "Kas yra aptikimo tikslų nustatymas?", "a": ["Nustatymas, kokius incidentus organizacija nori aptikti", "VPN tipo pasirinkimas", "Atsarginių kopijų tvarkaraščio sudarymas", "Nustatymas, kiek darbuotojų reikia įdarbinti"], "c": 0}, {"q": "Į ką reikia atsižvelgti renkantis stebėjimo priemones?", "a": ["Tik į spalvinę sąsają", "Tik į licencijos logotipą", "Į organizacijos poreikius ir reikalavimus", "Tik į įrankio pavadinimą"], "c": 2}, {"q": "Kodėl svarbi stebėjimo priemonių integracija?", "a": ["Reikia užtikrinti jų suderinamumą su esama infrastruktūra", "Kad nereikėtų incidentų reagavimo", "Kad nereikėtų jokių žurnalų", "Kad būtų galima išjungti IDPS"], "c": 0}, {"q": "Koks konfigūravimo tikslas?", "a": ["Išjungti visus perspėjimus", "Sumažinti klaidingus teigiamus signalus optimizuojant aptikimo taisykles", "Pašalinti elgsenos analizę", "Padidinti klaidingų signalų skaičių"], "c": 1}, {"q": "Kas yra elgsenos bazė?", "a": ["VPN vartotojų duomenų bazė", "Normalios veiklos modeliai, naudojami anomalijoms tiksliau aptikti", "Vartotojų slaptažodžių sąrašas", "Ugniasienės atsarginių kopijų rinkinys"], "c": 1}, {"q": "Kodėl svarbu reguliariai atnaujinti aptikimo taisykles?", "a": ["Kad nereikėtų mokymų", "Kad būtų išjungti visi seni žurnalai", "Kad sumažėtų stebėjimo apimtis iki nulio", "Kad jos būtų pritaikytos prie naujų grėsmių"], "c": 3}, {"q": "Ką reiškia 24/7 stebėjimas?", "a": ["Nuolatinę kritinių sistemų stebėseną", "Stebėjimą tik incidento metu", "Stebėjimą tik darbo dienomis", "Stebėjimą kartą per savaitę"], "c": 0}, {"q": "Kokia automatinių įspėjimų paskirtis?", "a": ["Nedelsiant pranešti apie įtartiną veiklą", "Tik keisti IP adresus", "Tik saugoti slaptažodžius", "Tik kurti vartotojus"], "c": 0}, {"q": "Kaip stebėjimo priemonės integruojamos su incidentų valdymu?", "a": ["Nenaudojant darbo eigų", "Atskiriant jas nuo visų procedūrų", "Susiejant jas su incidentų valdymo procedūromis", "Išjungiant eskalavimą"], "c": 2}, {"q": "Kas yra eskalavimo protokolai?", "a": ["Žurnalų archyvavimo taisyklės", "VPN konfigūracijos", "Wi-Fi slaptažodžių taisyklės", "Aiškiai apibrėžti veiksmai incidentams eskaluoti"], "c": 3}, {"q": "Kam reikalingi audito pėdsakai?", "a": ["Tik vartotojų mokymui", "Tik programinei įrangai diegti", "Tyrimams ir atitikties patikrinimams", "Tik tinklo spartai didinti"], "c": 2}, {"q": "Kodėl nuolatinis stebėjimas svarbus už įprastų darbo valandų ribų?", "a": ["Nes incidentai vyksta tik naktį", "Jis leidžia anksti aptikti incidentus bet kuriuo metu", "Kad nereikėtų darbuotojų", "Kad nereikėtų registruoti įvykių"], "c": 1}, {"q": "Kuo incidentų reagavimo integracija naudinga?", "a": ["Tik valdo vartotojų paskyras", "Padeda greitai imtis veiksmų incidentams lokalizuoti ir pašalinti", "Tik kuria žurnalus", "Pašalina stebėjimo poreikį"], "c": 1}, {"q": "Kodėl tikslus žurnalų vedimas svarbus NIS2 kontekste?", "a": ["Jis svarbus incidentų ataskaitoms", "Jis pakeičia incidentų valdymą", "Jis skirtas tik VPN", "Jis naudojamas tik rinkodarai"], "c": 0}, {"q": "Ko reikia mokyti IT ir saugumo personalą?", "a": ["Efektyviai naudotis stebėjimo priemonėmis", "Tik kurti VPN", "Tik naudotis el. paštu", "Tik keisti kompiuterių foną"], "c": 0}, {"q": "Kodėl personalas turi žinoti incidentų valdymo procedūras?", "a": ["Kad žinotų, kaip reaguoti į įspėjimus", "Kad galėtų pašalinti visus žurnalus", "Kad galėtų išjungti visą stebėjimą", "Kad galėtų pakeisti NIS2"], "c": 0}, {"q": "Ko reikia mokyti visus darbuotojus phishing kontekste?", "a": ["Atpažinti ir pranešti apie phishing bandymus", "Valdyti BGP", "Kurti VPN tunelius", "Konfigūruoti SIEM"], "c": 0}, {"q": "Kodėl svarbus visų darbuotojų saugumo sąmoningumas?", "a": ["Jis pašalina visas grėsmes", "Jis pakeičia SIEM", "Jis mažina žmogaus klaidos riziką saugumo incidentuose", "Jis leidžia nenaudoti autentifikacijos"], "c": 2}, {"q": "Kam reikalingos simuliacijos ir pratybos?", "a": ["Tik žurnalams archyvuoti", "Tik darbuotojų skaičiui nustatyti", "Tik programinei įrangai pirkti", "Stebėjimo ir reagavimo pajėgumams patikrinti"], "c": 3}, {"q": "Kokia viena pagrindinių stebėjimo priemonių diegimo problemų?", "a": ["Per mažas žurnalų skaičius visais atvejais", "Per didelis darbuotojų sąmoningumas", "Nesugebėjimas naudoti el. pašto", "Klaidingi teigiami signalai"], "c": 3}, {"q": "Kuo pavojingas didelis klaidingų įspėjimų kiekis?", "a": ["Jis gali apkrauti saugumo komandas", "Jis padidina darbuotojų skaičių", "Jis visada pagerina aptikimą", "Jis panaikina visas grėsmes"], "c": 0}, {"q": "Kodėl stebėjimui gali trūkti išteklių?", "a": ["Reikia kvalifikuotų specialistų ir investicijų", "Nes stebėjimas visada nemokamas", "Nes žurnalų nereikia", "Nes nereikia jokių specialistų"], "c": 0}, {"q": "Koks iššūkis kyla integruojant kelias stebėjimo priemones?", "a": ["Integracija gali būti sudėtinga", "Integracija visada vyksta automatiškai", "Nereikia suderinamumo", "Nereikia konfigūracijos"], "c": 0}, {"q": "Kokia geriausia praktika susijusi su stebėjimo programine įranga?", "a": ["Niekada neatnaujinti", "Reguliariai ją atnaujinti", "Naudoti tik senas aptikimo taisykles", "Išjungti pataisas"], "c": 1}, {"q": "Kaip galima optimizuoti įspėjimus?", "a": ["Didinti visų įspėjimų skaičių", "Išjungti visus įspėjimus", "Naudoti AI/ML klaidingiems teigiamiems signalams mažinti", "Pašalinti elgsenos bazę"], "c": 2}, {"q": "Ką mažesnėms organizacijoms gali būti tikslinga apsvarstyti?", "a": ["BGP prefix užgrobimą", "Visų sistemų išjungimą", "MSSP paslaugas", "Tik rankinį stebėjimą be įrankių"], "c": 2}, {"q": "Kokia buvo Kompanijos D problema?", "a": ["Įspėjimų nuovargis dėl didelio klaidingų teigiamų signalų kiekio", "Kompetencijos trūkumas 24/7 stebėjimui", "VPN gedimas", "Duomenų nutekėjimas dėl uždelsto aptikimo"], "c": 0}, {"q": "Ką Kompanija D įdiegė SIEM sistemoje?", "a": ["BGP", "Mašininį mokymąsi", "VXLAN", "WPA3"], "c": 1}, {"q": "Koks buvo Kompanijos D rezultatas?", "a": ["Stebėjimo atsisakymas", "Incidentų padidėjimas 60%", "Klaidingų teigiamų signalų sumažėjimas 60%", "Žurnalų panaikinimas"], "c": 2}, {"q": "Kokia buvo Kompanijos E problema?", "a": ["Per mažai belaidžių tinklų", "Per daug VPN vartotojų", "Trūko kompetencijos 24/7 stebėjimui įmonės viduje", "BGP prefix užgrobimas"], "c": 2}, {"q": "Kokį sprendimą pasirinko Kompanija E?", "a": ["Panaikino stebėjimą", "Perdavė stebėjimą MSSP paslaugų teikėjui", "Išjungė SIEM", "Pakeitė visus maršrutizatorius"], "c": 1}, {"q": "Koks buvo Kompanijos E rezultatas?", "a": ["Sumažėjo stebėjimo apimtis iki nulio", "Buvo panaikinti žurnalai", "Pagerėjo aptikimo galimybės ir NIS2 atitiktis", "Buvo atsisakyta incidentų valdymo"], "c": 2}, {"q": "Kokia buvo Kompanijos F problema?", "a": ["Duomenų nutekėjimas dėl uždelsto incidento aptikimo", "Kompetencijos trūkumas 24/7 stebėjimui", "Per daug klaidingų teigiamų signalų", "VPN konfigūracijos klaida"], "c": 0}, {"q": "Ką atliko Kompanija F?", "a": ["Išjungė SIEM", "Panaikino 24/7 stebėjimą", "Atsisakė žurnalų", "Pagerino stebėjimo priemones ir integravo incidentų valdymo procedūras"], "c": 3}, {"q": "Koks buvo Kompanijos F rezultatas?", "a": ["Incidentų reagavimo laikas pailgėjo nuo valandų iki dienų", "Incidentų reagavimo laikas sutrumpėjo nuo dienų iki valandų", "Stebėjimas buvo išjungtas", "NIS2 atitiktis buvo panaikinta"], "c": 1}];let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10)}
function startQuiz(){pick10();current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;let item=quiz[current];document.getElementById('progress').textContent=`Klausimas ${current+1} / ${quiz.length}`;document.getElementById('question').textContent=item.q;
let box=document.getElementById('answers');box.innerHTML='';item.a.forEach((ans,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=ans;b.onclick=()=>choose(i);box.appendChild(b)});
document.getElementById('next').disabled=true;document.getElementById('next').textContent=current===quiz.length-1?'Baigti →':'Kitas klausimas →'}
function choose(i){if(answered)return;answered=true;let item=quiz[current],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);
if(i===item.c){buttons[i].classList.add('correct');score++}else{buttons[i].classList.add('wrong');buttons[item.c].classList.add('correct')}document.getElementById('next').disabled=false}
document.getElementById('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${score} / 10`;document.getElementById('percent').textContent=`${score*10}%`}};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');let dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('darkMode',dark)};
if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}startQuiz();
</script></body></html>
