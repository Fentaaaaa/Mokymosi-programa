<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 Tema – Atitikties ataskaitų rengimas ir pristatymas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--red:#dc2626}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:850px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:28px;margin:0}#theme{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.meta,.small{color:var(--muted)}
.question{font-size:21px;line-height:1.4;margin:10px 0 22px}.option{width:100%;text-align:left;border:1px solid var(--border);background:var(--card);color:var(--text);padding:14px 16px;border-radius:11px;margin:7px 0;cursor:pointer}
.option:hover:not(:disabled){border-color:var(--accent)}.option.correct{background:#dcfce7;border-color:var(--green);color:#166534}.option.wrong{background:#fee2e2;border-color:var(--red);color:#991b1b}
body.dark .option.correct{background:#14532d;color:#dcfce7}body.dark .option.wrong{background:#7f1d1d;color:#fee2e2}
.option:disabled{cursor:default}.next,.restart{margin-top:18px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:10px;cursor:pointer}.hidden{display:none}
.result{text-align:center}.score{font-size:38px;font-weight:700;margin:16px 0 8px}
</style></head><body><div class="container">
<div class="top"><h1>5 Tema – Atitikties ataskaitų rengimas ir pristatymas</h1><button id="theme">🌙 Dark mode</button></div>
<div id="quiz" class="card"></div><div id="result" class="card result hidden"></div></div>
<script>
const bank=[{"q": "Ką siekiama nustatyti vertinimo etape?", "options": ["Darbuotojų produktyvumą", "Pažeidžiamumus ir neatitikimus", "Pardavimų augimą", "Marketingo efektyvumą"], "correct": 1}, {"q": "Ką vertinimo etape reikia nustatyti techninių kontrolės priemonių srityje?", "options": ["Ar jos atitinka reikalaujamus standartus", "Ar jos yra pigiausios rinkoje", "Ar jos yra naujausios pagal metus", "Ar jas naudoja konkurentai"], "correct": 0}, {"q": "Ką apima atitikties radinių skyrius?", "options": ["Tik darbuotojų apklausas", "Tik finansinius rezultatus", "Tik bendrą įmonės aprašymą", "Išsamų atitikties būklės vertinimą"], "correct": 3}, {"q": "Ką tikrina incidentų ataskaitų peržiūra?", "options": ["Ar buvo atnaujintas biuras", "Ar darbuotojai dirbo viršvalandžius", "Ar įmonė pasiekė pardavimų tikslus", "Ar incidentai buvo tinkamai valdomi ir pranešti per NIS2 nustatytus terminus"], "correct": 3}, {"q": "Kuris ataskaitos skyrius pateikia detalų veiksmų planą?", "options": ["Duomenų rinkimo skyrius", "Vykdomoji santrauka", "Atitikties radiniai", "Rekomendacijos"], "correct": 3}, {"q": "Kokie pagrindiniai etapai nagrinėjami atitikties audito procese?", "options": ["Planavimas, duomenų rinkimas, vertinimas, ataskaitų rengimas ir stebėsena", "Tik ataskaita ir sertifikavimas", "Tik planavimas ir baudos", "Tik duomenų rinkimas ir mokymai"], "correct": 0}, {"q": "Kodėl audito ataskaitoje rekomendacijos turi būti prioritetizuotos?", "options": ["Kad būtų galima panaikinti NIS2 reikalavimus", "Kad būtų aišku, kuriuos veiksmus reikia atlikti pagal rizikos svarbą", "Kad būtų galima išvengti dokumentų rinkimo", "Kad būtų galima atsisakyti visų auditų"], "correct": 1}, {"q": "Koks dokumentas gali padėti įvertinti incidentų valdymą?", "options": ["Darbuotojų CV", "Incidentų ataskaitos", "Pardavimų ataskaitos", "Rinkodaros planas"], "correct": 1}, {"q": "Ką reikia užtikrinti peržiūrint rizikos vertinimus?", "options": ["Reguliarų rizikų nustatymą ir mažinimą", "Reguliarų darbuotojų atostogų planavimą", "Reguliarų įrangos keitimą", "Reguliarų reklamos biudžeto didinimą"], "correct": 0}, {"q": "Kokia yra atitikties audito ataskaitos paskirtis?", "options": ["Tik aprašyti IT infrastruktūrą", "Tik pateikti organizacijos finansinius rezultatus", "Tik surašyti auditorių vardus", "Dokumentuoti atitikties būklę, radinius, neatitiktis ir veiksmus gerinimui"], "correct": 3}, {"q": "Ką tiekimo grandinės vertinimas turi padėti užtikrinti?", "options": ["Kad tiekėjai atliktų darbuotojų mokymus", "Kad tiekėjai sumažintų kainas", "Kad tiekėjai atitiktų NIS2 nustatytus kibernetinio saugumo reikalavimus", "Kad tiekėjai pakeistų organizacijos vadovybę"], "correct": 2}, {"q": "Ką apima rizikos mažinimo rekomendacijos?", "options": ["Biuro renovacijos planą", "Darbuotojų atostogų planą", "Pardavimų tikslus", "Veiksmus nustatytiems pažeidžiamumams pašalinti"], "correct": 3}, {"q": "Ką padeda suprasti duomenų rinkimo etapas?", "options": ["Kaip organizacija renkasi biuro baldus", "Kaip organizacija nustato atlyginimus", "Kaip organizacija planuoja reklamą", "Kaip organizacija šiuo metu valdo riziką ir atitiktį"], "correct": 3}, {"q": "Ką reikia nustatyti apibrėžiant audito apimtį?", "options": ["Tik organizacijos pajamas", "Tik auditorių darbo laiką", "Sistemas, tinklus ir procesus, kuriuos reikia audituoti", "Tik darbuotojų skaičių"], "correct": 2}, {"q": "Kodėl planavimo etapas yra svarbus?", "options": ["Jis skirtas tik baudos dydžiui nustatyti", "Jis nustato audito kryptį ir apimtį", "Jis pakeičia NIS2", "Jis automatiškai išsprendžia visas saugumo spragas"], "correct": 1}, {"q": "Kodėl planuojami tolesni auditai?", "options": ["Kad būtų pakeisti visi darbuotojai", "Kad būtų panaikinta ankstesnė ataskaita", "Kad būtų išvengta rizikos vertinimo", "Kad būtų užtikrinta nuolatinė atitiktis"], "correct": 3}, {"q": "Ką reiškia audito krypties nustatymas planavimo etape?", "options": ["Nustatyti klientų skaičių", "Nustatyti rinkodaros biudžetą", "Nustatyti darbuotojų atlyginimus", "Nustatyti, kokios sistemos, procesai ir tikslai bus vertinami"], "correct": 3}, {"q": "Kuris ataskaitos skyrius pabrėžia neatitiktį NIS2 standartams?", "options": ["Rizikos vertinimo planas", "Interviu protokolas", "Vykdomoji santrauka", "Neatitikties klausimai"], "correct": 3}, {"q": "Koks yra bendras NIS2 reguliarių auditų tikslas pagal medžiagą?", "options": ["Sumažinti darbuotojų skaičių", "Pakeisti organizacijos misiją", "Padidinti pardavimus", "Užtikrinti kibernetinio saugumo standartų laikymąsi"], "correct": 3}, {"q": "Per kiek laiko, pagal pateiktą medžiagą, turi būti atsižvelgiama į NIS2 incidentų pranešimų terminus?", "options": ["Per 7 ir 14 dienų", "Per 24 ir 72 valandas", "Per 30 ir 60 dienų", "Per 1 ir 2 metus"], "correct": 1}, {"q": "Kuris reikalavimas yra vienas iš planavimo etapo tikslų?", "options": ["Sukurti naują personalo skyrių", "Pakeisti visus tinklo įrenginius", "Užtikrinti NIS2 reikalavimų laikymąsi", "Atšaukti ankstesnius auditus"], "correct": 2}, {"q": "Kas pabrėžiama neatitikties klausimų skyriuje?", "options": ["Marketingo rezultatai", "Pardavimų tikslai", "Neatitiktis NIS2 standartams", "Darbuotojų atostogos"], "correct": 2}, {"q": "Koks pagrindinis ryšys tarp vertinimo ir rekomendacijų?", "options": ["Vertinimo rezultatai padeda nustatyti, kokias praktines rekomendacijas reikia pateikti", "Rekomendacijos pakeičia vertinimą", "Vertinimas nereikalingas rekomendacijoms", "Rekomendacijos parengiamos prieš renkant duomenis"], "correct": 0}, {"q": "Koks yra vertinimo ir analizės etapo tikslas?", "options": ["Surinkti pirmuosius duomenis", "Parengti organizacijos biudžetą", "Palyginti surinktus duomenis su NIS2 reikalavimais", "Sudaryti auditorių grafiką"], "correct": 2}, {"q": "Kas gali būti viena iš praktinių rekomendacijų?", "options": ["Biuro baldų keitimas", "Reklamos biudžeto didinimas", "Darbuotojų atostogų ilginimas", "Pleistrų diegimas"], "correct": 3}, {"q": "Kokios rekomendacijos gali būti įtrauktos į audito ataskaitą?", "options": ["Tik darbuotojų premijos", "Tik naujų biurų nuoma", "Pleistrų diegimas, politikos atnaujinimas ir incidentų aptikimo bei reagavimo gerinimas", "Tik rinkodaros kampanijos"], "correct": 2}, {"q": "Ką apima duomenų rinkimo etapas be žurnalų rinkimo?", "options": ["Tik finansinę apskaitą", "Tik rinkodaros analizę", "Tik darbuotojų atranką", "Interviu su personalu, rizikos vertinimų peržiūrą ir incidentų ataskaitų tikrinimą"], "correct": 3}, {"q": "Kokias suinteresuotąsias šalis svarbu įtraukti į planavimą?", "options": ["IT, kibernetinio saugumo pareigūnus ir vadovybę", "Tik išorinius tiekėjus", "Tik rinkodaros skyrių", "Tik klientus"], "correct": 0}, {"q": "Kokie sistemų žurnalai gali būti peržiūrimi duomenų rinkimo etape?", "options": ["Ugniasienės, tinklo veiklos ir incidentų žurnalai", "Tik pardavimų ataskaitos", "Tik finansiniai žurnalai", "Tik personalo žurnalai"], "correct": 0}, {"q": "Kodėl svarbu sekti rekomendacijų įgyvendinimą?", "options": ["Kad būtų galima išvengti visų būsimų auditų", "Kad būtų galima įsitikinti, jog nustatytos spragos tinkamai išspręstos", "Kad būtų galima panaikinti NIS2", "Kad būtų galima sumažinti audito apimtį iki nulio"], "correct": 1}, {"q": "Koks yra pagrindinis planavimo ir pasiruošimo etapo tikslas?", "options": ["Skirti baudas", "Parengti galutinę ataskaitą", "Atlikti tik techninių sistemų testavimą", "Apibrėžti audito apimtį, tikslus ir pagrindą"], "correct": 3}, {"q": "Koks yra pagrindinis duomenų rinkimo ir peržiūros etapo tikslas?", "options": ["Surinkti duomenis apie organizacijos kibernetinio saugumo būklę", "Sukurti naują IT infrastruktūrą", "Pakeisti saugumo politiką", "Parengti baudų sąrašą"], "correct": 0}, {"q": "Kokios techninės kontrolės priemonės minimos vertinimo etape?", "options": ["Tik darbuotojų mokymai", "Tik spausdintuvai ir telefonai", "Šifravimas ir prieigos kontrolė", "Tik apsaugos kameros"], "correct": 2}, {"q": "Ką turi pateikti rekomendacijų skyrius?", "options": ["Tik darbuotojų sąrašą", "Tik audito datą", "Detalų veiksmų planą atitikties gerinimui", "Tik organizacijos istoriją"], "correct": 2}, {"q": "Koks yra stebėsenos vaidmuo užtikrinant atitiktį?", "options": ["Pakeisti visus audito reikalavimus", "Sumažinti dokumentų kiekį iki nulio", "Padėti užtikrinti, kad nustatytos saugumo spragos būtų išspręstos ir atitiktis išliktų nuolatinė", "Panaikinti poreikį teikti ataskaitas"], "correct": 2}, {"q": "Kas pirmiausia nustatoma planuojant NIS2 atitikties auditą?", "options": ["Darbuotojų atostogų grafikas", "Naujų biurų vietos", "Įmonės reklamos biudžetas", "Kritinės sistemos ir procesai, kurie bus audituojami"], "correct": 3}, {"q": "Kuris ataskaitos skyrius skirtas vadovybei aukšto lygio apžvalgai?", "options": ["Atitikties radiniai", "Stebėsenos žurnalas", "Neatitikties klausimai", "Vykdomoji santrauka"], "correct": 3}, {"q": "Koks ypatingas dėmesys skiriamas incidentų pranešimams?", "options": ["Kad incidentai nebūtų registruojami", "Kad incidentai būtų pranešti per 24 ir 72 valandas", "Kad incidentai būtų pranešti tik klientams", "Kad incidentai būtų pranešti kartą per metus"], "correct": 1}, {"q": "Kokia informacija turi būti pateikta rekomendacijų įgyvendinimui?", "options": ["Tik organizacijos pajamos", "Tik darbuotojų skaičius", "Aiškūs terminai", "Tik auditorių vardai"], "correct": 2}, {"q": "Koks yra vykdomosios santraukos tikslas audito ataskaitoje?", "options": ["Pateikti visus techninius žurnalus", "Pateikti tik sutartis", "Pateikti aukšto lygio radinių ir rekomendacijų apžvalgą", "Pateikti tik darbuotojų sąrašą"], "correct": 2}, {"q": "Kokie dokumentai renkami planavimo etape?", "options": ["Saugumo politika, incidentų ataskaitos ir rizikos vertinimai", "Tik sąskaitos faktūros", "Tik rinkodaros planai", "Tik darbuotojų CV"], "correct": 0}, {"q": "Kaip rekomendacijos turi būti prioritetizuojamos?", "options": ["Pagal darbuotojo pareigas", "Pagal rizikos rimtumą ir poveikį", "Pagal įmonės pavadinimo ilgį", "Pagal biuro dydį"], "correct": 1}, {"q": "Ką turi padėti spręsti aiškios ir praktinės rekomendacijos?", "options": ["Tik organizacijos pardavimus", "Tik darbuotojų atostogas", "Tik klientų aptarnavimą", "Nustatytus neatitikimus"], "correct": 3}, {"q": "Ką reikia daryti po ataskaitos pateikimo?", "options": ["Stebėti rekomendacijų įgyvendinimą ir planuoti tolesnius auditus", "Ištrinti audito duomenis", "Nutraukti rizikos vertinimą", "Panaikinti saugumo politiką"], "correct": 0}, {"q": "Kodėl svarbu anksti įtraukti suinteresuotąsias šalis?", "options": ["Kad nereikėtų vertinti rizikos", "Kad būtų galima išvengti duomenų rinkimo", "Kad būtų užtikrintas bendradarbiavimas ir gautos įžvalgos", "Kad būtų galima atšaukti auditą"], "correct": 2}, {"q": "Su kuo vertinimo etape lyginami surinkti duomenys?", "options": ["Tik darbuotojų nuomone", "NIS2 reikalavimais", "Tik konkurentų rezultatais", "Tik ankstesnių metų pajamomis"], "correct": 1}, {"q": "Kokia yra įgyvendinimo stebėjimo paskirtis?", "options": ["Atlikti pradinį interviu", "Nustatyti audito apimtį", "Rinkti pirmuosius audito duomenis", "Sekuoti rekomendacijų įgyvendinimo eigą"], "correct": 3}, {"q": "Kuris ataskaitos skyrius pateikia išsamų atitikties būklės vertinimą?", "options": ["Atitikties radiniai", "Stebėsenos skyrius", "Dokumentų sąrašas", "Vykdomoji santrauka"], "correct": 0}, {"q": "Ką gali apimti incidentų valdymo gerinimo rekomendacijos?", "options": ["Tik fizinės apsaugos kamerų pirkimą", "Tik darbuotojų atlyginimų pakeitimus", "Tik reklamos kampanijas", "Incidentų aptikimo, reagavimo ir pranešimų patobulinimus"], "correct": 3}, {"q": "Ką reikia peržiūrėti tiekimo grandinės saugumo srityje?", "options": ["Trečiųjų šalių tiekėjų politiką ir sutartis dėl atitikties", "Tik klientų sutartis", "Tik darbuotojų sutartis", "Tik biuro nuomos sutartį"], "correct": 0}, {"q": "Koks yra tobulinimo rekomendacijų tikslas?", "options": ["Pateikti praktines rekomendacijas pažeidžiamumams šalinti ir atitikčiai gerinti", "Pakeisti visą organizacijos IT infrastruktūrą", "Sukurti naują rinkodaros strategiją", "Nustatyti audito kainą"], "correct": 0}, {"q": "Ką reikia įvertinti verslo tęstinumo srityje?", "options": ["Ar biuras yra pakankamai didelis", "Ar nelaimių atkūrimo planai yra veiksmingi", "Ar darbuotojai turi pakankamai atostogų", "Ar įmonė turi pakankamai reklamos"], "correct": 1}, {"q": "Kodėl audito metu atliekami interviu su personalu?", "options": ["Kad būtų sudarytas rinkodaros planas", "Kad būtų pakeista organizacijos struktūra", "Kad būtų nustatyti darbuotojų atlyginimai", "Kad būtų suprastos atitikties ir saugumo operacijos"], "correct": 3}];let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;const item=quiz[current],box=document.getElementById('quiz');box.innerHTML='<div class="meta">Klausimas '+(current+1)+' iš 10</div><div class="question">'+escapeHtml(item.q)+'</div><div id="options"></div><button id="next" class="next hidden">Kitas klausimas →</button>';const opts=document.getElementById('options');item.options.forEach((t,i)=>{const b=document.createElement('button');b.className='option';b.textContent=t;b.onclick=()=>answer(i);opts.appendChild(b)})}
function answer(i){if(answered)return;answered=true;const item=quiz[current],bs=[...document.querySelectorAll('.option')];bs.forEach(b=>b.disabled=true);if(i===item.correct){bs[i].classList.add('correct');score++}else{bs[i].classList.add('wrong');bs[item.correct].classList.add('correct')}document.getElementById('next').classList.remove('hidden')}
document.addEventListener('click',e=>{if(e.target.id==='next'){current++;current<10?showQuestion():showResult()}});
function showResult(){document.getElementById('quiz').classList.add('hidden');const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<div class="small">5 Tema baigta</div><div class="score">'+score+'/10</div><div>'+(score*10)+'%</div><button class="restart" onclick="pick10()">Bandyti dar kartą</button>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
const theme=document.getElementById('theme');if(localStorage.getItem('darkMode')==='1')document.body.classList.add('dark');
function themeText(){theme.textContent=document.body.classList.contains('dark')?'☀️ Light mode':'🌙 Dark mode'}theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('darkMode',document.body.classList.contains('dark')?'1':'0');themeText()};themeText();pick10();
</script></body></html>
