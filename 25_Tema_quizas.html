<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}

.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">

 "Kas yra viena pagrindinių fizinės saugos priemonių?", "a": ["Praėjimo valdymo sistema", "Mail serveris", "SQL ugniasienė", "DNS serveris"], "c": 0}, {"q": "Iš ko paprastai susideda praėjimo valdymo sistema?", "a": ["Tik darbuotojų sąrašo", "Tik kamerų", "Tik PIN kodų", "Užrakintų durų, centralizuotos teisių valdymo sistemos ir perspėjimo mechanizmų"], "c": 3}, {"q": "Kuo gali būti atrakinamos praėjimo valdymo sistemų durys?", "a": ["Tik slaptažodžiu el. paštu", "Tik Kerberos TGT", "Tik VPN", "Kortelėmis, žetonais arba aplikacijomis"], "c": 3}, {"q": "Kokiu papildomu faktoriumi gali būti sustiprintos praėjimo sistemos?", "a": ["PIN kodais arba biometrine informacija", "Tik DNS", "Tik DHCP", "Tik MAC adresu"], "c": 0}, {"q": "Ką leidžia skirtingos praėjimo teisės?", "a": ["Suteikti prieigą prie skirtingų biuro zonų skirtingiems asmenims", "Suteikti visiems vienodas teises", "Pakeisti Wi-Fi standartą", "Išjungti vaizdo stebėjimą"], "c": 0}, {"q": "Koks vienas pasenusių praėjimo sistemų iššūkių?", "a": ["Ransomware", "Darbuotojų praėjimo kortelių klonavimas", "DNS spoofing", "SQL Injection"], "c": 1}, {"q": "Kokia problema gali kilti darbuotojui pakeitus rolę arba išėjus iš darbo?", "a": ["Netinkamai valdomos prieigos teisės gali likti galioti", "Pasikeičia NFC dažnis", "Išsijungia DHCP", "Automatiškai sugenda kameros"], "c": 0}, {"q": "Kuris veiksnys taip pat minimas tarp praėjimo sistemų iššūkių?", "a": ["TOTP skaitiklis", "Socialinė inžinerija", "SQL indeksai", "SSL sertifikatai"], "c": 1}, {"q": "Kas yra praėjimo kortelės ir žetonai?", "a": ["Pasyvūs individualiai asmeniui išduodami elektronikos komponentai", "VPN serveriai", "Vaizdo įrašymo įrenginiai", "Aktyvūs Wi-Fi maršrutizatoriai"], "c": 0}, {"q": "Kokie standartai minimi praėjimo kortelių ir žetonų kontekste?", "a": ["BGP ir OSPF", "TCP ir UDP", "HTTP ir HTTPS", "RFID ir NFC"], "c": 3}, {"q": "Koks dažnis nurodomas RFID?", "a": ["13,56 MHz", "Apie 125–500 kHz", "2,4 GHz", "5 GHz"], "c": 1}, {"q": "Koks dažn  pažeidžiamumus", "Ji pakeičia antivirusinę", "Ji tikrina darbuotojų sveikatą"], "c": 1}, {"q": "Kokio tipo tinklo jungtys turi būti kontroliuojamos?", "a": ["Laidinės ir belaidės", "Tik laidinės", "Tik VPN", "Tik belaidės"], "c": 0}, {"q": "Kas yra NAC?", "a": ["Tinklo prieigos kontrolės sistema", "Vaizdo stebėjimo sistema", "Šifravimo algoritmas", "Praėjimo kortelė"], "c": 0}, {"q": "Kokie paprastesni laidinio tinklo ribojimai minimi?", "a": ["MAC adresų filtravimas ir nenaudojamų prievadų atjungimas", "Tik biometrika", "Tik NVR", "Tik WPA3"], "c": 0}, {"q": "Koks protokolas dažnai naudojamas NAC įgyvendinti?", "a": ["FTP", "HTTP", "802.1X", "BGP"], "c": 2}, {"q": "Kaip 802.1X padeda kontroliuoti tinklo prieigą?", "a": ["Valdo durų spynas", "Šifruoja vaizdo įrašus", "Autentifikuoja prie tinklo prijungtus įrenginius", "Generuoja TOTP"], "c": 2}, {"q": "Kas gali būti naudojama įrenginių autentifikacijai 802.1X kontekste?", "a": ["Tik SMS kodai", "Tik NVR", "Tik NFC kortelės", "Įrenginių sertifikatai arba įrenginiuose įdiegti agentai"], "c": 3}, {"q": "Kokie autentifikacijos mechanizmai paminėti belaidžio tinklo kontekste?", "a": ["Kerberos ir TOTP", "HTTP ir HTTPS", "BGP ir OSPF", "WPA2 PSK ir WPA2 Enterprise"], "c": 3}, {"q": "Kodėl gali būti ribojamas belaidžio ryšio stiprumas?", "a": ["Kad būtų išjungtas NAC", "Kad nebūtų galima jungtis iš tolimesnės lokacijos nei būtina", "Kad padidėtų Wi-Fi aprėptis", "Kad būtų pašalintas WPA2"], "c": 1}, {"q": "Kaip gali būti valdoma svečių prieiga prie belaidžio tinklo?", "a": ["Segmentuojant tinklą ir naudojant captive portalus", "Naudojant tik NVR", "Naudojant tik MAC adresą", "Išjungiant DHCP"], "c": 0}, {"q": "Kodėl svarbi darbuotojų įrenginių prieigos kontrolė?", "a": ["Įrenginiai naudojami tik pramogoms", "Įrenginiai negali būti pamesti", "Įrenginiai neturi duomenų", "Įrenginiai leidžia tiesiogiai prieiti prie jautrios įmonės informacijos"], "c": 3}, {"q": "Kur dažnai sukuriama darbuotojo paskyra?", "a": ["DHCP serveryje", "Wi-Fi prieigos taške", "NVR", "Centrinėje tapatybių valdymo sistemoje"], "c": 3}, {"q": "Koks centralizuotos tapatybės valdymo privalumas?", "a": ["Tą pačią tapatybę galima naudoti keliose įmonės sistemose, o prieigas valdyti centralizuotai", "Kiekvienai sistemai reikia skirtingo vartotojo vardo", "Nereikia šifruoti įrenginio", "Nereikia autentifikacijos"], "c": 0}, {"q": "Kuris pavyzdys minimas kaip tapatybių valdymo sistema?", "a": ["NVR", "802.1X", "Active Directory", "CCTV"], "c": 2}, {"q": "Kuris kitas tapatybių valdymo sprendimas minimas?", "a": ["Apache2", "WPA2", "Entra ID", "MySQL"], "c": 2}, {"q": "Koks dar tapatybių valdymo sprendimas paminėtas?", "a": ["RFID", "NAC", "NVR", "OKTA"], "c": 3}, {"q": "Kaip apsisaugoma nuo informacijos nutekinimo pametus ar pavogus įrenginį?", "a": ["Naudojama tik vaizdo kamera", "Išjungiamas DHCP", "Įrenginio kaupiklyje esanti informacija užšifruojama", "Pašalinamas Wi-Fi"], "c": 2}, {"q": "Kada įrenginio informacija skaidriai iššifruojama pagal medžiagą?", "a": ["Kai atidaromas NVR", "Kai prijungiamas bet koks USB", "Kai įjungiamas Wi-Fi", "Kai prisijungia autorizuotas darbuotojas"], "c": 3}, {"q": "Kas yra Windows Hello for Business?", "a": ["Galimybė jungtis prie Windows kompiuterio naudojant biometrinius duomenis, PIN, tapatybės kortelę su sertifikatu arba FIDO2 žetoną", "NAC protokolas", "MySQL autentifikacijos mechanizmas", "Vaizdo stebėjimo sistema"], "c": 0}, {"q": "Ką leidžia Windows Hello for Business prisijungimas?", "a": ["Toliau jungtis prie kitų sistemų nevedant prisijungimo slaptažodžio", "Konfigūruoti DHCP", "Valdyti NVR", "Išjungti visą autentifikaciją"], "c": 0}, {"q": "Kodėl duomenų centrams reikia papildomų apsaugos priemonių?", "a": ["Juose nereikia fizinės apsaugos", "Juose visada galima dirbti iš namų", "Jie turi būti atsparūs elektros, interneto ir kitiems nenumatytiems gedimams", "Juose nėra IT įrangos"], "c": 2}, {"q": "Kokia duomenų centro pastato konstrukcija minima?", "a": ["Atvira konstrukcija", "Tik požeminis rūsys", "„Pastatas pastate“", "Kilnojamas pastatas"], "c": 2}, {"q": "Kokios elektros tiekimo priemonės minimos duomenų centruose?", "a": ["Tik saulės baterijos", "Dedikuotos elektros linijos, UPS ir dyzeliniai generatoriai", "Tik viena elektros linija", "Tik baterijos telefonams"], "c": 1}, {"q": "Kodėl duomenų centruose naudojami keli interneto tiekėjai?", "a": ["Kad būtų užtikrintas ryšio atsparumas naudojant atskiras dedikuotas linijas", "Kad būtų galima išjungti tinklą", "Kad nereikėtų ugniasienės", "Kad veiktų NFC"], "c": 0}, {"q": "Ką užtikrina duomenų centro šaldymo ir vėdinimo sistema?", "a": ["MFA", "Praėjimo kortelių klonavimą", "Optimalų elektronikos įrangos temperatūros ir drėgmės palaikymą", "Wi-Fi autentifikaciją"], "c": 2}, {"q": "Kokia gesinimo sistema minima?", "a": ["Tik dūmų detektoriai", "Gesinimas dujomis, išstumiančiomis degimą palaikantį deguonį ir nekenkiančiomis elektronikai", "Tik ventiliacija", "Vandens kibirai"], "c": 1}, {"q": "Kodėl darbuotojų mokymai svarbūs fizinei saugai?", "a": ["Žmogiškasis faktorius yra ypač svarbus užtikrinant įmonės saugą", "Mokymai skirti tik IT administratoriams", "Mokymai pakeičia visas technines priemones", "Darbuotojai valdo tik serverius"], "c": 0}, {"q": "Kodėl svarbu iš anksto žinoti, kaip elgtis kritinėse situacijose?", "a": ["Nenumatytose situacijose nėra daug laiko racionaliems sprendimams priimti", "Mokymai skirti tik teorijai", "Sprendimus visada priima kamera", "Kritinėse situacijose nieko nereikia daryti"], "c": 0}, {"q": "Kuri situacija minima kaip kritinė?", "a": ["Slaptažodžio keitimas", "Programavimo klaida", "Elektros ar interneto ryšio dingimas", "Duomenų bazės indeksavimas"], "c": 2}, {"q": "Kuri kita kritinė situacija minima?", "a": ["Wi-Fi pavadinimo pakeitimas", "El. pašto filtro keitimas", "Gaisras ar stichinė nelaimė", "Programos atnaujinimas"], "c": 2}, {"q": "Ko darbuotojai turi gebėti išvengti?", "a": ["DHCP", "NFC", "CCTV", "Socialinės inžinerijos atakų"], "c": 3}, {"q": "Kaip dažnai paprastai organizuojami darbuotojų mokymai pagal medžiagą?", "a": ["Tik kartą per metus", "Kas valandą", "Kasdien", "Kas savaitę"], "c": 0}, {"q": "Kas gali būti naudojama darbuotojų žinioms patikrinti?", "a": ["Tik NAC", "Tik vaizdo kameros", "Tik praėjimo kortelės", "Žinias patikrinantys testai"], "c": 3}, {"q": "Kas periodiškai vykdoma pastato saugos kontekste?", "a": ["Kerberos testai", "BGP testai", "Evakuacijos testai", "MySQL testai"], "c": 2}, {"q": "Kokios simuliacijos vis dažniau naudojamos darbuotojų mokymuose?", "a": ["BGP hijacking simuliacijos", "Socialinės inžinerijos simuliacijos", "SQL optimizavimo simuliacijos", "Ransomware paleidimo simuliacijos"], "c": 1}, {"q": "Kodėl gamybinėms įmonėms fizinės socialinės inžinerijos mokymai gali būti ypač svarbūs?", "a": ["Gamyboje nenaudojamos IT sistemos", "Gamyboje nereikia fizinės apsaugos", "Gamyboje nėra darbuotojų", "Fizinis patekimas į patalpas jose išlieka aktualus rizikos scenarijus"], "c": 3}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
