<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic 49 — Vulnerability Scanning with Metasploit</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>Topic 49 — Vulnerability Scanning with Metasploit</h1><div class="subtitle">Practical vulnerability discovery and exploitation in a lab environment</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 49 temos tema?", "a": ["Įsilaužimo į tinklą atakos", "EDR sprendimai", "Pažeidžiamumų paieška su OpenVAS", "Pažeidžiamumų paieška su Metasploit"], "c": 3}, {"q": "Kokia paskaitos trukmė?", "a": ["2 valandos", "6 valandos", "8 valandos", "4 valandos"], "c": 3}, {"q": "Koks paskaitos formatas?", "a": ["Teorija", "Teorija ir praktinė veikla", "Egzaminas", "Praktinė veikla"], "c": 3}, {"q": "Koks pagrindinis praktinės veiklos tikslas?", "a": ["Pažeidžiamumų paieška ir išnaudojimas su Metasploit programiniu paketu", "Darbuotojų mokymas", "DLP diegimas", "DNS konfigūravimas"], "c": 0}, {"q": "Koks programinis paketas naudojamas praktinėje veikloje?", "a": ["GoPhish", "Metasploit", "Nessus", "OpenVAS"], "c": 1}, {"q": "Kuriame pratybų etape yra ši tema?", "a": ["3/6", "4/6", "5/6", "2/6"], "c": 1}, {"q": "Kokia veikla atliekama su Metasploit?", "a": ["Tik žurnalų analizė", "Pažeidžiamumų paieška ir išnaudojimas", "Tik DNS skenavimas", "Tik atsarginių kopijų kūrimas"], "c": 1}, {"q": "Kokia infrastruktūra minima praktinei veiklai?", "a": ["El. pašto infrastruktūra", "Viešas interneto serveris", "Gamybinė organizacijos infrastruktūra", "Infrastruktūra „laužymui“"], "c": 3}, {"q": "Koks būdas nurodytas prieigai prie praktinės infrastruktūros?", "a": ["Per Google Classroom tiesiogiai", "Per Guacamole", "Per GitHub", "Per OpenVAS konsolę"], "c": 1}, {"q": "Kur pateikiamas praktinio darbo aprašymas?", "a": ["TryHackMe", "Google Classroom'e", "GitHub'e", "El. paštu"], "c": 1}, {"q": "Kiek mašinų nurodyta praktinėje aplinkoje?", "a": ["Trys", "Keturios", "Viena", "Dvi"], "c": 3}, {"q": "Kokia pirmoji mašina minima praktinėje aplinkoje?", "a": ["Kali Linux", "Ubuntu Desktop", "Windows Server", "Metasploitable"], "c": 0}, {"q": "Koks komponentas minimas Kali Linux mašinoje?", "a": ["WordPress", "DNS serveris", "GoPhish", "OpenVAS komponentas"], "c": 3}, {"q": "Kokia antroji mašina minima praktinėje aplinkoje?", "a": ["Kali Linux", "OPNsense", "Metasploitable", "Windows Server"], "c": 2}, {"q": "Koks ryšys tarp Kali Linux ir Metasploitable praktikoje?", "a": ["Abi yra DNS serveriai", "Tai dvi praktinės aplinkos mašinos", "Abi yra ugniasienės", "Abi yra el. pašto serveriai"], "c": 1}, {"q": "Koks yra praktinės veiklos pobūdis pagal temos aprašymą?", "a": ["Pažeidžiamumų paieška ir jų išnaudojimas", "Tik tinklo segmentavimas", "Tik pažeidžiamumų dokumentavimas", "Tik sistemos atsarginių kopijų kūrimas"], "c": 0}, {"q": "Kuris įrankis yra pagrindinis šios temos praktikos objektas?", "a": ["Nmap", "Burp Suite", "OpenVAS", "Metasploit"], "c": 3}, {"q": "Kuri sistema pateikta kaip praktinė testavimo aplinka?", "a": ["Windows Server", "Metasploitable", "Entra ID", "OPNsense"], "c": 1}, {"q": "Kuri Linux sistema naudojama praktinėje aplinkoje?", "a": ["Kali Linux", "Alpine Linux", "CentOS", "Fedora"], "c": 0}, {"q": "Koks praktikos tikslas susijęs su pažeidžiamumais?", "a": ["Tik juos pašalinti automatiškai", "Tik juos užšifruoti", "Juos rasti ir išnaudoti naudojant Metasploit", "Tik juos surašyti į dokumentą"], "c": 2}, {"q": "Kokia paskaitos dalis minima kaip pagrindinė veikla?", "a": ["Egzaminas", "Teorinė paskaita", "Diskusija be praktikos", "Praktinė veikla"], "c": 3}, {"q": "Kokia ankstesnėje temoje naudota technologija minima Kali Linux aprašyme?", "a": ["SIEM", "DLP", "OpenVAS komponentas", "EDR"], "c": 2}, {"q": "Kuri iš pateiktų sistemų yra pažeidžiama testavimo aplinka?", "a": ["Guacamole", "Kali Linux", "Metasploitable", "Google Classroom"], "c": 2}, {"q": "Kuri iš pateiktų sistemų yra Linux pagrindu veikianti testavimo darbo aplinka?", "a": ["Kali Linux", "Metasploitable", "Guacamole", "Google Classroom"], "c": 0}, {"q": "Kokia praktinės infrastruktūros paskirtis?", "a": ["Talpinti viešą organizacijos svetainę", "Saugoti atsargines kopijas", "Valdyti darbuotojų paskyras", "Atlikti pažeidžiamumų paieškos ir išnaudojimo praktinę veiklą"], "c": 3}, {"q": "Kokia platforma minima kaip prieigos prie laboratorinės infrastruktūros priemonė?", "a": ["Guacamole", "Metasploit", "Google Classroom", "OpenVAS"], "c": 0}, {"q": "Kokia sistema minima kaip atskira praktinės aplinkos mašina?", "a": ["Google Classroom", "OpenVAS", "Guacamole", "Metasploitable"], "c": 3}, {"q": "Kokia sistema minima kaip kita praktinės aplinkos mašina?", "a": ["Kali Linux", "Guacamole", "Metasploitable", "Google Classroom"], "c": 0}, {"q": "Kuris teiginys geriausiai apibūdina 49 temos formatą?", "a": ["Praktinis darbas su Metasploit laboratorinėje aplinkoje", "Teorinė paskaita apie OpenVAS", "Tik diskusija", "Teorinė paskaita apie EDR"], "c": 0}, {"q": "Kokia užduotis nurodyta temos apraše?", "a": ["Web aplikacijos diegimas", "Pažeidžiamumų paieška ir išnaudojimas su Metasploit programiniu paketu", "SIEM sistemos diegimas", "Pažeidžiamumų paieška tik su OpenVAS"], "c": 1}, {"q": "Kuri mašina skirta kaip pažeidžiama sistema praktikoje?", "a": ["Google Classroom", "Kali Linux", "Metasploitable", "Guacamole"], "c": 2}, {"q": "Kuri mašina pateikiama su OpenVAS komponentu?", "a": ["Google Classroom", "Kali Linux", "Guacamole", "Metasploitable"], "c": 1}, {"q": "Kiek mašinų sudaro nurodytą praktinę aplinką?", "a": ["Dvi", "Viena", "Trys", "Dvi dešimtys"], "c": 0}, {"q": "Kur pateiktas praktinio darbo aprašymas?", "a": ["Metasploit", "Kali Linux", "Google Classroom'e", "Guacamole"], "c": 2}, {"q": "Kokia tema nurodyta kaip paskaitos pavadinimas?", "a": ["Pažeidžiamumų paieška su Qualys", "Pažeidžiamumų paieška su Nessus", "Pažeidžiamumų paieška su Metasploit", "Pažeidžiamumų paieška su OpenVAS"], "c": 2}, {"q": "Kokia veikla atliekama naudojant Metasploit laboratorijoje?", "a": ["Tik vartotojų mokymas", "Pažeidžiamumų paieška ir išnaudojimas", "Tik žurnalų rinkimas", "Tik tinklo segmentavimas"], "c": 1}, {"q": "Kokia laboratorinė sistema minima kaip taikinys?", "a": ["Metasploitable", "Google Classroom", "Guacamole", "Kali Linux"], "c": 0}, {"q": "Kokia laboratorinė sistema minima kaip darbo aplinka?", "a": ["Kali Linux", "Google Classroom", "Metasploitable", "Guacamole"], "c": 0}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
