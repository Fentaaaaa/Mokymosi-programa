<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>19 tema — Aplikacijų pažeidžiamumai</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>19 tema — Aplikacijų pažeidžiamumai</h1><div class="subtitle">Web aplikacijų sauga, CVE/CVSS, OWASP, MITRE ATT&CK ir Burp Suite</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kas yra viena iš pagrindinių internetinių aplikacijų pažeidžiamumų priežasčių?", "a": ["Per dažnas atsarginių kopijų kūrimas", "Programavimo arba konfigūravimo klaidos", "Per didelis monitorių skaičius", "Per mažas interneto greitis"], "c": 1}, {"q": "Kuo pasižymi Web 2.0 aplikacijos?", "a": ["Jos leidžia kurti ypač dinamiškas internetines aplikacijas", "Jos skirtos tik el. paštui", "Jos nenaudoja serverių", "Jos veikia tik be interneto"], "c": 0}, {"q": "Kokia aplikacijų pateikimo forma minima kaip viena pirmaujančių?", "a": ["Tik darbalaukio aplikacijos", "Internetinės ir mobiliosios aplikacijos", "Tik tekstinės konsolės", "Tik fiziniai terminalai"], "c": 1}, {"q": "Kur gali būti aptinkami nauji aplikacijų pažeidžiamumai?", "a": ["Tik klaviatūrose", "Web serveriuose, programinės įrangos karkasuose ar bibliotekose", "Tik spausdintuvuose", "Tik monitoriuose"], "c": 1}, {"q": "Ką reiškia CVE?", "a": ["Common Vulnerabilities and Exposures", "Common Virtual Encryption", "Central Vulnerability Engine", "Cyber Verification Environment"], "c": 0}, {"q": "Kas yra CVE?", "a": ["Antivirusinė programa", "Tinklo protokolas", "Formalus pažeidžiamumo aprašas, apimantis svarbiausius jo aspektus", "Web serveris"], "c": 2}, {"q": "Kokiame intervale vertinamas CVE pagal CVSS metodiką?", "a": ["10–100", "0.0–10.0", "0–1000", "1–5"], "c": 1}, {"q": "Ką reiškia didesnis CVSS skaičius?", "a": ["Rimtesnį pažeidžiamumą", "Daugiau vartotojų", "Didesnį interneto greitį", "Mažesnę riziką"], "c": 0}, {"q": "Kokios CVSS versijos paminėtos medžiagoje?", "a": ["v1 ir v4", "v3 ir v5", "v2 ir v3", "Tik v1"], "c": 2}, {"q": "Ar skirtingų CVSS versijų įverčiai visiškai sutampa?", "a": ["Tai nepriklauso nuo CVSS versijos", "Ne, jų įverčiai nėra visiškai sutampantys", "Taip, jei naudojamas tas pats serveris", "Taip, visada visiškai sutampa"], "c": 1}, {"q": "Kuris įrankis pateiktas kaip CVSS kalkuliatoriaus šaltinis?", "a": ["NVD CVSS Calculator", "Attack Navigator", "Burp Repeater", "Shodan"], "c": 0}, {"q": "Kuris iš šių šaltinių pateiktas pažeidžiamumų paieškai?", "a": ["Exploit DB", "Google Maps", "Microsoft Word", "Wikipedia"], "c": 0}, {"q": "Kuris iš šių taip pat pateiktas kaip pažeidžiamumų paieškos šaltinis?", "a": ["Burp Repeater", "Sequencer", "Clickbandit", "CVE MITRE"], "c": 3}, {"q": "Kuris šaltinis pateiktas kartu su Exploit DB, CVE MITRE ir VUL DB?", "a": ["Excel", "Shodan", "OWASP ZAP", "Rapid7"], "c": 3}, {"q": "Kas yra OWASP?", "a": ["Operacinė sistema", "Tinklo maršrutizavimo protokolas", "Kibernetinių nusikaltėlių grupė", "Bendruomenė, kurianti mokomąją medžiagą ir įrankius apie internetinių programų saugumą"], "c": 3}, {"q": "Kas yra OWASP Top 10?", "a": ["Dešimties populiariausių internetinių aplikacijų pažeidžiamumų sąrašas", "Dešimties populiariausių naršyklių sąrašas", "Dešimties antivirusinių programų sąrašas", "Dešimties tinklo protokolų sąrašas"], "c": 0}, {"q": "Ką, be pažeidžiamumų, apima OWASP Top 10?", "a": ["Apsaugos nuo tų pažeidžiamumų priemones", "Interneto tiekėjų sąrašą", "Programuotojų atlyginimus", "Serverių kainas"], "c": 0}, {"q": "Kada išleista naujausia OWASP Top 10 versija, minima medžiagoje?", "a": ["2015 metais", "2010 metais", "2021 metais", "2023 metais"], "c": 2}, {"q": "Kam OWASP Top 10 naudingas programinės įrangos kūrėjams?", "a": ["Padeda pasirinkti kompiuterio procesorių", "Padeda konfigūruoti Wi-Fi kanalus", "Padeda valdyti finansus", "Padeda apsisaugoti nuo potencialių pažeidžiamumų"], "c": 3}, {"q": "Kuri veikla minima kartu su OWASP?", "a": ["Patch Tuesday", "Nessus Scanner", "Cheat Sheet series", "Bug bounty tik Microsoft"], "c": 2}, {"q": "Kada pradėtas OWASP Top 10?", "a": ["2010 metais", "2021 metais", "2003 metais", "1995 metais"], "c": 2}, {"q": "Kas yra MITRE ATT&CK karkasas?", "a": ["Web aplikacijų skeneris", "Visų galimų kibernetinių atakų modelių matrica", "CVE duomenų bazė", "Slaptažodžių generatorius"], "c": 1}, {"q": "Pagal ką sumodeliuotas MITRE ATT&CK karkasas?", "a": ["Pagal atsitiktinius scenarijus", "Pagal realius, taikomus scenarijus", "Tik pagal laboratorinius testus", "Tik pagal vartotojų apklausas"], "c": 1}, {"q": "Kas gali naudoti MITRE ATT&CK karkasą?", "a": ["Tik programuotojai", "Blue ir Red komandos, įsiskverbimo testuotojai ir etiški programišiai", "Tik vadovai", "Tik sistemų administratoriai"], "c": 1}, {"q": "Koks įrankis paminėtas kartu su MITRE ATT&CK?", "a": ["Burp Decoder", "CVSS Calculator", "Exploit DB", "Attack Navigator"], "c": 3}, {"q": "Ką reiškia MITRE ATT&CK etapas Reconnaissance?", "a": ["Pradinę prieigą", "Duomenų išnešimą", "Informacijos rinkimą", "Poveikį sistemoms"], "c": 2}, {"q": "Ką reiškia Resource Development?", "a": ["Duomenų surinkimą", "Ryšio su taikiniu nutraukimą", "Teisių lygio pakėlimą", "Įsilaužimui reikiamų resursų gavimą"], "c": 3}, {"q": "Ką reiškia Initial Access?", "a": ["Pradinę prieigą", "Duomenų išnešimą", "Poveikį", "Informacijos rinkimą"], "c": 0}, {"q": "Ką reiškia Execution?", "a": ["Atsarginių kopijų kūrimą", "Duomenų archyvavimą", "Tinklo segmentavimą", "Įsilaužimo atlikimą"], "c": 3}, {"q": "Ką reiškia Persistence?", "a": ["Pažeidžiamumo skenavimą", "Užsitvirtinimą vidiniame tinkle", "Informacijos rinkimą", "Duomenų išnešimą"], "c": 1}, {"q": "Ką reiškia Privilege Escalation?", "a": ["Informacijos rinkimą", "Pradinę prieigą", "Duomenų šifravimą", "Teisių lygio pasikėlimą"], "c": 3}, {"q": "Ką reiškia Defense Evasion?", "a": ["Resursų gavimą", "Gynybinių mechanizmų apėjimą arba išvengimą", "Duomenų išnešimą", "Sistemos atkūrimą"], "c": 1}, {"q": "Ką reiškia Credential Access?", "a": ["Tinklo stebėjimą", "Priėjimą prie reikalingų paskyrų", "Duomenų sunaikinimą", "Konfigūracijos keitimą"], "c": 1}, {"q": "Ką reiškia Discovery?", "a": ["Paskyrų kūrimą", "Duomenų išnešimą", "Pataisų diegimą", "Atakos taikinio suradimą"], "c": 3}, {"q": "Ką reiškia Lateral Movement?", "a": ["Judėjimą vidiniame tinkle link taikinio", "Duomenų šifravimą", "Informacijos rinkimą iš interneto", "Atsarginių kopijų kūrimą"], "c": 0}, {"q": "Ką reiškia Collection?", "a": ["Pradinę prieigą", "Teisių pasikėlimą", "Reikalingų duomenų ar kitų resursų surinkimą", "Gynybos apėjimą"], "c": 2}, {"q": "Ką reiškia Command and Control?", "a": ["Ryšio užmezgimą su taikiniu", "Tinklo inventorizaciją", "Pažeidžiamumo pataisymą", "Duomenų sunaikinimą"], "c": 0}, {"q": "Ką reiškia Exfiltration?", "a": ["Pradinę prieigą", "Duomenų išsinešimą", "Gynybos mechanizmų apėjimą", "Saugos politikos kūrimą"], "c": 1}, {"q": "Ką reiškia Impact?", "a": ["Informacijos rinkimą", "Duomenų ar sistemų sunaikinimą arba modifikavimą", "Paskyrų gavimą", "Tinklo skenavimą"], "c": 1}, {"q": "Kam skirtas Burp Suite?", "a": ["Tinklo maršrutizavimui", "Atsarginių kopijų kūrimui", "Darbuotojų mokymui", "Internetinių aplikacijų saugumo testavimui"], "c": 3}, {"q": "Kokias Burp Suite versijas nurodo medžiaga?", "a": ["Tik bandomąją versiją", "Nemokamą ir komercines versijas", "Tik nemokamą versiją", "Tik mokamą versiją"], "c": 1}, {"q": "Kaip Burp Suite veikia testuojant web aplikaciją?", "a": ["Tik stebi procesoriaus apkrovą", "Tik valdo DNS", "Tik skenuoja failų sistemą", "Veikia kaip tarpininkas, perimdamas užklausas ir atsakymus bei leisdamas jomis manipuliuoti"], "c": 3}, {"q": "Kokie Burp Suite moduliai įvardyti kaip svarbiausi praktikoje?", "a": ["Comparer ir Collaborator", "Proxy ir Repeater", "Scanner ir Decoder", "Intruder ir Sequencer"], "c": 1}, {"q": "Kam skirtas Burp Scanner?", "a": ["Rankiniu būdu siųsti HTTP užklausas", "Vizualiai lyginti duomenis", "Automatiškai skenuoti tinklapio turinį ir saugumo pažeidžiamumus", "Analizuoti sesijos rakto atsitiktinumą"], "c": 2}, {"q": "Kam skirtas Burp Intruder?", "a": ["Automatizuotoms atakoms vykdyti", "Tik HTTP atsakymams lyginti", "Tik duomenims dekoduoti", "Tik sesijų raktams analizuoti"], "c": 0}, {"q": "Kam skirtas Burp Repeater?", "a": ["Automatiškai skenuoti tinklapį", "Kurti clickjacking atakas", "Analizuoti atsitiktinius skaičius", "Rankiniu būdu siųsti pakartotinas HTTP užklausas"], "c": 3}, {"q": "Kam skirtas Burp Collaborator client?", "a": ["Lyginti duomenis", "Dekoduoti slaptažodžius", "Kurti Burp Collaborator paketus ir stebėti jų sukeltus atsakymus", "Automatiškai skenuoti tinklapį"], "c": 2}, {"q": "Kam skirtas Burp Clickbandit?", "a": ["Siųsti HTTP užklausas", "Analizuoti sesijos raktus", "Kurti apgaulingos nuorodos (clickjacking) atakas", "Skenuoti tinklo įrenginius"], "c": 2}, {"q": "Kam skirtas Burp Sequencer?", "a": ["Automatiškai skenuoti turinį", "Vizualiai lyginti aplikacijos duomenis", "Analizuoti aplikacijos sesijos rakto atsitiktinių verčių sugeneravimo kokybę", "Kurti clickjacking atakas"], "c": 2}, {"q": "Kam skirtas Burp Decoder?", "a": ["Stebėti Collaborator atsakymus", "Transformuoti aplikacijos duomenis naudojant žinomas užkodavimo ir iškodavimo schemas", "Vykdyti automatizuotas atakas", "Analizuoti sesijos rakto atsitiktinumą"], "c": 1}, {"q": "Kam skirtas Burp Comparer?", "a": ["Siųsti pakartotinas HTTP užklausas", "Kurti clickjacking atakas", "Automatiškai skenuoti pažeidžiamumus", "Vizualiai palyginti aplikacijos duomenis ir aptikti įdomius skirtumus"], "c": 3}, {"q": "Kokia praktinė priemonė minima susipažinti su Burp Suite?", "a": ["TryHackMe Burp Suite Basics", "NVD Calculator", "Microsoft Learn", "OWASP ZAP Basics"], "c": 0}, {"q": "Koks yra Burp Suite Proxy vaidmuo?", "a": ["Klasifikuoti darbuotojus", "Perimti ir leisti manipuliuoti web aplikacijos užklausomis bei atsakymais", "Vertinti CVSS balus", "Kurti CVE numerius"], "c": 1}, {"q": "Kuris Burp Suite modulis naudojamas rankiniam HTTP užklausų kartojimui?", "a": ["Repeater", "Comparer", "Scanner", "Sequencer"], "c": 0}, {"q": "Kuris Burp Suite modulis skirtas automatizuotoms atakoms?", "a": ["Decoder", "Comparer", "Intruder", "Proxy"], "c": 2}, {"q": "Kuris teiginys apie OWASP Top 10 yra teisingas?", "a": ["Sąrašas atnaujinamas kasdien", "Sąraše pateikiami tik CVSS balai", "Sąrašas skirtas tik tinklo įrangai", "Sąrašas atnaujinamas kas kelerius metus"], "c": 3}, {"q": "Kuris teiginys apie CVSS yra teisingas?", "a": ["CVSS yra antivirusinė programa", "CVSS įvertis padeda apibūdinti pažeidžiamumo rimtumą", "CVSS nustato darbuotojo teises", "CVSS skirtas tik web serverių konfigūracijai"], "c": 1}, {"q": "Koks yra pagrindinis MITRE ATT&CK privalumas pagal pateiktą medžiagą?", "a": ["Jis pakeičia CVE duomenų bazę", "Jis struktūruoja realiais scenarijais paremtus kibernetinių atakų modelius", "Jis skirtas tik slaptažodžių saugojimui", "Jis automatiškai pataiso visas spragas"], "c": 1}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}start();
</script></body></html>
