<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 Tema – Vidinio ir išorinio audito procesas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--red:#dc2626}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:850px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:28px;margin:0}#theme{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.meta,.small{color:var(--muted)}
.question{font-size:21px;line-height:1.4;margin:10px 0 22px}.option{width:100%;text-align:left;border:1px solid var(--border);background:var(--card);color:var(--text);padding:14px 16px;border-radius:11px;margin:7px 0;cursor:pointer}
.option:hover:not(:disabled){border-color:var(--accent)}.option.correct{background:#dcfce7;border-color:var(--green);color:#166534}.option.wrong{background:#fee2e2;border-color:var(--red);color:#991b1b}
body.dark .option.correct{background:#14532d;color:#dcfce7}body.dark .option.wrong{background:#7f1d1d;color:#fee2e2}
.option:disabled{cursor:default}.next,.restart{margin-top:18px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:10px;cursor:pointer}.hidden{display:none}
.result{text-align:center}.score{font-size:38px;font-weight:700;margin:16px 0 8px}
</style></head><body><div class="container">
<div class="top"><h1>4 Tema – Vidinio ir išorinio audito procesas</h1><button id="theme">🌙 Dark mode</button></div>
<div id="quiz" class="card"></div><div id="result" class="card result hidden"></div></div>
<script>
const bank=[{"q": "Kas renkama duomenų rinkimo etape?", "options": ["Tik sąskaitos faktūros", "Tik darbuotojų CV", "Tik reklaminė medžiaga", "Žurnalai, konfigūracijos ir saugumo politika"], "correct": 3}, {"q": "Koks yra pagrindinis vidinių auditų dėmesys?", "options": ["Klientų aptarnavimas", "Saugumo praktikos tobulinimas iš vidaus", "Baudų skyrimas", "Nacionalinių institucijų kontrolė"], "correct": 1}, {"q": "Ką vidinis auditas tikrina incidentų valdymo srityje?", "options": ["Tik incidentų skaičių reklamoje", "Tik tiekėjų sutartis", "Incidentų aptikimo, reagavimo ir atkūrimo procesus", "Tik darbuotojų darbo laiką"], "correct": 2}, {"q": "Koks yra pirmasis išorinio audito proceso etapas?", "options": ["Sertifikato išdavimas", "Stebėsena", "Pasirengimas", "Ataskaitų archyvavimas"], "correct": 2}, {"q": "Ką vidinis auditas tikrina verslo tęstinumo srityje?", "options": ["Tiekėjų kainas", "Darbuotojų atostogų planus", "Pardavimų rezultatus", "Nelaimių atkūrimo planų veiksmingumą"], "correct": 3}, {"q": "Kokia bauda minima išorinio audito reglamentinio vykdymo dalyje?", "options": ["Iki 20 % IT biudžeto", "Iki 2 % darbuotojų atlyginimų", "Iki 2 % pasaulinės metinės apyvartos", "Iki 50 % turto vertės"], "correct": 2}, {"q": "Koks yra pagrindinis vidinio kibernetinio saugumo audito tikslas?", "options": ["Sukurti naują IT biudžetą", "Nustatyti darbuotojų atlyginimus", "Įvertinti organizacijos kibernetinio saugumo politikos ir NIS2 reikalavimų laikymąsi", "Pakeisti visus organizacijos serverius"], "correct": 2}, {"q": "Kas pateikiama vidinio audito ataskaitoje?", "options": ["Tik darbuotojų sąrašas", "Tik techninės įrangos kainos", "Tik organizacijos pelnas", "Audito radiniai, pažeidžiamumai ir tobulinimo rekomendacijos"], "correct": 3}, {"q": "Ką išorinis auditas vertina atitikties srityje?", "options": ["Tik darbuotojų atlyginimus", "Tik klientų skaičių", "Tik įmonės pajamas", "NIS2 reikalavimų, įskaitant pranešimus ir techninę kontrolę, laikymąsi"], "correct": 3}, {"q": "Koks yra pagrindinis išorinio sistemų saugumo audito tikslas?", "options": ["Sukurti vidinę IT komandą", "Pakeisti organizacijos verslo strategiją", "Tik patikrinti darbuotojų darbo laiką", "Užtikrinti NIS2 atitiktį ir pateikti objektyvų kibernetinio saugumo praktikos vertinimą"], "correct": 3}, {"q": "Kuris procesas priklauso išoriniam auditui?", "options": ["Pasirengimas, vertinimas, ataskaitų teikimas ir stebėsena", "Tik rizikos registravimas", "Tik darbuotojų mokymai", "Tik vidinis planavimas"], "correct": 0}, {"q": "Kodėl išoriniame audite vertinamas tiekimo grandinės saugumas?", "options": ["Nes tiekėjų pažeidžiamumai gali kelti didelę riziką organizacijai", "Nes tiekėjai nustato organizacijos atlyginimus", "Nes tiekėjai pakeičia NIS2", "Nes tiekėjai atlieka visus vidinius auditus"], "correct": 0}, {"q": "Ką auditai padeda tobulinti?", "options": ["Tik rinkodarą", "Saugumo priemones ir rizikos valdymą", "Tik apskaitą", "Tik personalo atranką"], "correct": 1}, {"q": "Kuriame etape įgyvendinamos taisomosios priemonės ir planuojami tolesni auditai?", "options": ["Planavimo etape", "Pradinio vertinimo etape", "Duomenų rinkimo etape", "Stebėsenos etape"], "correct": 3}, {"q": "Ką išorinis auditas vertina rizikos valdymo srityje?", "options": ["Tik kaip vykdoma rinkodara", "Tik kaip planuojamos atostogos", "Kaip rizikos nustatomos, mažinamos ir stebimos", "Tik kaip perkama įranga"], "correct": 2}, {"q": "Ką audito metu vertina saugumo politikos komponentas?", "options": ["Tik darbuotojų darbo laiką", "Kibernetinio saugumo protokolų, įskaitant prieigos kontrolę, šifravimą ir pleistrų valdymą, laikymąsi", "Tik fizinių patalpų nuomą", "Tik įmonės pelningumą"], "correct": 1}, {"q": "Ką reiškia vertinimo etapas vidiniame audite?", "options": ["Tik įsigyti naują įrangą", "Įvertinti, ar dabartinės kontrolės priemonės atitinka NIS2 ir vidinius reikalavimus", "Tik patikrinti darbuotojų darbo grafiką", "Tik parengti biudžetą"], "correct": 1}, {"q": "Kuriame etape parengiama radinių ataskaita?", "options": ["Duomenų rinkimo etape", "Planavimo etape", "Pasirengimo prieš auditą etape", "Ataskaitų teikimo etape"], "correct": 3}, {"q": "Koks yra pirmasis vidinio audito proceso etapas?", "options": ["Ataskaitų teikimas", "Stebėsena", "Galutinis sertifikavimas", "Planavimas"], "correct": 3}, {"q": "Koks bendras auditų vaidmuo kibernetinio saugumo valdyme?", "options": ["Nustatyti spragas, gerinti saugumo priemones ir padėti užtikrinti reikalavimų laikymąsi", "Tik planuoti rinkodarą", "Tik apskaičiuoti įmonės pelną", "Tik valdyti personalą"], "correct": 0}, {"q": "Kuo išoriniai auditai skiriasi nuo vidinių auditų pagal objektyvumą?", "options": ["Abu auditai visada atliekami nacionalinių institucijų", "Išoriniai auditai yra atliekami nepriklausomų šalių ir laikomi objektyvesniais", "Vidiniai auditai visada yra objektyvesni", "Objektyvumas nėra svarbus"], "correct": 1}, {"q": "Kuri sritis yra svarbi tiek vidiniame, tiek išoriniame audite?", "options": ["Reklama", "Darbuotojų atostogos", "Rizikos valdymas", "Pardavimų planavimas"], "correct": 2}, {"q": "Ką organizacija turi pateikti pasirengimo išoriniam auditui metu?", "options": ["Tik rinkodaros planą", "Tik darbuotojų atlyginimų lapelius", "Atitinkamus dokumentus, pavyzdžiui, saugumo politiką ir incidentų ataskaitas", "Tik pardavimų statistiką"], "correct": 2}, {"q": "Kas nustatoma planavimo etape?", "options": ["Tik įmonės pelnas", "Tik darbuotojų skaičius", "Audito apimtis, pavyzdžiui, sistemos ar skyriai", "Tik serverių gamintojas"], "correct": 2}, {"q": "Kuris teiginys apie vidinius ir išorinius auditus yra teisingas?", "options": ["Išorinius auditus visada atlieka tos pačios organizacijos darbuotojai", "Abu auditus visada atlieka nacionalinės institucijos", "Vidinius auditus atlieka organizacijos komanda, o išorinius – nepriklausomos trečiosios šalys arba nacionalinės institucijos", "Vidinius auditus visada atlieka klientai"], "correct": 2}, {"q": "Koks yra vienas išorinio audito tikslų?", "options": ["Nustatyti produktų kainas", "Pakeisti darbuotojų pareigas", "Pateikti objektyvų organizacijos kibernetinio saugumo praktikos vertinimą", "Sukurti organizacijos verslo strategiją"], "correct": 2}, {"q": "Ką vidiniai auditai padeda nustatyti?", "options": ["Tik darbuotojų atostogas", "Tik finansines klaidas", "Pažeidžiamumus ir tobulintinas saugumo sritis", "Tik techninės įrangos kainas"], "correct": 2}, {"q": "Koks yra pagrindinis išorinių auditų dėmesys?", "options": ["Platesnė atitiktis ir reglamentinis vertinimas", "Tik vidinis biudžetas", "Tik pardavimų rezultatai", "Tik darbuotojų mokymai"], "correct": 0}, {"q": "Ką gali apimti korekcinės priemonės?", "options": ["Tik naujų biurų nuomą", "Operacinius apribojimus", "Tik papildomą reklamą", "Tik darbuotojų mokymus"], "correct": 1}, {"q": "Ką organizacija gali daryti po nustatytų saugumo spragų?", "options": ["Nutraukti saugumo politiką", "Ignoruoti radinius", "Įgyvendinti taisomąsias priemones", "Panaikinti visus auditų dokumentus"], "correct": 2}, {"q": "Kas dažniausiai atlieka išorinius auditus?", "options": ["Nepriklausomi auditoriai arba nacionalinės institucijos", "Tik IT tiekėjai", "Tik klientai", "Tik organizacijos darbuotojai"], "correct": 0}, {"q": "Ką apima vidinio audito stebėsenos etapas?", "options": ["Tik biudžeto mažinimą", "Taisomųjų priemonių įgyvendinimą ir tolesnių auditų planavimą", "Tik naujų darbuotojų priėmimą", "Tik slaptažodžių kūrimą"], "correct": 1}, {"q": "Ką reiškia audito apimtis?", "options": ["Tik auditorių skaičių", "Tik baudos dydį", "Sistemų, skyrių ar kitų vertinamų sričių nustatymą", "Tik audito trukmę"], "correct": 2}, {"q": "Koks yra vienas svarbiausių vidinių auditų privalumų?", "options": ["Jie leidžia proaktyviai spręsti saugumo spragas prieš išorinę kontrolę", "Jie garantuoja, kad nebus jokių incidentų", "Jie automatiškai panaikina visas baudas", "Jie pakeičia NIS2"], "correct": 0}, {"q": "Koks yra audito rezultatas, kuriame identifikuojami pažeidžiamumai?", "options": ["Ataskaita su radiniais ir rekomendacijomis", "Pardavimų planas", "Darbuotojų atlyginimų ataskaita", "Reklamos kampanija"], "correct": 0}, {"q": "Kuri sritis yra vienas iš pagrindinių vidinio audito komponentų?", "options": ["Personalo atranka", "Rinkodaros kampanijos", "Rizikos vertinimas", "Pardavimų prognozės"], "correct": 2}, {"q": "Kam taikoma didesnė priežiūra pagal pateiktą medžiagą?", "options": ["Tik mažoms įmonėms", "Tik startuoliams", "Tik fiziniams asmenims", "Esminėms organizacijoms"], "correct": 3}, {"q": "Koks pagrindinis NIS2 audito procesų tikslas?", "options": ["Sumažinti darbuotojų skaičių", "Pakeisti organizacijos misiją", "Padidinti pardavimus", "Užtikrinti organizacijų atitiktį kibernetinio saugumo reikalavimams"], "correct": 3}, {"q": "Su kuo lyginama dabartinė organizacijos praktika vertinimo metu?", "options": ["NIS2 reikalavimais ir vidine politika", "Tik rinkodaros tikslais", "Tik konkurentų kainomis", "Tik darbuotojų nuomone"], "correct": 0}, {"q": "Ką apima incidentų valdymo vertinimas vidiniame audite?", "options": ["Tik darbuotojų mokymus", "Incidentų aptikimo, reagavimo ir atkūrimo procesų peržiūrą", "Tik serverių pirkimą", "Tik antivirusinės programos kainą"], "correct": 1}, {"q": "Kas pateikiama išorinio audito ataskaitoje?", "options": ["Tik darbuotojų sąrašas", "Tik įrangos kainos", "Tik įmonės pelnas", "Neatitikimai ir tobulinimo rekomendacijos"], "correct": 3}, {"q": "Kas gali būti išorinio audito pasekmė nesilaikant reikalavimų?", "options": ["Audito panaikinimas", "Baudos, ypač esminėms organizacijoms", "Automatinis sertifikato pratęsimas", "Privalomas darbuotojų paaukštinimas"], "correct": 1}, {"q": "Kodėl vidiniai auditai laikomi proaktyviais?", "options": ["Jie padeda nustatyti saugumo spragas ir jas spręsti prieš išorinę kontrolę", "Nes jie pakeičia išorinius auditus", "Nes juos visada atlieka valstybė", "Nes jie skiria baudas"], "correct": 0}, {"q": "Kodėl išorinių auditų nesilaikymo pasekmės gali būti reikšmingos?", "options": ["Nes gali būti taikomos baudos arba operaciniai apribojimai", "Nes darbuotojai netenka atostogų", "Nes panaikinamas organizacijos pavadinimas", "Nes automatiškai nutraukiama visa IT veikla"], "correct": 0}, {"q": "Kuo vidiniai auditai skiriasi pagal dažnumą?", "options": ["Jie vyksta tik kartą per dešimt metų", "Jie visada vyksta rečiau už išorinius", "Jie yra dažnesni", "Jie nevyksta reguliariai"], "correct": 2}, {"q": "Ką renka auditoriai analizuodami dabartinę saugumo būklę?", "options": ["Tik klientų atsiliepimus", "Tik darbuotojų CV", "Žurnalus, incidentų ataskaitas ir konfigūracijas", "Tik įmonės pelno ataskaitas"], "correct": 2}, {"q": "Kaip gali būti atliekamas išorinio audito vertinimas?", "options": ["Vietiniu arba nuotoliniu tinklų, sistemų ir saugumo priemonių vertinimu", "Tik pagal darbuotojų apklausą", "Tik telefonu", "Tik pagal įmonės pajamas"], "correct": 0}, {"q": "Kas gali vykti po išorinio audito ataskaitos?", "options": ["Auditas automatiškai ištrinamas", "Organizacija gali pateikti veiksmų planus, o institucijos gali atlikti tolesnius patikrinimus", "Organizacija automatiškai gauna sertifikatą", "NIS2 reikalavimai nebegalioja"], "correct": 1}, {"q": "Kuris procesas priklauso vidiniam auditui?", "options": ["Tik baudų skyrimas", "Tik planavimas", "Planavimas, duomenų rinkimas, vertinimas, ataskaitų teikimas ir stebėsena", "Tik sertifikavimas"], "correct": 2}, {"q": "Ką apima techninės kontrolės vertinimas?", "options": ["Prieigos kontrolės, šifravimo, stebėjimo sistemų ir kitų apsaugos priemonių testavimą", "Tik biuro baldų patikrą", "Tik finansinį auditą", "Tik darbuotojų mokymų grafiką"], "correct": 0}, {"q": "Kas dažniausiai atlieka vidinį auditą?", "options": ["Tik nacionalinė institucija", "Tik išorinis tiekėjas", "Tik klientai", "Pačios organizacijos kibernetinio saugumo komanda arba atitikties departamentas"], "correct": 3}, {"q": "Kuri organizacija pateiktoje medžiagoje minima kaip galinti būti esmine organizacija?", "options": ["Tik reklamos agentūra", "Sveikatos priežiūros arba finansų įstaiga", "Tik sporto klubas", "Tik mažmeninės prekybos parduotuvė"], "correct": 1}];let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;const item=quiz[current],box=document.getElementById('quiz');box.innerHTML='<div class="meta">Klausimas '+(current+1)+' iš 10</div><div class="question">'+escapeHtml(item.q)+'</div><div id="options"></div><button id="next" class="next hidden">Kitas klausimas →</button>';const opts=document.getElementById('options');item.options.forEach((t,i)=>{const b=document.createElement('button');b.className='option';b.textContent=t;b.onclick=()=>answer(i);opts.appendChild(b)})}
function answer(i){if(answered)return;answered=true;const item=quiz[current],bs=[...document.querySelectorAll('.option')];bs.forEach(b=>b.disabled=true);if(i===item.correct){bs[i].classList.add('correct');score++}else{bs[i].classList.add('wrong');bs[item.correct].classList.add('correct')}document.getElementById('next').classList.remove('hidden')}
document.addEventListener('click',e=>{if(e.target.id==='next'){current++;current<10?showQuestion():showResult()}});
function showResult(){document.getElementById('quiz').classList.add('hidden');const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<div class="small">4 Tema baigta</div><div class="score">'+score+'/10</div><div>'+(score*10)+'%</div><button class="restart" onclick="pick10()">Bandyti dar kartą</button>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
const theme=document.getElementById('theme');if(localStorage.getItem('darkMode')==='1')document.body.classList.add('dark');
function themeText(){theme.textContent=document.body.classList.contains('dark')?'☀️ Light mode':'🌙 Dark mode'}theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('darkMode',document.body.classList.contains('dark')?'1':'0');themeText()};themeText();pick10();
</script></body></html>
