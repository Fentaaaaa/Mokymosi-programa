<!DOCTYPE html><html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 Tema – Grėsmių identifikavimas ir mitigavimas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#4f46e5}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#818cf8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:25px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}
button{font:inherit}#themeBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.progress{color:var(--muted);font-size:14px;margin-bottom:12px}.question{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:20px}
.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.answer.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.answer.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444}body.dark .answer.correct{background:#14532d;color:#dcfce7}
body.dark .answer.wrong{background:#7f1d1d;color:#fee2e2}.next{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;cursor:pointer;font-weight:700;font-size:16px}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:46px;font-weight:800;margin:10px 0}
.small{color:var(--muted)}.hidden{display:none}.restart{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
</style></head><body><div class="container">
<div class="top"><div><h1>15 Tema – Grėsmių identifikavimas ir mitigavimas</h1><div class="subtitle">10 random questions per attempt</div></div>
<button id="themeBtn">🌙 Dark mode</button></div>
<div id="quiz" class="card"><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="answers" id="answers"></div>
<button class="next" id="next" disabled>Kitas klausimas →</button></div>
<div id="result" class="card result hidden"><h2>Quiz baigtas!</h2><div class="score" id="score"></div><div class="small" id="percent"></div>
<button class="restart" onclick="startQuiz()">Bandyti dar kartą</button></div></div>
<script>
const bank=[{"q": "Koks yra pagrindinis grėsmių identifikavimo tikslas?", "a": ["Tik registruoti incidentus po jų įvykimo", "Atpažinti potencialias kibernetines grėsmes, kurios galėtų pasinaudoti pažeidžiamumais", "Tik keisti vartotojų slaptažodžius", "Tik didinti tinklo spartą"], "c": 1}, {"q": "Kas yra grėsmių mitigavimas?", "a": ["Tik sistemų inventorizacija", "Tik incidentų ataskaitų rengimas", "Priemonių įgyvendinimas siekiant sumažinti arba pašalinti nustatytų grėsmių poveikį", "Tik grėsmių registravimas"], "c": 2}, {"q": "Koks NIS2 reikalavimas susijęs su rizikos valdymu?", "a": ["Nustatyti išsamias rizikos vertinimo procedūras", "Vertinti tik fizinę apsaugą", "Atsisakyti rizikos vertinimo", "Riziką vertinti tik po incidento"], "c": 0}, {"q": "Ką reiškia proaktyvios priemonės?", "a": ["Tik reagavimą po incidento", "Tik atsarginių kopijų kūrimą", "Strategijas, skirtas grėsmių aptikimui ir prevencijai", "Tik vartotojų paskyrų valdymą"], "c": 2}, {"q": "Kodėl reikia nuolat stebėti sistemas ir tinklus?", "a": ["Kad būtų galima išjungti žurnalų rinkimą", "Kad grėsmės būtų aptinkamos kuo anksčiau", "Kad nereikėtų incidentų reagavimo plano", "Kad būtų galima atsisakyti ugniasienių"], "c": 1}, {"q": "Koks vienas pagrindinių grėsmių valdymo tikslų?", "a": ["Apsaugoti kritinę infrastruktūrą ir duomenis", "Atsisakyti saugumo politikų", "Sumažinti atsarginių kopijų kiekį", "Padidinti sistemų sudėtingumą"], "c": 0}, {"q": "Kaip grėsmių valdymas padeda užtikrinti tęstinumą?", "a": ["Padeda palaikyti nepertraukiamą paslaugų teikimą", "Išjungia kritines sistemas", "Atsisako incidentų planavimo", "Pašalina visus darbuotojus iš procesų"], "c": 0}, {"q": "Kokias problemas gali padėti išvengti efektyvus grėsmių valdymas?", "a": ["Duomenų nutekėjimus, paslaugų sutrikimus ir finansinius nuostolius", "Tik darbuotojų kaitą", "Tik programinės įrangos licencijų problemas", "Tik elektros tiekimo sutrikimus"], "c": 0}, {"q": "Kas yra kenksmingų programų ataka?", "a": ["Ataka naudojant programinę įrangą, skirtą sutrikdyti, pakenkti ar gauti neteisėtą prieigą", "Tik fizinis serverio sugadinimas", "Tik tinklo stebėjimas", "Tik vartotojo mokymas"], "c": 0}, {"q": "Kuri ataka 2017 m. paveikė organizacijas visame pasaulyje, įskaitant NHS?", "a": ["Dyn DDoS ataka", "NotPetya ataka", "Twitter phishing ataka", "WannaCry ransomware ataka"], "c": 3}, {"q": "Kas yra phishing ataka?", "a": ["Tinklo perkrovimas pertekliniu srautu", "Apgaulingas bandymas gauti jautrią informaciją apsimetant patikima institucija", "Disko šifravimas atsarginėms kopijoms", "Tinklo segmentavimas"], "c": 1}, {"q": "Kuri organizacija 2020 m. patyrė didelio masto phishing ataką, aprašo medžiaga?", "a": ["Siemens AG", "Deutsche Bank", "Twitter", "NHS"], "c": 2}, {"q": "Kas yra DDoS ataka?", "a": ["Vartotojų prieigos ribojimas", "Bandymas pavogti slaptažodį el. paštu", "Disko atvaizdo kūrimas", "Tinklo ar paslaugos perkrovimas pertekliniu srautu, siekiant ją padaryti neprieinamą"], "c": 3}, {"q": "Kuri 2016 m. DDoS ataka sutrikdė tokias paslaugas kaip Spotify ir Reddit?", "a": ["Ataka prieš Dyn DNS tiekėją", "Ataka prieš NHS", "Ataka prieš Deutsche Bank", "Ataka prieš Siemens AG"], "c": 0}, {"q": "Kodėl organizacijos turi būti pasirengusios tokioms grėsmėms pagal NIS2?", "a": ["Kad nereikėtų rizikos vertinimo", "Kad būtų sumažintas stebėjimas", "Siekiant apsaugoti esmines paslaugas", "Kad būtų galima atsisakyti saugumo kontrolės"], "c": 2}, {"q": "Kas yra pirmasis svarbus grėsmių identifikavimo proceso žingsnis?", "a": ["Incidento ataskaitos siuntimas", "Išteklių inventorizacija", "Darbuotojų atleidimas", "Sistemos išjungimas"], "c": 1}, {"q": "Ką apima išteklių inventorizacija?", "a": ["Sistemų, duomenų ir paslaugų, būtinų veiklai, katalogo sudarymą", "Tik tinklo kabelių žymėjimą", "Tik darbuotojų sąrašo sudarymą", "Tik programinės įrangos pirkimą"], "c": 0}, {"q": "Koks yra pažeidžiamumų vertinimo tikslas?", "a": ["Tik kurti atsargines kopijas", "Aptikti sistemų ir programų silpnybes", "Tik registruoti vartotojus", "Tik matuoti tinklo spartą"], "c": 1}, {"q": "Kokie šaltiniai paminėti kaip grėsmių žvalgybos informacijos šaltiniai?", "a": ["Tik darbuotojų apklausos", "EUROPOL, ENISA ir kibernetinio saugumo įmonės", "Tik įmonės rinkodaros skyrius", "Tik socialiniai tinklai"], "c": 1}, {"q": "Kokia informacijos keitimosi platforma paminėta medžiagoje?", "a": ["MSSP", "CERT-EU", "Wireshark", "SIEM"], "c": 1}, {"q": "Ką reikia vertinti atliekant rizikos analizę?", "a": ["Tik serverio kainą", "Tik darbuotojų skaičių", "Tik sistemos amžių", "Potencialų poveikį ir tikimybę"], "c": 3}, {"q": "Ką Siemens AG reguliariai atlieka?", "a": ["Tik atsarginių kopijų testus", "Tik DDoS atakas", "Pramoninių valdymo sistemų pažeidžiamumų vertinimus", "Tik darbuotojų phishing mokymus"], "c": 2}, {"q": "Su kuo Siemens AG bendradarbiauja, kad būtų informuota apie naujas grėsmes?", "a": ["CERT-EU", "Deutsche Bank", "NHS", "Dyn"], "c": 0}, {"q": "Kodėl svarbu žinoti, ką reikia apsaugoti?", "a": ["Kad būtų galima išjungti stebėjimą", "Kad nereikėtų saugumo politikų", "Kad nereikėtų vertinti pažeidžiamumų", "Išteklių inventorizacija yra pirmasis grėsmių valdymo žingsnis"], "c": 3}, {"q": "Kuo naudinga grėsmių žvalgyba?", "a": ["Ji naudojama tik rinkodarai", "Ji pašalina rizikos vertinimą", "Ji pakeičia visas saugumo kontrolės priemones", "Ji padeda numatyti ir pasiruošti galimoms atakoms"], "c": 3}, {"q": "Kokia saugumo kontrolės priemonė skirta neteisėtai prieigai blokuoti?", "a": ["Tik atsarginės kopijos", "Tik šifravimas", "Tik darbuotojų mokymai", "Ugniasienės ir įsibrovimo prevencijos sistemos"], "c": 3}, {"q": "Kokia šifravimo paskirtis grėsmių mitigavime?", "a": ["Tik padidinti tinklo spartą", "Apsaugoti duomenis juos siunčiant ir saugant", "Tik aptikti phishing", "Tik valdyti vartotojų roles"], "c": 1}, {"q": "Kodėl svarbus reguliarus atnaujinimų diegimas?", "a": ["Kad nereikėtų stebėti sistemų", "Kad būtų greitai įdiegtos saugumo pataisos", "Kad būtų mažiau saugumo pataisų", "Kad būtų galima išjungti apsaugas"], "c": 1}, {"q": "Koks atnaujinimų pavyzdys paminėtas?", "a": ["CERT-EU Patch Day", "Google Security Friday", "Microsoft Patch Tuesday", "NIS2 Update Monday"], "c": 2}, {"q": "Ką reiškia mažiausios privilegijos principas?", "a": ["Leisti neribotą prieigą", "Apriboti vartotojų prieigos teises iki būtinų", "Suteikti visiems administratoriaus teises", "Visiškai pašalinti prieigos kontrolę"], "c": 1}, {"q": "Kuo MFA padeda grėsmių mitigavime?", "a": ["Tik stebi tinklo srautą", "Pagerina prisijungimo saugumą", "Išjungia ugniasienes", "Panaikina poreikį turėti slaptažodžius visais atvejais"], "c": 1}, {"q": "Kodėl reikalingos darbuotojų saugumo sąmoningumo programos?", "a": ["Kad darbuotojai galėtų valdyti BGP", "Kad darbuotojai išmoktų atpažinti grėsmes", "Kad būtų galima atsisakyti MFA", "Kad būtų panaikinti žurnalai"], "c": 1}, {"q": "Kokią veiklą reguliariai atlieka Deutsche Bank kaip pavyzdį?", "a": ["Tinklo segmentavimą", "Diskų atvaizdavimą", "DDoS atakas", "Phishing simuliacijas"], "c": 3}, {"q": "Kodėl saugumo kontrolės priemonės svarbios?", "a": ["Jos pašalina visus vartotojus", "Jos padeda sukurti apsaugos sluoksnius", "Jos pakeičia incidentų tyrimą", "Jos skirtos tik ataskaitoms"], "c": 1}, {"q": "Kodėl neatnaujintos sistemos yra rizikingos?", "a": ["Jos pakeičia ugniasienes", "Jos yra dažnos atakos vietos", "Jos visada turi mažiau pažeidžiamumų", "Jos nebegali būti atakuojamos"], "c": 1}, {"q": "Kokia yra darbuotojų mokymo nauda?", "a": ["Mokymai pašalina visas grėsmes", "Mokymai mažina riziką, susijusią su žmogaus klaidomis", "Mokymai pakeičia technines kontrolės priemones", "Mokymai panaikina MFA poreikį"], "c": 1}, {"q": "Kas yra IRP?", "a": ["Incidentų registravimo platforma", "Infrastruktūros atkūrimo procesas", "Incidentų reagavimo planas", "Informacijos rizikos protokolas"], "c": 2}, {"q": "Ką reikia apibrėžti incidentų reagavimo plane?", "a": ["Veiksmus, kurių reikia imtis incidento metu", "Tik programinės įrangos pirkimą", "Tik darbuotojų darbo grafiką", "Tik atsarginių kopijų vietą"], "c": 0}, {"q": "Kodėl kuriama incidentų reagavimo komanda?", "a": ["Kad visi darbuotojai turėtų vienodas teises", "Kad būtų galima išjungti stebėjimą", "Kad būtų aiškiai paskirstyti vaidmenys ir atsakomybės", "Kad nereikėtų procedūrų"], "c": 2}, {"q": "Ką apima komunikacijos protokolai?", "a": ["Tik darbuotojų mokymų tvarkaraštį", "Tik atsarginių kopijų taisykles", "Tik tinklo konfigūraciją", "Gaires, kaip teikti vidines ir išorines ataskaitas"], "c": 3}, {"q": "Kodėl IRP reikia reguliariai testuoti?", "a": ["Kad būtų galima atsisakyti plano", "Kad sumažėtų incidentų žurnalų kiekis", "Kad nereikėtų komunikacijos", "Kad būtų patikrintas komandos pasirengimas incidentams"], "c": 3}, {"q": "Kokia organizacija pateikta kaip reguliarių incidentų reagavimo pratybų pavyzdys?", "a": ["AXA Group", "ING Group", "Siemens AG", "Microsoft"], "c": 1}, {"q": "Kaip gerai paruoštas IRP veikia reagavimą?", "a": ["Jis pakeičia atsargines kopijas", "Jis sumažina reagavimo laiką ir žalą", "Jis panaikina poreikį stebėti sistemas", "Jis padidina incidentų skaičių"], "c": 1}, {"q": "Kokia stebėjimo priemonė paminėta realaus laiko stebėjimui ir įspėjimams?", "a": ["MSSP", "CERT-EU", "MFA", "SIEM"], "c": 3}, {"q": "Kokia organizacija paminėta kaip SIEM naudojimo pavyzdys?", "a": ["AXA Group", "Maersk", "Deutsche Bank", "ING Group"], "c": 0}, {"q": "Kam reikalingi reguliarūs auditai ir vertinimai?", "a": ["Tik vartotojų paskyroms kurti", "NIS2 ir vidinių politikų laikymuisi tikrinti", "Tik tinklo spartai didinti", "Tik darbuotojų skaičiui mažinti"], "c": 1}, {"q": "Kodėl reikia reguliariai atnaujinti saugumo politikas?", "a": ["Kad būtų galima atsisakyti mokymų", "Kad jos atspindėtų naujas grėsmes ir technologijas", "Kad nereikėtų incidentų plano", "Kad būtų mažiau saugumo kontrolės"], "c": 1}, {"q": "Kas yra grėsmių paieška?", "a": ["Tik antivirusinės programos atnaujinimas", "Proaktyvi grėsmių paieška, galinti aptikti tradicines apsaugos priemones apeinančias grėsmes", "Tik vartotojų mokymas", "Tik incidentų ataskaitų rengimas"], "c": 1}, {"q": "Kuo grėsmių paieška skiriasi nuo reaktyvių priemonių?", "a": ["Ji proaktyviai ieško grėsmių prieš arba nepriklausomai nuo įprastų perspėjimų", "Ji atliekama tik po incidento", "Ji skirta tik fizinei apsaugai", "Ji nenaudoja jokių duomenų"], "c": 0}, {"q": "Kodėl organizacijos turėtų dalyvauti sektoriaus kibernetinio saugumo forumuose?", "a": ["Kad nereikėtų stebėjimo", "Kad galėtų bendradarbiauti ir keistis informacija", "Kad galėtų atsisakyti NIS2", "Kad būtų galima išjungti incidentų ataskaitas"], "c": 1}, {"q": "Ką remia EE-ISAC pagal pateiktą pavyzdį?", "a": ["Energetikos įmones", "Laivybos įmones", "Bankus", "Sveikatos priežiūros įmones"], "c": 0}, {"q": "Kodėl svarbios viešojo ir privataus sektorių partnerystės?", "a": ["Jos pakeičia incidentų tyrimą", "Jos leidžia bendradarbiauti su valdžios institucijomis", "Jos panaikina būtinybę dalytis informacija", "Jos pašalina privatumo reikalavimus"], "c": 1}, {"q": "Kokia yra tarptautinio bendradarbiavimo nauda?", "a": ["Dalytis ir gauti informaciją apie pasaulines grėsmes", "Tik keisti organizacijos politiką", "Tik didinti darbuotojų skaičių", "Tik valdyti vietinius serverius"], "c": 0}, {"q": "Ką reikalaujama daryti su reikšmingais incidentais?", "a": ["Pranešti apie juos per nustatytus laikotarpius", "Viešinti visą konfidencialią informaciją", "Neregistruoti jų", "Pranešti tik po metų"], "c": 0}, {"q": "Kaip informacijos keitimas padeda kibernetiniam saugumui?", "a": ["Tik didina žurnalų kiekį", "Pašalina poreikį turėti apsaugos priemones", "Tik padeda rinkodarai", "Didina bendrą saugumą ir padeda užkirsti kelią plačiai paplitusioms atakoms"], "c": 3}, {"q": "Koks buvo Maersk incidentas 2017 m.?", "a": ["NotPetya kenkėjiškos programos ataka", "Phishing ataka prieš Twitter", "DDoS prieš Dyn", "WannaCry ataka"], "c": 0}, {"q": "Ką Maersk pastebėjo pradėjus incidentą?", "a": ["Tik elektros tiekimo sutrikimą", "Tik darbuotojų neatvykimą", "Sistemos sutrikimus ir neįprastą tinklo veiklą", "Tik VPN klaidas"], "c": 2}, {"q": "Koks buvo Maersk grėsmių mitigavimo veiksmas?", "a": ["Paveiktų sistemų izoliacija, kad būtų užkirstas kelias plitimui", "Visų sistemų viešinimas", "Žurnalų ištrynimas", "MFA išjungimas"], "c": 0}, {"q": "Ką Maersk atliko atkūrimo metu?", "a": ["Atstatė IT infrastruktūrą ir atkūrė paslaugas", "Tik sustabdė atsargines kopijas", "Tik ištrynė paveiktus serverius", "Tik pakeitė slaptažodžius"], "c": 0}, {"q": "Kokią pamoką Maersk atvejis parodė apie atsargines kopijas?", "a": ["Kopijos trukdo atkūrimui", "Kopijos naudojamos tik auditui", "Reguliarios kopijos palengvino atkūrimą", "Atsarginės kopijos nėra reikalingos"], "c": 2}, {"q": "Kokią tinklo architektūros pamoką parodė Maersk atvejis?", "a": ["Tinklo segmentavimas visada didina žalą", "Segmentavimas pakeičia atsargines kopijas", "Segmentavimas nereikalingas incidentų metu", "Tinklo segmentavimas galėjo apriboti poveikį"], "c": 3}, {"q": "Ką Maersk atliko po incidento?", "a": ["Pagerino saugumo priemones ir kibernetinio saugumo protokolus", "Nustojo bendradarbiauti", "Išjungė stebėjimo sistemas", "Atsisakė atsarginių kopijų"], "c": 0}, {"q": "Kokia buvo Maersk bendradarbiavimo pamoka?", "a": ["Paslėpė visą informaciją", "Nutraukė informacijos keitimąsi", "Atsisakė incidentų ataskaitų", "Pasidalijo patirtimi, kad padėtų kitoms organizacijoms"], "c": 3}];let quiz=[],current=0,score=0,answered=false;
function startQuiz(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;const item=quiz[current];document.getElementById('progress').textContent=`Klausimas ${current+1} / ${quiz.length}`;document.getElementById('question').textContent=item.q;const box=document.getElementById('answers');box.innerHTML='';item.a.forEach((ans,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=ans;b.onclick=()=>choose(i);box.appendChild(b)});document.getElementById('next').disabled=true;document.getElementById('next').textContent=current===quiz.length-1?'Baigti →':'Kitas klausimas →'}
function choose(i){if(answered)return;answered=true;const item=quiz[current],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);if(i===item.c){buttons[i].classList.add('correct');score++}else{buttons[i].classList.add('wrong');buttons[item.c].classList.add('correct')}document.getElementById('next').disabled=false}
document.getElementById('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${score} / 10`;document.getElementById('percent').textContent=`${score*10}%`}};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('darkMode',dark)};
if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}startQuiz();
</script></body></html>
