<!DOCTYPE html><html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>16 Tema – Informacijos klasifikavimo bei dalinimosi politikos</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#4f46e5}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#818cf8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:25px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}
button{font:inherit}#themeBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.progress{color:var(--muted);font-size:14px;margin-bottom:12px}.question{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:20px}
.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.answer.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.answer.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444}body.dark .answer.correct{background:#14532d;color:#dcfce7}
body.dark .answer.wrong{background:#7f1d1d;color:#fee2e2}.next{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;cursor:pointer;font-weight:700;font-size:16px}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:46px;font-weight:800;margin:10px 0}
.small{color:var(--muted)}.hidden{display:none}.restart{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
</style></head><body><div class="container">
<div class="top"><div><h1>16 Tema – Informacijos klasifikavimo bei dalinimosi politikos</h1><div class="subtitle">10 random questions per attempt</div></div>
<button id="themeBtn">🌙 Dark mode</button></div>
<div id="quiz" class="card"><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="answers" id="answers"></div>
<button class="next" id="next" disabled>Kitas klausimas →</button></div>
<div id="result" class="card result hidden"><h2>Quiz baigtas!</h2><div class="score" id="score"></div><div class="small" id="percent"></div>
<button class="restart" onclick="startQuiz()">Bandyti dar kartą</button></div></div>
<script>
const bank=[{"q": "Kas yra informacijos klasifikavimas?", "a": ["Duomenų trynimas pagal jų amžių", "Tinklo srauto filtravimas", "Vartotojų paskyrų kūrimas", "Duomenų kategorizavimas pagal jautrumą ir neteisėtos prieigos poveikį"], "c": 3}, {"q": "Kodėl informacijos klasifikavimas svarbus pagal NIS2?", "a": ["Kad duomenys būtų apsaugomi pagal jų klasifikaciją", "Kad visi duomenys būtų vieši", "Kad būtų sumažintas darbuotojų skaičius", "Kad būtų galima atsisakyti prieigos kontrolės"], "c": 0}, {"q": "Koks pagrindinis prieigos kontrolės tikslas jautriai informacijai?", "a": ["Leisti prieigą be autentifikacijos", "Užtikrinti, kad prieiga būtų suteikta tik įgaliotiems asmenims", "Suteikti prieigą visiems darbuotojams", "Viešinti konfidencialius duomenis"], "c": 1}, {"q": "Kuris yra vienas iš klasifikavimo lygių?", "a": ["Laikina", "Automatinė", "Vieša", "Techninė"], "c": 2}, {"q": "Kokia informacija gali būti klasifikuojama kaip „Vieša“?", "a": ["Informacija, kuria galima dalytis viešai, pvz., pranešimai spaudai", "Slapti prisijungimo duomenys", "Klientų finansiniai įrašai", "Komercinės paslaptys"], "c": 0}, {"q": "Ką reiškia klasifikacija „Tik vidiniam naudojimui“?", "a": ["Neslaptą vidaus informaciją", "Kritines komercines paslaptis", "Tik asmens sveikatos duomenis", "Viešai skelbiamą informaciją"], "c": 0}, {"q": "Kokia informacija priskiriama „Konfidencialiai“?", "a": ["Tik viešos svetainės turinys", "Jautrūs duomenys, kuriuos reikia apsaugoti, pvz., klientų įrašai", "Tik vieši pranešimai", "Tik bendro pobūdžio reklama"], "c": 1}, {"q": "Ką reiškia „Labai konfidenciali / ribota“?", "a": ["Viešą informaciją", "Informaciją, kurios nereikia saugoti", "Kritinę informaciją, kuriai taikomos griežtos kontrolės priemonės", "Neslaptą vidaus informaciją"], "c": 2}, {"q": "Koks gali būti „Labai konfidencialios / ribotos“ informacijos pavyzdys?", "a": ["Komercinės paslaptys", "Pranešimas spaudai", "Viešas renginio skelbimas", "Bendras įmonės adresas"], "c": 0}, {"q": "Ką reikia sudaryti identifikuojant informacijos išteklius?", "a": ["Tik darbuotojų atostogų grafiką", "Tik programinės įrangos licencijų sąrašą", "Tik serverių IP adresų sąrašą", "Duomenų tipų, pvz., asmens duomenų, finansinių įrašų ir intelektinės nuosavybės, katalogą"], "c": 3}, {"q": "Pagal ką priskiriamas informacijos klasifikacijos lygis?", "a": ["Pagal failo dydį", "Pagal jautrumą ir poveikį", "Pagal dokumento spalvą", "Pagal darbuotojo darbo stažą"], "c": 1}, {"q": "Kokį klasifikavimo pavyzdį pateikia Kompanija A?", "a": ["Trijų lygių schemą be prieigos kontrolės", "Vieno lygio schemą, kur visi duomenys konfidencialūs", "Keturių lygių schemą, kur klientų finansiniai duomenys klasifikuojami kaip konfidencialūs", "Dviejų lygių schemą, kur visi duomenys vieši"], "c": 2}, {"q": "Kuo naudingas tinkamas informacijos klasifikavimas?", "a": ["Suteikia visiems vienodą prieigą", "Panaikina mokymų poreikį", "Pašalina poreikį saugoti duomenis", "Padeda taikyti tinkamas apsaugos priemones"], "c": 3}, {"q": "Nuo ko gali padėti apsisaugoti tinkamas klasifikavimas?", "a": ["Nuo programinės įrangos licencijų", "Nuo duomenų nutekėjimų", "Nuo elektros kainų pokyčių", "Nuo darbuotojų atostogų"], "c": 1}, {"q": "Kas turi koordinuoti informacijos klasifikavimą?", "a": ["Duomenų savininkai ir saugumo komandos", "Tik apskaita", "Tik rinkodaros skyrius", "Tik išoriniai klientai"], "c": 0}, {"q": "Kas yra RBAC?", "a": ["Duomenų šifravimo algoritmas", "Tinklo stebėjimo protokolas", "Vaidmenimis pagrįsta prieigos kontrolė", "Atsarginių kopijų sistema"], "c": 2}, {"q": "Kaip RBAC suteikia leidimus?", "a": ["Pagal darbo vaidmenis", "Pagal dokumento dydį", "Pagal darbuotojo amžių", "Pagal kompiuterio modelį"], "c": 0}, {"q": "Ką reiškia būtinybės žinoti principas?", "a": ["Prieiga priklauso tik nuo darbo stažo", "Prieiga suteikiama be patikrinimo", "Visi darbuotojai turi prieigą prie visų duomenų", "Prieiga suteikiama tik tada, kai ji būtina darbo funkcijoms atlikti"], "c": 3}, {"q": "Kokia MFA paskirtis jautrių duomenų apsaugai?", "a": ["Panaikinti prieigos kontrolę", "Viešinti informaciją", "Suteikti papildomą autentifikaciją", "Tik registruoti duomenis"], "c": 2}, {"q": "Kaip šifravimas padeda saugoti informaciją?", "a": ["Tik nustato duomenų klasifikaciją", "Suteikia visiems prieigą", "Apsaugo duomenis perdavimo ir saugojimo metu", "Pašalina poreikį klasifikuoti duomenis"], "c": 2}, {"q": "Ką turi nustatyti informacijos dalinimosi gairės?", "a": ["Vidaus ir išorės dalinimosi procedūras", "Tik darbuotojų darbo laiką", "Tik duomenų bazių dydį", "Tik serverių vietą"], "c": 0}, {"q": "Kas yra duomenų tvarkymo procedūros dalinimosi kontekste?", "a": ["Tik tinklo kabelių keitimas", "Tik vartotojų atrankos procedūros", "Saugūs perdavimo metodai ir patvirtinimo procesai", "Tik dokumentų trynimo taisyklės"], "c": 2}, {"q": "Kam reikalingas NDA?", "a": ["Tinklo greičiui didinti", "Duomenims viešinti", "Vartotojų paskyroms kurti", "Teisinei apsaugai dalijantis jautriais duomenimis su išoriniais partneriais"], "c": 3}, {"q": "Ką reiškia duomenų minimizavimas dalinantis informacija?", "a": ["Dalytis tik vieša informacija", "Niekada nesidalyti duomenimis", "Dalytis tik būtinais duomenimis", "Dalytis visais turimais duomenimis"], "c": 2}, {"q": "Ką Kompanija B naudoja prieigai prie tyrimų duomenų riboti?", "a": ["NDA", "RBAC", "Tik šifravimą", "DLP"], "c": 1}, {"q": "Ką Kompanija B naudoja prieigai prie „Labai konfidencialios“ informacijos?", "a": ["Tik DLP", "Tik auditą", "Tik mokymus", "MFA"], "c": 3}, {"q": "Ko Kompanija B reikalauja prieš dalindamasi jautriais duomenimis su partneriais?", "a": ["NDA", "Prieigos visiems darbuotojams", "Visų duomenų kopijos", "Viešo paskelbimo"], "c": 0}, {"q": "Kaip prieigos kontrolė padeda organizacijai?", "a": ["Sumažina autentifikacijos saugumą", "Pašalina klasifikavimo poreikį", "Užkerta kelią neteisėtai prieigai ir galimiems nutekėjimams", "Padidina duomenų viešumą"], "c": 2}, {"q": "Kaip dalinimosi politikos padeda apsaugoti duomenis?", "a": ["Suteikia visiems vienodą prieigą", "Leidžia dalintis visais duomenimis", "Mažina atsitiktinio duomenų nutekėjimo riziką ir plečia apsaugą trečiosioms šalims", "Pašalina NDA poreikį"], "c": 2}, {"q": "Kodėl darbuotojams reikalingi reguliarūs mokymai?", "a": ["Kad galėtų keisti NIS2", "Kad nereikėtų prieigos kontrolės", "Kad jie žinotų, kaip klasifikuoti ir tvarkyti duomenis", "Kad galėtų administruoti visus serverius"], "c": 2}, {"q": "Kas yra specifiniai vaidmenų mokymai?", "a": ["Tik vadovų mokymai", "Turinys, pritaikytas skirtingiems departamentams", "Tik IT darbuotojų mokymai", "Vienodi mokymai visiems be išimties"], "c": 1}, {"q": "Kam skirtos saugumo sąmoningumo kampanijos?", "a": ["Tik programinės įrangos diegimui", "Tik finansinių ataskaitų rengimui", "Tik tinklo administravimui", "Nuolatiniams priminimams ir atnaujinimams apie saugumą"], "c": 3}, {"q": "Kas yra DLP?", "a": ["Prieigos vaidmuo", "Duomenų praradimo prevencijos įrankis", "Duomenų klasifikavimo lygis", "Konfidencialumo sutartis"], "c": 1}, {"q": "Ką stebi ir kontroliuoja DLP įrankiai?", "a": ["Duomenų perdavimus", "Tik tinklo kabelius", "Tik darbuotojų atostogas", "Tik serverių temperatūrą"], "c": 0}, {"q": "Kam reikalingi reguliarūs auditai?", "a": ["Atitikčiai politikoms vertinti", "Tik duomenims trinti", "Tik failams suspausti", "Tik vartotojams kurti"], "c": 0}, {"q": "Ką turi apibrėžti incidentų reagavimo procedūros klasifikavimo politikų kontekste?", "a": ["Tik darbuotojų atlyginimus", "Veiksmų žingsnius politikų pažeidimams spręsti", "Tik įmonės rinkodarą", "Tik duomenų bazių dydžius"], "c": 1}, {"q": "Kodėl nustatomos drausminės priemonės?", "a": ["Kad būtų aiškios pasekmės už politikų nesilaikymą", "Kad visi duomenys būtų vieši", "Kad nereikėtų audito", "Kad būtų galima atsisakyti mokymų"], "c": 0}, {"q": "Ką Kompanija C organizuoja darbuotojams?", "a": ["Privalomus kasmetinius saugumo mokymus", "Tik techninius programavimo kursus", "Tik vadovų susitikimus", "Tik finansinius mokymus"], "c": 0}, {"q": "Kokią papildomą veiklą Kompanija C naudoja informuotumui stiprinti?", "a": ["Phishing simuliacijas", "Tinklo segmentavimą", "DDoS atakas", "Diskų atvaizdavimą"], "c": 0}, {"q": "Kokį sprendimą Kompanija C naudoja duomenų judėjimui stebėti?", "a": ["MFA", "RBAC", "NDA", "DLP"], "c": 3}, {"q": "Koks žmogaus veiksnio poveikis pabrėžiamas medžiagoje?", "a": ["Mokymai mažina su žmogiškomis klaidomis susijusią riziką", "Darbuotojai neturi įtakos duomenų apsaugai", "Mokymai didina nutekėjimų riziką", "Žmogaus veiksnys neturi reikšmės"], "c": 0}, {"q": "Kaip NIS2 klasifikacija padeda rizikos valdymui?", "a": ["Panaikina rizikos vertinimą", "Suteikia visiems vienodą prieigą", "Pakeičia incidentų reagavimo planą", "Padeda nustatyti kritinius išteklius"], "c": 3}, {"q": "Ką reikia daryti su pažeidimais pagal NIS2?", "a": ["Neregistruoti pažeidimų", "Pranešti tik po metų", "Pranešti apie juos pagal nustatytus NIS2 terminus", "Pranešti tik darbuotojams"], "c": 2}, {"q": "Ką GDPR reikalauja informacijos klasifikavimo kontekste?", "a": ["Viešinti visus asmens duomenis", "Tinkamai klasifikuoti ir tvarkyti asmens duomenis", "Dalytis visais duomenimis su partneriais", "Netaikyti prieigos kontrolės"], "c": 1}, {"q": "Ką reiškia teisėtas duomenų tvarkymas?", "a": ["Dalytis duomenimis be apribojimų", "Netaikyti NDA", "Užtikrinti, kad duomenų dalijimasis atitiktų GDPR principus", "Saugoti visus duomenis neribotą laiką"], "c": 2}, {"q": "Kodėl Siemens reikėjo standartizuoti duomenų apsaugą?", "a": ["Kad apsauga būtų vienoda skirtinguose padaliniuose", "Kad būtų panaikinti mokymai", "Kad būtų galima atsisakyti DLP", "Kad visi duomenys būtų vieši"], "c": 0}, {"q": "Ką Siemens sukūrė?", "a": ["Tik vietinę slaptažodžių politiką", "Tik vieno skyriaus DLP", "Tik atsarginių kopijų politiką", "Globalią klasifikavimo politiką"], "c": 3}, {"q": "Kokias technines kontrolės priemones Siemens įdiegė?", "a": ["DLP ir prieigos valdymą", "Tik MFA ir NDA", "Tik ugniasienes", "Tik antivirusinę programą"], "c": 0}, {"q": "Ką Siemens atliko su darbuotojais?", "a": ["Mokymų nevykdė", "Apmokė darbuotojus visame pasaulyje", "Apmokė tik vadovybę", "Apmokė tik IT skyrių"], "c": 1}, {"q": "Koks buvo Siemens klasifikavimo politikos rezultatas?", "a": ["Padidinta duomenų nutekėjimo rizika", "Pagerinta duomenų apsauga ir reglamentinė atitiktis", "Panaikintas poreikis klasifikuoti", "Sumažinta duomenų apsauga"], "c": 1}, {"q": "Koks dar rezultatas buvo pasiektas Siemens?", "a": ["Atsisakyta DLP", "Padidintas duomenų tvarkymo efektyvumas", "Panaikinta prieigos kontrolė", "Sumažintas mokymų poreikis"], "c": 1}, {"q": "Kodėl atitiktis svarbi organizacijai?", "a": ["Ji panaikina duomenų klasifikavimą", "Ji sumažina saugumo kontrolę", "Ji leidžia viešinti konfidencialią informaciją", "Ji padeda išvengti finansinių baudų ir reputacijos žalos"], "c": 3}, {"q": "Kokia yra pagrindinė informacijos klasifikavimo nauda?", "a": ["Padaryti visus duomenis viešus", "Panaikinti mokymų poreikį", "Suteikti visiems vienodą prieigą", "Apsaugoti jautrią informaciją ir laikytis NIS2 reikalavimų"], "c": 3}, {"q": "Koks yra efektyvių dalinimosi politikų tikslas?", "a": ["Kontroliuoti duomenų srautą ir išvengti neteisėto atskleidimo", "Pašalinti prieigos kontrolę", "Dalytis kuo daugiau informacijos", "Panaikinti duomenų minimizavimą"], "c": 0}, {"q": "Kodėl darbuotojų įsitraukimas svarbus?", "a": ["Mokymai pakeičia visas technines priemones", "Darbuotojų mokyti nereikia", "Darbuotojai neturi įtakos saugumui", "Mokymai yra kritiškai svarbūs sėkmingam politikų įgyvendinimui"], "c": 3}, {"q": "Ką organizacija turėtų atlikti su klasifikavimo ir dalinimosi politikomis?", "a": ["Padaryti jas tik viešas", "Sukurti arba atnaujinti jas", "Visiškai jų atsisakyti", "Naudoti tik viename skyriuje"], "c": 1}, {"q": "Kokias technologines priemones rekomenduojama naudoti?", "a": ["Tik antivirusinę programą", "Tik ugniasienę", "Tik NDA ir auditą", "DLP ir MFA"], "c": 3}, {"q": "Ką turi suprasti visi darbuotojai?", "a": ["Savo vaidmenis duomenų apsaugos srityje", "Tik programavimo principus", "Tik tinklo architektūrą", "Tik įmonės finansus"], "c": 0}, {"q": "Kam tenka informacijos apsaugos atsakomybė?", "a": ["Tik IT skyriui", "Visai organizacijai – tai kolektyvinė atsakomybė", "Tik vadovui", "Tik saugumo komandai"], "c": 1}, {"q": "Kaip NIS2 laikymasis veikia bendrą kibernetinį atsparumą?", "a": ["Panaikina rizikos valdymą", "Mažina saugumo kontrolę", "Stiprina bendrą kibernetinio saugumo atsparumą", "Suteikia visiems neribotą prieigą"], "c": 2}];let quiz=[],current=0,score=0,answered=false;
function startQuiz(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;const item=quiz[current];document.getElementById('progress').textContent=`Klausimas ${current+1} / ${quiz.length}`;document.getElementById('question').textContent=item.q;const box=document.getElementById('answers');box.innerHTML='';item.a.forEach((ans,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=ans;b.onclick=()=>choose(i);box.appendChild(b)});document.getElementById('next').disabled=true;document.getElementById('next').textContent=current===quiz.length-1?'Baigti →':'Kitas klausimas →'}
function choose(i){if(answered)return;answered=true;const item=quiz[current],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);if(i===item.c){buttons[i].classList.add('correct');score++}else{buttons[i].classList.add('wrong');buttons[item.c].classList.add('correct')}document.getElementById('next').disabled=false}
document.getElementById('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${score} / 10`;document.getElementById('percent').textContent=`${score*10}%`}};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('darkMode',dark)};
if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}startQuiz();
</script></body></html>
