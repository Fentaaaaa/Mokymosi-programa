<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>11 Tema – Tiekimo grandinės rizikų valdymas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#4f46e5}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#818cf8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:25px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}
button{font:inherit}#themeBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.progress{color:var(--muted);font-size:14px;margin-bottom:12px}.question{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:20px}
.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.answer.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.answer.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444}body.dark .answer.correct{background:#14532d;color:#dcfce7}
body.dark .answer.wrong{background:#7f1d1d;color:#fee2e2}.next{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;cursor:pointer;font-weight:700;font-size:16px}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:46px;font-weight:800;margin:10px 0}
.small{color:var(--muted)}.hidden{display:none}.restart{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
</style></head>
<body><div class="container">
<div class="top"><div><h1>11 Tema – Tiekimo grandinės rizikų valdymas</h1><div class="subtitle">10 random questions per attempt</div></div>
<button id="themeBtn">🌙 Dark mode</button></div>
<div id="quiz" class="card"><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="answers" id="answers"></div>
<button class="next" id="next" disabled>Kitas klausimas →</button></div>
<div id="result" class="card result hidden"><h2>Quiz baigtas!</h2><div class="score" id="score"></div><div class="small" id="percent"></div>
<button class="restart" onclick="startQuiz()">Bandyti dar kartą</button></div></div>
<script>
const bank=[{"q": "Kokia yra pagrindinė tiekimo grandinės rizikų valdymo tema?", "a": ["Rinkodaros kampanijų valdymas", "Darbuotojų atostogų planavimas", "Biuro patalpų valdymas", "Trečiųjų šalių programinės įrangos komponentų ir paslaugų rizikų valdymas"], "c": 3}, {"q": "Ką apima tiekimo grandinės rizikų valdymas?", "a": ["Tik tiekėjų kainų palyginimą", "Rizikų identifikavimą, vertinimą ir mažinimą", "Tik sutarčių pasirašymą", "Tik programinės įrangos pirkimą"], "c": 1}, {"q": "Kokios rizikos kyla iš trečiųjų šalių programinės įrangos?", "a": ["Tik darbuotojų rizikos", "Tik finansinės rizikos", "Komponentų, bibliotekų, priklausomybių ir tiekėjų paslaugų rizikos", "Tik rinkodaros rizikos"], "c": 2}, {"q": "Koks yra vienas NIS2 reikalavimų tiekimo grandinės srityje?", "a": ["Naudoti tik vieną tiekėją", "Atsisakyti tiekėjų auditų", "Įgyvendinti priemones tiekimo grandinės rizikoms identifikuoti ir valdyti", "Nesvarstyti tiekėjų saugumo"], "c": 2}, {"q": "Ką reikia įvertinti renkantis tiekėją?", "a": ["Tik darbuotojų skaičių", "Tik produkto kainą", "Tik tiekėjo logotipą", "Tiekėjo saugumo praktiką"], "c": 3}, {"q": "Kodėl reikalinga tiekimo grandinės saugumo politika?", "a": ["Kad būtų nustatytas požiūris į tiekimo grandinės rizikas", "Kad būtų valdomos darbuotojų atostogos", "Kad būtų planuojami pardavimai", "Kad būtų nustatyta rinkodaros strategija"], "c": 0}, {"q": "Kas yra kenksmingas kodas tiekimo grandinėje?", "a": ["Netinkama sutarties forma", "Neteisingas darbuotojo slaptažodis", "Tiekėjo vėlavimas", "Kenkėjiškos programinės įrangos įterpimas į trečiosios šalies programinę įrangą"], "c": 3}, {"q": "Kokia rizika susijusi su neužlopytais tiekėjo programinės įrangos trūkumais?", "a": ["Rinkodaros rizika", "Personalo rizika", "Pažeidžiamumų rizika", "Finansinio planavimo rizika"], "c": 2}, {"q": "Kas yra „zero-day“ pažeidžiamumas šiame kontekste?", "a": ["Programinės įrangos licencijos tipas", "Darbuotojų mokymų formatas", "Tiekėjo kainos pokytis", "Tiekėjo programinėje įrangoje esantis pažeidžiamumas, kuriam gali nebūti parengto pataisymo"], "c": 3}, {"q": "Su kuo susijusios priklausomybių rizikos?", "a": ["Tik tiekėjų finansais", "Tik darbuotojų priklausomybe nuo mokymų", "Tik organizacijos patalpomis", "Atvirojo kodo bibliotekų ar kitų priklausomybių trūkumais"], "c": 3}, {"q": "Kodėl tiekimo grandinė gali būti reikšminga organizacijos saugumui?", "a": ["Ji susijusi tik su rinkodara", "Ji svarbi tik finansų skyriui", "Net vienas pažeistas komponentas gali sukelti didelį saugumo incidentą", "Ji neturi jokios įtakos sistemų saugumui"], "c": 2}, {"q": "Ką reiškia proaktyvus tiekimo grandinės rizikų valdymas?", "a": ["Reaguoti tik po incidento", "Iš anksto nustatyti ir valdyti rizikas", "Vertinti tik produkto kainą", "Ignoruoti tiekėjų rizikas"], "c": 1}, {"q": "Koks yra vienas pagrindinių tiekėjų vertinimo etapų?", "a": ["Pardavimų prognozė", "Darbuotojų atranka", "Reklamos kampanijos vertinimas", "Saugumo patikra"], "c": 3}, {"q": "Ką užtikrina atitikties patikrinimas?", "a": ["Kad tiekėjas turėtų daug klientų", "Kad tiekėjas būtų pigiausias", "Kad tiekėjai atitiktų atitinkamus standartus, pvz., ISO 27001", "Kad tiekėjas turėtų daug darbuotojų"], "c": 2}, {"q": "Ką rekomenduojama įtraukti į tiekėjų sutartis?", "a": ["Tik darbuotojų atostogų taisykles", "Tik produkto reklamą", "Saugumo priemonių ir incidentų pranešimų reikalavimus", "Tik kainų nuolaidas"], "c": 2}, {"q": "Ką reiškia teisė audituoti tiekėją?", "a": ["Galimybę tikrinti tiekėjo saugumo praktiką", "Galimybę nustatyti tiekėjo kainas", "Galimybę keisti tiekėjo darbuotojus", "Galimybę valdyti tiekėjo pardavimus"], "c": 0}, {"q": "Kuriems tiekėjams reikia skirti ypatingą dėmesį?", "a": ["Tiems, kurie teikia esminę programinę įrangą ar paslaugas", "Tik naujausiems tiekėjams", "Tik pigiausiems tiekėjams", "Tik mažiausiems tiekėjams"], "c": 0}, {"q": "Ką reikia įvertinti atliekant tiekimo grandinės rizikos vertinimą?", "a": ["Tik produkto pavadinimą", "Tik darbuotojų skaičių", "Tik tiekėjo adresą", "Galimas grėsmes ir pažeidžiamumus"], "c": 3}, {"q": "Kam skirtos rizikos mažinimo strategijos?", "a": ["Nustatytoms rizikoms spręsti", "Darbuotojų atrankai", "Produktų kainoms nustatyti", "Tiekėjų reklamai"], "c": 0}, {"q": "Ką rekomenduojama naudoti tiekėjų saugumo vertinimui?", "a": ["Klausimynus, auditus ir sertifikatus", "Tik reklaminius bukletus", "Tik telefono skambučius", "Tik tiekėjo interneto svetainę"], "c": 0}, {"q": "Kodėl tiekėjai prioritetizuojami pagal programinės įrangos kritiškumą?", "a": ["Kad daugiau dėmesio būtų skiriama svarbiausiems tiekėjams", "Kad būtų galima atsisakyti auditų", "Kad būtų nustatytos darbuotojų algos", "Kad būtų pasirinktas rinkodaros kanalas"], "c": 0}, {"q": "Ką reikia aiškiai apibrėžti tiekėjų sutartyse?", "a": ["Tik reklamos taisykles", "Tik darbo laiką", "Saugumo lūkesčius ir atsakomybes", "Tik produkto spalvą"], "c": 2}, {"q": "Kas yra SSDLC?", "a": ["Incidentų pranešimų platforma", "Saugios programinės įrangos kūrimo gyvavimo ciklas", "Tiekėjų sutarčių valdymo sistema", "Saugumo dokumentų archyvavimo sistema"], "c": 1}, {"q": "Ką reikia atlikti vykdant kodo peržiūras?", "a": ["Tik tikrinti darbuotojų prieigas", "Reguliariai tikrinti kodą dėl pažeidžiamumų", "Tik tikrinti kodo formatavimą", "Tik vertinti produkto kainą"], "c": 1}, {"q": "Kam skirtas įsiskverbimo testavimas?", "a": ["Tiekėjų kainoms palyginti", "Sutarčių terminams nustatyti", "Darbuotojų mokymams", "Programinės įrangos saugumo spragoms nustatyti"], "c": 3}, {"q": "Kokios praktikos turi būti skatinamos tarp tiekėjų?", "a": ["Saugios programavimo praktikos", "Tik finansinės atskaitomybės praktikos", "Tik pardavimo praktikos", "Tik rinkodaros praktikos"], "c": 0}, {"q": "Kas yra SCA?", "a": ["Sistemų atkūrimo analizė", "Programinės įrangos sudėties analizė", "Saugumo komunikacijos auditas", "Tiekėjų sertifikavimo procesas"], "c": 1}, {"q": "Ką SCA padeda valdyti?", "a": ["Atvirojo kodo komponentų ir priklausomybių rizikas", "Tiekėjų kainas", "Darbuotojų atostogas", "Rinkodaros kampanijas"], "c": 0}, {"q": "Ką atlieka pažeidžiamumų skenavimas trečiųjų šalių programinėje įrangoje?", "a": ["Nustato žinomus pažeidžiamumus", "Nustato tiekėjų pelną", "Nustato rinkodaros biudžetą", "Nustato darbuotojų atlyginimus"], "c": 0}, {"q": "Ką turi užtikrinti nuolatinė stebėsena?", "a": ["Savalaikį saugumo atnaujinimų ir pleistrų diegimą", "Tik metinį tiekėjo vertinimą", "Tik sutarčių pasirašymą", "Tik rinkodaros ataskaitas"], "c": 0}, {"q": "Kodėl reikalingas tiekėjų incidentų valdymo planas?", "a": ["Kad būtų pasirengta incidentams tiekėjų pusėje", "Kad būtų keičiamos produktų kainos", "Kad būtų valdomos tiekėjo reklamos", "Kad būtų planuojamos atostogos"], "c": 0}, {"q": "Ką padarė Įmonė Y?", "a": ["Įdiegė SCA įrankius trečiųjų šalių bibliotekų stebėsenai", "Paskelbė visas priklausomybes viešai", "Atsisakė programinės įrangos auditų", "Panaikino visus tiekėjus"], "c": 0}, {"q": "Ką padėjo aptikti Įmonės Y SCA įrankiai?", "a": ["Sutarties terminų neatitikimą", "Darbuotojų mokymų spragas", "Tiekėjo kainų klaidą", "Kritinį pažeidžiamumą atvirojo kodo komponente"], "c": 3}, {"q": "Ką reiškia integruoti saugumą į SSDLC?", "a": ["Saugumą patikėti tik tiekėjui", "Saugumą vertinti tik incidento metu", "Saugumą įtraukti į kiekvieną programinės įrangos kūrimo etapą", "Saugumą tikrinti tik po išleidimo"], "c": 2}, {"q": "Kodėl svarbu bendradarbiauti su tiekėjais dėl SSDLC?", "a": ["Kad jie valdytų organizacijos darbuotojus", "Kad jie vykdytų rinkodarą", "Kad jie pakeistų savo kainas", "Kad jie laikytųsi saugios programinės įrangos kūrimo principų"], "c": 3}, {"q": "Kuo naudingi automatiniai SCA įrankiai?", "a": ["Jie pakeičia visus saugumo darbuotojus", "Jie padeda nustatyti rizikas programinės įrangos priklausomybėse", "Jie valdo sutartis", "Jie nustato tiekėjų kainas"], "c": 1}, {"q": "Ką būtina valdyti atvirojo kodo komponentų srityje?", "a": ["Tik jų kainą", "Jų saugumo rizikas", "Tik jų dizainą", "Tik jų kūrėjų skaičių"], "c": 1}, {"q": "Kodėl reikia nustatyti aiškius komunikacijos kanalus su tiekėjais?", "a": ["Kad būtų galima keisti tiekėjų darbuotojus", "Kad būtų galima vykdyti rinkodarą", "Kad būtų galima nustatyti produktų kainas", "Kad saugumo klausimai būtų sprendžiami aiškiai ir greitai"], "c": 3}, {"q": "Ką reikia paskirti abiejose organizacijose?", "a": ["Saugumo kontaktinius asmenis", "Pardavimų atstovus", "Rinkodaros vadovus", "Finansų auditorius"], "c": 0}, {"q": "Ką padeda užtikrinti reguliarūs saugumo praktikų susitikimai?", "a": ["Darbuotojų kaitą", "Produktų kainų mažinimą", "Periodinę tiekimo grandinės saugumo peržiūrą", "Rinkodaros planavimą"], "c": 2}, {"q": "Kokia informacija gali būti dalijamasi su tiekėjais?", "a": ["Aktuali informacija apie grėsmes", "Tik rinkodaros medžiaga", "Tik finansinės ataskaitos", "Tik darbuotojų duomenys"], "c": 0}, {"q": "Ką reikia sutarti dėl incidentų pranešimų?", "a": ["Tik metinį pranešimą", "Greitas pranešimo procedūras", "Nenumatyti jokios procedūros", "Tik žodinį pranešimą po incidento"], "c": 1}, {"q": "Ką apima bendros mokymų sesijos su tiekėjais?", "a": ["Tik pardavimų mokymus", "Tik produkto pristatymą", "Bendradarbiavimą saugumo mokymų iniciatyvose", "Tik rinkodaros mokymus"], "c": 2}, {"q": "Kuo naudingas geriausios praktikos dalijimasis?", "a": ["Panaikinami tiekėjai", "Nustatomos produktų kainos", "Keičiamasi informacija apie saugumo patobulinimus", "Mažinamas darbuotojų skaičius"], "c": 2}, {"q": "Ką padarė Įmonė Z?", "a": ["Įsteigė bendrą saugumo forumą su pagrindiniais tiekėjais", "Nutraukė informacijos dalijimąsi", "Atsisakė tiekėjų auditų", "Panaikino saugumo kontaktus"], "c": 0}, {"q": "Kodėl atviras dialogas su tiekėjais yra naudingas?", "a": ["Jis leidžia nevykdyti auditų", "Jis stiprina pasitikėjimą ir leidžia greitai imtis veiksmų", "Jis pakeičia SSDLC", "Jis panaikina visas rizikas"], "c": 1}, {"q": "Kodėl dalijantis jautria informacija svarbūs konfidencialumo susitarimai?", "a": ["Kad būtų panaikinti tiekėjų kontaktai", "Kad būtų išvengta saugumo mokymų", "Kad būtų apsaugota jautri informacija", "Kad būtų galima viešinti visą informaciją"], "c": 2}, {"q": "Ką reikia stebėti atliekant nuolatinę tiekėjų stebėseną?", "a": ["Tiekėjų atitiktį ir saugumo veiklą", "Tik tiekėjų kainas", "Tik darbuotojų skaičių", "Tik produktų pardavimus"], "c": 0}, {"q": "Kam skirti reguliarūs tiekėjų auditai?", "a": ["Tik darbuotojų mokymams", "Tik rinkodarai", "Tik produktų kūrimui", "Nuolatinei atitikčiai užtikrinti"], "c": 3}, {"q": "Kada reikia atnaujinti tiekimo grandinės politiką?", "a": ["Tik kas dešimt metų", "Pagal naujas grėsmes ar incidentus", "Tik pakeitus vadovą", "Tik gavus tiekėjo prašymą"], "c": 1}, {"q": "Ką reiškia grįžtamojo ryšio ciklas tiekimo grandinės rizikų valdyme?", "a": ["Ignoruoti ankstesnius incidentus", "Išmoktas pamokas naudoti rizikų valdymo procesams tobulinti", "Panaikinti auditų rezultatus", "Tikrinti tik kainas"], "c": 1}, {"q": "Ką parodė Įmonės W pavyzdys?", "a": ["Tiekėjas buvo iš karto pašalintas", "Tiekėjo neatitiktis buvo aptikta audito metu ir ištaisyta bendradarbiaujant", "Auditai buvo nutraukti", "Tiekėjo rizikos nebuvo vertinamos"], "c": 1}, {"q": "Ką padarė Įmonė V po tiekimo grandinės atakos?", "a": ["Panaikino saugumo reikalavimus", "Nutraukė auditavimą", "Atsisakė visų tiekėjų", "Peržiūrėjo tiekėjų vertinimo procesą ir sugriežtino naujų sutarčių saugumo reikalavimus"], "c": 3}, {"q": "Kodėl tiekimo grandinės politika turi būti nuolat tobulinama?", "a": ["Auditai nereikalingi", "Tiekėjai visada lieka tokie patys", "Saugumo rizikos niekada nesikeičia", "Grėsmių aplinka nuolat kinta"], "c": 3}, {"q": "Kam naudojami KPI tiekimo grandinės rizikų valdyme?", "a": ["Tik darbuotojų skaičiui matuoti", "Veiksmingumui įvertinti", "Tik tiekėjų kainoms nustatyti", "Tik rinkodarai"], "c": 1}, {"q": "Koks yra pagrindinis tiekimo grandinės rizikų valdymo principas?", "a": ["Ignoruoti trečiųjų šalių rizikas", "Reaguoti tik po incidento", "Vertinti tik produkto kainą", "Proaktyviai valdyti ir stebėti programinės įrangos tiekėjus"], "c": 3}, {"q": "Ką organizacijos privalo atlikti pagal pateiktą NIS2 medžiagą?", "a": ["Įgyvendinti tiekimo grandinės saugumo priemones ir vertinti tiekėjų rizikas", "Naudoti tik vieną programinės įrangos tiekėją", "Nevykdyti tiekėjų auditų", "Atsisakyti tiekėjų"], "c": 0}, {"q": "Su kuo būtinas nuolatinis bendradarbiavimas?", "a": ["Tik finansų skyriumi", "Tik klientais", "Tiekėjais, CSIRT ir kitais suinteresuotaisiais asmenimis", "Tik rinkodaros komanda"], "c": 2}, {"q": "Kokia rekomendacija pateikiama dėl tiekėjų atitikties?", "a": ["Tikrinti tik kartą organizacijos gyvavimo pradžioje", "Visai netikrinti", "Vertinti tik po incidento", "Reguliariai ją peržiūrėti ir vykdyti auditą"], "c": 3}, {"q": "Ką rekomenduojama daryti su personalu ir tiekėjais?", "a": ["Mokymus vykdyti tik po incidento", "Mokymų nevykdyti", "Vykdyti periodinius mokymus apie saugumo geriausias praktikas", "Mokyti tik rinkodaros"], "c": 2}, {"q": "Kokie įrankiai rekomenduojami tiekimo grandinės rizikoms valdyti?", "a": ["Tik popieriniai dokumentai", "Automatizuoti rizikų nustatymo ir valdymo įrankiai", "Tik rankiniai skaičiavimai", "Tik el. paštas"], "c": 1}, {"q": "Kodėl saugumo priemonės turi būti integruotos į tiekimo grandinės procesus?", "a": ["Kad būtų sumažintas tiekėjų skaičius", "Kad būtų išvengta mokymų", "Kad būtų pakeista rinkodara", "Kad būtų užtikrintas ilgalaikis atitikimas ir atsparumas"], "c": 3}];let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10)}
function startQuiz(){pick10();current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;let item=quiz[current];document.getElementById('progress').textContent=`Klausimas ${current+1} / ${quiz.length}`;document.getElementById('question').textContent=item.q;let box=document.getElementById('answers');box.innerHTML='';
item.a.forEach((ans,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=ans;b.onclick=()=>choose(i);box.appendChild(b)});document.getElementById('next').disabled=true;document.getElementById('next').textContent=current===quiz.length-1?'Baigti →':'Kitas klausimas →'}
function choose(i){if(answered)return;answered=true;let item=quiz[current],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);if(i===item.c){buttons[i].classList.add('correct');score++}else{buttons[i].classList.add('wrong');buttons[item.c].classList.add('correct')}document.getElementById('next').disabled=false}
document.getElementById('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${score} / 10`;document.getElementById('percent').textContent=`${score*10}%`}};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');let dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('darkMode',dark)};
if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}startQuiz();
</script></body></html>
