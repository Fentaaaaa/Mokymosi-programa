<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18 tema — Pažeidžiamumų identifikavimas bei valdymas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px;cursor:pointer}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text);cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}
.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;border:0;cursor:pointer}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}
.percent{font-size:22px;color:var(--muted)}.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;border:0;cursor:pointer}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head>
<body><div class="container">
<div class="top"><div><h1>18 tema — Pažeidžiamumų identifikavimas bei valdymas</h1><div class="subtitle">Pažeidžiamumų valdymo procesas ir NIS2</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div>
<div id="quiz"></div></div>
<script>
const bank=[{"q": "Kas yra pažeidžiamumų valdymas?", "a": ["Vienkartinis serverio patikrinimas", "Tik incidentų registravimas", "Tik antivirusinės programos diegimas", "Nuolatinis procesas, apimantis pažeidžiamumų identifikavimą, vertinimą, gydymą ir ataskaitų teikimą"], "c": 3}, {"q": "Ko reikalauja NIS2 pažeidžiamumų valdymo srityje?", "a": ["Naudoti tik rankinį testavimą", "Tik kartą per metus atlikti auditą", "Visus pažeidžiamumus ignoruoti", "Įgyvendinti procedūras reguliariam pažeidžiamumų vertinimui ir sprendimui"], "c": 3}, {"q": "Ką reiškia proaktyvus požiūris į pažeidžiamumus?", "a": ["Proaktyviai aptikti ir šalinti pažeidžiamumus", "Laukti, kol įvyks incidentas", "Išjungti pažeidžiamų sistemų stebėjimą", "Šalinti tik tuos pažeidžiamumus, apie kuriuos praneša klientai"], "c": 0}, {"q": "Koks yra vienas pagrindinių pažeidžiamumų valdymo tikslų?", "a": ["Padidinti tinklo greitį", "Panaikinti visus saugumo žurnalus", "Sumažinti galimus atakos vektorius", "Sumažinti darbuotojų skaičių"], "c": 2}, {"q": "Koks 2017 m. Equifax atvejis pateiktas kaip pavyzdys?", "a": ["Incidentas dėl netinkamo slaptažodžio", "Duomenų praradimas dėl sugedusio disko", "Tinklo sutrikimas dėl elektros gedimo", "Didelis duomenų nutekėjimas dėl neužtaisyto Apache Struts pažeidžiamumo"], "c": 3}, {"q": "Kodėl svarbu proaktyviai valdyti pažeidžiamumus?", "a": ["Kad būtų galima panaikinti ataskaitas", "Pažeidžiamumai gali būti išnaudoti neteisėtai prieigai, paslaugų sutrikdymui ar duomenų vagystei", "Kad būtų galima išjungti tinklą", "Kad būtų galima atsisakyti visų saugumo priemonių"], "c": 1}, {"q": "Koks yra pirmasis pažeidžiamumų valdymo gyvavimo ciklo etapas?", "a": ["Ataskaitų archyvavimas", "Darbuotojų mokymas", "Incidento uždarymas", "Identifikavimas"], "c": 3}, {"q": "Kodėl svarbi išteklių inventorizacija?", "a": ["Reikia palaikyti atnaujintą visų IT išteklių inventorių", "Kad būtų galima padidinti interneto greitį", "Kad būtų galima ištrinti senus vartotojus", "Kad būtų galima išjungti skenavimą"], "c": 0}, {"q": "Kam naudojamas pažeidžiamumų skenavimas?", "a": ["Automatizuotai sistemoms skenuoti dėl žinomų pažeidžiamumų", "Darbuotojų produktyvumui vertinti", "Atsarginėms kopijoms kurti", "El. laiškams archyvuoti"], "c": 0}, {"q": "Kokie šaltiniai nurodyti grėsmių žvalgybai?", "a": ["Tik socialiniai tinklai", "CVE duomenų bazės, tiekėjų patarimai ir saugumo biuleteniai", "Tik darbuotojų apklausos", "Tik metinės finansinės ataskaitos"], "c": 1}, {"q": "Kas atliekama pažeidžiamumų vertinimo etape?", "a": ["Kuriamos darbuotojų paskyros", "Išjungiami tinklo žurnalai", "Įdiegiama antivirusinė programa", "Įvertinamas nustatytų pažeidžiamumų pavojingumas ir galimas poveikis"], "c": 3}, {"q": "Kam naudojami CVSS įvertinimai?", "a": ["Serverių temperatūrai stebėti", "Tinklo greičiui matuoti", "Pažeidžiamumų sprendimo pastangoms prioritetizuoti", "Darbuotojų atlyginimams skaičiuoti"], "c": 2}, {"q": "Kas priskiriama sprendimo etapui?", "a": ["Pataisų ir atnaujinimų diegimas, konfigūracijos pakeitimai ir mitigavimo strategijos", "Tik pažeidžiamumų registravimas", "Tik mokymai", "Tik auditas"], "c": 0}, {"q": "Ką galima daryti, jei pataisymas nėra įmanomas?", "a": ["Ištrinti visą sistemą", "Išjungti stebėjimą", "Įgyvendinti laikiną mitigavimo sprendimą", "Ignoruoti pažeidžiamumą"], "c": 2}, {"q": "Kodėl atliekamas pakartotinis skenavimas?", "a": ["Sukurti naujus vartotojus", "Išjungti pataisas", "Nustatyti darbuotojų produktyvumą", "Patvirtinti, kad pažeidžiamumai buvo sėkmingai pašalinti"], "c": 3}, {"q": "Kam skirti penetraciniai testai patikros etape?", "a": ["Valdyti darbuotojų prieigą prie el. pašto", "Įsitikinti saugumo priemonių veiksmingumu", "Matuoti interneto greitį", "Kurti atsargines kopijas"], "c": 1}, {"q": "Ką reikia dokumentuoti pažeidžiamumų valdymo procese?", "a": ["Tik antivirusinių programų versijas", "Nustatytus pažeidžiamumus, atliktus veiksmus ir laikotarpius", "Tik serverių pavadinimus", "Tik darbuotojų vardus"], "c": 1}, {"q": "Kam teikiamos atitikties ataskaitos, kai to reikalaujama?", "a": ["Tik tiekėjams", "Tik klientams", "Tik darbuotojams", "Vadovybei ir reglamentinėms institucijoms"], "c": 3}, {"q": "Koks Microsoft pavyzdys pateiktas?", "a": ["DLP diegimas etapais", "Bug bounty programa", "Griežtas pažeidžiamumų valdymo procesas, įskaitant Patch Tuesday atnaujinimus", "Rizikos matrica ERP sistemoms"], "c": 2}, {"q": "Kodėl struktūruotas gyvavimo ciklas svarbus?", "a": ["Jis panaikina poreikį skenuoti", "Jis užtikrina, kad pažeidžiamumai būtų sistemingai sprendžiami", "Jis leidžia ignoruoti CVSS", "Jis pakeičia incidentų valdymą"], "c": 1}, {"q": "Koks įrankis nurodytas kaip tinklo skenerio pavyzdys?", "a": ["Nessus", "Recorded Future", "HackerOne", "Burp Suite"], "c": 0}, {"q": "Kuris įrankis pateiktas kaip interneto programų skenerio pavyzdys?", "a": ["OpenVAS", "Acunetix", "Nessus", "CERT-EU"], "c": 1}, {"q": "Ką simuliuoja vidaus penetraciniai testai?", "a": ["Tik socialinę inžineriją", "Atakas iš organizacijos vidaus", "Tik fizinį įsilaužimą", "Atakas tik iš interneto"], "c": 1}, {"q": "Ką simuliuoja išorės penetraciniai testai?", "a": ["Tik vidinių darbuotojų klaidas", "Tik serverio gedimus", "Tik elektros tiekimo sutrikimus", "Atakas iš išorinių šaltinių"], "c": 3}, {"q": "Kas yra raudonųjų komandų pratybos?", "a": ["Tik darbuotojų mokymas", "Tik automatinis pažeidžiamumų skenavimas", "Pažangus testavimas, apimantis realių atakų simuliacijas", "Tik dokumentų tikrinimas"], "c": 2}, {"q": "Kokios paslaugos pateiktos kaip grėsmių žvalgybos prenumeratų pavyzdžiai?", "a": ["Nessus ir OpenVAS", "Acunetix ir Burp Suite", "FireEye ir Recorded Future", "HackerOne ir Bugcrowd"], "c": 2}, {"q": "Kokios bendruomenės nurodytos kaip informacijos keitimosi resursai?", "a": ["Equifax ir Marriott", "Microsoft ir Tesla", "SAP ir Facebook", "CERT-EU ir ENISA"], "c": 3}, {"q": "Kas yra bug bounty programų tikslas?", "a": ["Išjungti automatinius skenerius", "Pakeisti penetracinius testus", "Uždrausti išorinius tyrimus", "Skatinti išorinius saugumo tyrėjus pranešti apie pažeidžiamumus"], "c": 3}, {"q": "Kokios platformos pateiktos bug bounty pavyzdžiais?", "a": ["FireEye ir Recorded Future", "Nessus ir OpenVAS", "HackerOne ir Bugcrowd", "CVE ir CVSS"], "c": 2}, {"q": "Koks Facebook pavyzdys pateiktas?", "a": ["Bug bounty programa, skatinanti tyrėjus pranešti apie saugumo pažeidžiamumus", "Automatizuotas atnaujinimų diegimas visame tinkle", "Rizikos matrica ERP sistemoms", "Patch Tuesday atnaujinimai"], "c": 0}, {"q": "Koks yra vienas automatizuotų įrankių apribojimas?", "a": ["Jie visada pakeičia visus penetracinius testus", "Jie turėtų būti papildomi rankiniu testavimu", "Jie gali būti naudojami tik kartą", "Jie netinka reguliariam skenavimui"], "c": 1}, {"q": "Ką suteikia bug bounty programos?", "a": ["Papildomą apsaugos lygį pasitelkiant išorinius ekspertus", "Tik tinklo segmentavimą", "Tik darbuotojų mokymus", "Tik pataisų testavimą"], "c": 0}, {"q": "Koks yra rizika pagrįsto prioritizavimo principas?", "a": ["Pažeidžiamumų prioritetas nustatomas įvertinus jų riziką ir poveikį", "Visada pirmiausia sprendžiami seniausi pažeidžiamumai", "Visi pažeidžiamumai sprendžiami atsitiktine tvarka", "Prioritetai nustatomi tik pagal sistemos pavadinimą"], "c": 0}, {"q": "Į ką atsižvelgiama vertinant pažeidžiamumo verslo poveikį?", "a": ["Tik į pažeidžiamumo pavadinimą", "Į galimą poveikį kritinėms sistemoms ir duomenims", "Tik į darbuotojų skaičių", "Tik į sistemos amžių"], "c": 1}, {"q": "Kuriems pažeidžiamumams teikiamas didesnis prioritetas pagal išnaudojimo prieinamumą?", "a": ["Tiems, kuriems jau yra žinomų išnaudojimo priemonių", "Tiems, kurie yra tik dokumentuose", "Tiems, kurie niekaip nesusiję su sistemomis", "Tiems, kurie neturi jokios informacijos"], "c": 0}, {"q": "Kokios sistemos reikalauja didesnio prioriteto dėl išteklių svarbos?", "a": ["Sistemos, palaikančios svarbias paslaugas", "Tik testinės sistemos", "Tik viešos svetainės", "Tik darbuotojų asmeniniai įrenginiai"], "c": 0}, {"q": "Kodėl svarbu stebėti grėsmių kraštovaizdį?", "a": ["Kad būtų galima išvengti testavimo", "Kad būtų atsižvelgta į aktyvias grėsmes, taikančias į organizacijos pramonės sektorių", "Kad būtų galima atsisakyti inventorizacijos", "Kad būtų galima išjungti CVSS"], "c": 1}, {"q": "Koks kontekstinis veiksnys susijęs su reglamentais?", "a": ["Ignoruoti atitikties reikalavimus", "Spręsti pažeidžiamumus, kurie turi įtakos reglamentinei atitikčiai", "Spręsti tik viešų sistemų pažeidžiamumus", "Spręsti tik technologiškai seniausius pažeidžiamumus"], "c": 1}, {"q": "Koks SAP pavyzdys pateiktas?", "a": ["Rizikos matrica derina CVSS įvertinimus su verslo poveikiu", "Automatizuotas atnaujinimų valdymas", "Bug bounty programa", "Patch Tuesday"], "c": 0}, {"q": "Į kokius pažeidžiamumus SAP pirmiausia kreipia dėmesį pagal pateiktą pavyzdį?", "a": ["Tik darbuotojų įrenginių pažeidžiamumus", "Tik viešų svetainių pažeidžiamumus", "Turinčius įtakos kritinėms ERP sistemoms", "Tik neaktyvių sistemų pažeidžiamumus"], "c": 2}, {"q": "Kodėl prioritetai gali keistis?", "a": ["Tik dėl dokumentų formato", "Tik dėl serverių spalvos", "Tik dėl darbuotojų atostogų", "Dėl naujų grėsmių ir verslo pokyčių"], "c": 3}, {"q": "Ką turi apimti atnaujinimų valdymo procesas?", "a": ["Reguliarius atnaujinimus, pataisų testavimą ir skubių pataisų diegimo procedūras", "Tik darbuotojų mokymus", "Tik metinį auditą", "Tik atsarginių kopijų kūrimą"], "c": 0}, {"q": "Kodėl pataisos testuojamos kontroliuojamoje aplinkoje?", "a": ["Kad būtų galima panaikinti konfigūraciją", "Kad būtų išvengta galimų sutrikimų dėl klaidingų pataisų", "Kad būtų galima išjungti stebėjimą", "Kad būtų galima atsisakyti atnaujinimų"], "c": 1}, {"q": "Kada reikalingas skubus pataisymas?", "a": ["Tik metų pabaigoje", "Reaguojant į kritinius pažeidžiamumus", "Tik pakeitus darbuotojus", "Tik po audito"], "c": 1}, {"q": "Kas yra saugios konfigūracijos?", "a": ["Saugumo geriausios praktikos taikymas sistemos nustatymams", "Konfigūracijos dokumentų ištrynimas", "Tik numatytųjų slaptažodžių naudojimas", "Visų nustatymų išjungimas"], "c": 0}, {"q": "Kodėl palaikomos pagrindinės konfigūracijos?", "a": ["Kad būtų paprasčiau valdyti standartines konfigūracijas", "Kad būtų galima atsisakyti saugos nustatymų", "Kad kiekviena sistema būtų visiškai skirtinga", "Kad būtų išjungti atnaujinimai"], "c": 0}, {"q": "Kokia yra tinklo segmentavimo paskirtis kaip mitigavimo priemonės?", "a": ["Išjungti visą tinklą", "Panaikinti inventorizaciją", "Izoliuoti pažeidžiamas sistemas ir apriboti poveikį", "Padidinti pažeidžiamumo išnaudojimo greitį"], "c": 2}, {"q": "Koks Tesla pavyzdys pateiktas?", "a": ["Rizikos matrica ERP sistemoms", "Patch Tuesday atnaujinimai", "Bug bounty programa", "Automatizuotos atnaujinimų valdymo priemonės greitam pataisų diegimui visame tinkle"], "c": 3}, {"q": "Kodėl laiku atliekami atnaujinimai svarbūs?", "a": ["Jie pakeičia visus saugos testus", "Jie skirti tik ataskaitoms", "Jie panaikina poreikį konfigūruoti sistemas", "Jie yra viena efektyviausių gynybos priemonių prieš išnaudojimus"], "c": 3}, {"q": "Ką reikia įtraukti į incidentų reagavimo planą?", "a": ["Tik atsarginių kopijų tvarką", "Tik darbuotojų mokymus", "Tik finansų procesus", "Pažeidžiamumų valdymą"], "c": 3}, {"q": "Kaip pažeidžiamumų duomenys gali padėti incidentų valdymui?", "a": ["Jie naudojami tik darbuotojų atlyginimams", "Jie panaikina komunikacijos protokolus", "Jie pakeičia visus žurnalus", "Jie naudojami grėsmių aptikimui gerinti"], "c": 3}, {"q": "Ką turi užtikrinti vidiniai pranešimai apie pažeidžiamumus?", "a": ["Kad informacija būtų laikoma tik viename kompiuteryje", "Kad būtų išjungti saugos įspėjimai", "Kad pranešimai būtų siunčiami tik metų pabaigoje", "Kad pažeidžiamumai būtų nedelsiant pranešti atitinkamoms komandoms"], "c": 3}, {"q": "Kada koordinuojami išoriniai pranešimai?", "a": ["Tik kiekvieno skenavimo metu", "Su valdžios institucijomis ir suinteresuotaisiais, kai būtina", "Tik darbuotojų mokymų metu", "Niekada"], "c": 1}, {"q": "Ką po incidento reikia nustatyti atliekant pagrindinių priežasčių analizę?", "a": ["Tik tinklo greitį", "Ar pažeidžiamumas prisidėjo prie incidento", "Tik incidento trukmę", "Tik darbuotojų skaičių"], "c": 1}, {"q": "Ką reiškia mokymasis iš incidentų pažeidžiamumų valdyme?", "a": ["Išjungti pažeidžiamumų skenavimą", "Nekeisti jokių procesų", "Atnaujinti pažeidžiamumų valdymo procesus remiantis incidentų išvadomis", "Panaikinti dokumentavimą"], "c": 2}, {"q": "Koks Marriott International pavyzdys pateiktas?", "a": ["Po duomenų nutekėjimo pažeidžiamumų valdymas glaudžiau integruotas į incidentų reagavimą", "Panaikinti incidentų reagavimo planai", "Įdiegta tik bug bounty programa", "Naudotas tik Patch Tuesday procesas"], "c": 0}, {"q": "Kokia buvo viena Marriott integravimo nauda?", "a": ["Sumažintas pažeidžiamumų skenavimas", "Pagerinta komunikacija tarp saugumo ir IT komandų, kad problemos būtų sprendžiamos greičiau", "Išjungti vidiniai pranešimai", "Atsisakyta atnaujinimų"], "c": 1}, {"q": "Ką reiškia procesų integravimo sinergija?", "a": ["Procesai turi būti visiškai atskirti", "Procesų integravimas pagerina bendrą kibernetinio saugumo veiksmingumą", "Incidentų valdymas neturi būti susijęs su pažeidžiamumais", "Skenavimas turi būti atliekamas tik kartą"], "c": 1}, {"q": "Koks yra nuolatinio tobulinimo principas?", "a": ["Mokymasis iš incidentų stiprina būsimas gynybos priemones", "Reikia atsisakyti dokumentavimo", "Procesai turi likti nepakitę", "Incidentų išvados neturi įtakos procesams"], "c": 0}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}start();
</script></body></html>
