<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>23 tema — CIS Linux OS grūdinimas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>23 tema — CIS Linux OS grūdinimas</h1><div class="subtitle">Linux OS parametrų grūdinimas pagal CIS standartą</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kuo paremtas Linux OS grūdinimas šioje temoje?", "a": ["NIS2", "CIS standartu", "Kerberos", "OWASP Top 10"], "c": 1}, {"q": "Koks yra praktinės veiklos tikslas?", "a": ["Linux OS parametrų grūdinimas", "Web aplikacijos kūrimas", "Kerberos diegimas", "Ransomware analizė"], "c": 0}, {"q": "Kokia paskaitos trukmė?", "a": ["2 valandos", "4 valandos", "6 valandos", "8 valandos"], "c": 1}, {"q": "Koks paskaitos formatas nurodytas?", "a": ["Praktinė veikla", "Nuotolinis testas", "Tik teorija", "Egzaminas"], "c": 0}, {"q": "Kuri CIS sritis skirta failų sistemos vientisumo tikrinimui?", "a": ["5.1 Configure Logging", "1.2 Filesystem Integrity Checking", "1.4 Secure Boot Settings", "6.1 System File Permissions"], "c": 1}, {"q": "Kuri CIS sritis skirta programinės įrangos ir pataisų valdymui?", "a": ["6.2 Local User and Group Settings", "4.4 Configure PAM", "2.1 Configure Time Synchronization", "1.3 Configure Software and Patch Management"], "c": 3}, {"q": "Kuri CIS sritis skirta Secure Boot nustatymams?", "a": ["1.7 Command Line Warning Banners", "1.4 Secure Boot Settings", "2.3 Service Clients", "5.1 Configure Logging"], "c": 1}, {"q": "Kuri CIS sritis skirta papildomam procesų grūdinimui?", "a": ["6.1 System File Permissions", "3.2 Network parameters (Host Only)", "1.5 Additional Process Hardening", "1.2 Filesystem Integrity Checking"], "c": 2}, {"q": "Kuri CIS sritis skirta komandų eilutės įspėjimo reklamjuostėms?", "a": ["4.5 Set Shadow Password Suite Parameters", "2.2 Special Purpose Services", "1.7 Command Line Warning Banners", "6.2 Local User and Group Settings"], "c": 2}, {"q": "Kuri CIS sritis skirta laiko sinchronizavimui?", "a": ["2.3 Service Clients", "2.1 Configure Time Synchronization", "3.1 Disable unused network protocols and devices", "5.1 Configure Logging"], "c": 1}, {"q": "Kuri CIS sritis skirta specialios paskirties servisams?", "a": ["1.5 Additional Process Hardening", "6.2 Local User and Group Settings", "2.2 Special Purpose Services", "4.4 Configure PAM"], "c": 2}, {"q": "Kuri CIS sritis skirta servisų klientams?", "a": ["2.1 Configure Time Synchronization", "5.1 Configure Logging", "2.3 Service Clients", "3.2 Network parameters (Host Only)"], "c": 2}, {"q": "Kuri CIS sritis skirta nenaudojamų tinklo protokolų ir įrenginių išjungimui?", "a": ["6.1 System File Permissions", "4.5 Set Shadow Password Suite Parameters", "3.2 Network parameters (Host Only)", "3.1 Disable unused network protocols and devices"], "c": 3}, {"q": "Kuri CIS sritis skirta tinklo parametrams?", "a": ["3.2 Network parameters (Host Only)", "5.1 Configure Logging", "2.3 Service Clients", "3.1 Disable unused network protocols and devices"], "c": 0}, {"q": "Kuri CIS sritis skirta PAM konfigūravimui?", "a": ["4.4 Configure PAM", "4.5 Set Shadow Password Suite Parameters", "6.2 Local User and Group Settings", "1.3 Configure Software and Patch Management"], "c": 0}, {"q": "Kuri CIS sritis skirta Shadow Password Suite parametrams?", "a": ["5.1 Configure Logging", "2.1 Configure Time Synchronization", "4.4 Configure PAM", "4.5 Set Shadow Password Suite Parameters"], "c": 3}, {"q": "Kuri CIS sritis skirta registravimo (logging) konfigūravimui?", "a": ["1.2 Filesystem Integrity Checking", "6.1 System File Permissions", "5.1 Configure Logging", "2.2 Special Purpose Services"], "c": 2}, {"q": "Kuri CIS sritis skirta sisteminių failų teisėms?", "a": ["6.1 System File Permissions", "5.1 Configure Logging", "3.2 Network parameters (Host Only)", "6.2 Local User and Group Settings"], "c": 0}, {"q": "Kuri CIS sritis skirta vietinių vartotojų ir grupių nustatymams?", "a": ["2.3 Service Clients", "6.1 System File Permissions", "4.4 Configure PAM", "6.2 Local User and Group Settings"], "c": 3}, {"q": "Kiek pagrindinių CIS sričių išvardyta pirmame sąraše nuo 1.2 iki 2.3?", "a": ["8", "12", "5", "10"], "c": 0}, {"q": "Kiek CIS sričių išvardyta antrame sąraše nuo 3.1 iki 6.2?", "a": ["7", "4", "6", "9"], "c": 0}, {"q": "Koks CIS srities numeris skirtas Filesystem Integrity Checking?", "a": ["1.2", "1.4", "1.3", "1.5"], "c": 0}, {"q": "Koks CIS srities numeris skirtas Software and Patch Management?", "a": ["1.3", "1.2", "1.7", "2.1"], "c": 0}, {"q": "Koks CIS srities numeris skirtas Secure Boot Settings?", "a": ["1.7", "1.4", "1.5", "2.2"], "c": 1}, {"q": "Koks CIS srities numeris skirtas Additional Process Hardening?", "a": ["2.1", "3.1", "1.4", "1.5"], "c": 3}, {"q": "Koks CIS srities numeris skirtas Command Line Warning Banners?", "a": ["2.3", "4.4", "1.5", "1.7"], "c": 3}, {"q": "Koks CIS srities numeris skirtas Configure Time Synchronization?", "a": ["3.1", "2.2", "2.3", "2.1"], "c": 3}, {"q": "Koks CIS srities numeris skirtas Special Purpose Services?", "a": ["2.2", "2.1", "2.3", "3.2"], "c": 0}, {"q": "Koks CIS srities numeris skirtas Service Clients?", "a": ["4.4", "3.1", "2.2", "2.3"], "c": 3}, {"q": "Koks CIS srities numeris skirtas Disable unused network protocols and devices?", "a": ["3.1", "4.5", "2.3", "3.2"], "c": 0}, {"q": "Koks CIS srities numeris skirtas Network parameters (Host Only)?", "a": ["3.1", "4.4", "3.2", "5.1"], "c": 2}, {"q": "Koks CIS srities numeris skirtas Configure PAM?", "a": ["3.2", "6.1", "4.5", "4.4"], "c": 3}, {"q": "Koks CIS srities numeris skirtas Set Shadow Password Suite Parameters?", "a": ["4.4", "6.2", "5.1", "4.5"], "c": 3}, {"q": "Koks CIS srities numeris skirtas Configure Logging?", "a": ["2.1", "6.1", "4.5", "5.1"], "c": 3}, {"q": "Koks CIS srities numeris skirtas System File Permissions?", "a": ["4.4", "6.1", "6.2", "5.1"], "c": 1}, {"q": "Koks CIS srities numeris skirtas Local User and Group Settings?", "a": ["4.5", "6.1", "6.2", "5.1"], "c": 2}, {"q": "Kokio lygio politikos konfigūruojamos praktinėje užduotyje?", "a": ["Level 0", "Level 1", "Level 2", "Level 3"], "c": 1}, {"q": "Kaip atliekama užduotis pagal medžiagą?", "a": ["Savarankiškai be dėstytojo", "Tik teorinėje paskaitoje", "Kartu su dėstytoju", "Tik atliekant egzaminą"], "c": 2}, {"q": "Iš kur atliekamos Linux OS konfigūracijos?", "a": ["Tik per mobiliąją programėlę", "Tik iš grafinės sąsajos", "Tik per naršyklę", "Iš komandinės eilutės"], "c": 3}, {"q": "Kur pridėtas CIS nustatymų rinkinys Linux OS?", "a": ["Į Windows registrą", "Į GitHub", "Prie Classroom failų", "Į Kerberos KDC"], "c": 2}, {"q": "Kam skirtas CIS nustatymų rinkinys?", "a": ["Ransomware iššifravimui", "Web serverio turiniui", "Linux OS nustatymams ir grūdinimo konfigūracijoms", "MFA kodų generavimui"], "c": 2}, {"q": "Kuri tema tiesiogiai susijusi su 1.2 Filesystem Integrity Checking?", "a": ["PAM", "Laiko sinchronizavimas", "Vartotojų ir grupių nustatymai", "Failų sistemos vientisumo tikrinimas"], "c": 3}, {"q": "Kuri tema tiesiogiai susijusi su 1.3?", "a": ["Programinės įrangos ir pataisų valdymas", "Logging", "Secure Boot", "PAM"], "c": 0}, {"q": "Kuri tema tiesiogiai susijusi su 2.1?", "a": ["Sisteminiai failų leidimai", "Laiko sinchronizavimas", "Service Clients", "Specialios paskirties servisai"], "c": 1}, {"q": "Kuri tema tiesiogiai susijusi su 3.1?", "a": ["Tinklo parametrų konfigūravimas", "PAM", "Nenaudojamų tinklo protokolų ir įrenginių išjungimas", "Logging"], "c": 2}, {"q": "Kuri tema tiesiogiai susijusi su 4.4?", "a": ["Logging", "Vartotojų ir grupių nustatymai", "PAM konfigūravimas", "Shadow Password Suite parametrų nustatymas"], "c": 2}, {"q": "Kuri tema tiesiogiai susijusi su 5.1?", "a": ["Secure Boot", "Sisteminių failų teisės", "Logging konfigūravimas", "Laiko sinchronizavimas"], "c": 2}, {"q": "Kuri tema tiesiogiai susijusi su 6.1?", "a": ["Sisteminių failų teisės", "Vietiniai vartotojai ir grupės", "Failų sistemos vientisumas", "PAM"], "c": 0}, {"q": "Kuri tema tiesiogiai susijusi su 6.2?", "a": ["Vietinių vartotojų ir grupių nustatymai", "Logging", "Service Clients", "Sisteminių failų teisės"], "c": 0}, {"q": "Kuris teiginys geriausiai apibūdina šios temos pobūdį?", "a": ["Kerberos autentifikacijos analizė", "MFA algoritmų programavimas", "Praktinis Linux OS parametrų grūdinimas pagal CIS standartą", "Ransomware kūrimas"], "c": 2}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
