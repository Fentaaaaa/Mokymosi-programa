*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px} .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}

.result{text-align:center} .score{font-size:44px;font-weight:800;margin:15px 0 5px} .percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}

4 srauto balansavimu?", "a": ["TCP", "HTTP", "ARP", "DNS"], "c": 0}, {"q": "Koks protokolas pavyzdžiu siejamas su L7 srauto balansavimu?", "a": ["HTTPS", "ARP", "Ethernet", "DHCP"], "c": 0}, {"q": "Kuo L4 srauto balansavimas siejamas medžiagoje?", "a": ["DHCP options", "MAC adresais", "DNS įrašais", "TCP srautu"], "c": 3}, {"q": "Kuo L7 srauto balansavimas siejamas medžiagoje?", "a": ["HTTPS srautu", "Ethernet kadrais", "DHCP užklausomis", "ARP srautu"], "c": 0}, {"q": "Kas yra proxy serveris?", "a": ["DNS įrašas", "Tinklo komutatorius", "DHCP klientas", "Tarpinis serveris, naudojamas pasiekti tinklo resursus"], "c": 3}, {"q": "Kokie du proxy tipai pateikiami medžiagoje?", "a": ["LAN ir WAN", "TCP ir UDP", "STP ir LACP", "Forward ir reverse"], "c": 3}, {"q": "Kam dažnai naudojami įprasti forward proxy serveriai įmonėse?", "a": ["Prieigos prie interneto valdymui", "STP keliams valdyti", "IP adresams dalinti", "DNS įrašams kurti"], "c": 0}, {"q": "Kam dar gali būti naudojami forward proxy serveriai?", "a": ["EtherChannel kūrimui", "Tapatybės anonimizavimui", "VLAN kilpoms šalinti", "DHCP rezervacijoms"], "c": 1}, {"q": "Kam naudojami reverse proxy serveriai?", "a": ["Tik DHCP", "Srauto balansavimui", "Tik MAC adresų keitimui", "Tik STP"], "c": 1}, {"q": "Kokią kitą funkciją gali atlikti reverse proxy?", "a": ["MAC spoofing", "TLS terminavimą", "DHCP lease kūrimą", "STP root parinkimą"], "c": 1}, {"q": "Kaip reverse proxy gali nukreipti skirtingus domenus?", "a": ["Tik į vieną LAN segmentą", "Tik į skirtingus DHCP serverius", "Į vieną išorinį IP adresą", "Tik į skirtingus MAC adresus"], "c": 2}, {"q": "Kuo skiriasi forward ir reverse proxy pagal paskirtį?", "a": ["Forward proxy veikia klientų prieigos pusėje, reverse proxy – serverių/srauto pusėje", "Forward proxy skirtas tik DNS, reverse – tik DHCP", "Forward proxy skirtas tik STP", "Jie yra visiškai vienodi"], "c": 0}, {"q": "Kuri technologija užtikrina, kad alternatyvūs keliai nesukeltų nuolatinių kilpų?", "a": ["HTTPS", "DNS", "STP", "DHCP"], "c": 2}, {"q": "Kokia STP nauda, kai yra keli fiziniai keliai?", "a": ["Visi keliai visada naudojami", "IP adresai tampa dinaminiai", "DNS tampa nereikalingas", "Valdomas aktyvus kelias ir išvengiama kilpų"], "c": 3}, {"q": "Kokia technologija skirta didesniam pralaidumui sujungiant kelis ryšius?", "a": ["STP", "DHCP", "DNS", "EtherChannel"], "c": 3}, {"q": "Kuris protokolas naudojamas EtherChannel pavadinime pateiktame pavyzdyje?", "a": ["TCP", "UDP", "DNS", "LACP"], "c": 3}, {"q": "Kuri technologija automatiškai priskiria IP konfigūraciją įrenginiui?", "a": ["STP", "Proxy", "DNS", "DHCP"], "c": 3}, {"q": "Kuri technologija susieja IP adresus su vardais?", "a": ["LACP", "DHCP", "STP", "DNS"], "c": 3}, {"q": "Kuri technologija padalina srautą tarp kelių serverių?", "a": ["DNS", "DHCP", "Srauto balansavimas", "STP"], "c": 2}, {"q": "Kuri technologija veikia kaip tarpinis serveris?", "a": ["LACP", "DNS", "DHCP", "Proxy"], "c": 3}, {"q": "Kuri proxy rūšis naudojama prieigai prie interneto valdyti?", "a": ["Reverse proxy", "STP proxy", "DNS proxy", "Forward proxy"], "c": 3}, {"q": "Kuri proxy rūšis naudojama srauto balansavimui?", "a": ["Forward proxy", "DNS proxy", "DHCP proxy", "Reverse proxy"], "c": 3}, {"q": "Kuri praktinė veikla minima šioje temoje?", "a": ["WordPress diegimas", "OSI ir bazinių tinklo komandų praktiniai užsiėmimai", "Kerberos laboratorija", "CIS Windows grūdinimas"], "c": 1}, {"q": "Kokia platforma minima praktiniuose tinklo užsiėmimuose?", "a": ["TryHackMe", "WordPress", "GitHub", "Azure DevOps"], "c": 0}, {"q": "Kuri TryHackMe tema minima?", "a": ["Linux Privilege Escalation", "Intro to Networking", "Web Fundamentals", "OWASP Top 10"], "c": 1}, {"q": "Kuri kita TryHackMe tema minima?", "a": ["SIEM Deployment", "Kerberos Attacks", "DNSSEC Advanced", "What is Networking"], "c": 3}, {"q": "Kuri LAN skirta TryHackMe tema minima?", "a": ["Enterprise VLAN", "LAN Security Advanced", "Intro to LAN", "LAN Proxy"], "c": 2}, {"q": "Kuri DNS skirta TryHackMe tema minima?", "a": ["DNSSEC in Detail", "DNS in Detail", "DNS Proxy Lab", "Advanced DNS"], "c": 1}, {"q": "Kokia pagrindinė STP problema sprendžiama tinkle?", "a": ["IP adresų priskyrimas", "Kilpų prevencija", "HTTPS terminavimas", "DNS vardų sprendimas"], "c": 1}, {"q": "Kokia pagrindinė DHCP paskirtis?", "a": ["DNS vardų kūrimas", "Automatinė tinklo įrenginių IP konfigūracija", "Srauto balansavimas", "Proxy veikimas"], "c": 1}, {"q": "Kokia pagrindinė DNS paskirtis?", "a": ["Susieti vardus su IP adresais", "Valdyti STP", "Balansuoti TCP", "Priskirti IP klientams"], "c": 0}, {"q": "Kokia pagrindinė srauto balansavimo paskirtis?", "a": ["Padalinti srautą tarp kelių serverių ir didinti patikimumą", "Kurti DNS įrašus", "Valdyti MAC lenteles", "Priskirti IP"], "c": 0}, {"q": "Kokia pagrindinė reverse proxy paskirtis iš pateiktų?", "a": ["Tik STP", "Tik DHCP", "Tik interneto anonimizavimas", "Srauto balansavimas, TLS terminavimas ir domenų nukreipimas"], "c": 3}];
let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){
 document.body.classList.toggle('dark');
 const d=document.body.classList.contains('dark');
 localStorage.setItem('darkMode',d?'1':'0');
 document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode';
}
if(localStorage.getItem('darkMode')==='1'){
 document.body.classList.add('dark');
 document.getElementById('themeBtn').textContent='☀️ Light mode';
}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function start(){
 quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);
 index=0; score=0; answered=false; render();
}
function render(){
 const x=quiz[index];
 document.getElementById('quiz').innerHTML=
 `<div class="progress">Question ${index+1} of ${quiz.length}</div>
 <div class="card"><div class="question">${esc(x.q)}</div>
 <div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div>
 <button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`;
}
function answer(c){
 if(answered)return;
 answered=true;
 const x=quiz[index], bs=[...document.querySelectorAll('.answer')];
 bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct');});
 if(c===x.c)score++; else bs[c].classList.add('wrong');
 document.getElementById('next').disabled=false;
}
function next(){
 if(!answered)return;
 if(index===quiz.length-1){result();return;}
 index++; answered=false; render();
}
function result(){
 document.getElementById('quiz').innerHTML=
 `<div class="card result"><div class="progress">Quiz completed</div>
 <h2>Your result</h2><div class="score">${score} / 10</div>
 <div class="percent">${score*10}%</div>
 <button class="retry" onclick="start()">Try again</button></div>`;
}
start();
</script>
