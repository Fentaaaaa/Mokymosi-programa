<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>21 tema — CIS Windows Server OS grūdinimas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>21 tema — CIS Windows Server OS grūdinimas</h1><div class="subtitle">Windows Server OS parametrų grūdinimas pagal CIS</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kuo paremtas Windows Server OS grūdinimas šioje temoje?", "a": ["OWASP Top 10", "CIS nustatymų rinkiniu", "CVSS", "MITRE ATT&CK"], "c": 1}, {"q": "Kokio lygio politikos konfigūruojamos praktinėje užduotyje?", "a": ["Level 2", "Level 1", "Level 0", "Level 3"], "c": 1}, {"q": "Kaip atliekamos konfigūracijos?", "a": ["Iš grafinės aplinkos ir/ar komandinės eilutės", "Tik per BIOS", "Tik per PowerShell", "Tik per interneto naršyklę"], "c": 0}, {"q": "Kokia yra rekomenduojama „Enforce password history“ reikšmė?", "a": ["1 slaptažodis", "10 ar mažiau slaptažodžių", "24 ar daugiau slaptažodžių", "5 ar daugiau slaptažodžių"], "c": 2}, {"q": "Kokia yra rekomenduojama „Maximum password age“ reikšmė?", "a": ["90 ar daugiau dienų", "0 dienų", "180 dienų", "60 ar mažiau dienų, bet ne 0"], "c": 3}, {"q": "Kokia yra rekomenduojama minimali slaptažodžio trukmė simboliais?", "a": ["6 ar daugiau simbolių", "8 ar daugiau simbolių", "14 ar daugiau simbolių", "10 ar daugiau simbolių"], "c": 2}, {"q": "Kokia yra rekomenduojama „Account lockout duration“ reikšmė?", "a": ["10 sekundžių", "15 ar daugiau minučių", "1 valanda", "5 minutės"], "c": 1}, {"q": "Kokia yra rekomenduojama „Reset account lockout counter after“ reikšmė?", "a": ["5 ar mažiau minučių", "15 ar daugiau minučių", "60 sekundžių", "24 valandos"], "c": 1}, {"q": "Kuri politika priklauso „Password and account lockout policy“ sričiai?", "a": ["Enforce password history", "Allow Basic authentication", "Allow log on locally", "Audit Other System Events"], "c": 0}, {"q": "Kaip turi būti nustatytas „Act as part of the operating system“?", "a": ["Guests", "Administrators", "No One", "Everyone"], "c": 2}, {"q": "Kam pagal pateiktą CIS nustatymą turi būti leidžiama „Allow log on locally“?", "a": ["Remote Desktop Users", "Administrators", "Everyone", "Guests"], "c": 1}, {"q": "Kam turi būti leidžiama „Allow log on through Remote Desktop Services“?", "a": ["Tik Guests", "Tik Everyone", "Administrators ir Remote Desktop Users", "Guests ir Everyone"], "c": 2}, {"q": "Kam turi būti priskirta „Back up files and directories“ teisė?", "a": ["Guests", "Everyone", "Remote Desktop Users", "Administrators"], "c": 3}, {"q": "Kuri grupė turi būti įtraukta į „Deny log on locally“?", "a": ["Guests", "Everyone", "Administrators", "Remote Desktop Users"], "c": 0}, {"q": "Kuri sritis apima „Act as part of the operating system“ nustatymą?", "a": ["User rights assignment", "Windows firewall", "WinRM service", "Windows installer"], "c": 0}, {"q": "Kokiam Windows komponentui skirta 9.1.4 CIS rekomendacija?", "a": ["PowerShell", "Windows Firewall", "Windows Installer", "WinRM Client"], "c": 1}, {"q": "Kaip turi būti nustatytas „Windows Firewall: Domain: Settings: Display a notification“?", "a": ["Enabled", "Not configured", "No", "Yes"], "c": 2}, {"q": "Kokia sritis apima „Audit Sensitive Privilege Use“?", "a": ["Password policy", "System", "Privilege Use", "Windows Firewall"], "c": 2}, {"q": "Kaip turi būti nustatytas „Audit Sensitive Privilege Use“?", "a": ["Failure only", "Disabled", "Success and Failure", "Success only"], "c": 2}, {"q": "Kokia sritis apima „Audit Other System Events“?", "a": ["WinRM Client", "System", "Windows Installer", "Privilege Use"], "c": 1}, {"q": "Kaip turi būti nustatytas „Audit Other System Events“?", "a": ["Disabled", "Failure only", "Success and Failure", "Success only"], "c": 2}, {"q": "Koks nustatymas priklauso Windows Installer sričiai?", "a": ["Allow user control over installs", "Display a notification", "Allow Basic authentication", "Audit Sensitive Privilege Use"], "c": 0}, {"q": "Kaip turi būti nustatytas „Allow user control over installs“?", "a": ["Enabled", "No One", "Success and Failure", "Disabled"], "c": 3}, {"q": "Kaip turi būti nustatytas „Always install with elevated privileges“?", "a": ["Administrators", "Guests", "Disabled", "Enabled"], "c": 2}, {"q": "Kodėl svarbu atkreipti dėmesį į „Always install with elevated privileges“ nustatymą?", "a": ["CIS rekomenduoja jį įjungti visiems vartotojams", "CIS rekomenduoja jį išjungti", "Jis nustato Windows Firewall pranešimus", "Jis susijęs su slaptažodžių istorija"], "c": 1}, {"q": "Kuri sritis apima „Allow Basic authentication“ nustatymą su 18.9.97.1.x numeracija?", "a": ["WinRM client", "Windows Installer", "PowerShell", "WinRM service"], "c": 0}, {"q": "Kaip turi būti nustatytas WinRM client „Allow Basic authentication“?", "a": ["No One", "Success and Failure", "Disabled", "Enabled"], "c": 2}, {"q": "Kaip turi būti nustatytas WinRM client „Allow unencrypted traffic“?", "a": ["Disabled", "Success only", "Enabled", "Not configured"], "c": 0}, {"q": "Kaip turi būti nustatytas WinRM client „Disallow Digest authentication“?", "a": ["No One", "Disabled", "Success and Failure", "Enabled"], "c": 3}, {"q": "Kiek WinRM client nustatymų pateikta šioje temoje?", "a": ["4", "2", "3", "5"], "c": 2}, {"q": "Kuri sritis apima 18.9.97.2.x nustatymus?", "a": ["WinRM service", "PowerShell", "WinRM client", "Windows Installer"], "c": 0}, {"q": "Kaip turi būti nustatytas WinRM service „Allow Basic authentication“?", "a": ["Success and Failure", "No One", "Enabled", "Disabled"], "c": 3}, {"q": "Kaip turi būti nustatytas WinRM service „Allow unencrypted traffic“?", "a": ["Enabled", "Success only", "Disabled", "Administrators"], "c": 2}, {"q": "Kuris teiginys apie WinRM service nustatymus atitinka pateiktą medžiagą?", "a": ["Abu turi būti Enabled", "Abu turi būti nustatyti Success and Failure", "Basic authentication ir unencrypted traffic turi būti Disabled", "Basic authentication turi būti Enabled, o unencrypted traffic Disabled"], "c": 2}, {"q": "Kuri sritis apima „Turn on PowerShell Transcription“?", "a": ["PowerShell", "WinRM client", "Privilege Use", "System"], "c": 0}, {"q": "Kaip turi būti nustatytas „Turn on PowerShell Transcription“?", "a": ["Enabled", "Success and Failure", "Disabled", "No One"], "c": 2}, {"q": "Kuri iš šių sričių yra tiesiogiai įvardyta CIS Windows OS grūdinimo sąraše?", "a": ["Burp Suite", "CVE", "Windows firewall", "OWASP Top 10"], "c": 2}, {"q": "Kuri iš šių sričių taip pat priklauso pateiktam CIS Windows OS nustatymų sąrašui?", "a": ["CVE DETAILS", "OWASP ZAP", "Windows installer", "MITRE ATT&CK"], "c": 2}, {"q": "Kuri iš šių sričių minima kartu su WinRM client ir WinRM service?", "a": ["CVSS", "PowerShell", "CORS", "OWASP"], "c": 1}, {"q": "Kiek pagrindinių sričių išvardyta CIS Windows OS grūdinimo sąraše?", "a": ["9", "5", "7", "12"], "c": 0}, {"q": "Kuri rekomendacija susijusi su slaptažodžių istorija?", "a": ["14 simbolių minimalus ilgis", "15 minučių blokavimas", "60 dienų maksimalus amžius", "24 ar daugiau ankstesnių slaptažodžių"], "c": 3}, {"q": "Kuri rekomendacija susijusi su minimaliu slaptažodžio ilgiu?", "a": ["15 minučių", "60 dienų", "14 ar daugiau simbolių", "24 slaptažodžiai"], "c": 2}, {"q": "Kuri rekomendacija susijusi su paskyros blokavimo trukme?", "a": ["60 dienų", "24 slaptažodžiai", "14 simbolių", "15 ar daugiau minučių"], "c": 3}, {"q": "Kuri rekomendacija susijusi su paskyros blokavimo skaitiklio atkūrimu?", "a": ["15 ar daugiau minučių", "60 dienų", "14 simbolių", "24 slaptažodžiai"], "c": 0}, {"q": "Kuris nustatymas turi būti priskirtas „No One“?", "a": ["Allow log on through Remote Desktop Services", "Allow log on locally", "Back up files and directories", "Act as part of the operating system"], "c": 3}, {"q": "Kuris nustatymas turi būti priskirtas „Administrators“?", "a": ["Deny log on locally", "Act as part of the operating system", "Allow Basic authentication", "Allow log on locally"], "c": 3}, {"q": "Kuris nustatymas turi būti priskirtas „Administrators, Remote Desktop Users“?", "a": ["Act as part of the operating system", "Back up files and directories", "Allow log on through Remote Desktop Services", "Allow log on locally"], "c": 2}, {"q": "Kuris nustatymas turi būti priskirtas „Administrators“ pagal pateiktą medžiagą?", "a": ["Disallow Digest authentication", "Deny log on locally", "Act as part of the operating system", "Back up files and directories"], "c": 3}, {"q": "Kuri grupė turi būti įtraukta į „Deny log on locally“?", "a": ["Remote Desktop Users", "Everyone", "Administrators", "Guests"], "c": 3}, {"q": "Kuri audito reikšmė naudojama tiek „Audit Sensitive Privilege Use“, tiek „Audit Other System Events“?", "a": ["Disabled", "Success only", "Failure only", "Success and Failure"], "c": 3}, {"q": "Kodėl audito nustatymuose naudojama „Success and Failure“ reikšmė pagal pateiktą konfigūraciją?", "a": ["Kad būtų leidžiamas nuotolinis prisijungimas", "Kad būtų išjungtas auditas", "Kad būtų audituojami ir sėkmingi, ir nesėkmingi įvykiai", "Kad būtų fiksuojami tik sėkmingi įvykiai"], "c": 2}, {"q": "Kuris nustatymas yra susijęs su nešifruotu WinRM srautu?", "a": ["Allow unencrypted traffic", "Minimum password length", "Allow user control over installs", "Audit Other System Events"], "c": 0}, {"q": "Kokia turi būti WinRM nešifruoto srauto nustatymo reikšmė pagal CIS?", "a": ["Success and Failure", "No One", "Enabled", "Disabled"], "c": 3}, {"q": "Kuris WinRM client nustatymas turi būti Enabled?", "a": ["Allow Basic authentication", "Allow unencrypted traffic", "Disallow Digest authentication", "Allow user control over installs"], "c": 2}, {"q": "Kuris nustatymas neleidžia vartotojui kontroliuoti diegimų?", "a": ["Allow Basic authentication = Disabled", "Allow user control over installs = Disabled", "Display a notification = No", "Always install with elevated privileges = Enabled"], "c": 1}, {"q": "Kuris Windows Installer nustatymas turi būti Disabled?", "a": ["Always install with elevated privileges", "Disallow Digest authentication", "Enforce password history", "Audit Other System Events"], "c": 0}, {"q": "Kokia praktinės veiklos tema nurodyta paskaitoje?", "a": ["OWASP Top 10 analizė", "Windows Server OS parametrų grūdinimas", "Web aplikacijų testavimas", "DLP politikų kūrimas"], "c": 1}, {"q": "Koks paskaitos formatas nurodytas?", "a": ["Teorija", "Teorija ir praktika", "Teorija ir diskusija", "Praktinė veikla"], "c": 3}, {"q": "Kokia paskaitos trukmė nurodyta?", "a": ["4 valandos", "3 valandos", "1 valanda", "2 valandos"], "c": 0}, {"q": "Kur pateiktas CIS PDF pagal medžiagą?", "a": ["Burp Suite", "NVD", "Classroom failuose", "GitHub repozitorijoje"], "c": 2}, {"q": "Kaip atliekama užduotis pagal medžiagą?", "a": ["Tik per interneto naršyklę", "Tik per automatizuotą įrankį", "Kartu su dėstytoju", "Tik savarankiškai be dėstytojo"], "c": 2}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}start();
</script></body></html>
