<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>6 Tema – Grėsmių bei rizikų identifikavimas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--red:#dc2626}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:850px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:28px;margin:0}#theme{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.meta,.small{color:var(--muted)}
.question{font-size:21px;line-height:1.4;margin:10px 0 22px}.option{width:100%;text-align:left;border:1px solid var(--border);background:var(--card);color:var(--text);padding:14px 16px;border-radius:11px;margin:7px 0;cursor:pointer}
.option:hover:not(:disabled){border-color:var(--accent)}.option.correct{background:#dcfce7;border-color:var(--green);color:#166534}.option.wrong{background:#fee2e2;border-color:var(--red);color:#991b1b}
body.dark .option.correct{background:#14532d;color:#dcfce7}body.dark .option.wrong{background:#7f1d1d;color:#fee2e2}
.option:disabled{cursor:default}.next,.restart{margin-top:18px;border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:10px;cursor:pointer}.hidden{display:none}
.result{text-align:center}.score{font-size:38px;font-weight:700;margin:16px 0 8px}
</style></head><body><div class="container">
<div class="top"><h1>6 Tema – Grėsmių bei rizikų identifikavimas</h1><button id="theme">🌙 Dark mode</button></div>

ną riziką?", "options": ["Perkelti", "Priimti", "Ignoruoti", "Vengti"], "correct": 3}, {"q": "Jei RPO yra viena valanda, ką tai reiškia?", "options": ["Auditas trunka vieną valandą", "Sistema gali būti neveikianti vieną valandą", "Rizika turi būti perduota per vieną valandą", "Įmonė negali sau leisti prarasti daugiau nei vienos valandos duomenų"], "correct": 3}, {"q": "Kuo iš esmės skiriasi RTO ir RPO?", "options": ["RTO yra rizikos matrica, o RPO – auditas", "Abu reiškia tą patį", "RTO yra apie duomenis, o RPO tik apie darbuotojus", "RTO susijęs su atkūrimo laiku, o RPO – su leistinu duomenų praradimu"], "correct": 3}, {"q": "Koks pavyzdys pateikiamas rizikos perkėlimo atveju?", "options": ["Sudaryti sutartį su paslaugų teikėju arba apsidrausti nuo rizikos", "Atšaukti visą veiklą", "Ignoruoti riziką", "Panaikinti saugumo kontrolę"], "correct": 0}, {"q": "Kokia yra 1 reikšmė poveikio skalėje?", "options": ["Nedidelis", "Nereikšmingas", "Vidutinis", "Didelis"], "correct": 1}, {"q": "Ką reikia apibrėžti nustatant rizikos vertinimo kontekstą?", "options": ["Tik audito kainą", "Tik darbuotojų skaičių", "Vertinimo apimtį ir tikslus", "Tik techninės įrangos gamintojus"], "correct": 2}, {"q": "Jei RTO yra viena valanda, ką tai reiškia?", "options": ["Rizika turi būti įvertinta per valandą", "Sistema ar paslauga turėtų būti atkurta per nustatytą vienos valandos laiką", "Auditas turi trukti vieną valandą", "Galima prarasti vienos valandos duomenis"], "correct": 1}, {"q": "Kokia gali būti naudinga informacija identifikuojant resursus?", "options": ["Tik klientų apklausos", "Tik reklaminė medžiaga", "Egzistuojanti sistemų dokumentacija", "Tik darbuotojų atostogų grafikas"], "correct": 2}, {"q": "Kas yra BIA?", "options": ["Poveikio verslui analizė, padedanti suprasti galimą įvykių ar incidentų poveikį verslo veiklai", "Techninis tinklo auditas", "Finansinis auditas", "Darbuotojų apklausa"], "correct": 0}, {"q": "Į kokius tris pagrindinius informacijos saugumo principus tipiškai gali daryti poveikį grėsmės?", "options": ["Pelningumą, rinkodarą ir pardavimus", "Greitį, kainą ir patogumą", "Privatumą, reklamą ir personalą", "Konfidencialumą, integralumą ir prieinamumą"], "correct": 3}, {"q": "Kokia yra 4 reikšmė poveikio skalėje?", "options": ["Ženklus", "Nereikšmingas", "Vidutinis", "Nedidelis"], "correct": 0}, {"q": "Kuri iš pateiktų yra grėsmės kategorija?", "options": ["Įsilaužėlių grėsmė", "Biuro baldų grėsmė", "Pardavimų grėsmė", "Atostogų grėsmė"], "correct": 0}, {"q": "Kuri iš pateiktų yra dažnai sutinkama grėsmė?", "options": ["Duomenų nutekėjimas", "Darbuotojų paaukštinimas", "Pardavimų augimas", "Naujų biurų paieška"], "correct": 0}, {"q": "Ką reikia padaryti po rizikų prioritetizavimo?", "options": ["Pakeisti organizacijos misiją", "Įgyvendinti kontrolės priemones", "Atšaukti vertinimą", "Ištrinti rizikų sąrašą"], "correct": 1}, {"q": "Koks scenarijus pateiktas medžiagoje kaip pavyzdys?", "options": ["Darbuotojas pamiršta susitikimą", "Vartotojas atidaro el. paštu gautą prisegtuką, kuris paleidžia tinklu plintančią šifravimo ataką", "Serveris gauna naują procesorių", "Tiekėjas sumažina kainą"], "correct": 1}, {"q": "Į ką atsižvelgiama nustatant rizikos vertinimo kontekstą?", "options": ["Tik darbuotojų atostogas", "Tik konkurentų kainas", "Organizacijos tikslus, reguliavimo reikalavimus ir suinteresuotąsias šalis", "Tik biuro dydį"], "correct": 2}, {"q": "Ką reiškia rizikos perkėlimas?", "options": ["Visada atsisakyti veiklos", "Visada priimti riziką", "Padidinti rizikos poveikį", "Dalytis rizika arba perduoti ją kitai šaliai"], "correct": 3}, {"q": "Kas yra rizikos vertinimas?", "options": ["Tik finansinių nuostolių skaičiavimas", "Tik techninių gedimų registravimas", "Tik darbuotojų mokymas", "Sistemingas požiūris į rizikos nustatymą, įvertinimą ir valdymą"], "correct": 3}, {"q": "Kokia yra 3 reikšmė tikimybės skalėje?", "options": ["Įmanomas", "Retas", "Labai tikėtinas", "Ženklus"], "correct": 0}, {"q": "Kam gerai pritaikyta TARA metodologija?", "options": ["Tik mokykloms", "Didelių korporacijų ir gynybos srityje dirbančių kompanijų rizikų vertinimui", "Tik ligoninėms", "Tik mažoms įmonėms"], "correct": 1}, {"q": "Koks yra vienas pagrindinių rizikos vertinimo rezultatų?", "options": ["Tik audito ataskaita", "Tik darbuotojų mokymas", "Rizikų prioritetizavimas ir sprendimas, kaip su jomis elgtis", "Tik rizikų sąrašo ištrynimas"], "correct": 2}, {"q": "Kokia yra 4 reikšmė tikimybės skalėje?", "options": ["Įmanomas", "Nereikšmingas", "Tikėtinas", "Retas"], "correct": 2}, {"q": "Kodėl svarbu suprasti sąryšius tarp sistemos komponentų?", "options": ["Kad būtų galima atsisakyti dokumentacijos", "Kad būtų galima išvengti rizikos vertinimo", "Kad būtų aiškios priklausomybės tarp komponentų ir išorinių priklausomybių", "Kad būtų galima sumažinti darbuotojų skaičių"], "correct": 2}, {"q": "Kokia yra 5 reikšmė tikimybės skalėje?", "options": ["Vidutinis", "Retas", "Mažai tikėtinas", "Labai tikėtinas"], "correct": 3}, {"q": "Koks yra pirmasis bendras rizikos vertinimo žingsnis?", "options": ["Ataskaitos rengimas", "Rizikos prioritetizavimas", "Rizikos mažinimas", "Nustatyti kontekstą"], "correct": 3}, {"q": "Kuris etapas eina po specifinių scenarijų identifikavimo?", "options": ["Resursų identifikavimas", "Apimties įvertinimas", "Rizikos analizė ir poveikio vertinimas", "Kontrolės priemonių įgyvendinimas"], "correct": 2}, {"q": "Kas yra specifinio scenarijaus identifikavimo esmė?", "options": ["Aprašyti konkrečią įvykių seką, galinčią sukelti neigiamą poveikį", "Tik nustatyti darbuotojų skaičių", "Tik išvardyti grėsmių pavadinimus", "Tik suskaičiuoti serverius"], "correct": 0}, {"q": "Kuri rizikos vertinimo metodika grėsmes paverčia finansine išraiška?", "options": ["OCTAVE", "COSO", "FAIR", "TARA"], "correct": 2}, {"q": "Kuri iš pateiktų yra grėsmė, susijusi su sistemomis?", "options": ["Klientų apklausos", "Pardavimų planai", "Darbuotojų atostogos", "Sistemų gedimai"], "correct": 3}, {"q": "Kokie gali būti rizikos šaltiniai?", "options": ["Tik programinė įranga", "Tik darbuotojai", "Tik gamtos stichijos", "Žmogiškieji veiksniai, technologijos, procesai, išoriniai įvykiai ir reguliavimo pokyčiai"], "correct": 3}, {"q": "Kuri iš pateiktų yra grėsmė, susijusi su aplinka?", "options": ["Gamtos stichijos", "Darbuotojų susitikimai", "Rinkodaros kampanijos", "Finansinės ataskaitos"], "correct": 0}, {"q": "Koks karkasas apima ir rizikų vertinimo dedamąją bei yra sukurtas ISACA?", "options": ["OCTAVE", "COBIT", "FAIR", "TARA"], "correct": 1}, {"q": "Koks gali būti rizikos valdymo sprendimas, kai riziką galima sumažinti techninėmis ar organizacinėmis priemonėmis?", "options": ["Didinti", "Vengti", "Mažinti", "Ignoruoti"], "correct": 2}, {"q": "Kuri iš pateiktų yra dažnai sutinkama kibernetinė grėsmė?", "options": ["Finansinis planavimas", "Ransomware", "Biuro remontas", "Darbuotojų mokymai"], "correct": 1}, {"q": "Koks gali būti rizikos valdymo sprendimas, kai rizika perduodama kitai šaliai?", "options": ["Didinti", "Vengti", "Perkelti", "Priimti"], "correct": 2}, {"q": "Kur buvo sukurtas OCTAVE rizikos vertinimas?", "options": ["Carnegie Mellon universitete", "Harvardo universitete", "MIT", "Stanfordo universitete"], "correct": 0}, {"q": "Kodėl rizikos vertinimo apimtis turi būti suderinta su verslu?", "options": ["Nes verslas negali būti vertinamas", "Nes IT specialistų vertinimu kritinė sistema ne visada bus kritinė verslui", "Nes rizikos visada yra vienodos", "Nes IT skyrius sprendžia visus verslo klausimus"], "correct": 1}, {"q": "Ką reiškia rizikos vengimas?", "options": ["Padidinti rizikos tikimybę", "Nieko nedaryti su rizika", "Nevykdyti veiklos, dėl kurios kyla nepriimtina rizika, pasirenkant priimtinesnę alternatyvą", "Perduoti riziką kitai šaliai"], "correct": 2}, {"q": "Kuri organizacija nurodoma kaip sukūrusi OCTAVE 2001 m.?", "options": ["COSO", "NIST", "Carnegie Mellon universitetas", "ISACA"], "correct": 2}, {"q": "Ką BIA padeda nustatyti laiko prasme?", "options": ["Kiek laiko procesas gali būti sustojęs ir kokio senumo informaciją galima prarasti", "Kiek laiko darbuotojai turi dirbti", "Kiek laiko trunka auditas", "Kiek laiko galioja sutartis"], "correct": 0}, {"q": "Kas turi būti išskirta vertinamoje apimtyje?", "options": ["Informaciniai resursai, programinė ir aparatinė įranga", "Tik biuro baldai", "Tik klientai", "Tik darbuotojai"], "correct": 0}, {"q": "Kada organizacijai gali reikėti rizikos mažinimo priemonių?", "options": ["Tik tada, kai rizika jau įvyko", "Kai nustatoma, kad organizacija negali toleruoti nustatytos rizikos", "Kai rizika neegzistuoja", "Tik po audito"], "correct": 1}, {"q": "Ką reiškia rizikos mažinimas?", "options": ["Visada nutraukti veiklą", "Perduoti riziką draudikui", "Ignoruoti riziką", "Sumažinti rizikos tikimybę ar pasekmes iki priimtino lygio"], "correct": 3}, {"q": "Koks yra pirmasis BIA žingsnis?", "options": ["Išsiaiškinti svarbiausius dalykus, kurių reikia verslui tęsti", "Išjungti sistemas", "Nustatyti baudą", "Perduoti riziką"], "correct": 0}, {"q": "Ką rizikos vertinimas padeda organizacijai suprasti?", "options": ["Tik konkurentų veiksmus", "Tik darbuotojų darbo laiką", "Galimas grėsmes, pažeidžiamumą ir galimą rizikų poveikį", "Tik IT įrangos kainas"], "correct": 2}, {"q": "Kokia yra 2 reikšmė tikimybės skalėje?", "options": ["Labai tikėtinas", "Mažai tikėtinas", "Retas", "Tikėtinas"], "correct": 1}, {"q": "Nuo ko gali priklausyti rizikos vertinimo apimtis?", "options": ["Tik nuo biuro vietos", "Tik nuo įmonės pavadinimo", "Tik nuo darbuotojų amžiaus", "Nuo to, ar vertinama viena informacinė sistema, ar visa kompanijos IT organizacija"], "correct": 3}, {"q": "Ką reiškia bendras rizikos įvertinimas?", "options": ["Tik draudimo kainos apskaičiavimą", "Vienos rizikos pavadinimo nustatymą", "Bendro organizacijos rizikos profilio įvertinimą atsižvelgiant į kelių rizikų kumuliacinį poveikį", "Tik vieno serverio vertinimą"], "correct": 2}, {"q": "Ką reiškia BIA klausimas „Kaip blogai tai gali būti?“?", "options": ["Įvertinti galimo sutrikimo poveikio dydį", "Nustatyti audito kainą", "Nustatyti darbuotojų skaičių", "Nustatyti rizikos perdavimo kainą"], "correct": 0}, {"q": "Ką reiškia RTO?", "options": ["Rizikos tikimybės balą", "Maksimalų laiką, kurį įmonė gali sau leisti, kad sistema ar paslauga būtų neveikianti", "Rizikos poveikio balą", "Maksimalų duomenų kiekį, kurį galima prarasti"], "correct": 1}, {"q": "Ką reiškia BIA prioritetų nustatymas?", "options": ["Nustatyti reklamos biudžetą", "Nustatyti, kurį serverį parduoti", "Nuspręsti, nuo kurių sutrikimų svarbiausia apsisaugoti", "Nustatyti, kurį darbuotoją paaukštinti"], "correct": 2}, {"q": "Kuo pasižymi kiekybinė rizikos analizė?", "options": ["Ji naudoja duomenis ir skaičiavimus tikimybei bei pasekmėms įvertinti", "Ji naudoja tik subjektyvias nuomones", "Ji nenaudoja jokių duomenų", "Ji vertina tik darbuotojų skaičių"], "correct": 0}, {"q": "Kokia yra 3 reikšmė poveikio skalėje?", "options": ["Didelis", "Nereikšmingas", "Vidutinis", "Nedidelis"], "correct": 2}, {"q": "Ką reikia apsvarstyti BIA metu kaip svarbius verslo išteklius?", "options": ["Tik pinigus", "Tik darbuotojus", "Žinias, logistiką, fizines patalpas, klientus ir žmones", "Tik serverius"], "correct": 2}, {"q": "Kokia yra 5 reikšmė poveikio skalėje?", "options": ["Nedidelis", "Vidutinis", "Didelis", "Ženklus"], "correct": 2}, {"q": "Kuris karkasas apibūdinamas kaip vienas labiausiai paplitusių rizikos vertinimo karkasų?", "options": ["NIST", "COSO", "TARA", "FAIR"], "correct": 0}];let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;const item=quiz[current],box=document.getElementById('quiz');box.innerHTML='<div class="meta">Klausimas '+(current+1)+' iš 10</div><div class="question">'+escapeHtml(item.q)+'</div><div id="options"></div><button id="next" class="next hidden">Kitas klausimas →</button>';const opts=document.getElementById('options');item.options.forEach((t,i)=>{const b=document.createElement('button');b.className='option';b.textContent=t;b.onclick=()=>answer(i);opts.appendChild(b)})}
function answer(i){if(answered)return;answered=true;const item=quiz[current],bs=[...document.querySelectorAll('.option')];bs.forEach(b=>b.disabled=true);if(i===item.correct){bs[i].classList.add('correct');score++}else{bs[i].classList.add('wrong');bs[item.correct].classList.add('correct')}document.getElementById('next').classList.remove('hidden')}
document.addEventListener('click',e=>{if(e.target.id==='next'){current++;current<10?showQuestion():showResult()}});
function showResult(){document.getElementById('quiz').classList.add('hidden');const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<div class="small">6 Tema baigta</div><div class="score">'+score+'/10</div><div>'+(score*10)+'%</div><button class="restart" onclick="pick10()">Bandyti dar kartą</button>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
