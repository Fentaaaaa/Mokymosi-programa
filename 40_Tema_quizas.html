<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic 40 — Perimeter Security</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>Topic 40 — Perimeter Security</h1><div class="subtitle">Network perimeter, firewall zones, modern firewalls and OPNsense</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 40 temos tema?", "a": ["Perimetro apsaugos sprendimo diegimas organizacijoje", "Linux grūdinimas", "SIEM sistemos diegimas", "DNS konfigūravimas"], "c": 0}, {"q": "Kokia paskaitos trukmė?", "a": ["6 valandos", "8 valandos", "4 valandos", "2 valandos"], "c": 2}, {"q": "Koks paskaitos formatas?", "a": ["Tik savarankiškas darbas", "Teorija + praktika", "Tik teorija", "Tik egzaminas"], "c": 1}, {"q": "Kuri tema nagrinėjama paskaitoje?", "a": ["Tik el. paštas", "Tik DNS", "Šiuolaikinės organizacijos tinklo perimetras", "Tik kriptografija"], "c": 2}, {"q": "Kuri klasikinė priemonė nagrinėjama?", "a": ["Tik SIEM", "Klasikinės perimetro apsaugos priemonės", "Tik EDR", "Tik DLP"], "c": 1}, {"q": "Kokia konkreti tinklo saugumo priemonė konfigūruojama?", "a": ["DHCP serveris", "SMTP serveris", "DNS serveris", "Tinklo ugniasienė"], "c": 3}, {"q": "Kas įeina į tipinį organizacijos tinklo perimetrą?", "a": ["Tik biuro kompiuteriai", "Tik vieša svetainė", "Visos informacinės sistemos, naudojamos vidiniame tinkle ir pasiekiamos iš viešojo interneto", "Tik duomenų centras"], "c": 2}, {"q": "Ką apima klasikinės infrastruktūros tinklo perimetras?", "a": ["Tik viešą debesiją", "Tik VPN klientus", "Tik darbuotojų telefonus", "Įmonės biurų infrastruktūrą, duomenų centrus ir sąsajas tarp jų"], "c": 3}, {"q": "Kuris elementas priskiriamas šiuolaikiniam organizacijos tinklo perimetrui?", "a": ["Tik el. pašto serveris", "Tik vienas biuro LAN", "Vidiniai visų biurų tinklai", "Tik spausdintuvai"], "c": 2}, {"q": "Ar darbuotojų namų tinklai gali būti organizacijos tinklo perimetro dalis?", "a": ["Taip", "Tik jei naudojamas IPv6", "Tik savaitgaliais", "Ne"], "c": 0}, {"q": "Ar duomenų centrai įeina į šiuolaikinį tinklo perimetrą?", "a": ["Tik mažos organizacijos", "Taip", "Tik vieši duomenų centrai", "Ne"], "c": 1}, {"q": "Ar viešosios debesijos infrastruktūra gali būti organizacijos tinklo perimetro dalis?", "a": ["Taip", "Tik be ugniasienės", "Ne", "Tik be VPN"], "c": 0}, {"q": "Kodėl šiuolaikinės organizacijos tinklo perimetras yra platesnis nei klasikinis?", "a": ["Nes naudojamas tik vienas tinklas", "Nes visi darbuotojai dirba biure", "Nes nebeliko ugniasienių", "Jis apima daugiau skirtingų aplinkų, įskaitant biurų tinklus, namų tinklus, duomenų centrus ir debesiją"], "c": 3}, {"q": "Kokia yra tinklo perimetro apsaugos esmė?", "a": ["Apsaugoti visus organizacijos perimetro elementus kompleksiniu sprendimu", "Apsaugoti tik vieną serverį", "Tik šifruoti diskus", "Tik blokuoti el. paštą"], "c": 0}, {"q": "Ar tinklo perimetro apsauga yra vienas sprendimas?", "a": ["Taip, tik IDS", "Taip, tik VPN", "Taip, visada vienas įrenginys", "Ne, ji yra kompleksinė ir sudaryta iš kelių skirtingų sprendimų"], "c": 3}, {"q": "Kokia klasikinė perimetro priemonė yra pagrindinis šios paskaitos dėmesio objektas?", "a": ["SIEM", "Antivirusinė", "DLP", "Perimetro ugniasienė"], "c": 3}, {"q": "Kaip apibūdinama perimetro ugniasienė?", "a": ["Ji skirta tik DNS", "Ji būtina, tačiau nėra vienintelė perimetro apsaugos priemonė", "Ji pakeičia visas kitas saugumo sistemas", "Ji yra vienintelė galima saugumo priemonė"], "c": 1}, {"q": "Kuo remiasi klasikinis tinklo modelis?", "a": ["Tik debesija", "Tik VPN", "Vienu bendru tinklu", "Skirtingo pasitikėjimo lygio zonomis"], "c": 3}, {"q": "Ką reiškia buvimas saugioje zonoje klasikiniame modelyje?", "a": ["Kad visi srautai blokuojami", "Galimybę be papildomų validacijų prieiti prie informacijos", "Kad reikia VPN", "Kad vartotojas neturi prieigos"], "c": 1}, {"q": "Kas naudojama duomenų srautams tarp tinklo zonų valdyti?", "a": ["Tik komutatorius", "Tik DNS serveris", "Bent viena ugniasienė", "Tik DHCP serveris"], "c": 2}, {"q": "Ar kartais diegiamas daugiau nei vienas ugniasienės sluoksnis?", "a": ["Ne", "Taip", "Tik namų tinkluose", "Tik debesijoje"], "c": 1}, {"q": "Ką gali daryti šiuolaikinės ugniasienės be įprastų transportinio lygmens taisyklių?", "a": ["Atlikti IPS/IDS funkcijas ir kitas saugumo funkcijas", "Tik priskirti IP adresus", "Tik valdyti DNS", "Tik keisti MAC adresus"], "c": 0}, {"q": "Kokią funkciją gali atlikti šiuolaikinė ugniasienė su šifruotu interneto srautu?", "a": ["Tik pakeisti DNS", "Skanuoti jį nuo kenkėjiškų programų", "Tik perduoti jį be analizės", "Tik priskirti DHCP adresą"], "c": 1}, {"q": "Ar ugniasienė gali blokuoti nepageidaujamus tinklapius?", "a": ["Tik su DHCP", "Tik su STP", "Taip", "Ne"], "c": 2}, {"q": "Ar šiuolaikinė ugniasienė gali terminuoti VPN sesijas?", "a": ["Taip", "Tik DNS serveris", "Tik komutatorius", "Ne"], "c": 0}, {"q": "Kuri funkcija minima kaip šiuolaikinės ugniasienės galimybė?", "a": ["Tik DHCP", "IDS ir IPS", "Tik SMTP", "Tik DNS"], "c": 1}, {"q": "Kuri įmonė minima tarp ugniasienių gamintojų?", "a": ["Google Drive", "Cisco", "Microsoft Word", "GitHub"], "c": 1}, {"q": "Kuri kita ugniasienių gamintoja minima?", "a": ["Mozilla", "Fortinet", "VMware", "Canonical"], "c": 1}, {"q": "Kuri kita ugniasienių gamintoja minima?", "a": ["Oracle", "Palo Alto", "Red Hat", "Ubuntu"], "c": 1}, {"q": "Kuri kita ugniasienių gamintoja minima?", "a": ["OpenAI", "WordPress", "Apache", "Checkpoint"], "c": 3}, {"q": "Kuri kita ugniasienių gamintoja minima?", "a": ["Cloudflare", "Linux Foundation", "Sophos", "Cisco Meraki"], "c": 2}, {"q": "Kokios formos gali būti ugniasienės?", "a": ["Fiziniai įrenginiai arba virtualizuoti sprendimai", "Tik virtualios mašinos", "Tik fiziniai įrenginiai", "Tik debesijos paslaugos"], "c": 0}, {"q": "Kokia ugniasienė konfigūruojama praktikoje?", "a": ["OPNsense", "Windows Firewall", "Palo Alto PAN-OS", "iptables"], "c": 0}, {"q": "Koks pirmas praktinės ugniasienės konfigūracijos darbas?", "a": ["Ugniasienės vardo ir root slaptažodžio konfigūracija", "DNS zonos sukūrimas", "DHCP klientų trynimas", "VPN tiekėjo pasirinkimas"], "c": 0}, {"q": "Kokia paskyra minima pirmame konfigūracijos etape?", "a": ["guest", "anonymous", "operator", "root"], "c": 3}, {"q": "Kas dar konfigūruojama vartotojų valdymo dalyje?", "a": ["DHCP leases", "VLAN pavadinimai", "Ugniasienės vartotojai", "DNS MX įrašai"], "c": 2}, {"q": "Koks SSH apribojimas praktikoje konfigūruojamas?", "a": ["SSH išjungimas visiems", "Apribojimas jungtis prie ugniasienės iš namų adreso SSH protokolu", "DNS per SSH", "Leidimas jungtis iš bet kur"], "c": 1}, {"q": "Kokia autentifikacijos saugumo priemonė konfigūruojama prisijungimui prie ugniasienės?", "a": ["STP", "MFA", "SPF", "DKIM"], "c": 1}, {"q": "Su kokia katalogų paslauga integruojama ugniasienė?", "a": ["LDAP tik", "Active Directory", "GitHub", "DNSSEC"], "c": 1}, {"q": "Koks sertifikatas diegiamas praktikoje?", "a": ["SPF sertifikatas", "Let's Encrypt sertifikatas", "Self-signed sertifikatas tik", "DKIM sertifikatas"], "c": 1}, {"q": "Kokia papildoma TLS funkcija konfigūruojama?", "a": ["TLS išjungimas", "Tik SMTP TLS", "Tik DNS TLS", "TLS tinklo srauto skanavimas"], "c": 3}, {"q": "Kokia ugniasienė naudojama laboratoriniame darbe?", "a": ["OPNsense atviro kodo ugniasienė", "Windows Server", "pfSense", "Cisco ASA"], "c": 0}, {"q": "Kuri ugniasienės funkcija padeda aptikti įsilaužimus?", "a": ["IDS", "DNS", "DHCP", "NAT"], "c": 0}, {"q": "Kuri ugniasienės funkcija gali aktyviai blokuoti aptiktą grėsmę?", "a": ["DHCP", "IPS", "DNS", "MX"], "c": 1}, {"q": "Kodėl ugniasienė gali būti laikoma tik viena iš perimetro apsaugos priemonių?", "a": ["Ugniasienė negali filtruoti srauto", "Ugniasienė neveikia tinkle", "Šiuolaikinio perimetro apsaugai reikia kelių skirtingų sprendimų", "Ugniasienė skirta tik DNS"], "c": 2}, {"q": "Kokia yra pagrindinė zonų ir ugniasienių paskirtis?", "a": ["Valdyti tik el. paštą", "Valdyti duomenų srautus tarp skirtingo pasitikėjimo zonų", "Priskirti domenų vardus", "Kurti vartotojų paskyras"], "c": 1}, {"q": "Kuri aplinka paminėta kaip modernios organizacijos perimetro dalis?", "a": ["Tik biuro LAN", "Viešoji debesijos infrastruktūra", "Tik serverių spinta", "Tik darbuotojų telefonai"], "c": 1}, {"q": "Kuris teiginys apie šiuolaikinį perimetrą teisingas?", "a": ["Jis apima daugiau nei vien biurų ir duomenų centro infrastruktūrą", "Jis apsiriboja VPN", "Jis apsiriboja internetu", "Jis apsiriboja biuru"], "c": 0}, {"q": "Kuris teiginys apie perimetro ugniasienę teisingas?", "a": ["Ji nereikalinga", "Ji yra būtina, tačiau ne vienintelė perimetro apsaugos priemonė", "Ji pakeičia visas kitas saugumo priemones", "Ji skirta tik DHCP"], "c": 1}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
