<style>

, "a": ["Failo dydį ir formatą", "IP ir MAC adresą visada", "Laiko žymą ir informacinį pranešimą", "Vartotojo vardą ir slaptažodį"], "c": 2}, {"q": "Kuo dažnai papildomas žurnalinis įrašas?", "a": ["Vartotojo nuotrauka", "Failo hash reikšme", "TLS sertifikatu", "Įvykio svarbos žyma"], "c": 3}, {"q": "Koks įrankis naudojamas Windows žurnalinių įrašų peržiūrai?", "a": ["PowerShell ISE", "Task Manager", "Event Viewer", "Device Manager"], "c": 2}, {"q": "Kuris yra Windows žurnalinių įrašų tipas?", "a": ["Kernel", "Application", "Firewall", "Network"], "c": 1}, {"q": "Kuris dar yra Windows žurnalinių įrašų tipas?", "a": ["Security", "DNS", "Router", "Storage"], "c": 0}, {"q": "Kuris dar yra Windows žurnalinių įrašų tipas?", "a": ["Apache", "Setup", "SSH", "Kernel"], "c": 1}, {"q": "Kuris dar yra Windows žurnalinių įrašų tipas?", "a": ["SCP", "NFS", "APT", "System"], "c": 3}, {"q": "Kuris kritiškumo lygis nurodytas Windows žurnaluose?", "a": ["Verbose", "Debug", "Critical", "Trace"], "c": 2}, {"q": "Kuris kritiškumo lygis nurodytas Windows žurnaluose?", "a": ["Notice", "Error", "Audit", "Trace"], "c": 1}, {"q": "Kuris kritiškumo lygis nurodytas Windows žurnaluose?", "a": ["Warning", "Normal", "Debug", "Trace"], "c": 0}, {"q": "Kuris kritiškumo lygis nurodytas Windows žurnaluose?", "a": ["Audit", "Verbose", "Information", "Notice"], "c": 2}, {"q": "Kuriame kataloge Linux saugo žurnalinius įrašus?", "a": ["/home/log", "/var/log", "/etc/log", "/usr/logs"], "c": 1}, {"q": "Kaip Linux žurnalinius failus galima peržiūrėti?", "a": ["Tik Event Viewer", "Tik naršykle", "Tik BIOS", "Tekstiniu redaktoriumi arba teksto manipuliavimo komanda, pvz., tail"], "c": 3}, {"q": "Kokia komanda gali būti naudojama Linux branduolio įrašų analizei?", "a": ["kernview", "dmesg", "systemlog", "grepfs"], "c": 1}, {"q": "Koks servisas atsakingas už žurnalinių įrašų saugojimą?", "a": ["cron", "syslog", "systemd-network", "sshd"], "c": 1}, {"q": "Kuris yra tipinis Linux žurnalinis failas?", "a": ["/var/log/eventviewer", "/etc/syslog.log", "/var/log/syslog", "/home/syslog"], "c": 2}, {"q": "Kuris yra tipinis Linux žurnalinis failas?", "a": ["/var/log/messages", "/etc/messages", "/usr/messages", "/home/messages"], "c": 0}, {"q": "Kuris failas susijęs su autentifikacijos žurnalais?", "a": ["/var/log/auth.log", "/home/auth.log", "/var/log/login.txt", "/etc/auth"], "c": 0}, {"q": "Kuris failas susijęs su branduolio žurnalais?", "a": ["/var/log/kern.log", "/etc/kern", "/home/kern", "/var/log/kernel.txt"], "c": 0}, {"q": "Kodėl žurnalų saugojimas tik atskiruose kompiuteriuose ir serveriuose nėra optimalus?", "a": ["Nes jų negalima skaityti", "Nes jie visada užšifruoti", "Įrašai gali būti modifikuojami", "Nes jie neturi laiko žymų"], "c": 2}, {"q": "Kokia kita problema kyla analizuojant atskiruose sistemose saugomus žurnalus?", "a": ["Negalima kurti vartotojų", "Sunku koreliuoti įvykius iš skirtingų sistemų", "Negalima naudoti HTTPS", "Negalima paleisti OS"], "c": 1}, {"q": "Kokia dar problema susijusi su atskirų sistemų žurnalais?", "a": ["Jie visada užima 0 vietos", "Jie automatiškai ištrinami", "Jie gali užimti nemažai vietos greituose serverių kaupikliuose", "Jie negali būti archyvuojami"], "c": 2}, {"q": "Koks sprendimas įprastai pasitelkiamas dėl šių problemų?", "a": ["Centralizuotos žurnalinių įrašų konfigūravimo sistemos", "Tik Incognito režimas", "Tik VPN", "Tik antivirusinė"], "c": 0}, {"q": "Iš ko sudarytos centralizuotos žurnalinių įrašų sistemos?", "a": ["Tik Windows Event Viewer", "Tik viena duomenų bazė", "Žurnalų saugojimo ir paieškos sistema bei agentai žurnalams persiųsti", "Tik tekstinis redaktorius"], "c": 2}, {"q": "Ką agentai centralizuotoje sistemoje daro?", "a": ["Persiunčia žurnalinius įrašus iš pavienių mazgų", "Kuria vartotojų paskyras", "Šifruoja visą internetą", "Valdo DNS"], "c": 0}, {"q": "Kuris yra centralizuotos žurnalų sistemos pavyzdys?", "a": ["Kerberos", "BitLocker", "Graylog", "PuTTY"], "c": 2}, {"q": "Kuris yra centralizuotos žurnalų sistemos pavyzdys?", "a": ["VNC", "Splunk", "OpenVPN", "NFS"], "c": 1}, {"q": "Kuris yra centralizuotos žurnalų sistemos pavyzdys?", "a": ["Apache2", "SCP", "Elastic", "SSH"], "c": 2}, {"q": "Kuris yra centralizuotos žurnalų sistemos pavyzdys?", "a": ["UFW", "LVM", "Cron", "Azure Log Analytics"], "c": 3}, {"q": "Nuo ko priklauso žurnalinių įrašų saugojimo laikas?", "a": ["Tik disko dydžio", "Tik operacinės sistemos", "Tik vartotojų skaičiaus", "Organizacijos reikalavimų ir atitikties standartų"], "c": 3}, {"q": "Kiek kai kuriose industrijose gali siekti žurnalų saugojimo laikas?", "a": ["Iki 10 metų", "Iki 10 dienų", "Iki 1 mėnesio", "Iki 10 valandų"], "c": 0}, {"q": "Koks svarbus reikalavimas taikomas prieigai prie žurnalų?", "a": ["Tik administratoriaus slaptažodžio dalijimasis", "Griežtas prieigos teisių valdymas", "Vieša prieiga visiems", "Anoniminė prieiga"], "c": 1}, {"q": "Koks dar reikalavimas taikomas žurnalams?", "a": ["Galimybė juos laisvai redaguoti", "Automatinis jų trynimas", "Negalėjimas jų modifikuoti", "Tik rankinis kopijavimas"], "c": 2}, {"q": "Kokie žurnalai dažniausiai aktualūs analizei?", "a": ["Tik archyviniai žurnalai", "Pakankamai nauji žurnalai, iki vieno ar kelių mėnesių amžiaus", "Tik 10 metų senumo žurnalai", "Tik vienos dienos žurnalai"], "c": 1}, {"q": "Kas gali būti daroma su senesniais žurnalais?", "a": ["Jie visada ištrinami", "Jie privalo būti redaguojami", "Jie gali būti archyvuojami", "Jie perkeliami į DNS"], "c": 2}, {"q": "Kur gali būti saugomi archyvuoti žurnalai?", "a": ["Tik Event Viewer", "Ten, kur įprasti analitiniai įrankiai neveikia", "Tik RAM", "Tik naršyklėje"], "c": 1}, {"q": "Kas yra Log Analytics Workspace?", "a": ["VPN protokolas", "Windows įrankis", "Azure teikiama žurnalinių įrašų saugojimo paslauga", "Linux failų sistema"], "c": 2}, {"q": "Ką galima saugoti Log Analytics Workspace?", "a": ["Tik vartotojų slaptažodžius", "Tik DNS užklausas", "Didelius žurnalinių įrašų kiekius iš OS ir kitų Azure paslaugų", "Tik function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}

function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
