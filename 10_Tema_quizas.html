<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>10 Tema – Koordinuotas pažeidžiamumų atskleidimas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#4f46e5}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#818cf8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:25px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}
button{font:inherit}#themeBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.progress{color:var(--muted);font-size:14px;margin-bottom:12px}.question{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:20px}
.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.answer.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.answer.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444}body.dark .answer.correct{background:#14532d;color:#dcfce7}
body.dark .answer.wrong{background:#7f1d1d;color:#fee2e2}.next{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;cursor:pointer;font-weight:700;font-size:16px}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:46px;font-weight:800;margin:10px 0}
.small{color:var(--muted)}.hidden{display:none}.restart{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
</style></head>
<body><div class="container">
<div class="top"><div><h1>10 Tema – Koordinuotas pažeidžiamumų atskleidimas</h1><div class="subtitle">10 random questions per attempt</div></div>
<button id="themeBtn">🌙 Dark mode</button></div>
<div id="quiz" class="card"><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="answers" id="answers"></div>
<button class="next" id="next" disabled>Kitas klausimas →</button></div>
<div id="result" class="card result hidden"><h2>Quiz baigtas!</h2><div class="score" id="score"></div><div class="small" id="percent"></div>
<button class="restart" onclick="startQuiz()">Bandyti dar kartą</button></div></div>
<script>
const bank=[{"q": "Kas yra koordinuotas pažeidžiamumų atskleidimas (CVD)?", "a": ["Tiekėjų sutarčių valdymo procesas", "Bendradarbiavimo procesas, skirtas atsakingai spręsti saugumo pažeidžiamumus", "Procesas, skirtas tik programinei įrangai testuoti", "Tik vidinis incidentų registravimo procesas"], "c": 1}, {"q": "Kas gali dalyvauti CVD procese?", "a": ["Tik klientai", "Pažeidžiamumų atradėjas, paveikta organizacija, tiekėjai ir institucijos", "Tik IT administratoriai", "Tik organizacijos vadovas"], "c": 1}, {"q": "Kokį CVD aspektą ypatingai pabrėžia NIS2 direktyva?", "a": ["Produktų kainodarą", "Darbuotojų atranką", "Koordinuotą pažeidžiamumų atskleidimą", "Rinkodaros komunikaciją"], "c": 2}, {"q": "Koks yra vienas NIS2 reikalavimų pažeidžiamumų valdymui?", "a": ["Priimti pranešimus tik telefonu", "Pažeidžiamumus spręsti tik po viešo paskelbimo", "Neskelbti jokių kontaktų", "Sukurti politiką pažeidžiamumų pranešimams priimti ir valdyti"], "c": 3}, {"q": "Su kuo organizacija turi koordinuoti pažeidžiamumų valdymą?", "a": ["Tik tiekėjų pardavimų skyriumi", "Tik rinkodaros komanda", "CSIRT ir suinteresuotaisiais asmenimis", "Tik klientais"], "c": 2}, {"q": "Koks yra vienas pagrindinių CVD tikslų?", "a": ["Sustabdyti saugumo testavimą", "Sumažinti riziką pašalinant pažeidžiamumus prieš jiems tampant grėsmėmis", "Panaikinti visus tiekėjus", "Padidinti viešai skelbiamų pažeidžiamumų skaičių"], "c": 1}, {"q": "Kaip CVD prisideda prie saugumo gerinimo?", "a": ["Sumažina komunikaciją su tyrėjais", "Stiprina bendrą saugumo būklę", "Panaikina poreikį atnaujinti sistemas", "Pakeičia incidentų valdymą"], "c": 1}, {"q": "Koks dar CVD tikslas nurodomas medžiagoje?", "a": ["Rinkodaros išlaidų mažinimas", "Darbuotojų skaičiaus mažinimas", "NIS2 reguliavimo reikalavimų laikymasis", "Tiekėjų pakeitimas"], "c": 2}, {"q": "Kodėl aiškūs pažeidžiamumų valdymo procesai yra svarbūs?", "a": ["Jie pakeičia atsargines kopijas", "Jie pašalina visas kibernetines grėsmes", "Jie leidžia ignoruoti tyrėjų pranešimus", "Jie padeda sumažinti galimos žalos riziką"], "c": 3}, {"q": "Nuo ko CVD gali apsaugoti organizaciją ir jos klientus?", "a": ["Nuo darbuotojų atostogų", "Nuo rinkodaros klaidų", "Nuo tiekėjų kainų pokyčių", "Nuo galimų duomenų nutekėjimų"], "c": 3}, {"q": "Koks yra vienas būdas sukurti pažeidžiamumų pranešimų kanalą?", "a": ["Nustatyti kontaktinį tašką, pvz., security@imone.com", "Naudoti tik bendrą įmonės reklamų el. paštą", "Nenaudoti jokio kontaktinio taško", "Priimti pranešimus tik žodžiu"], "c": 0}, {"q": "Kam gali būti naudojamas security.txt failas?", "a": ["Rinkodaros informacijai", "Tiekėjų kainoms", "Pažeidžiamumų pranešimo kontaktinei informacijai ir proceso viešinimui", "Darbuotojų atlyginimams"], "c": 2}, {"q": "Kur dar galima viešinti pažeidžiamumų atskleidimo procesą?", "a": ["Tik vidiniame darbuotojų kalendoriuje", "Specialiame saugumo puslapyje", "Tik finansinėje ataskaitoje", "Tik socialinių tinklų reklamoje"], "c": 1}, {"q": "Ką reiškia VDP?", "a": ["Viešųjų duomenų protokolas", "Pažeidžiamumų atskleidimo politika", "Verslo duomenų planas", "Vidinės dokumentacijos procesas"], "c": 1}, {"q": "Ką VDP turi nurodyti apie sistemas?", "a": ["Sistemas ir paslaugas, kurioms ji taikoma", "Tik klientų skaičių", "Tik darbuotojų kompiuterių modelius", "Tik tiekėjų pavadinimus"], "c": 0}, {"q": "Ką VDP turėtų pateikti tyrėjams?", "a": ["Gaires, kaip pateikti informaciją apie pažeidžiamumą", "Tik organizacijos istoriją", "Tik produktų kainas", "Tik finansinius duomenis"], "c": 0}, {"q": "Ką reiškia teisinis saugumo užtikrinimas VDP kontekste?", "a": ["Visi tyrėjai turi būti organizacijos darbuotojai", "Pažeidžiamumų negalima pranešti", "Geros valios pastangos pranešti apie pažeidžiamumus neturėtų būti teisiškai persekiojamos", "Tyrėjai turi mokėti už pranešimus"], "c": 2}, {"q": "Koks svarbus reikalavimas taikomas VDP prieinamumui?", "a": ["VDP turi būti prieinama tik tiekėjams", "VDP turi būti slapta", "VDP turi būti lengvai randama ir suprantama", "VDP turi būti prieinama tik vadovui"], "c": 2}, {"q": "Kuo svarbūs pranešimų kanalai?", "a": ["Jie naudojami tik po incidento", "Tyrėjai turi žinoti, kur ir kaip pranešti apie pažeidžiamumus", "Jie pakeičia CSIRT", "Jie skirti tik rinkodarai"], "c": 1}, {"q": "Kaip turėtų būti prižiūrimi pažeidžiamumų pranešimų kanalai?", "a": ["Tikrinami kartą per kelerius metus", "Reguliariai stebimi, kad būtų užtikrintas savalaikis atsakas", "Stebimi tik po viešo pažeidžiamumo paskelbimo", "Visai nestebimi"], "c": 1}, {"q": "Ką padeda nustatyti VDP elementai?", "a": ["Darbuotojų atlyginimus", "Klientų pirkimo įpročius", "Lūkesčius tiek organizacijai, tiek tyrėjui", "Tiekėjų kainas"], "c": 2}, {"q": "Kas sudaro vidinio koordinavimo dalį?", "a": ["Tik pardavimų komanda", "Incidentų reagavimo komanda", "Tik tiekėjas", "Tik viešųjų ryšių komanda"], "c": 1}, {"q": "Ką incidentų reagavimo komanda daro CVD procese?", "a": ["Tvarko pažeidžiamumų pranešimus", "Atlieka darbuotojų atranką", "Valdo rinkodaros kampanijas", "Sudaro tiekėjų kainoraščius"], "c": 0}, {"q": "Ką reikia įvertinti gavus pranešimą apie pažeidžiamumą?", "a": ["Tik pranešėjo pareigas", "Tik tiekėjo pavadinimą", "Jo rimtumą ir poveikį", "Tik pranešimo ilgį"], "c": 2}, {"q": "Kodėl pažeidžiamumai prioritetizuojami?", "a": ["Kad būtų galima atidėti visus taisymus", "Kad būtų sumažintas tyrėjų skaičius", "Kad visi pranešimai būtų ignoruojami", "Kad ištekliai būtų paskirstyti efektyviai"], "c": 3}, {"q": "Ką apima pažeidžiamumų šalinimo planavimas?", "a": ["Tik finansinį planavimą", "Tik komunikaciją su žiniasklaida", "Tik darbuotojų mokymus", "Šalinimo strategijų ir terminų parengimą"], "c": 3}, {"q": "Koks yra vienas išorinio koordinavimo veiksmas?", "a": ["Biuro perkėlimas", "Komunikacija su pranešėju", "Darbuotojų atlyginimų peržiūra", "Rinkodaros plano keitimas"], "c": 1}, {"q": "Ką reikia daryti bendraujant su pažeidžiamumo pranešėju?", "a": ["Nutraukti komunikaciją", "Ignoruoti jo pranešimus", "Patvirtinti ir atnaujinti informaciją", "Paskelbti visą informaciją viešai iš karto"], "c": 2}, {"q": "Kada bendradarbiaujama su CSIRT?", "a": ["Tik kai reikia pakeisti tiekėją", "Kai reikia informuoti apie platesnes pažeidžiamumo pasekmes", "Tik kuriant VDP", "Tik rinkodaros kampanijos metu"], "c": 1}, {"q": "Kada gali būti reikalingas koordinavimas su tiekėjais?", "a": ["Tik keičiant darbuotojų atlyginimus", "Tik kuriant naują produktą", "Kai pažeidžiamumas susijęs su trečiosiomis šalimis", "Tik po viešo pranešimo"], "c": 2}, {"q": "Ką parodė Įmonės B pavyzdys?", "a": ["Tiekėjai neturi būti įtraukiami", "Bendradarbiavimas su tiekėju gali padėti sukurti pažeidžiamumo pataisą", "VDP nereikalinga", "Tyrėjams nereikia teikti informacijos"], "c": 1}, {"q": "Kodėl svarbus greitas pažeidžiamumo įvertinimas?", "a": ["Kad būtų galima atidėti taisymą", "Kad būtų išvengta komunikacijos", "Kad pažeidžiamumai būtų sprendžiami laiku", "Kad būtų galima panaikinti VDP"], "c": 2}, {"q": "Kuo naudinga skaidri komunikacija su tyrėjais?", "a": ["Ji pakeičia CSIRT", "Ji leidžia nevykdyti taisymų", "Ji kuria pasitikėjimą", "Ji panaikina visus pažeidžiamumus"], "c": 2}, {"q": "Kuo gali būti naudingas bendradarbiavimas?", "a": ["Jis visada panaikina riziką", "Jis gali paspartinti pažeidžiamumų pašalinimo procesą", "Jis panaikina poreikį vertinti poveikį", "Jis pakeičia VDP"], "c": 1}, {"q": "Kas yra atsakingas atskleidimas?", "a": ["Koordinuotas pažeidžiamumo komunikavimas, suderinant atskleidimo laiką ir saugumą", "Tik vidinis pranešimas vadovui", "Pažeidžiamumo paskelbimas iš karto be pataisos", "Pažeidžiamumo slėpimas neribotą laiką"], "c": 0}, {"q": "Koks terminas pateikiamas kaip atsakingo atskleidimo pavyzdys?", "a": ["24 valandos", "72 valandos", "90 dienų", "365 dienos"], "c": 2}, {"q": "Kodėl pažeidžiamumo detalės gali būti laikomos privačiai iki pataisos parengimo?", "a": ["Kad būtų išvengta VDP", "Kad tyrėjas negalėtų padėti", "Kad nereikėtų taisyti pažeidžiamumo", "Kad būtų sumažinta rizika, jog pažeidžiamumas bus išnaudotas"], "c": 3}, {"q": "Ką reikia parengti prieš viešą pažeidžiamumo komunikaciją?", "a": ["Tik finansinę ataskaitą", "Tik darbuotojų grafiką", "Tik tiekėjo sutartį", "Viešuosius patarimus ir atnaujinimus"], "c": 3}, {"q": "Ką reikia informuoti apie pažeidžiamumą ir būtinus veiksmus?", "a": ["Tik tiekėjo pardavimų skyrių", "Paveiktus klientus", "Tik darbuotojus", "Tik rinkodaros komandą"], "c": 1}, {"q": "Kas gali būti įspėjami apie pažeidžiamumą tiekimo grandinėje?", "a": ["Tik tyrėjas", "Tik klientai", "Tik organizacijos vadovas", "Paveikti partneriai"], "c": 3}, {"q": "Kada reikia pranešti reguliavimo institucijoms?", "a": ["Kai tai privaloma dėl reikšmingų klausimų", "Tik jei to paprašo klientas", "Niekada", "Tik po metų"], "c": 0}, {"q": "Ką parodė Įmonės C pavyzdys?", "a": ["Pataisa buvo parengta kartu su tyrėju, tada išleistas saugumo patarimas ir pateiktos atnaujinimo instrukcijos", "Pažeidžiamumas buvo paskelbtas be pataisos", "Tyrėjas buvo pašalintas iš proceso", "Klientai nebuvo informuoti"], "c": 0}, {"q": "Koks yra pagrindinis atskleidimo strategijos principas?", "a": ["Visada slėpti informaciją", "Visada atskleisti informaciją kuo anksčiau", "Suderinti skaidrumo poreikį su saugumo svarba", "Informuoti tik darbuotojus"], "c": 2}, {"q": "Kodėl ankstyvas atskleidimas be pataisos gali būti rizikingas?", "a": ["Jis gali padidinti riziką", "Jis visada panaikina grėsmę", "Jis pagreitina visų sistemų atkūrimą", "Jis pakeičia VDP"], "c": 0}, {"q": "Kaip aiškios instrukcijos padeda klientams?", "a": ["Jos panaikina VDP", "Jos pašalina pažeidžiamumą automatiškai", "Jos padeda klientams apsisaugoti", "Jos pakeičia CSIRT"], "c": 2}, {"q": "Kokia reguliavimo pranešimų nauda?", "a": ["Jie užtikrina atitiktį ir palaikymą", "Jie panaikina tyrėjų vaidmenį", "Jie skirti tik rinkodarai", "Jie pakeičia pataisų kūrimą"], "c": 0}, {"q": "Ką reikia atlikti po incidento siekiant nuolat tobulinti procesą?", "a": ["Ignoruoti incidentą", "Ištrinti VDP", "Panaikinti pranešimų kanalus", "Atlikti incidento analizę ir nustatyti priežastis"], "c": 3}, {"q": "Kaip gali būti atnaujinama VDP?", "a": ["Tik kas dešimt metų", "Ji niekada neatnaujinama", "Pagal incidentų metu išmoktas pamokas ir poreikius", "Tik gavus tiekėjo prašymą"], "c": 2}, {"q": "Ką parodė Įmonės E pavyzdys?", "a": ["Ji aptiko IoT įrenginio pažeidžiamumą, bendradarbiavo su CSIRT ir išleido programinės įrangos atnaujinimą", "Ji paskelbė pažeidžiamumą be sprendimo", "Ji panaikino VDP", "Ji ignoravo pažeidžiamumą"], "c": 0}, {"q": "Ką parodė Įmonės F pavyzdys?", "a": ["Bendras atskleidimas gali pagerinti kelių pramonės šakų saugumą", "CSIRT nereikia įtraukti", "Kelių sektorių pažeidžiamumai neturi būti koordinuojami", "Tiekėjų nereikia informuoti"], "c": 0}, {"q": "Kodėl kiekvienas incidentas svarbus nuolatiniam tobulinimui?", "a": ["Jis pakeičia visus saugumo procesus", "Jis panaikina poreikį atnaujinti politiką", "Jis leidžia atsisakyti VDP", "Jis suteikia pamokų, padedančių stiprinti gynybą"], "c": 3}, {"q": "Kodėl reikia reguliariai peržiūrėti pažeidžiamumų politiką?", "a": ["Kad ji taptų ilgesnė", "Kad būtų galima pašalinti kontaktinius kanalus", "Kad ji išliktų veiksminga ir aktuali", "Kad jos nereikėtų viešinti"], "c": 2}, {"q": "Koks bendradarbiavimo aspektas pabrėžiamas realiuose pavyzdžiuose?", "a": ["Tik bendradarbiavimas su klientais", "Bendradarbiavimas su tyrėjais, CSIRT ir kitais suinteresuotaisiais asmenimis", "Tik bendradarbiavimas su vadovybe", "Tik bendradarbiavimas su rinkodaros komanda"], "c": 1}, {"q": "Koks yra vienas svarbiausių CVD rezultatų?", "a": ["Viešas visų pažeidžiamumų paskelbimas", "Pažeidžiamumų sprendimas prieš jiems tampant grėsmėmis", "Komunikacijos kanalų panaikinimas", "Tyrėjų skaičiaus mažinimas"], "c": 1}, {"q": "Ką organizacija turėtų sukurti arba atnaujinti pagal pateiktus veiksmus?", "a": ["Tik darbuotojų atostogų planą", "Pažeidžiamumų atskleidimo politiką (VDP)", "Tik tiekėjų katalogą", "Tik rinkodaros planą"], "c": 1}, {"q": "Ką reikia nustatyti, kad tyrėjai galėtų lengvai pranešti apie pažeidžiamumus?", "a": ["Tik socialinių tinklų paskyrą", "Tik bendrą telefono numerį be instrukcijų", "Tik vidinį darbuotojų portalą", "Aiškius pranešimų kanalus"], "c": 3}, {"q": "Ką reikia mokyti incidentų reagavimo komandą daryti?", "a": ["Valdyti darbuotojų atlyginimus", "Tvarkyti pažeidžiamumų pranešimus", "Kurti rinkodaros kampanijas", "Sudaryti tiekėjų kainoraščius"], "c": 1}, {"q": "Koks yra VDP prieinamumo principas?", "a": ["Ji turi būti prieinama tik saugumo vadovui", "Ji turi būti paslėpta", "Ji turi būti prieinama tik reguliuotojams", "Ji turi būti lengvai randama ir suprantama"], "c": 3}, {"q": "Koks yra CVD ir skaidrumo ryšys?", "a": ["Aiški ir koordinuota komunikacija padeda užtikrinti skaidrumą ir atsakomybę", "CVD panaikina komunikacijos poreikį", "CVD skirtas tik techniniam testavimui", "CVD reikalauja slėpti visą informaciją"], "c": 0}, {"q": "Koks procesas padeda suderinti pažeidžiamumo atskleidimo laiką su pataisos parengimu?", "a": ["Darbuotojų mokymo planas", "Tiekėjų atranka", "Atsakingo atskleidimo strategija", "Rinkodaros planas"], "c": 2}, {"q": "Koks yra pagrindinis koordinuoto pažeidžiamumų atskleidimo tikslas?", "a": ["Panaikinti tyrėjų dalyvavimą", "Atsisakyti bendradarbiavimo su CSIRT", "Saugiai ir koordinuotai spręsti pažeidžiamumus, mažinant riziką", "Kuo greičiau viešinti visas pažeidžiamumo detales"], "c": 2}];let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10)}
function startQuiz(){pick10();current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;let item=quiz[current];document.getElementById('progress').textContent=`Klausimas ${current+1} / ${quiz.length}`;document.getElementById('question').textContent=item.q;
let box=document.getElementById('answers');box.innerHTML='';item.a.forEach((ans,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=ans;b.onclick=()=>choose(i);box.appendChild(b)});
document.getElementById('next').disabled=true;document.getElementById('next').textContent=current===quiz.length-1?'Baigti →':'Kitas klausimas →'}
function choose(i){if(answered)return;answered=true;let item=quiz[current],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);
if(i===item.c){buttons[i].classList.add('correct');score++}else{buttons[i].classList.add('wrong');buttons[item.c].classList.add('correct')}document.getElementById('next').disabled=false}
document.getElementById('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${score} / 10`;document.getElementById('percent').textContent=`${score*10}%`}};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');let dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('darkMode',dark)};
if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}startQuiz();
</script></body></html>
