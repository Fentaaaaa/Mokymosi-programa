ry", "Endpoint Data Routing", "Enterprise DNS Response"], "c": 0}, {"q": "Kuo EDR praplečia ESS funkcionalumą?", "a": ["Tik programų diegimu", "Tik antivirusinių aprašų atnaujinimu", "Nuolatiniu mazgų stebėjimu, telemetrijos agregavimu, analizavimu ir automatiniais veiksmais", "Tik DNS stebėjimu"], "c": 2}, {"q": "Kaip EDR užtikrina nuolatinį mazgų stebėjimą?", "a": ["Naudojami tik DNS serveriai", "Naudojami kompiuteriuose įdiegti agentai", "Naudojami tik vartotojų slaptažodžiai", "Naudojamas tik naršyklės įskiepis"], "c": 1}, {"q": "Kur siunčiama EDR telemetrija?", "a": ["Tik į vartotojo el. paštą", "Į centrinę EDR sistemą", "Tik į vietinį failą", "Tik į DNS serverį"], "c": 1}, {"q": "Kokia telemetrijos agregavimo nauda?", "a": ["Formuojamas bendras infrastruktūros vaizdas", "Išjungiami agentai", "Ištrinami visi įrenginių duomenys", "Pašalinamas antivirusas"], "c": 0}, {"q": "Ką EDR daro su surinkta informacija?", "a": ["Analizuoja ir koreliuoja informaciją", "Tik archyvuoja ją be analizės", "Tik siunčia ją vartotojui", "Tik ištrina ją"], "c": 0}, {"q": "Kokius algoritmus plačiai naudoja EDR sistemos pagal medžiagą?", "a": ["Mašininio mokymosi algoritmus", "Tik kriptografinius hash algoritmus", "Tik DNS algoritmus", "Tik maršrutizavimo algoritmus"], "c": 0}, {"q": "Kokias grėsmes EDR gali detaliau analizuoti?", "a": ["Tik DNS klaidas", "Tik fizinius įrenginių gedimus", "Tik žinomus failų virusus", "Sofistikuotas grėsmes, paremtas neįprastu kompiuterio naudojimu"], "c": 3}, {"q": "Ką EDR gali daryti aptikęs kenkėjišką veiklą be failo sustabdymo?", "a": ["Tik išjungti monitorių", "Tik uždaryti naršyklę", "Tik pervadinti failą", "Atlikti platesnio masto veiksmus, pvz., izoliuoti mazgą nuo tinklo"], "c": 3}, {"q": "Koks pavyzdys pateikiamas ransomware atveju?", "a": ["EDR ištrina visą tinklą", "EDR išjungia DNS", "EDR tik pakeičia ekrano foną", "EDR gali izoliuoti mazgą nuo tinklo"], "c": 3}, {"q": "Kam EDR gali informuoti apie aptiktus įvykius?", "a": ["Tik vartotojo šeimą", "Tik aparatinės įrangos gamintoją", "Tik interneto tiekėją", "Saugumo operacijų komandą"], "c": 3}, {"q": "Kodėl EDR saugo surinktą informaciją?", "a": ["Analitikai ją gali panaudoti tolimesnei incidentų analizei", "Kad vartotojai galėtų keisti DNS", "Kad būtų galima išjungti agentą", "Tik licencijavimo tikslais"], "c": 0}, {"q": "Koks EDR sprendimų rinkos bruožas minimas?", "a": ["Visi sprendimai yra nemokami", "Dauguma sprendimų yra komerciniai ir prieinami kaip SaaS", "Visi sprendimai yra tik vietiniai", "EDR sprendimų nėra SaaS formatu"], "c": 1}, {"q": "Ar egzistuoja atviro kodo EDR sprendimai?", "a": ["Tik Windows Defender aplinkoje", "Ne", "Tik mokamose debesijose", "Taip, juos galima diegti ir naudoti savo infrastruktūroje"], "c": 3}, {"q": "Kuris atviro kodo EDR sprendimas minimas?", "a": ["Exchange", "Apache", "Wazuh", "MySQL"], "c": 2}, {"q": "Kuris kitas atviro kodo sprendimas minimas?", "a": ["OpenEDR", "OpenLDAP", "OpenVPN", "OpenSSH"], "c": 0}, {"q": "Kuris kitas sprendimas minimas tarp atviro kodo EDR pavyzdžių?", "a": ["Nginx", "Postfix", "OSSEC", "Kibana"], "c": 2}, {"q": "Kuris dar sprendimas minimas rinkos apžvalgoje?", "a": ["The Hive", "MariaDB", "IIS", "WordPress"], "c": 0}, {"q": "Su kokiomis didesnėmis platformomis dažnai susiję EDR produktai?", "a": ["Pilnų SIEM+XDR platformų dalimi", "Tik VPN platformų dalimi", "Tik el. pašto platformų dalimi", "Tik DNS platformų dalimi"], "c": 0}, {"q": "Kodėl EDR yra kritinis sistemos komponentas?", "a": ["Kad analizuotų sistemos veiklą, EDR turi pasiekti žemus operacinės sistemos sluoksnius", "Nes EDR veikia tik naršyklėje", "Nes EDR nereikia OS prieigos", "Nes EDR neturi agentų"], "c": 0}, {"q": "Kodėl gamintojai turi būti ypač atsargūs su giliomis EDR integracijomis?", "a": ["Jos veikia tik kaip interneto svetainės", "Jos tik siunčia el. laiškus", "Jos integruojasi į žemus operacinės sistemos sluoksnius", "Jos neturi jokios prieigos prie OS"], "c": 2}, {"q": "Koks incidentas pateikiamas kaip gilių integracijų rizikos pavyzdys?", "a": ["WordPress incidentas 2020 metais", "Apache incidentas 2015 metais", "CrowdStrike incidentas 2024 metų liepos mėn.", "DNS incidentas 2010 metais"], "c": 2}, {"q": "Kokia priemonė minima kaip apsauga nuo tokio pobūdžio poveikio?", "a": ["Tik slaptažodžio keitimas", "Tik VPN", "Veiklos tęstinumo planas", "Tik DNS atsarginė kopija"], "c": 2}, {"q": "Kas yra OpenEDR pagal medžiagą?", "a": ["DNS serveris", "Tik antivirusinis aprašas", "VPN sprendimas", "Atviro kodo EDR sprendimas"], "c": 3}, {"q": "Kaip gali būti diegiamas OpenEDR?", "a": ["Tik Android telefone", "Kliento infrastruktūroje arba naudojamas kaip SaaS platforma", "Tik DNS serveryje", "Tik naršyklėje"], "c": 1}, {"q": "Koks OpenEDR komponentas sudaro pagrindinę platformos dalį?", "a": ["DNS resolveris", "DHCP serveris", "VPN koncentratorius", "Pagrindinė biblioteka"], "c": 3}, {"q": "Koks OpenEDR komponentas veikia kaip atskiras servisas?", "a": ["DNS zona", "Servisas", "Mail serveris", "Web proxy"], "c": 1}, {"q": "Koks modulis stebi aplikacijas?", "a": ["SMTP modulis", "Aplikacijų stebėjimo modulis", "VPN modulis", "DNS modulis"], "c": 1}, {"q": "Koks modulis stebi sistemą?", "a": ["Pašto stebėjimo modulis", "Sistemos stebėjimo modulis", "DNS zonų modulis", "DHCP modulis"], "c": 1}, {"q": "Koks OpenEDR komponentas susijęs su failų sistema?", "a": ["SMTP filtras", "VPN filtras", "Failų sistemos filtras", "DNS filtras"], "c": 2}, {"q": "Koks komponentas stebi žemo lygmens procesus?", "a": ["Web turinio filtras", "Žemo lygmens procesų stebėjimo modulis", "DNS stebėjimo modulis", "El. pašto filtras"], "c": 1}, {"q": "Koks komponentas stebi žemo lygmens registrą?", "a": ["DNS agentas", "LDAP serveris", "Žemo lygmens registro stebėjimo modulis", "VPN klientas"], "c": 2}, {"q": "Koks komponentas skirtas pačios sistemos apsaugai?", "a": ["Web serveris", "Savisaugos modulis", "SMTP modulis", "DNS modulis"], "c": 1}, {"q": "Koks modulis stebi tinklą?", "a": ["Failų archyvas", "Tinklo stebėjimo modulis", "DHCP modulis", "LDAP katalogas"], "c": 1}, {"q": "Kokia OpenEDR versija nurodoma kaip nemokamai išbandoma?", "a": ["SaaS versija", "Tik laboratorinė ISO versija", "Tik fizinis appliance", "Tik Android versija"], "c": 0}, {"q": "Koks pirmas praktinės užduoties žingsnis?", "a": ["Sukurti Active Directory mišką", "Užsiregistruoti OpenEDR tinklapyje", "Sukurti DNS zoną", "Įdiegti WordPress"], "c": 1}, {"q": "Koks kitas praktinės užduoties žingsnis?", "a": ["Įdiegti agentą į DNS serverį", "Sukurti VPN tunelį", "Atsisiųsti OpenEDR agentą ir įdiegti jį į nurodytą Windows mašiną", "Ištrinti Windows agentą"], "c": 2}, {"q": "Ką reikia atlikti su OpenEDR valdymo panele?", "a": ["Tik pakeisti slaptažodį", "Tik išjungti agentą", "Susipažinti su jos valdymu ir informacijos pateikimu skirtingais pjūviais", "Tik eksportuoti DNS zoną"], "c": 2}, {"q": "Koks testinis failas naudojamas praktinėje užduotyje?", "a": ["ISO testinis failas", "EICAR testinis failas", "WordPress testinis failas", "DNS testinis failas"], "c": 1}, {"q": "Koks praktinės užduoties tikslas paleidus EICAR testinį failą?", "a": ["Patikrinti Wi-Fi signalą", "Patikrinti DNS zoną", "Išsiaiškinti, kokie įvykiai fiksuojami OpenEDR valdymo panelėje", "Sukurti naują vartotoją"], "c": 2}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
