<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>26 tema — Fizinės saugos testavimo metodikos</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>26 tema — Fizinės saugos testavimo metodikos</h1><div class="subtitle">Fizinės prieigos, socialinės inžinerijos ir darbuotojų elgesio testavimas</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 26 temos tema?", "a": ["Kerberos autentifikacija", "Fizinės saugos testavimo metodikos", "Fizinė organizacijos sauga", "Apache2 grūdinimas"], "c": 1}, {"q": "Koks paskaitos formatas?", "a": ["Egzaminas", "Teorija", "Praktinė veikla", "Seminaras"], "c": 1}, {"q": "Kokia paskaitos trukmė?", "a": ["2 valandos", "4 valandos", "6 valandos", "8 valandos"], "c": 1}, {"q": "Kokios trys pagrindinės paskaitos temos?", "a": ["Kerberos, Ransomware ir OTP", "NAC, MFA ir VPN", "Apache2, MySQL ir Linux", "Fizinės saugos testavimo svarba, darbuotojų mokymo svarba ir fizinės saugos testavimo eiga"], "c": 3}, {"q": "Kodėl reikia ne tik diegti, bet ir testuoti fizinės apsaugos priemones?", "a": ["Nes įsilaužėliai gali svarstyti įvairius įsilaužimo kelius", "Nes fizinė sauga pakeičia kibernetinę saugą", "Nes testuoti reikia tik kameras", "Nes tai būtina tik duomenų centrams"], "c": 0}, {"q": "Apie kokius testus dažnai pirmiausia kalbama IT saugos kontekste?", "a": ["Evakuacijos testus", "Informacinių sistemų įsiskverbimo testus", "Vaizdo kamerų testus", "Gaisro bandymus"], "c": 1}, {"q": "Koks požiūris į įsilaužimo kelius akcentuojamas?", "a": ["Svarstomi tik tinklo įsilaužimai", "Svarstomos tik socialinės inžinerijos atakos", "Svarstomi visi galimi įsilaužimo keliai", "Svarstomos tik programinės spragos"], "c": 2}, {"q": "Koks vienas klausimas keliamas testuojant fizinės prieigos kontrolę?", "a": ["Ar visi serveriai naudoja Linux?", "Ar visos kameros turi Wi-Fi?", "Ar visi darbuotojai turi VPN?", "Ar visos spynos veikia tinkamai?"], "c": 3}, {"q": "Ką tikrinama dėl praėjimo durų?", "a": ["Ar jos naudoja TOTP", "Ar jos automatiškai uždaromos ir neblokuojamos", "Ar jos turi NVR", "Ar jos turi DHCP"], "c": 1}, {"q": "Ką tikrinama dėl darbuotojų prieigos teisių?", "a": ["Ar jos valdomos tik rankiniu būdu", "Ar jos tinkamai sutvarkytos kiekvienam darbuotojui", "Ar visi turi administratoriaus teises", "Ar visi naudoja tą pačią kortelę"], "c": 1}, {"q": "Ką galima testuoti su praėjimo sistemos žetonais ir kortelėmis?", "a": ["Ar jie gali paleisti MySQL", "Ar jie gali veikti kaip VPN", "Kaip lengvai juos galima nuklonuoti", "Ar jie gali pakeisti slaptažodį"], "c": 2}, {"q": "Ką galima tikrinti mechaniškai pažeidus praėjimo sistemą?", "a": ["Ar galima įdiegti WordPress", "Ar galima apeiti poreikį autentifikuotis žetonu ar kortele", "Ar galima pakeisti darbuotojo rolę", "Ar galima įjungti NVR"], "c": 1}, {"q": "Ką reikia tikrinti dėl signalizacijos?", "a": ["Ar ji naudoja NFC", "Ar ji turi MySQL", "Ar ji gali autentifikuoti per Kerberos", "Ar ji tinkamai veikia"], "c": 3}, {"q": "Kodėl vien techninių priemonių nepakanka?", "a": ["Kameros negali būti naudojamos", "Techninės priemonės visada sugenda", "Darbuotojai turi žinoti, kaip elgtis pastebėję neįprastą veiklą", "Praėjimo kortelės nėra saugios"], "c": 2}, {"q": "Koks darbuotojų elgesys tikrinamas dėl nepažįstamų asmenų?", "a": ["Ar darbuotojai išjungia kameras", "Ar darbuotojai nėra per daug paslaugūs ir neįleidžia nepažįstamų asmenų", "Ar darbuotojai dalina slaptažodžius", "Ar darbuotojai naudoja VPN"], "c": 1}, {"q": "Ką darbuotojai turėtų daryti pastebėję nepažįstamą asmenį?", "a": ["Duoti jam praėjimo kortelę", "Reaguoti pagal organizacijos saugumo kultūrą ir taisykles", "Ignoruoti jį", "Išjungti signalizaciją"], "c": 1}, {"q": "Ką galima tikrinti dėl neįprastos laukto svečio veiklos?", "a": ["Ar darbuotojai gali imtis veiksmų", "Ar svečias turi VPN", "Ar svečias naudoja NFC", "Ar svečias turi USB"], "c": 0}, {"q": "Ką dar svarbu vertinti tarp darbuotojų?", "a": ["Ar jie dalinasi kortelėmis", "Ar jie išjungia NVR", "Ar jie naudoja tą patį slaptažodį", "Ar jie dalinasi įžvalgomis tarpusavyje ir su vadovais"], "c": 3}, {"q": "Kokia informacijos dalinimosi rizika minima?", "a": ["Per daug atviras dalinimasis informacija apie fizinę saugą ar jos trūkumus su išoriniais asmenimis", "Per mažas Wi-Fi greitis", "Per daug kamerų", "Per daug evakuacijos testų"], "c": 0}, {"q": "Kas yra „masalo“ užmetimas fizinės saugos testavimo kontekste?", "a": ["Bandymas patekti per pagrindines duris", "Bandymas nuklonuoti kortelę", "Bandymas išjungti kamerą", "Bandymas priversti darbuotoją prijungti kenkėjišką įrenginį prie kompiuterio"], "c": 3}, {"q": "Ar fizinis įsibrovimas gali būti bandomas neįžengiant pro biuro duris?", "a": ["Ne", "Tik naktį", "Taip", "Tik duomenų centre"], "c": 2}, {"q": "Koks įrenginys gali būti naudojamas kaip „masalas“?", "a": ["Praėjimo kortelė", "USB įrenginys", "DHCP serveris", "NVR"], "c": 1}, {"q": "Kuo dar gali būti maskuojamas kenkėjiškas įrenginys?", "a": ["Monitoriumi", "Kamera", "Durų spyna", "Įkrovimo kabeliu"], "c": 3}, {"q": "Kaip kenkėjiški įrenginiai gali patekti į organizaciją?", "a": ["Tik per VPN", "Tik per serverį", "Tik per DHCP", "Jie gali būti siunčiami kaip verslo dovanos arba „pametami“ bendrose patalpose"], "c": 3}, {"q": "Koks yra paprastos kenkėjiškos USB atmintinės tikslas pagal medžiagą?", "a": ["Turėti kenkėjišką programinę įrangą", "Imituoti durų kortelę", "Įrašyti vaizdą", "Generuoti OTP"], "c": 0}, {"q": "Kas yra „Rubber Ducky“?", "a": ["NAC įrenginys", "USB atmintinę primenantis įrenginys, imituojantis klaviatūrą ir suvedantis kenkėjišką kodą", "Praėjimo kortelė", "Vaizdo kamera"], "c": 1}, {"q": "Koks dar kenkėjiško USB įrenginio tipas minimas?", "a": ["Kompiuterį fiziškai sugadinantis USB įrenginys", "USB, skirtas tik failams kopijuoti", "USB kamera", "USB NFC skaitytuvas"], "c": 0}, {"q": "Kaip galima apsisaugoti nuo paprastų USB atmintinių su kenkėjiškomis programomis?", "a": ["Uždrausti Mass Storage Device tipo USB įrenginius", "Įjungti NVR", "Išjungti Wi-Fi", "Naudoti tik NFC"], "c": 0}, {"q": "Kaip galima mažinti Rubber Ducky tipo atakos riziką?", "a": ["Išjungti vaizdo kameras", "Išjungti DHCP", "Naudoti tik RFID", "Valdyti prieigą prie administratoriaus paskyrą turinčios komandinės eilutės"], "c": 3}, {"q": "Kokios komandinės eilutės aplinkos paminėtos?", "a": ["SQL ir PHP", "BGP ir OSPF", "Apache ir MySQL", "bash arba PowerShell"], "c": 3}, {"q": "Kokia programinė priemonė gali padėti aptikti Rubber Ducky tipo veiklą?", "a": ["DHCP", "Programinė įranga, stebinti klavišų paspaudimų greitį", "NAC", "NVR"], "c": 1}, {"q": "Kokia svarbiausia apsaugos priemonė nuo nepatikimų USB įrenginių?", "a": ["Tik vaizdo stebėjimas", "Darbuotojų edukacija, kad ne darbdavio išduoti USB įrenginiai nebūtų jungiami prie darbinių kompiuterių", "Tik praėjimo kortelės", "Visų USB įrenginių naudojimas"], "c": 1}, {"q": "Kokia technika minima fiziniam patekimui į organizacijos patalpas?", "a": ["Ransomware", "Socialinė inžinerija", "BGP hijacking", "SQL Injection"], "c": 1}, {"q": "Kuo galima apsimesti siekiant patekti į patalpas?", "a": ["Tik IT administratoriumi", "Pastato sistemų priežiūros personalu", "Tik įmonės direktoriumi", "Tik klientu"], "c": 1}, {"q": "Kuo dar gali apsimesti fizinio patekimo testuotojas?", "a": ["Tik kurjeriu", "Tik apsaugos darbuotoju", "Tik darbuotojo vadovu", "Potencialiu kandidatu į darbo poziciją"], "c": 3}, {"q": "Kuo dar gali būti apsimetama?", "a": ["Tik auditoriumi", "Tik klientu su sutartimi", "Tik sistemų administratoriumi", "Į netikėtą situaciją papuolusiu atsitiktiniu asmeniu"], "c": 3}, {"q": "Kas paprastai atliekama dar prieš fizinį patekimą?", "a": ["Perimetro analizė", "MySQL atsarginė kopija", "Kerberos bilieto gavimas", "MFA registracija"], "c": 0}, {"q": "Ką galima apžiūrėti atliekant perimetro analizę?", "a": ["Tik VPN serverius", "Tik duomenų bazes", "Vaizdo stebėjimo sistemas ir jų išdėstymą", "Tik darbuotojų slaptažodžius"], "c": 2}, {"q": "Ką dar galima analizuoti prieš fizinį patekimą?", "a": ["Tik WordPress temą", "Tik MySQL vartotojus", "Tik DNS zoną", "Praėjimo valdymo sistemų versijas"], "c": 3}, {"q": "Kokį personalą galima vertinti perimetro analizėje?", "a": ["Tik rinkodaros darbuotojus", "Tik programuotojus", "Fizinės apsaugos personalą", "Tik duomenų bazių administratorius"], "c": 2}, {"q": "Kokie darbuotojų įpročiai gali būti analizuojami?", "a": ["Tik darbo valandų apskaita", "Tik el. pašto naudojimas", "Rūkymo pertraukėlių dažnumas ir paslaugumas įleidžiant kitus asmenis", "Tik slaptažodžių keitimas"], "c": 2}, {"q": "Ar fizinio patekimo testavimo metu gali būti bandoma užmegzti ryšius su darbuotojais?", "a": ["Ne, niekada", "Tik su apsaugos darbuotojais", "Taip, apsimetant potencialiais klientais ar partneriais", "Tik po patekimo"], "c": 2}, {"q": "Kas gali būti daroma jau patekus į įmonės biurą?", "a": ["Darbo vietų apžiūra ir jautrios informacijos paieška", "Tik evakuacijos testas", "Tik kameros išjungimas", "Tik Wi-Fi slaptažodžio pakeitimas"], "c": 0}, {"q": "Koks kitas veiksmas gali būti atliekamas patekus į biurą?", "a": ["Išjungiamas internetas visoje įmonėje", "Bandoma patekti į griežtesnės kontrolės patalpas", "Įdiegiama nauja antivirusinė", "Pakeičiamas darbuotojų darbo grafikas"], "c": 1}, {"q": "Ką galima bandyti prijungti prie laisvo tinklo prievado?", "a": ["Mažą iš anksto sukonfigūruotą kompiuterį, pvz., Raspberry Pi", "TOTP generatorių", "NVR", "RFID kortelę"], "c": 0}, {"q": "Ką galima palikti biure kaip socialinės inžinerijos elementą?", "a": ["Praėjimo kortelę", "USB atmintinę, sudarant įspūdį, kad ją paliko kolega", "Wi-Fi maršrutizatorių", "NVR"], "c": 1}, {"q": "Koks dar tikslas gali būti siekiamas patekus į biurą?", "a": ["Likti nepastebėtam", "Pakeisti visus darbuotojus", "Išjungti elektros tiekimą", "Iškart išjungti visas sistemas"], "c": 0}, {"q": "Kodėl vien patekimo į patalpas dažnai nepakanka?", "a": ["Vien patekimas retai leidžia pasiekti visus keliamus įsilaužimo tikslus", "Patalpose nėra informacijos", "Kameros visada aptinka testuotoją", "Durys automatiškai užsidaro"], "c": 0}, {"q": "Ko dažnai siekiama po fizinio patekimo?", "a": ["Tik išbandyti signalizaciją", "Tik nufotografuoti duris", "Tik nuklonuoti vieną kortelę", "Galimybės prisijungti prie organizacijos informacinių sistemų negrįžtant į patalpas"], "c": 3}, {"q": "Kaip gali būti siekiama išlaikyti prieigą iš išorės?", "a": ["Naudojant tik NFC", "Išjungiant kameras", "Paliekant duris atidarytas", "Prijungiant savo įrangą, prie kurios galima prisijungti iš išorės"], "c": 3}, {"q": "Koks gali būti tokios įrangos pavyzdys?", "a": ["Tik RFID žetonas", "Atskiras kompiuteris", "Tik praėjimo kortelė", "Tik kamera"], "c": 1}, {"q": "Kur dar gali būti paleista kenkėjiška programinė įranga?", "a": ["Tik maršrutizatoriuje", "Ant egzistuojančio kompiuterio", "Tik NVR", "Tik telefone"], "c": 1}, {"q": "Kokia gali būti porininko užduotis fizinio testo metu?", "a": ["Konfigūruoti Wi-Fi", "Stebėti gaisro signalizaciją", "Valdyti darbuotojų mokymus", "Laukti indikacijų, kad pirminė konfigūracija atlikta ir užmegztas ryšys su įrenginiu"], "c": 3}, {"q": "Ką reikia daryti etiško fizinio įsilaužimo atveju?", "a": ["Viešinti darbuotojų duomenis", "Dokumentuoti visas surastas spragas ir pateikti rekomendacijas ataskaitoje", "Palikti įrangą organizacijoje", "Slėpti spragas"], "c": 1}, {"q": "Kokia turėtų būti darbuotojų saugumo kultūra?", "a": ["Saugumo užtikrinimas yra kiekvieno darbuotojo atsakomybė", "Saugumas yra tik apsaugos darbuotojo atsakomybė", "Saugumas yra tik vadovo atsakomybė", "Saugumas yra tik IT administratoriaus atsakomybė"], "c": 0}, {"q": "Kodėl požiūris „tas asmuo atėjo ne pas mane“ nėra tinkamas?", "a": ["Tai susiję su MySQL", "Darbuotojai turėtų reaguoti pastebėję nepažįstamą asmenį", "Darbuotojai privalo valdyti visas sistemas", "Tai susiję su Wi-Fi"], "c": 1}, {"q": "Kokia įmonių politika minima dėl svečių?", "a": ["Svečias visada gali vaikščioti vienas", "Svečią visuomet turėtų lydėti darbuotojas, žinantis, kodėl svečias lankosi", "Svečias turi gauti administratoriaus paskyrą", "Svečias gali naudotis bet kuria patalpa"], "c": 1}, {"q": "Ko reikėtų paklausti radus nepažįstamą asmenį?", "a": ["Koks jo Wi-Fi slaptažodis", "Pas ką jis atvyko ir kur yra jį lydintis asmuo", "Koks jo MFA kodas", "Koks jo IP adresas"], "c": 1}, {"q": "Ką svarbu padaryti prieš planuojamus apdailos ar elektros darbus?", "a": ["Iš anksto informuoti darbuotojus apie darbus", "Pakeisti visus slaptažodžius", "Atjungti NAC", "Išjungti visas kameras"], "c": 0}, {"q": "Kas turi būti pateikta užsakovui po etiško fizinio saugumo testo?", "a": ["Kenkėjiška įranga", "Praėjimo kortelių kopijos", "Darbuotojų slaptažodžiai", "Surastos spragos ir rekomendacijos ataskaitoje"], "c": 3}, {"q": "Koks yra vienas pagrindinių fizinės saugos testavimo tikslų?", "a": ["Išjungti organizacijos sistemas", "Pakeisti fizinės apsaugos politiką be leidimo", "Nustatyti, ar fizinės apsaugos priemonės ir darbuotojų elgesys realiai užtikrina saugumą", "Surasti kuo daugiau darbuotojų"], "c": 2}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
