<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>31 tema — Asimetrinės kriptografijos taikymas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>31 tema — Asimetrinės kriptografijos taikymas</h1><div class="subtitle">SSH raktai, TLS/HTTPS, sertifikatai ir praktinė konfigūracija</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 31 temos tema?", "a": ["Linux failų sistemos", "Fizinės saugos testavimas", "Simetrinės kriptografijos istorija", "Asimetrinės kriptografijos taikymas"], "c": 3}, {"q": "Kokia paskaitos trukmė?", "a": ["2 valandos", "4 valandos", "6 valandos", "8 valandos"], "c": 1}, {"q": "Koks paskaitos formatas?", "a": ["Egzaminas", "Praktinis užsiėmimas", "Teorija", "Klausimai/diskusija"], "c": 1}, {"q": "Kuri praktinė užduotis nagrinėjama su SSH?", "a": ["NFS konfigūravimas", "DNS serverio diegimas", "VNC konfigūravimas", "SSH raktų konfigūravimas Ubuntu Linux sistemoje"], "c": 3}, {"q": "Kuri kita praktinė užduotis nagrinėjama?", "a": ["Failų sistemos atkūrimas", "Linux branduolio kompiliavimas", "VPN kūrimas", "Tinklapio apsaugojimas su TLS/HTTPS"], "c": 3}, {"q": "Kokia komanda naudojama prisijungti prie Linux serverio per integruotą SSH klientą?", "a": ["openssl serveris", "scp serveris", "ssh \"vartotojas\"@\"serverio_FQDN\" -p \"portas\"", "ssh-copy-id serveris"], "c": 2}, {"q": "Kuris įrankis paminėtas Windows vartotojams SSH prisijungimui?", "a": ["Certbot", "PuTTY", "Apache2", "Audacity"], "c": 1}, {"q": "Koks pagrindinis SSH raktų naudojimo privalumas?", "a": ["Prisijungimas naudojant raktų porą yra saugesnis nei naudojant tik slaptažodį", "Raktai pakeičia serverio IP adresą", "Nereikia jokio autentifikavimo", "Raktai išjungia SSH"], "c": 0}, {"q": "Kuri rakto dalis įkeliama į serverį, prie kurio norima prisijungti?", "a": ["Viešasis raktas", "Privatus raktas", "Tik passphrase", "Abu privatūs raktai"], "c": 0}, {"q": "Kur laikoma privati rakto dalis?", "a": ["Serverio viešame kataloge", "CA saugykloje", "DNS serveryje", "Saugiai pas vartotoją ir naudojama prisijungiant"], "c": 3}, {"q": "Kurioje sistemoje generuojama RSA raktų pora pagal praktinę užduotį?", "a": ["Web naršyklėje", "Serveryje b", "Serveryje a", "CA serveryje"], "c": 2}, {"q": "Kur perkeliamas sugeneruotas viešasis raktas?", "a": ["Į serverį a", "Į DNS serverį", "Į CA", "Į serverį b"], "c": 3}, {"q": "Kokia komanda generuoja RSA raktų porą su 4096 bitų raktu?", "a": ["openssl rsa -copy", "ssh-copy-id -t rsa", "ssh-keygen -t rsa -b 4096", "ssh -keygen 2048"], "c": 2}, {"q": "Ką reiškia ssh-keygen komandos parametras -t rsa?", "a": ["Nurodo passphrase", "Nurodo serverio portą", "Nurodo RSA rakto tipą", "Nurodo failo dydį"], "c": 2}, {"q": "Ką nurodo ssh-keygen parametras -b 4096?", "a": ["Rakto dydį bitais", "Vartotojo ID", "Failo pavadinimą", "Serverio portą"], "c": 0}, {"q": "Kam skirtas -C parametras ssh-keygen komandoje?", "a": ["Rakto dydžiui", "Rakto komentarui arba aprašymui", "Serverio adresui", "Rakto ištrynimui"], "c": 1}, {"q": "Ką galima pasirinkti kuriant SSH raktą papildomai?", "a": ["Passphrase", "TLS versiją", "DNS zoną", "NFS portą"], "c": 0}, {"q": "Kokia passphrase paskirtis?", "a": ["Pakeisti viešąjį raktą", "Papildomai apsaugoti privatų raktą", "Nustatyti SSH portą", "Sukurti DNS įrašą"], "c": 1}, {"q": "Kokia komanda naudojama patikrinti, ar SSH raktų pora sukurta?", "a": ["apt update", "ls ~/.ssh/id_*", "ufw status", "cat /etc/ssl/*"], "c": 1}, {"q": "Kokia komanda naudojama viešajam raktui nukopijuoti į serverį?", "a": ["a2enmod", "ssh-copy-id", "openssl req", "ssh-keygen"], "c": 1}, {"q": "Kur serveryje galima peržiūrėti įkeltus SSH raktus?", "a": ["~/.ssh/authorized_keys", "/etc/ssl/private", "/etc/apache2", "/var/www/html"], "c": 0}, {"q": "Koks failas naudojamas autorizuoti SSH viešuosius raktus?", "a": ["apache2.conf", "authorized_keys", "default-ssl.conf", "server.key"], "c": 1}, {"q": "Kokia pagrindinė antrosios praktinės dalies tema?", "a": ["NFS failų perdavimas", "SSH slaptažodžių keitimas", "TLS/HTTPS šifravimas tinklapiams", "Linux procesų stebėjimas"], "c": 2}, {"q": "Koks web serveris diegiamas praktinėje užduotyje?", "a": ["IIS", "Nginx", "Tomcat", "Apache2"], "c": 3}, {"q": "Koks sertifikatas pirmiausia konfigūruojamas kaip praktikos dalis?", "a": ["„Nepatikimas“ / self-signed sertifikatas", "Tik SSH sertifikatas", "Tik klientinis sertifikatas", "Tik CA Root sertifikatas"], "c": 0}, {"q": "Kokia paslauga minima patikimam sertifikatui gauti?", "a": ["PuTTY", "ZeroSSL", "VNC", "NFS"], "c": 1}, {"q": "Kodėl serverio vardas svarbus gaunant TLS sertifikatą?", "a": ["Jis nustato CPU greitį", "Jis nustato SSH rakto dydį", "Jis nustato Linux distribuciją", "Sertifikatas siejamas su serverio vardu"], "c": 3}, {"q": "Kokia komanda atnaujina paketų repozitorijų sąrašą Ubuntu sistemoje?", "a": ["apt update", "apt install apache2", "systemctl restart apache2", "ufw status"], "c": 0}, {"q": "Kokia komanda įdiegia Apache2?", "a": ["openssl apache2", "a2enmod apache2", "apt install apache2", "apt upgrade apache2"], "c": 2}, {"q": "Kokia komanda patikrina ugniasienės statusą?", "a": ["apache status", "apt status", "ufw status", "ssh status"], "c": 2}, {"q": "Kokia komanda įjungia Apache SSL modulį?", "a": ["systemctl ssl", "a2ensite ssl", "openssl ssl", "a2enmod ssl"], "c": 3}, {"q": "Kokia komanda perkrauna Apache2 po SSL modulio įjungimo?", "a": ["service ssl restart", "systemctl start ssh", "systemctl restart apache2", "apache2 reload-all"], "c": 2}, {"q": "Kokia komanda generuoja self-signed TLS sertifikatą pagal praktikos pavyzdį?", "a": ["ssh-copy-id", "ssh-keygen -t rsa", "a2enmod ssl", "openssl req -x509 ... -newkey rsa:4096 ..."], "c": 3}, {"q": "Koks raktų tipas naudojamas pateiktame self-signed sertifikato generavimo pavyzdyje?", "a": ["ECDSA", "RSA", "AES", "DSA"], "c": 1}, {"q": "Koks rakto dydis naudojamas pateiktame self-signed sertifikato pavyzdyje?", "a": ["1024 bitai", "2048 bitai", "4096 bitai", "256 bitai"], "c": 2}, {"q": "Kiek dienų galioja pateiktame pavyzdyje sugeneruotas self-signed sertifikatas?", "a": ["365 dienas", "730 dienų", "30 dienų", "90 dienų"], "c": 0}, {"q": "Kur saugomas self-signed sertifikato failas pagal pavyzdinę konfigūraciją?", "a": ["/etc/apache2/key.pem", "/var/www/html/cert.crt", "/etc/ssh/authorized_keys", "/etc/ssl/certs/apache-selfsigned.crt"], "c": 3}, {"q": "Kur saugomas self-signed privataus rakto failas?", "a": ["/etc/ssl/private/apache-selfsigned.key", "/etc/ssl/certs/apache-selfsigned.key", "/var/www/private.key", "~/.ssh/id_rsa"], "c": 0}, {"q": "Kuris Apache nustatymas nurodo sertifikato failą?", "a": ["SSLCertificateKeyFile", "SSLProtocol", "SSLCompression", "SSLCertificateFile"], "c": 3}, {"q": "Kuris Apache nustatymas nurodo privataus rakto failą?", "a": ["SSLCipherSuite", "SSLCertificateKeyFile", "SSLCertificateFile", "SSLHonorCipherOrder"], "c": 1}, {"q": "Kokia komanda įjungia numatytąją SSL svetainės konfigūraciją?", "a": ["systemctl enable default-ssl", "a2ensite default-ssl.conf", "a2enmod default-ssl.conf", "openssl default-ssl"], "c": 1}, {"q": "Kokia komanda perkrauna Apache2 po HTTPS konfigūracijos?", "a": ["ssh restart apache2", "systemctl restart apache2", "apt restart apache2", "a2reload tls"], "c": 1}, {"q": "Kokia funkcija konfigūruojama 000-default.conf faile?", "a": ["Ugniasienės taisyklės", "SSH raktų generavimas", "Nukreipimas iš HTTP į HTTPS", "DNS validacija"], "c": 2}, {"q": "Kas yra CSR?", "a": ["Sertifikato pasirašymo užklausa", "SSH rakto tipas", "TLS šifro rinkinys", "Apache modulis"], "c": 0}, {"q": "Kokia komanda pateikiama CSR generavimui?", "a": ["apt install apache2", "openssl req -new -newkey rsa:2048 ...", "ssh-keygen -t rsa -b 4096", "a2enmod ssl"], "c": 1}, {"q": "Koks rakto dydis naudojamas pateiktame CSR pavyzdyje?", "a": ["4096 bitai", "128 bitai", "2048 bitai", "256 bitai"], "c": 2}, {"q": "Koks validavimo būdas naudojamas užsakant patikimą sertifikatą praktikoje?", "a": ["SSH validacija", "VNC validacija", "NFS validacija", "DNS validacija"], "c": 3}, {"q": "Kam perduodamas DNS įrašas praktinės užduoties metu?", "a": ["Apache procesui", "SSH klientui", "Dėstytojui", "CA privačiam raktui"], "c": 2}, {"q": "Kokia priemonė naudojama TLS konfigūracijos patikrinimui?", "a": ["Webmin", "PuTTY", "NFS", "SSL Labs"], "c": 3}, {"q": "Koks puslapis naudojamas SSL Labs testui?", "a": ["certbot.eff.org", "zerossl.com", "localhost", "ssllabs.com/ssltest/"], "c": 3}, {"q": "Ką galima tikrinti naudojant SSL Labs?", "a": ["SSH vartotojus", "APT repozitorijas", "TLS konfigūracijos saugumą", "Linux failų teises"], "c": 2}, {"q": "Koks protokolas išjungiamas pateiktoje saugesnėje TLS konfigūracijoje?", "a": ["SSLv3", "TLS 1.3", "SSH", "HTTPS"], "c": 0}, {"q": "Kokios TLS versijos išjungiamos pateiktame nustatyme?", "a": ["TLS 1.2 ir TLS 1.3", "TLS 1.3 ir SSLv3", "TLSv1 ir TLSv1.1", "Tik TLS 1.3"], "c": 2}, {"q": "Ką daro SSLHonorCipherOrder on?", "a": ["Generuoja CSR", "Įjungia serverio šifro rinkinio eiliškumo laikymąsi", "Išjungia HTTPS", "Įjungia SSH"], "c": 1}, {"q": "Ką daro SSLCompression off?", "a": ["Išjungia TLS", "Išjungia TLS suspaudimą", "Įjungia HTTP", "Išjungia Apache"], "c": 1}, {"q": "Ką daro SSLSessionTickets off?", "a": ["Išjungia sertifikatą", "Išjungia DNS", "Išjungia TLS sesijų bilietus", "Išjungia SSH raktus"], "c": 2}, {"q": "Kuris raktas turi likti pas vartotoją jungiantis per SSH raktų porą?", "a": ["Privatus raktas", "authorized_keys failas", "Viešasis raktas", "CSR"], "c": 0}, {"q": "Kuris raktas įkeliamas į serverį SSH autentifikacijai?", "a": ["Privatus raktas", "CA Root raktas", "Viešasis raktas", "TLS sesijos raktas"], "c": 2}, {"q": "Kuris protokolas naudojamas saugiam prisijungimui prie Linux serverio?", "a": ["FTP", "SSH", "HTTP", "NFS"], "c": 1}, {"q": "Kuris protokolas naudojamas tinklapio apsaugai praktinėje užduotyje?", "a": ["SSH", "NFS", "HTTPS/TLS", "SCP"], "c": 2}, {"q": "Koks ryšys tarp SSH raktų poros ir TLS sertifikatų?", "a": ["Abiem atvejais naudojami asimetrinės kriptografijos raktai", "Abu yra tik simetriniai raktai", "Abu yra tik hash reikšmės", "Jie nesusiję su kriptografija"], "c": 0}, {"q": "Kuri priemonė gali būti naudojama Windows aplinkoje SSH prisijungimui?", "a": ["SSLLabs", "Apache2", "PuTTY", "ZeroSSL"], "c": 2}, {"q": "Kokia Linux komanda skirta viešajam SSH raktui įkelti į kitą serverį?", "a": ["a2ensite", "ssh-copy-id", "openssl req", "ssh-keygen"], "c": 1}, {"q": "Koks failas serveryje nurodo autorizuotus SSH viešuosius raktus?", "a": ["/etc/apache2/ports.conf", "~/.ssh/authorized_keys", "/etc/ssl/certs/cert.crt", "/var/www/html/index.html"], "c": 1}, {"q": "Koks pagrindinis self-signed sertifikato trūkumas praktikos kontekste?", "a": ["Jis negali veikti su HTTPS", "Jis nenaudoja privataus rakto", "Jis nėra patikimos sertifikavimo institucijos išduotas", "Jis negali būti naudojamas Apache"], "c": 2}, {"q": "Kuo skiriasi patikimas sertifikatas nuo self-signed praktikos kontekste?", "a": ["Patikimas sertifikatas nenaudoja TLS", "Self-signed visada naudoja AES", "Patikimas sertifikatas gaunamas iš sertifikatų išdavėjo, o self-signed pasirašomas pačios sistemos", "Self-signed nenaudoja rakto"], "c": 2}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
