<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>20 tema — OWASP Top 10</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>20 tema — OWASP Top 10</h1><div class="subtitle">A01–A10: web aplikacijų saugumas</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kiek kategorijų sudaro OWASP Top 10 (2021)?", "a": ["12", "5", "10", "20"], "c": 2}, {"q": "Kokia yra A01 kategorija?", "a": ["Nesaugus dizainas", "Kriptografinės klaidos", "Injekcijos", "Netinkamai veikianti prieigos kontrolė"], "c": 3}, {"q": "Kokia yra A02 kategorija?", "a": ["Injekcijos", "SSRF", "Kriptografinės klaidos", "Saugumo konfigūracijos klaidos"], "c": 2}, {"q": "Kokia yra A03 kategorija?", "a": ["Nesaugus dizainas", "Identifikacijos klaidos", "Injekcijos", "Integralumo klaidos"], "c": 2}, {"q": "Kokia yra A04 kategorija?", "a": ["Injekcijos", "Saugumo konfigūracijos klaidos", "SSRF", "Nesaugus dizainas"], "c": 3}, {"q": "Kokia yra A05 kategorija?", "a": ["Prieigos kontrolė", "Saugumo konfigūracijos klaidos", "Kriptografinės klaidos", "Pažeidžiami komponentai"], "c": 1}, {"q": "Kokia yra A06 kategorija?", "a": ["SSRF", "Pažeidžiami ir neatnaujinti komponentai", "Identifikacijos klaidos", "Injekcijos"], "c": 1}, {"q": "Kokia yra A07 kategorija?", "a": ["Identifikacijos ir autentifikacijos klaidos", "Prieigos kontrolė", "Nesaugus dizainas", "Programinės įrangos integralumo klaidos"], "c": 0}, {"q": "Kokia yra A08 kategorija?", "a": ["Kriptografinės klaidos", "Saugumo fiksavimo klaidos", "Programinės įrangos ir duomenų integralumo klaidos", "Injekcijos"], "c": 2}, {"q": "Kokia yra A09 kategorija?", "a": ["Saugumo fiksavimo ir stebėjimo klaidos", "Nesaugus dizainas", "Prieigos kontrolė", "SSRF"], "c": 0}, {"q": "Kokia yra A10 kategorija?", "a": ["Saugumo konfigūracijos klaidos", "Kriptografinės klaidos", "Injekcijos", "Serverio užklausų klastojimas (SSRF)"], "c": 3}, {"q": "Koks yra pagrindinis prieigos kontrolės tikslas?", "a": ["Automatiškai atnaujinti bibliotekas", "Stebėti tinklo srautą", "Užšifruoti visus duomenis", "Užtikrinti, kad vartotojai negalėtų veikti už savo teisių ribų"], "c": 3}, {"q": "Prie ko gali privesti netinkamai veikianti prieigos kontrolė?", "a": ["Neautorizuotos informacijos prieigos, modifikavimo ar sunaikinimo", "Tik lėtesnio puslapio veikimo", "Tik slaptažodžio pakeitimo", "Tik serverio perkrovimo"], "c": 0}, {"q": "Kuris principas pažeidžiamas, kai suteikiama per daug prieigos teisių?", "a": ["Mažiausių prieigos teisių principas", "Atsarginio kopijavimo principas", "Segmentavimo principas", "Šifravimo principas"], "c": 0}, {"q": "Kaip gali būti apeinami prieigos mechanizmai?", "a": ["Modifikuojant URL arba API užklausas", "Tik keičiant ekrano raišką", "Tik pakeitus operacinę sistemą", "Tik išvalant naršyklės istoriją"], "c": 0}, {"q": "Kokia gali būti A01 problema su API?", "a": ["API atsakymų registravimas", "API prieiga be tinkamų prieigos kontrolių POST, PUT ir DELETE metodams", "API dokumentacijos turėjimas", "API naudojimas tik su HTTPS"], "c": 1}, {"q": "Kas gali būti JWT pažeidžiamumo pavyzdys?", "a": ["JWT saugojimas dokumentacijoje", "JWT pavadinimo pakeitimas", "JWT modifikacija arba invalidacijos pažeidimai", "JWT naudojimas su HTTPS"], "c": 2}, {"q": "Kas yra CORS?", "a": ["Šifravimo algoritmas", "Slaptažodžių maišos funkcija", "Duomenų bazės tipas", "Mechanizmas, leidžiantis riboto naudojimo resursams būti pasiektiems iš kito domeno"], "c": 3}, {"q": "Kokia yra viena A01 apsaugos priemonių?", "a": ["Nenaudoti prieigos žurnalų", "Leisti katalogų skaitymą", "Visiems suteikti administratoriaus teises", "Išskyrus viešus resursus, prieigą pagal nutylėjimą drausti"], "c": 3}, {"q": "Ką reikėtų daryti su sesijos identifikatoriumi po atsijungimo?", "a": ["Palikti jį galioti neribotai", "Perkelti į URL", "Paskelbti viešai", "Invaliduoti jį serveryje"], "c": 3}, {"q": "Su kuo dažniausiai siejamos A02 kriptografinės klaidos?", "a": ["Tik su URL", "Tik su API metodais", "Netinkamomis algoritmų implementacijomis, pasenusiais standartais ar nešifruotais duomenimis", "Tik su vartotojų vardais"], "c": 2}, {"q": "Kuri yra A02 priežastis?", "a": ["TLS naudojimas", "Per dažnas raktų rotavimas", "Per stiprūs slaptažodžiai", "Senų ar silpnų kriptografinių algoritmų naudojimas"], "c": 3}, {"q": "Kokia raktų valdymo problema minima A02?", "a": ["Per daug API metodų", "Per trumpi URL", "Per daug žurnalų", "Silpni ar neunikalūs raktai ir raktų laikymas kartu su kodu"], "c": 3}, {"q": "Ką rekomenduojama daryti su jautriais duomenimis saugojimo metu?", "a": ["Dėti į URL", "Saugoti atviru tekstu", "Šifruoti juos („at rest“)", "Išjungti jų apsaugą"], "c": 2}, {"q": "Ką rekomenduojama naudoti perduodant duomenis?", "a": ["TLS ir HSTS", "Tik HTTP", "FTP be apsaugos", "Atvirą tekstą"], "c": 0}, {"q": "Kokie algoritmai paminėti slaptažodžių saugojimui?", "a": ["Argon2, scrypt, bcrypt arba PBKDF2", "SQL ir NoSQL", "JWT ir CORS", "MD5 ir FTP"], "c": 0}, {"q": "Su kuo dažniausiai siejamos A03 injekcijos?", "a": ["Tik DNS", "Tik el. paštu", "Tik failų kopijavimu", "SQL, NoSQL duomenų bazėmis ir OS komandomis"], "c": 3}, {"q": "Kas sudaro prielaidas injekcijoms?", "a": ["Stiprus MFA", "Nevaliduojami, nefiltruojami ar nesanitizuojami vartotojo įvesti duomenys", "Centralizuotas žurnalų kaupimas", "TLS naudojimas"], "c": 1}, {"q": "Kokia priemonė rekomenduojama apsisaugoti nuo injekcijų?", "a": ["Visų vartotojų blokavimas", "Slaptažodžių dalinimasis", "Visų API išjungimas", "Serverio pusėje veikianti įvesties validacija"], "c": 3}, {"q": "Ką rekomenduojama naudoti dinaminėms užklausoms?", "a": ["Nesaugias dinamines užklausas", "Atvirus vartotojo įvesties duomenis", "Pabėgimo simbolius ir parametrizuotas sąsajas", "Tik URL parametrus"], "c": 2}, {"q": "Kokia SQL priemonė minima masinio įrašų atskleidimo rizikai mažinti?", "a": ["LIMIT", "CORS", "JWT", "HSTS"], "c": 0}, {"q": "Kuo A04 Nesaugus dizainas labiau susijęs nei daugelis kitų OWASP Top 10 kategorijų?", "a": ["Projektavimo stadija", "Tik galutiniu testavimu", "Tik vartotojų mokymu", "Tik serverio paleidimu"], "c": 0}, {"q": "Kokia yra viena A04 priežastis?", "a": ["Per daug testų", "Per dažnas atnaujinimas", "Per stiprus autentifikavimas", "Netinkamas funkcinių ir nefunkcinių reikalavimų išsiaiškinimas"], "c": 3}, {"q": "Kokia A04 apsaugos priemonė minima?", "a": ["Saugumo testų išjungimas", "Visų reikalavimų atsisakymas", "Grėsmių modeliavimas kritiniams procesams", "Klientų sujungimas į vieną grupę"], "c": 2}, {"q": "Ką rekomenduojama integruoti į vartotojų istorijas?", "a": ["Saugumo koncepcijas ir valdymo mechanizmus", "Tik finansinius duomenis", "Tik rinkodaros reikalavimus", "Tik dizaino spalvas"], "c": 0}, {"q": "Kodėl A05 Saugumo konfigūracijos klaidos yra pavojingos?", "a": ["Jos visada sukelia tik našumo problemas", "Jos susijusios tik su vartotojų sąsaja", "Jos neleidžia naudoti aplikacijos", "Jos dažnai tampa lengvai išnaudojama ir paplitusia priežastimi"], "c": 3}, {"q": "Kuris yra A05 pavyzdys?", "a": ["Minimalios platformos naudojimas", "MFA įjungimas", "Automatinis saugumo parametrų validavimas", "Numatytųjų vartotojų ir slaptažodžių palikimas"], "c": 3}, {"q": "Kokia A05 apsaugos priemonė minima?", "a": ["Minimalios platformos be nereikalingo funkcionalumo palaikymas", "Numatytųjų slaptažodžių naudojimas", "Visų funkcijų įjungimas", "Klaidų pranešimų detalizavimas vartotojui"], "c": 0}, {"q": "Kuo dažnai pasižymi A06?", "a": ["Aplaidaus išorinių priklausomybių valdymo problema", "Per stipriu autentifikavimu", "Tik URL klaidomis", "Per dideliu žurnalų kiekiu"], "c": 0}, {"q": "Kokia A06 priežastis?", "a": ["Oficialių šaltinių naudojimas", "Reguliarus komponentų inventorizavimas", "Komponentų testavimas", "Nežinojimas apie naudojamų komponentų versijas"], "c": 3}, {"q": "Ką rekomenduojama daryti su nenaudojamomis priklausomybėmis?", "a": ["Palikti visas", "Perkelti į URL", "Pašalinti jas", "Viešinti jas"], "c": 2}, {"q": "Kokie įrankiai paminėti priklausomybių inventorizavimui?", "a": ["JWT ir CORS", "Burp Repeater ir Intruder", "OWASP Dependency Check ir retire.js", "HSTS ir TLS"], "c": 2}, {"q": "Iš kokių šaltinių rekomenduojama atsisiųsti komponentus?", "a": ["Iš atsitiktinių svetainių", "Iš nežinomų forumų", "Iš nepatikrintų archyvų", "Iš oficialių šaltinių saugiais kanalais"], "c": 3}, {"q": "Kokia yra viena A07 priežastis?", "a": ["„Brute force“ atakų leidimas", "Stiprių slaptažodžių tikrinimas", "Sesijų invalidavimas", "MFA naudojimas"], "c": 0}, {"q": "Kas yra credential surfing pagal pateiktą medžiagą?", "a": ["CORS konfigūravimas", "API dokumentavimas", "Duomenų šifravimas", "Automatizuotų atakų leidimas naudojant žinomų galiojančių prisijungimų sąrašus"], "c": 3}, {"q": "Kokia autentifikacijos priemonė rekomenduojama, kur tik įmanoma?", "a": ["Antro faktoriaus autentifikacija", "Numatytasis slaptažodis", "Slaptažodžio laikymas URL", "Vienas bendras slaptažodis"], "c": 0}, {"q": "Ką reikėtų daryti su nesėkmingais prisijungimais?", "a": ["Skelbti viešai", "Juos fiksuoti ir informuoti administratorius apie įtartiną elgseną", "Trinti žurnalus", "Visiškai ignoruoti"], "c": 1}, {"q": "Kada sesijos ID turėtų būti invaliduojamas?", "a": ["Po atsijungimo ar ilgalaikio neveiksnumo", "Niekada", "Tik po metų", "Tik pakeitus naršyklę"], "c": 0}, {"q": "Su kuo susijusi A08 kategorija?", "a": ["Tik su SQL užklausomis", "Tik su CORS", "Tik su slaptažodžiais", "Programinės įrangos atnaujinimais, kritiniais duomenimis ir CI/CD automatizacija be integralumo patvirtinimo"], "c": 3}, {"q": "Kokia yra A08 priežastis?", "a": ["Saugios repozitorijos naudojimas", "Nepatikrintų bibliotekų iš nepatikimų šaltinių naudojimas", "Skaitmeninių parašų naudojimas", "Kodo peržiūra"], "c": 1}, {"q": "Kokia A08 apsaugos priemonė užtikrina programinės įrangos autentiškumą?", "a": ["Skaitmeniniai parašai ar panašūs mechanizmai", "Neprižiūrimi atnaujinimai", "Atviri atsisiuntimai", "Numatytieji slaptažodžiai"], "c": 0}, {"q": "Ką rekomenduojama užtikrinti programinės įrangos tiekimo grandinėje?", "a": ["Kad visi komponentai būtų nežinomi", "Kad ji nebūtų dokumentuojama", "Kad ji būtų saugi ir neturėtų žinomų pažeidžiamumų", "Kad pakeitimai nebūtų peržiūrimi"], "c": 2}, {"q": "Kokia problema apibūdina A09?", "a": ["Per daug testų", "Per daug MFA", "Nepakankamas žurnalinių įrašų kaupimas ir incidentų stebėjimas", "Per stiprus šifravimas"], "c": 2}, {"q": "Kuris įvykis pagal A09 turėtų būti fiksuojamas?", "a": ["Tik sėkmingi mokėjimai", "Tik sistemos paleidimai", "Sėkmingi ir nesėkmingi prisijungimai", "Tik darbuotojų atostogos"], "c": 2}, {"q": "Kokia A09 problema susijusi su žurnalų saugojimu?", "a": ["Žurnalai turi pakankamą kontekstą", "Žurnalai saugomi centralizuotai", "Žurnalai analizuojami", "Žurnaliniai įrašai saugomi tik lokaliai"], "c": 3}, {"q": "Kokia A09 apsaugos priemonė rekomenduojama?", "a": ["Fiksuoti prisijungimo, prieigos kontrolės ir serverio validavimo klaidas su pakankamu kontekstu", "Trinti žurnalus", "Laikyti juos tik viename kompiuteryje", "Nefiksuoti klaidų"], "c": 0}, {"q": "Kas turėtų sukonfigūruoti efektyvų stebėjimo ir pranešimų procesą?", "a": ["Tik galutiniai vartotojai", "Tik finansai", "Tik rinkodara", "DevSecOps komandos"], "c": 3}, {"q": "Kas yra SSRF?", "a": ["Kai duomenys šifruojami", "Kai serveris per lėtai atsako", "Kai vartotojas pamiršta slaptažodį", "Kai internetinė aplikacija nepakankamai tikrina, kokį nutolusį resursą nori pasiekti vartotojas"], "c": 3}, {"q": "Koks gali būti SSRF pasiekiamas resursas?", "a": ["Serverio vidiniai failai arba debesijos serverio metadata paslauga", "Tik naršyklės istorija", "Tik vartotojo ekranas", "Tik vieša reklama"], "c": 0}, {"q": "Kokia pagrindinė A10 priežastis?", "a": ["Per stiprus slaptažodis", "Centralizuoti žurnalai", "Web aplikacija nevaliduoja vartotojo pateiktų resursų adresų", "MFA naudojimas"], "c": 2}, {"q": "Kokia SSRF apsaugos priemonė minima?", "a": ["Segmentuoti nutolusių resursų prieigos funkcionalumą į atskirus tinklus", "Išjungti validaciją", "Leisti visą srautą", "Siųsti neapdorotus atsakymus klientams"], "c": 0}, {"q": "Ką reiškia „deny by default“ ugniasienės politika A10 kontekste?", "a": ["Leisti tik nežinomą srautą", "Blokuoti visą, išskyrus būtinąjį interneto srautą", "Blokuoti tik vietinį srautą", "Leisti visą interneto srautą"], "c": 1}, {"q": "Ką reikia daryti su vartotojų įvestimi apsaugant nuo SSRF?", "a": ["Sanitizuoti ir validuoti visą vartotojų įvestą informaciją", "Niekada jos netikrinti", "Persiųsti neapdorotą", "Laikyti ją URL"], "c": 0}, {"q": "Koks veiksmas aiškiai nurodytas kaip SSRF apsaugos priemonė?", "a": ["Uždrausti HTTP nukreipimus", "Įjungti visus nukreipimus", "Išjungti ugniasienę", "Leisti nepatikrintus URL"], "c": 0}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}start();
</script></body></html>
