<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>27 tema — Kriptografijos naudojimas informacijos apsaugojime</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>27 tema — Kriptografijos naudojimas informacijos apsaugojime</h1><div class="subtitle">Kriptografijos sąvoka, praktiniai taikymai ir saugumo grėsmės</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 27 temos tema?", "a": ["Apache2 grūdinimas", "Fizinės saugos testavimas", "Kriptografijos naudojimas informacijos apsaugojime", "Kerberos autentifikacija"], "c": 2}, {"q": "Koks paskaitos formatas?", "a": ["Praktinė veikla", "Egzaminas", "Laboratorinis darbas", "Teorija"], "c": 3}, {"q": "Kokia paskaitos trukmė?", "a": ["2 valandos", "8 valandos", "6 valandos", "4 valandos"], "c": 3}, {"q": "Kokios trys pagrindinės paskaitos temos?", "a": ["Fizinė prieiga, CCTV ir RFID", "Kerberos, Ransomware ir MFA", "HTTPS, MySQL ir NAC", "Kriptografijos sąvoka, svarba informacinėse sistemose ir praktinės taikymo sritys"], "c": 3}, {"q": "Kaip apibrėžiama kriptografija?", "a": ["Failų kopijavimas", "Tinklo maršrutizavimas", "Informacijos suspaudimas", "Informacijos paslėpimas, kad tik numatytasis gavėjas galėtų ją perskaityti"], "c": 3}, {"q": "Kas tipiškai naudojama informacijai užšifruoti?", "a": ["Tik IP adresas", "Raktas ir šifravimo algoritmas", "Tik sertifikatas", "Tik vartotojo vardas"], "c": 1}, {"q": "Kas įprastai naudojama ir informacijai užšifruoti, ir iššifruoti pagal pateiktą aprašymą?", "a": ["Tik privatus raktas", "Tas pats raktas", "Tik slaptažodžio hash", "Tik viešas raktas"], "c": 1}, {"q": "Kas nutinka neturint šifravimo rakto?", "a": ["Informacija ištrinama", "Informacija automatiškai iššifruojama", "Informacija iškart tampa vieša", "Originalios informacijos atskleidimas reikalauja labai daug skaičiavimo pajėgumų ir laiko"], "c": 3}, {"q": "Kur taikoma kriptografija informacinėse sistemose?", "a": ["Tik el. paštui", "Tiek informacijai „at rest“, tiek „in transit“", "Tik VPN", "Tik duomenų bazėms"], "c": 1}, {"q": "Ką reiškia „at rest“ šiame kontekste?", "a": ["Informacija saugoma laikmenoje", "Informacija perduodama tinklu", "Informacija pasirašoma", "Informacija siunčiama SMS"], "c": 0}, {"q": "Ką reiškia „in transit“?", "a": ["Informacija perduodama", "Informacija archyvuojama", "Informacija spausdinama", "Informacija saugoma diske"], "c": 0}, {"q": "Kodėl kriptografija svarbi saugiam informacijos perdavimui internetu?", "a": ["Ji skirta tik failų kopijavimui", "Ji tik pagreitina internetą", "Be jos informacija galėtų būti perduodama atviru tekstu ir matoma tame pačiame tinkle esantiems įrenginiams", "Ji pakeičia DNS"], "c": 2}, {"q": "Kokia dar rizika minima be tinklo srauto stebėjimo?", "a": ["Nustoja veikti NFC", "Sugestų DHCP", "Išsijungtų VPN", "Iš pavogto kompiuterio išėmus kaupiklį būtų galima laisvai prieiti prie vartotojo duomenų"], "c": 3}, {"q": "Koks svarbus reikalavimas taikant kriptografiją vartotojo patirties požiūriu?", "a": ["Ji turi reikalauti slaptažodžio kiekvienai operacijai", "Ji turi būti išjungta darbo metu", "Ji turi būti naudojama tik rankiniu būdu", "Ji turi kuo mažiau varžyti vartotoją"], "c": 3}, {"q": "Kas yra HTTPS?", "a": ["Saugų sujungimą su web serveriais užtikrinantis protokolas, papildantis HTTP", "VPN protokolas", "Failų sistemos protokolas", "MFA algoritmas"], "c": 0}, {"q": "Kuo HTTPS paremtas pagal medžiagą?", "a": ["Tik OTP", "TLS sertifikatais ir asimetrine kriptografija", "Tik simetrine kriptografija", "Tik Kerberos"], "c": 1}, {"q": "Kokia naršyklės indikacija minima naudojant HTTPS?", "a": ["NAC piktograma", "Spynelės ikonėlė", "VPN raktas", "Raudonas skydas"], "c": 1}, {"q": "Koks protokolas yra papildomas HTTPS pagrindu?", "a": ["SSH", "HTTP", "FTP", "DHCP"], "c": 1}, {"q": "Kokia tendencija minima apie įprastą HTTP?", "a": ["Beveik nebėra resursų, pasiekiamų įprastiniu HTTP protokolu", "HTTP visiškai pakeitė HTTPS", "HTTP naudojamas tik SSH", "HTTP naudojamas tik VPN"], "c": 0}, {"q": "Kokie kiti protokolai paminėti kaip analogiškai apsaugomi?", "a": ["Kerberos ir TOTP", "FTPS ir IMAPS", "BGP ir OSPF", "NAC ir 802.1X"], "c": 1}, {"q": "Ką reiškia VPN?", "a": ["Verified Public Network", "Virtual Password Node", "Visual Private Node", "Virtual Private Network"], "c": 3}, {"q": "Kaip apibūdinamas VPN?", "a": ["Tik ugniasienė", "Tik Wi-Fi prieigos taškas", "Vietinis fizinis tinklas", "Virtualus privatus tinklas, dinamiškai suformuojamas tarp nutolusių taškų naudojant viešąjį Internetą"], "c": 3}, {"q": "Kas suformuojama tarp nutolusių VPN taškų?", "a": ["Tik VLAN", "Šifruoti duomenų tuneliai", "Tik DNS užklausos", "Tik HTTP ryšiai"], "c": 1}, {"q": "Kas vyksta su VPN duomenų paketais?", "a": ["Jie šifruojami ir inkapsuliuojami naujais antgalviais", "Jie ištrinami", "Jie tik suspaudžiami", "Jie siunčiami atviru tekstu"], "c": 0}, {"q": "Tarp kokių objektų gali būti formuojami VPN tuneliai?", "a": ["Tik tarp serverių", "Tik tarp dviejų telefonų", "Tarp pavienių taškų arba tarp nutolusių tinklų", "Tik tarp Wi-Fi maršrutizatorių"], "c": 2}, {"q": "Koks pavyzdys pateiktas nutolusių tinklų atveju?", "a": ["Tik duomenų centrai", "Ofisai", "Tik telefonai", "Tik vartotojo ir serverio ryšys"], "c": 1}, {"q": "Kas yra SSH?", "a": ["Secure Shell", "Secure Storage Hash", "Server Sharing Hub", "System Security Host"], "c": 0}, {"q": "Kam skirtas SSH?", "a": ["Šifruoti kaupiklius", "Valdyti kameras", "Valdyti praėjimo korteles", "Prisijungti prie nutolusių serverių komandinės eilutės"], "c": 3}, {"q": "Kokia kriptografija naudojama SSH aprašyme?", "a": ["Tik simetrinė kriptografija", "Tik OTP", "Tik hash funkcijos", "Asimetrinė kriptografija"], "c": 3}, {"q": "Kokį protokolą pakeitė SSH?", "a": ["Nešifruotą Telnet", "FTP", "HTTP", "DHCP"], "c": 0}, {"q": "Kur SSH dažniausiai sutinkamas?", "a": ["Tik duomenų bazėse", "*nix tipo operacinėse sistemose", "Tik Windows", "Tik mobiliuosiuose telefonuose"], "c": 1}, {"q": "Koks SSH analogas Windows šeimos OS nurodytas medžiagoje?", "a": ["NVR", "WinRM", "RDP", "NAC"], "c": 1}, {"q": "Kas yra skaitmeninis parašas?", "a": ["VPN tunelis", "MFA kodas", "Failų suspaudimo būdas", "Priemonė įrodyti savo tapatybę naudojantis informacinėmis sistemomis"], "c": 3}, {"q": "Kokia teisinė vertė dažnai priskiriama skaitmeniniam parašui?", "a": ["Tik techninė vertė", "Dauguma atvejų tokia pati kaip asmens parašo ant popieriaus", "Neturi teisinės vertės", "Visada mažesnė už popierinį parašą"], "c": 1}, {"q": "Kokia kriptografija naudojama skaitmeniniam parašui?", "a": ["Tik simetrinė kriptografija", "Asimetrinė kriptografija", "Tik OTP", "Tik hash be raktų"], "c": 1}, {"q": "Kokia infrastruktūra minima kartu su skaitmeniniu parašu?", "a": ["NAC", "DHCP", "Viešojo rakto infrastruktūra (PKI)", "NVR"], "c": 2}, {"q": "Ką gauna asmuo skaitmeninio parašo naudojimo atveju?", "a": ["Skaitmeninį sertifikatą", "TOTP kodą", "VPN tunelį", "TGT"], "c": 0}, {"q": "Kas išduoda skaitmeninį sertifikatą pagal medžiagą?", "a": ["DHCP serveris", "Bet kuris vartotojas", "Web serveris", "Institucija, kuria pasitiki visos sutartį sudarančios šalys"], "c": 3}, {"q": "Kokia informacija gali būti užšifruota kaupiklyje?", "a": ["Tik VPN konfigūracija", "Kompiuterio ar serverio SSD arba HDD saugoma informacija", "Tik el. laiškai", "Tik tinklo paketai"], "c": 1}, {"q": "Koks gali būti kaupiklio šifravimo raktas pagal medžiagą?", "a": ["Slaptažodis, naudojamas prisijungti prie operacinės sistemos", "NVR raktas", "IP adresas", "Username"], "c": 0}, {"q": "Kada nauja informacija užšifruojama?", "a": ["Tik kartą per savaitę", "Tik vartotojui paspaudus mygtuką", "Automatiškai, kai ji įrašoma į kaupiklį", "Tik išjungiant kompiuterį"], "c": 2}, {"q": "Kokie raktai naudojami kaupiklių šifravimui?", "a": ["Tik TOTP raktai", "Tik SSH raktai", "Tik asimetriniai raktai", "Simetriniai šifravimo raktai"], "c": 3}, {"q": "Kokia kaupiklių šifravimo sistema minima Windows OS?", "a": ["Kerberos", "BitLocker", "NAC", "OpenVPN"], "c": 1}, {"q": "Koks pagrindinis kaupiklių šifravimo tikslas?", "a": ["Valdyti tinklo prieigą", "Generuoti MFA kodus", "Apsaugoti saugomą informaciją", "Pagreitinti procesorių"], "c": 2}, {"q": "Kuo remiasi kriptografijos saugumo principas?", "a": ["Neturint rakto reikia labai daug laiko ir skaičiavimo pajėgumų raktui atspėti", "Informacija turi būti siunčiama atviru tekstu", "Raktas turi būti vieno simbolio", "Raktas turi būti viešas"], "c": 0}, {"q": "Kada šifravimo raktas laikomas nepakankamai saugiu pagal pateiktą kriterijų?", "a": ["Kai tikėtinas rakto atspėjimo laikas yra trumpesnis už laiką, kurį informacija išliks aktuali", "Kai naudojamas VPN", "Kai raktas yra ilgas", "Kai naudojamas HTTPS"], "c": 0}, {"q": "Kuris rakto požymis yra esminis informacijos saugai?", "a": ["Ilgis, sudėtingumas ir nenuspėjamumas", "Vartotojo vardas", "Spalva", "Failo pavadinimas"], "c": 0}, {"q": "Ar vien stiprus algoritmas visada garantuoja saugumą?", "a": ["Tik jei naudojamas HTTP", "Taip, visada", "Tik jei naudojamas VPN", "Ne, nes nesaugi gali būti ir algoritmo implementacija"], "c": 3}, {"q": "Kas gali nutikti, jei kriptografiniame algoritme randama loginė klaida?", "a": ["Automatiškai įjungiamas MFA", "Užšifruota informacija gali būti atskleista greičiau ar paprasčiau", "Informacija tampa dar saugesnė", "Padidėja rakto ilgis"], "c": 1}, {"q": "Kada kriptografinis algoritmas vertinamas kaip nesaugus?", "a": ["Kai jis naudojamas HTTPS", "Kai jis naudoja raktą", "Kai aptinkama spraga, leidžianti informaciją atskleisti lengviau nei tikintis atsitiktinio rakto atspėjimo", "Kai jis veikia internete"], "c": 2}, {"q": "Kuo remiasi dabartiniai paplitę kriptografiniai standartai?", "a": ["NFC dažniu", "Wi-Fi aprėptimi", "Interneto greičiu", "Egzistuojančių kompiuterių ribotumu laužant kriptografinius protokolus"], "c": 3}, {"q": "Kokia technologija gali kelti grėsmę dabartiniams kriptografiniams standartams?", "a": ["NVR", "DHCP", "Kvantiniai kompiuteriai", "RFID"], "c": 2}, {"q": "Kada, pagal medžiagą, kvantiniai kompiuteriai gali tapti pajėgūs kai kuriuos dabartinius standartus paversti nesaugiais?", "a": ["Jau kitą dieną", "Per ateinantį dešimtmetį", "Per 100 metų", "Per vieną savaitę"], "c": 1}, {"q": "Kas kuriama reaguojant į kvantinių kompiuterių plėtrą?", "a": ["Naujos RFID kortelės", "Kvantiniams kompiuteriams atsparūs kriptografiniai standartai", "Nauji DHCP serveriai", "Nauji NVR"], "c": 1}, {"q": "Koks vienas iššūkis kuriant naujus kriptografinius algoritmus?", "a": ["Kad jiems nereikėtų raktų", "Kad jie naudotų tik HTTP", "Kad jie veiktų tik viename kompiuteryje", "Užtikrinti, kad jie būtų pakankamai greiti įprastuose kompiuteriuose ir atsparūs daug greitesnių kriptografinių operacijų įrenginių atakoms"], "c": 3}, {"q": "Koks kriterijus ypač svarbus šifravimo rakto saugumui?", "a": ["Spalva", "Nenuspėjamumas", "Monitoriaus raiška", "Failo formatas"], "c": 1}, {"q": "Kas gali būti nesaugu net naudojant teoriškai saugų algoritmą?", "a": ["Tik VPN kabelis", "Tik NVR", "Tik vartotojo monitorius", "Jo implementacija"], "c": 3}, {"q": "Kuris pavyzdys yra praktinis kriptografijos taikymas kasdienėje veikloje?", "a": ["NVR", "RFID", "DHCP", "HTTPS"], "c": 3}, {"q": "Kuris pavyzdys skirtas šifruotam ryšiui tarp nutolusių taškų?", "a": ["CCTV", "Skaitmeninis parašas", "BitLocker", "VPN"], "c": 3}, {"q": "Kuris pavyzdys skirtas saugiam prisijungimui prie nutolusio serverio komandinės eilutės?", "a": ["BitLocker", "HTTPS", "SSH", "VPN"], "c": 2}, {"q": "Kuris pavyzdys skirtas tapatybės įrodymui informacinėje sistemoje?", "a": ["BitLocker", "Skaitmeninis parašas", "HTTPS", "VPN"], "c": 1}, {"q": "Kuris pavyzdys skirtas informacijai kaupiklyje apsaugoti?", "a": ["SSH", "HTTPS", "Kaupiklio šifravimas", "VPN"], "c": 2}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
