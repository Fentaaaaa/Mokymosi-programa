<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>28 tema — Pažintis su Linux</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>28 tema — Pažintis su Linux</h1><div class="subtitle">Linux šeimos OS, valdymas, failų sistemos, teisės ir saugumo priemonės</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kas yra Linux?", "a": ["Komercinė duomenų bazė", "Atviro kodo OS branduolys", "Failų perdavimo protokolas", "Tinklo ugniasienė"], "c": 1}, {"q": "Kada sukurta pirmoji Linux versija?", "a": ["1985 metais", "1991 metais", "2010 metais", "2001 metais"], "c": 1}, {"q": "Kas yra Linux kūrėjas?", "a": ["Richard Stallman", "Linus Torvalds", "Dennis Ritchie", "Ken Thompson"], "c": 1}, {"q": "Kokia kalba buvo naudojama Linux rašyti?", "a": ["Python", "C#", "Java", "C"], "c": 3}, {"q": "Koks Linux požymis pabrėžiamas medžiagoje?", "a": ["Ypatingas kustomizavimas ir moduliškumas", "Uždara architektūra", "Tik vienas naudojimo scenarijus", "Tik grafinė sąsaja"], "c": 0}, {"q": "Kas yra pilna GNU/Linux operacinė sistema?", "a": ["Tik failų sistema", "Tik shell", "Šiuolaikinė distribucija, pvz., Ubuntu, RHEL, SUSE ar Arch Linux", "Tik Linux branduolys"], "c": 2}, {"q": "Kur Linux ypač populiari?", "a": ["Tik žaidimų konsolėse", "Integruotose sistemose, serveriuose ir mobiliuose įrenginiuose", "Tik biuro kompiuteriuose", "Tik spausdintuvuose"], "c": 1}, {"q": "Ar Linux turi vieną numatytąją grafinę aplinką?", "a": ["Taip, XFCE", "Taip, GNOME", "Taip, KDE", "Ne"], "c": 3}, {"q": "Kuri yra Linux grafinė aplinka?", "a": ["APT", "KDE", "systemd", "NFS"], "c": 1}, {"q": "Kuri iš šių taip pat yra Linux grafinė aplinka?", "a": ["YUM", "GNOME", "LVM", "Cron"], "c": 1}, {"q": "Kuri iš šių yra Linux grafinė aplinka?", "a": ["SSH", "SCP", "UFW", "XFCE"], "c": 3}, {"q": "Kuri iš šių yra Linux grafinė aplinka?", "a": ["LXDE", "NFS", "APT", "VNC"], "c": 0}, {"q": "Ar Linux grafinę aplinką galima pakeisti?", "a": ["Tik naudojant VNC", "Taip", "Tik serveriuose", "Ne"], "c": 1}, {"q": "Kas įprastai naudojama Linux serveriuose vietoje grafinės aplinkos?", "a": ["Komandinė eilutė (shell)", "CPanel", "VNC", "KDE"], "c": 0}, {"q": "Ką reiškia failinė sistema Linux aplinkoje?", "a": ["Ji skirta tik tinklo maršrutizavimui", "Ji yra grafinė aplinka", "Ji apibrėžia duomenų saugojimo struktūrą ir savybes, pvz., talpos bei failo dydžio ribas", "Ji valdo tik vartotojų slaptažodžius"], "c": 2}, {"q": "Kuri yra Linux failinė sistema?", "a": ["NTLM", "BGP", "EXT4", "HTTP"], "c": 2}, {"q": "Kuri yra Linux failinė sistema?", "a": ["TLS", "XFS", "SSH", "DHCP"], "c": 1}, {"q": "Kuri yra Linux failinė sistema?", "a": ["VNC", "BTRFS", "VPN", "SCP"], "c": 1}, {"q": "Ką apibrėžia katalogų struktūra?", "a": ["Tik procesų prioritetus", "Tik tinklo prievadus", "Tik vartotojų grupes", "Esminių sistemai reikalingų katalogų bei failų lokacijas"], "c": 3}, {"q": "Kuo Linux loginė katalogų struktūra skiriasi nuo fizinių įrenginių?", "a": ["Fizinių įrenginių Linux neturi", "Yra aiškus jų atskyrimas", "Jie yra tas pats objektas", "Katalogai yra tik grafiniai"], "c": 1}, {"q": "Koks yra fizinio disko įrenginio pavyzdys?", "a": ["/home/user", "/dev/sda", "/var/log", "/etc/passwd"], "c": 1}, {"q": "Kas vyksta su disko skirsniais prieš naudojimą informacijos rašymui ir skaitymui?", "a": ["Jie visada konvertuojami į RAM", "Jie siunčiami per SSH", "Jie paleidžiami kaip procesai", "Jie formatuojami ir prijungiami (mounted)"], "c": 3}, {"q": "Ką reiškia NFS?", "a": ["Node File Server", "Network Firewall Service", "Network File System", "New File Security"], "c": 2}, {"q": "Kam skirtas NFS?", "a": ["Tik disko šifravimui", "Tik nuotoliniam darbalaukiui", "Tik paketų diegimui", "Failų perdavimui per tinklą nesijungiant prie sistemos interaktyviai"], "c": 3}, {"q": "Koks Windows analogas minimas NFS?", "a": ["SMB", "RDP", "NTFS", "WinRM"], "c": 0}, {"q": "Kokius prievadus naudoja NFS pagal medžiagą?", "a": ["TCP 2049 ir 111", "TCP 22 ir 80", "UDP 53 ir 67", "TCP 443 ir 5900"], "c": 0}, {"q": "Ar NFS sujungimai tarp kliento ir serverio gali būti šifruojami?", "a": ["Taip", "Ne", "Tik naudojant Cron", "Tik naudojant VNC"], "c": 0}, {"q": "Koks įrankis dažniau naudojamas greitam failų kopijavimui/perdavimui?", "a": ["VNC", "APT", "SCP", "NFS"], "c": 2}, {"q": "Kuo paremtas SCP failų perdavimas?", "a": ["NFS", "SSH", "Cron", "HTTP"], "c": 1}, {"q": "Ką reiškia LVM?", "a": ["Local Volume Monitor", "Logical Volume Manager", "Linux Virtual Machine", "Logical Virtual Module"], "c": 1}, {"q": "Kam skirtas LVM?", "a": ["Diegti tik grafines aplinkas", "Valdyti tik tinklo vartotojus", "Šifruoti tik HTTP srautą", "Valdyti blokinius duomenų kaupiklius, juos dalinti į skirsnius ir apjungti į logines grupes"], "c": 3}, {"q": "Kokius kaupiklius gali valdyti LVM?", "a": ["Tik RAM", "HDD ar SSD", "Tik tinklo adapterius", "Tik USB peles"], "c": 1}, {"q": "Kokį lankstumą suteikia LVM?", "a": ["Galima pakeisti Linux branduolį be perkrovimo", "Galima automatiškai įjungti VPN", "Galima pakeisti CPU architektūrą", "Vieno fizinio disko skirsnį galima praplėsti vieta iš kito fizinio disko"], "c": 3}, {"q": "Kas yra daemon Linux aplinkoje?", "a": ["Grafinė aplinka", "Failų sistema", "Automatiškai startuojantis ir fone veikiantis procesas", "Paketų repozitorija"], "c": 2}, {"q": "Kas yra systemd?", "a": ["Grafinė aplinka", "Pagrindinis servisų valdymo ir konfigūravimo įrankis", "Paketų formatas", "Failų perdavimo protokolas"], "c": 1}, {"q": "Ką pakeitė systemd?", "a": ["SysVinit", "APT", "VNC", "NFS"], "c": 0}, {"q": "Kuri komanda skirta procesams peržiūrėti?", "a": ["apt", "scp", "ufw", "ps"], "c": 3}, {"q": "Kuri kita komanda skirta procesų medžiui peržiūrėti?", "a": ["pstree", "cron", "systemctl", "mount"], "c": 0}, {"q": "Kokia komanda skirta servisų valdymui?", "a": ["scp", "systemctl", "apt", "ps"], "c": 1}, {"q": "Kodėl Linux OS saugumo atnaujinimai yra būtini?", "a": ["Tik vartotojų sukūrimui", "Tik grafinei aplinkai pakeisti", "Tik failų kopijavimui", "Tinkamam operacinės sistemos saugumo lygiui užtikrinti"], "c": 3}, {"q": "Iš kur diegiami Linux saugumo atnaujinimai?", "a": ["Iš viešų ar privačių paketų repozitorijų", "Tik iš VNC serverio", "Tik iš USB laikmenos", "Tik iš BIOS"], "c": 0}, {"q": "Ar Linux repozitorijos gali būti papildomai pridedamos?", "a": ["Tik Windows aplinkoje", "Ne", "Tik naudojant VNC", "Taip"], "c": 3}, {"q": "Kam naudojamos paketų valdymo sistemos?", "a": ["Tik failų šifravimui", "Programinės įrangos diegimui ir paketų valdymui", "Tik procesų stebėjimui", "Tik nuotoliniam darbalaukiui"], "c": 1}, {"q": "Kokios paketų valdymo sistemos paminėtos?", "a": ["NFS ir SCP", "APT ir YUM", "LVM ir Cron", "SSH ir VNC"], "c": 1}, {"q": "Ką leidžia valdyti paketų valdymo sistemos be pačių paketų?", "a": ["Tik IP adresą", "Paketų priklausomybes", "Tik monitoriaus raišką", "Tik failų teises"], "c": 1}, {"q": "Kokia komanda atnaujina APT repozitorijų sąrašus?", "a": ["apt upgrade", "apt remove", "apt update", "apt install"], "c": 2}, {"q": "Kokia komanda atnaujina įdiegtus paketus?", "a": ["apt upgrade", "apt update", "apt remove", "apt install"], "c": 0}, {"q": "Kokia komanda diegia aplikaciją Ubuntu Linux?", "a": ["apt upgrade", "apt install", "apt remove", "apt update"], "c": 1}, {"q": "Kokia komanda pašalina aplikaciją Ubuntu Linux?", "a": ["apt remove", "apt upgrade", "apt install", "apt update"], "c": 0}, {"q": "Kokia yra pagrindinė Linux OS konfigūravimo priemonė?", "a": ["LVM", "Shell", "VNC", "NFS"], "c": 1}, {"q": "Kuris yra konfigūracijos valdymo įrankis?", "a": ["NFS", "Ansible", "BitLocker", "Firefox"], "c": 1}, {"q": "Kuris taip pat yra konfigūracijos valdymo įrankis?", "a": ["APT", "Puppet", "SSH", "SCP"], "c": 1}, {"q": "Kuris įrankis veikia naršyklėje ir gali būti naudojamas Linux konfigūravimui?", "a": ["NFS", "LVM", "Cron", "Webmin"], "c": 3}, {"q": "Kuris įrankis taip pat gali būti naudojamas naršyklėje?", "a": ["systemd", "YUM", "Cockpit", "SCP"], "c": 2}, {"q": "Koks protokolas naudojamas nuotoliniam Linux operacinių sistemų konfigūravimui?", "a": ["DHCP", "SSH", "HTTP", "NFS"], "c": 1}, {"q": "Ką leidžia konfigūracijų valdymo įrankiai dideliame serverių kiekyje?", "a": ["Tik keisti DNS", "Tik kopijuoti failus rankiniu būdu", "Palaikyti pageidaujamą operacinės sistemos konfigūraciją", "Tik stebėti ekranus"], "c": 2}, {"q": "Kas yra VNC?", "a": ["Virtual Network Control", "Virtual Node Configuration", "Virtual Network Computing", "Verified Network Connection"], "c": 2}, {"q": "Ką suteikia VNC?", "a": ["Tik paketų diegimą", "Pilną grafinę prieigą prie Linux ar Windows operacinės sistemos ir jos grafinės aplinkos", "Tik komandinės eilutės prieigą", "Tik failų perdavimą"], "c": 1}, {"q": "Kokia sąlyga reikalinga VNC naudojimui pagal medžiagą?", "a": ["Turi būti įdiegtas NFS", "Turi būti išjungtas SSH", "Operacinė sistema turi jau turėti grafinę sąsają", "Turi būti naudojamas LVM"], "c": 2}, {"q": "Ar VNC gali palaikyti daug to paties vartotojo sesijų?", "a": ["Tik Windows", "Taip", "Ne", "Tik Ubuntu Server"], "c": 1}, {"q": "Kokį TCP prievadą naudoja VNC?", "a": ["22", "2049", "5900", "111"], "c": 2}, {"q": "Kokios teisės priskiriamos Linux failui ar katalogui?", "a": ["send, receive, route", "read, write, execute", "start, stop, delete", "open, close, mount"], "c": 1}, {"q": "Koks simbolis reiškia read teisę?", "a": ["w", "r", "d", "x"], "c": 1}, {"q": "Koks simbolis reiškia write teisę?", "a": ["r", "d", "x", "w"], "c": 3}, {"q": "Koks simbolis reiškia execute teisę?", "a": ["x", "w", "d", "r"], "c": 0}, {"q": "Koks skaitinis dydis atitinka read teisę?", "a": ["2", "4", "0", "1"], "c": 1}, {"q": "Koks skaitinis dydis atitinka write teisę?", "a": ["2", "0", "1", "4"], "c": 0}, {"q": "Koks skaitinis dydis atitinka execute teisę?", "a": ["1", "0", "4", "2"], "c": 0}, {"q": "Kam priklauso failo ar katalogo teisių rinkiniai?", "a": ["Tik administratoriui", "Tik root vartotojui", "Tik grupei", "Savininkui, grupei ir visiems kitiems"], "c": 3}, {"q": "Kokie specialūs teisių mechanizmai paminėti?", "a": ["SUID, SGID ir Sticky Bit", "TLS, VPN ir VNC", "APT, YUM ir LVM", "NFS, SCP ir SSH"], "c": 0}, {"q": "Kam skirtas Cron?", "a": ["Periodiniam komandų paleidimui", "Tinklo ugniasienei", "Failų šifravimui", "Vartotojų kūrimui"], "c": 0}, {"q": "Kokia Linux ugniasienė minima kaip populiariausia?", "a": ["LVM", "Cron", "NFS", "IPtables"], "c": 3}, {"q": "Kokia supaprastinta IPtables sąsaja naudojama Ubuntu?", "a": ["SCP", "UFW", "VNC", "SSH"], "c": 1}, {"q": "Ką reiškia UFW?", "a": ["Uncomplicated FireWall", "Unified Web Firewall", "Universal File Writer", "User Firewall Wrapper"], "c": 0}, {"q": "Kokia komanda leidžia UFW per TCP atverti 80 prievadą?", "a": ["systemctl allow 80", "apt install 80/tcp", "sudo ufw deny 80/tcp", "sudo ufw allow 80/tcp"], "c": 3}, {"q": "Ką daro pateikta iptables taisyklė su TCP 80 prievadu?", "a": ["Leidžia įeinantį TCP srautą į 80 prievadą", "Paleidžia SSH", "Įjungia VNC", "Blokuoja visą TCP srautą"], "c": 0}, {"q": "Kuri praktinė užduotis minima Ubuntu Linux aplinkoje?", "a": ["Active Directory diegimas", "Windows registro keitimas", "Papildomų repozitorijų pridėjimas", "BitLocker konfigūracija"], "c": 2}, {"q": "Kokia kita praktinė užduotis minima?", "a": ["Sukurti VPN tarp ofisų", "Parašyti skriptą ir sukonfigūruoti jį veikti kaip servisą", "Sukurti Windows GPO", "Įdiegti NFS į Windows"], "c": 1}, {"q": "Kaip tą patį skriptą dar galima paleisti periodiškai?", "a": ["Naudojant VNC", "Naudojant NFS", "Naudojant LVM", "Naudojant Cron"], "c": 3}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
