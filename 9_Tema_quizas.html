<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9 Tema – Komunikacijos plano parengimas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#4f46e5}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#818cf8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:25px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}
button{font:inherit}#themeBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.progress{color:var(--muted);font-size:14px;margin-bottom:12px}.question{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:20px}
.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.answer.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.answer.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444}body.dark .answer.correct{background:#14532d;color:#dcfce7}
body.dark .answer.wrong{background:#7f1d1d;color:#fee2e2}.next{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;cursor:pointer;font-weight:700;font-size:16px}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:46px;font-weight:800;margin:10px 0}
.small{color:var(--muted)}.hidden{display:none}.restart{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="container">
<div class="top"><div><h1>9 Tema – Komunikacijos plano parengimas</h1><div class="subtitle">10 random questions per attempt</div></div>
<button id="themeBtn">🌙 Dark mode</button></div>
<div id="quiz" class="card"><div class="progress" id="progress"></div><div class="question" id="question"></div>
<div class="answers" id="answers"></div><button class="next" id="next" disabled>Kitas klausimas →</button></div>
<div id="result" class="card result hidden"><h2>Quiz baigtas!</h2><div class="score" id="score"></div><div class="small" id="percent"></div>
<button class="restart" onclick="startQuiz()">Bandyti dar kartą</button></div>
</div>
<script>
const bank=[{"q": "Koks yra pagrindinis vidinės komunikacijos protokolų tikslas?", "a": ["Sukurti naują organizacijos struktūrą", "Užtikrinti savalaikę ir veiksmingą komunikaciją organizacijoje incidento metu", "Pakeisti visas IT sistemas", "Sumažinti darbuotojų skaičių"], "c": 1}, {"q": "Ką turi nustatyti krizės valdymo komandos komunikacija?", "a": ["Tik viešųjų ryšių biudžetą", "Tik tiekėjų kainas", "Tik darbuotojų atlyginimus", "Pagrindinius kontaktus ir komunikacijos srautą komandoje"], "c": 3}, {"q": "Kas yra vidinis pranešimų mechanizmas?", "a": ["Sistema klientams pateikti sąskaitas", "Sistema darbuotojams pranešti apie incidentus", "Tiekėjų vertinimo sistema", "Rinkodaros kampanijų sistema"], "c": 1}, {"q": "Kuris pavyzdys pateikiamas kaip vidinis pranešimų mechanizmas?", "a": ["Viešas interneto forumas", "Tiekėjo interneto svetainė", "Karštoji linija arba specialus el. paštas", "Socialinių tinklų reklama"], "c": 2}, {"q": "Ką reikia nustatyti komunikacijos kanalų srityje?", "a": ["Tik socialinių tinklų kanalus", "Pagrindinius ir atsarginius komunikacijos metodus", "Tik išorinės komunikacijos kanalus", "Tik vieną komunikacijos kanalą"], "c": 1}, {"q": "Kuris kanalas minimas kaip galimas komunikacijos metodas?", "a": ["El. paštas", "Tik spauda", "Tik televizija", "Tik telefono skambučiai"], "c": 0}, {"q": "Kodėl ruošiami pranešimų šablonai?", "a": ["Kad juos būtų galima greitai panaudoti incidento metu", "Kad būtų sumažintas darbuotojų skaičius", "Kad būtų sudarytos tiekėjų sutartys", "Kad būtų pakeistas BCP"], "c": 0}, {"q": "Kodėl vidinė komunikacija būtina incidento metu?", "a": ["Kad būtų galima sustabdyti visas paslaugas", "Kad nereikėtų incidentų valdymo", "Kad būtų išvengta atsarginių kopijų", "Kad suinteresuotieji asmenys būtų informuoti ir veiktų sinchroniškai"], "c": 3}, {"q": "Ką turi žinoti darbuotojai įvykus saugumo pažeidimui?", "a": ["Kokį tiekėją pasirinkti", "Kokį reklamos kanalą naudoti", "Su kuo susisiekti", "Kokį produktą pirkti"], "c": 2}, {"q": "Kuo padeda iš anksto paruošti pranešimų šablonai?", "a": ["Palengvina komunikaciją incidento metu ir užtikrina prieigą prie aktualios informacijos", "Pakeičia RTO ir RPO", "Panaikina incidento poveikį", "Pakeičia visą komunikacijos planą"], "c": 0}, {"q": "Koks yra pagrindinis išorinės komunikacijos protokolų tikslas?", "a": ["Sukurti naują BCP", "Užtikrinti savalaikę komunikaciją su išoriniais suinteresuotaisiais asmenimis", "Pakeisti incidentų valdymo komandą", "Užtikrinti tik vidinę komunikaciją"], "c": 1}, {"q": "Kokie asmenys ar organizacijos minimi kaip išoriniai suinteresuotieji asmenys?", "a": ["Tik darbuotojai", "Klientai, partneriai, tiekėjai ir reguliuotojai", "Tik vadovai", "Tik IT administratoriai"], "c": 1}, {"q": "Per kiek laiko pagal pateiktą medžiagą reikia pranešti incidentus nacionalinėms CERT arba CSIRT?", "a": ["Per 12 valandų", "Per 48 valandas", "Per 7 dienas", "Per 24 valandas"], "c": 3}, {"q": "Kada turi būti pateikta išsami tolesnė ataskaita?", "a": ["Per 12 valandų", "Per 24 valandas", "Per 7 dienas", "Per 72 valandas"], "c": 3}, {"q": "Ką reikia pateikti išsamioje 72 valandų ataskaitoje?", "a": ["Incidento priežastį, poveikį ir šalinimo veiksmus", "Tik darbuotojų sąrašą", "Tik incidento pavadinimą", "Tik tiekėjo kontaktus"], "c": 0}, {"q": "Ką reikia daryti reguliavimo institucijoms, kai atsiranda daugiau informacijos?", "a": ["Pateikti tik vieną galutinę ataskaitą", "Nuolat atnaujinti informaciją", "Laukti iki metų pabaigos", "Nutraukti komunikaciją"], "c": 1}, {"q": "Kokia yra pradinės 24 valandų ataskaitos paskirtis?", "a": ["Pateikti incidento apžvalgą", "Pateikti tiekėjų vertinimą", "Pateikti metinę finansinę ataskaitą", "Pateikti galutinę incidento analizę"], "c": 0}, {"q": "Ką suteikia 72 valandų išsami ataskaita?", "a": ["Gilesnę incidento analizę, įskaitant priežastis ir šalinimo žingsnius", "Tik kontaktinių asmenų sąrašą", "Tik komunikacijos kanalų sąrašą", "Tik pradinį incidento pavadinimą"], "c": 0}, {"q": "Kodėl svarbus nuolatinis informacijos atnaujinimas reguliuotojams?", "a": ["Kad nereikėtų testuoti plano", "Kad būtų galima pakeisti BCP", "Kad reguliuotojai būtų informuoti, kai situacija keičiasi", "Kad būtų galima nutraukti incidento valdymą"], "c": 2}, {"q": "Koks yra pranešimų nuoseklumo ir koordinavimo tikslas?", "a": ["Užtikrinti tik viešųjų ryšių veiklą", "Užtikrinti, kad komunikacija būtų kuo retesnė", "Užtikrinti, kad komunikacija būtų koordinuota, aiški ir nuosekli", "Užtikrinti tik vidinę komunikaciją"], "c": 2}, {"q": "Kam skirtas išorinių komunikacijų patvirtinimo procesas?", "a": ["Patvirtinti pranešimus prieš juos išsiunčiant", "Atkurti sistemas", "Pakeisti darbuotojų roles", "Valdyti atsargines kopijas"], "c": 0}, {"q": "Kokiems pranešimams gali būti taikomas patvirtinimo procesas?", "a": ["Tik techninėms atsarginėms kopijoms", "Tik vidiniams darbuotojų laiškams", "Pranešimams klientams ir žiniasklaidai", "Tik tiekėjų sąskaitoms"], "c": 2}, {"q": "Kodėl reikia derinti vidinius ir išorinius pranešimus?", "a": ["Kad būtų sumažintas darbuotojų skaičius", "Kad nebūtų prieštaringos informacijos", "Kad būtų išvengta BCP testavimo", "Kad nereikėtų reguliuotojų"], "c": 1}, {"q": "Ką reikia teikti visiems suinteresuotiesiems asmenims, kai situacija keičiasi?", "a": ["Tik metines ataskaitas", "Tik pradinius pranešimus", "Tik galutinę ataskaitą", "Reguliarius atnaujinimus"], "c": 3}, {"q": "Kodėl pranešimų nuoseklumas yra būtinas?", "a": ["Kad būtų sumažintas komunikacijos kiekis", "Kad būtų išvengta darbuotojų mokymų", "Kad būtų išvengta nesusipratimų ar dezinformacijos", "Kad nereikėtų BCP"], "c": 2}, {"q": "Koks procesas padeda užtikrinti, kad pranešimai būtų patikrinti prieš išsiunčiant?", "a": ["Atsarginių kopijų procesas", "Centralizuotas patvirtinimo procesas", "DRP atkūrimo procesas", "Tiekėjų atrankos procesas"], "c": 1}, {"q": "Koks yra komunikacijos plano testavimo ir peržiūros tikslas?", "a": ["Atsisakyti vidinės komunikacijos", "Pakeisti visus darbuotojus", "Reguliariai testuoti ir tobulinti planą, kad jis būtų veiksmingas tikro incidento metu", "Sukurti naują komunikacijos kanalą kas mėnesį"], "c": 2}, {"q": "Ką reikia daryti per stalo pratybas komunikacijos plano kontekste?", "a": ["Pateikti reguliuotojui galutinę ataskaitą", "Simuliuoti incidentus ir patikrinti komunikacijos protokolus", "Atkurti visas sistemas iš atsarginių kopijų", "Keisti tiekėjų sutartis"], "c": 1}, {"q": "Ką leidžia patikrinti stalo pratybos?", "a": ["Tik finansines ataskaitas", "Komunikacijos žingsnius kontroliuojamoje aplinkoje", "Tik darbuotojų skaičių", "Tik techninės įrangos kainą"], "c": 1}, {"q": "Kas yra simuliuotos pratybos komunikacijos plano kontekste?", "a": ["Tik dokumento skaitymas", "Pratybos, kuriose komunikacijos testai įtraukiami į realias pratybas", "Tik darbuotojų mokymai", "Tik tiekėjų apklausa"], "c": 1}, {"q": "Ką padeda įvertinti simuliuotos pratybos?", "a": ["Kaip komanda reaguoja realiuoju laiku", "Tik dokumentacijos apimtį", "Tik tiekėjų kainas", "Tik klientų skaičių"], "c": 0}, {"q": "Ką reikia atlikti po komunikacijos plano testų?", "a": ["Testų aptarimą, siekiant nustatyti spragas ir tobulinti planą", "Pakeisti visus komunikacijos kanalus", "Nutraukti visas komunikacijas", "Ištrinti komunikacijos planą"], "c": 0}, {"q": "Ką reikia daryti nustačius komunikacijos plano spragas?", "a": ["Nutraukti testavimą", "Ignoruoti jas", "Tobulinti ir atnaujinti komunikacijos planą", "Panaikinti pranešimų šablonus"], "c": 2}, {"q": "Kuo naudinga reguliari komunikacijos plano testavimo praktika?", "a": ["Ji padeda užtikrinti plano veiksmingumą tikro incidento metu", "Ji pakeičia BCP", "Ji pašalina poreikį komunikuoti", "Ji panaikina visus incidentus"], "c": 0}, {"q": "Kuo stalo pratybos skiriasi nuo simuliuotų pratybų?", "a": ["Stalo pratybos visada atkuria sistemas, o simuliuotos tik diskutuoja", "Jos yra visiškai identiškos", "Stalo pratybos vyksta kontroliuojamoje diskusijų aplinkoje, o simuliuotos pratybos testuoja reakciją realiuoju laiku", "Simuliuotos pratybos vyksta tik raštu"], "c": 2}, {"q": "Kokia yra CERT arba CSIRT paskirtis šiame komunikacijos kontekste?", "a": ["Valdyti darbuotojų atostogas", "Atlikti tiekėjų atranką", "Gauti pranešimus apie incidentus pagal nustatytus terminus", "Tvirtinti rinkodaros kampanijas"], "c": 2}, {"q": "Kam skirti klientų pranešimai incidento metu?", "a": ["Tik žiniasklaidai", "Tik IT administratoriui", "Tik darbuotojams", "Paveiktiems klientams informuoti aiškiais ir skaidriais pranešimais"], "c": 3}, {"q": "Kodėl reikia informuoti svarbius tiekėjus ir partnerius?", "a": ["Kad jie taptų reguliuotojais", "Kad jie valdytų vidinę komunikaciją", "Jų paslaugos gali būti paveiktos incidento metu", "Kad jie pakeistų BCP"], "c": 2}, {"q": "Kada gali būti reikalingi viešieji ryšiai?", "a": ["Kai būtina paruošti pranešimus žiniasklaidai ir valdyti viešuosius ryšius", "Tik kuriant atsargines kopijas", "Tik atliekant darbuotojų mokymus", "Tik vertinant RPO"], "c": 0}, {"q": "Koks yra vienas pagrindinių komunikacijos plano komponentų?", "a": ["Tiekėjo pelno ataskaita", "Pranešimų šablonai", "Darbuotojų atostogų grafikas", "Produktų kainoraštis"], "c": 1}, {"q": "Ką turi užtikrinti pagrindiniai ir atsarginiai komunikacijos metodai?", "a": ["Kad komunikacija galėtų vykti ir sutrikus pagrindiniam kanalui", "Kad būtų naudojamas tik vienas kanalas", "Kad būtų išvengta išorinės komunikacijos", "Kad būtų panaikinti pranešimų šablonai"], "c": 0}, {"q": "Ką turi užtikrinti aiškios pranešimo linijos?", "a": ["Kad darbuotojai žinotų, su kuo susisiekti saugumo pažeidimo atveju", "Kad klientai žinotų tiekėjų kainas", "Kad tiekėjai valdytų BCP", "Kad reguliuotojai valdytų vidinę komunikaciją"], "c": 0}, {"q": "Kuris terminas taikomas pradinei incidento ataskaitai?", "a": ["7 dienos", "24 valandos", "30 dienų", "72 valandos"], "c": 1}, {"q": "Kuris terminas taikomas išsamiai tolesnei ataskaitai?", "a": ["24 valandos", "30 dienų", "72 valandos", "12 valandų"], "c": 2}, {"q": "Ką turi apimti išsami ataskaita be incidento priežasties?", "a": ["Tiekėjo kainą", "Poveikį ir šalinimo veiksmus", "Rinkodaros rezultatus", "Darbuotojų atlyginimus"], "c": 1}, {"q": "Koks yra vienas svarbiausių išorinės komunikacijos principų?", "a": ["Vienkartinis informavimas", "Informacijos slėpimas", "Tik vidinė komunikacija", "Skaidrus ir nuoseklus informavimas"], "c": 3}, {"q": "Ką reiškia koordinuota komunikacija?", "a": ["Informacija siunčiama tik reguliuotojams", "Komunikacija nevykdoma iki incidento pabaigos", "Kiekvienas darbuotojas siunčia skirtingą informaciją", "Vidiniai ir išoriniai pranešimai turi būti suderinti"], "c": 3}, {"q": "Ką reikia daryti, kai incidento situacija keičiasi?", "a": ["Ištrinti ankstesnius pranešimus", "Teikti reguliarius atnaujinimus suinteresuotiesiems asmenims", "Laukti galutinės ataskaitos", "Nutraukti visą komunikaciją"], "c": 1}, {"q": "Kodėl centralizuotas patvirtinimo procesas naudingas?", "a": ["Jis padeda patikrinti pranešimus prieš jų išsiuntimą", "Jis pakeičia DRP", "Jis panaikina incidentus", "Jis skirtas tik atsarginėms kopijoms"], "c": 0}, {"q": "Koks yra po testų atliekamo aptarimo tikslas?", "a": ["Pakeisti visus komunikacijos kanalus", "Sumažinti darbuotojų skaičių", "Nustatyti spragas ir tobulinimo sritis", "Sukurti naują organizaciją"], "c": 2}, {"q": "Kada komunikacijos planas turėtų būti atnaujinamas?", "a": ["Tik po realaus incidento", "Remiantis testų rezultatais ir išmoktomis pamokomis", "Tik po penkerių metų", "Tik pakeitus įmonės pavadinimą"], "c": 1}, {"q": "Koks ryšys tarp komunikacijos plano testavimo ir realaus incidento?", "a": ["Testavimas skirtas tik dokumentų archyvavimui", "Testavimas pakeičia incidentų valdymą", "Testavimas padeda užtikrinti, kad planas veiktų efektyviai tikro incidento metu", "Testavimas pašalina visų incidentų tikimybę"], "c": 2}, {"q": "Kuri komunikacija skirta organizacijos darbuotojams?", "a": ["Vidinė komunikacija", "Reguliacinė ataskaita", "Viešieji ryšiai", "Išorinė komunikacija"], "c": 0}, {"q": "Kuri komunikacija skirta klientams, partneriams ir reguliuotojams?", "a": ["Tik TTX", "Tik DRP", "Išorinė komunikacija", "Vidinė komunikacija"], "c": 2}, {"q": "Koks pagrindinis komunikacijos plano tikslas incidento metu?", "a": ["Užtikrinti aiškų, savalaikį ir koordinuotą informacijos perdavimą", "Pakeisti visas IT sistemas", "Sustabdyti informacijos perdavimą", "Sumažinti tiekėjų skaičių"], "c": 0}];let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10)}
function startQuiz(){pick10();current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;const item=quiz[current];document.getElementById('progress').textContent=`Klausimas ${current+1} / ${quiz.length}`;document.getElementById('question').textContent=item.q;const box=document.getElementById('answers');box.innerHTML='';
item.a.forEach((ans,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=ans;b.onclick=()=>choose(i);box.appendChild(b)});document.getElementById('next').disabled=true;document.getElementById('next').textContent=current===quiz.length-1?'Baigti →':'Kitas klausimas →'}
function choose(i){if(answered)return;answered=true;const item=quiz[current];const buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);if(i===item.c){buttons[i].classList.add('correct');score++}else{buttons[i].classList.add('wrong');buttons[item.c].classList.add('correct')}document.getElementById('next').disabled=false}
document.getElementById('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${score} / 10`;document.getElementById('percent').textContent=`${score*10}%`}};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('darkMode',dark)};
if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}startQuiz();
</script>
</body></html>
