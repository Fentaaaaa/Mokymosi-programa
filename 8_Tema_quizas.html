<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8 Tema – Verslo tęstinumo plano bandymai</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#4f46e5}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#818cf8}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:28px 18px 50px} .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:25px;margin:0 0 5px} .subtitle{color:var(--muted);font-size:14px}
button{font:inherit} #themeBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.progress{color:var(--muted);font-size:14px;margin-bottom:12px} .question{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:20px}
.answers{display:grid;gap:11px} .answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)} .answer.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.answer.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444} body.dark .answer.correct{background:#14532d;color:#dcfce7}
body.dark .answer.wrong{background:#7f1d1d;color:#fee2e2} .next{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;cursor:pointer;font-weight:700;font-size:16px}
.next:disabled{opacity:.45;cursor:not-allowed} .result{text-align:center} .score{font-size:46px;font-weight:800;margin:10px 0}
.small{color:var(--muted)} .hidden{display:none} .restart{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="container">
<div class="top"><div><h1>8 Tema – Verslo tęstinumo plano bandymai</h1><div class="subtitle">10 random questions per attempt</div></div>
<button id="themeBtn">🌙 Dark mode</button></div>
<div id="quiz" class="card"><div class="progress" id="progress"></div><div class="question" id="question"></div>
<div class="answers" id="answers"></div><button class="next" id="next" disabled>Kitas klausimas →</button></div>
<div id="result" class="card result hidden"><h2>Quiz baigtas!</h2><div class="score" id="score"></div><div class="small" id="percent"></div>
<button class="restart" onclick="startQuiz()">Bandyti dar kartą</button></div>
</div>
<script>
const bank=[{"q": "Koks yra pagrindinis BCP bandymų tikslas?", "a": ["Sukurti naują organizacijos struktūrą", "Pakeisti visas IT sistemas", "Sumažinti darbuotojų skaičių", "Užtikrinti, kad planas veiktų efektyviai tikro kibernetinio incidento metu"], "c": 3}, {"q": "Kodėl BCP bandymai yra svarbūs pagal NIS2 direktyvą?", "a": ["Kad būtų panaikinti visi tiekėjai", "Kad BCP būtų įgyvendinamas sklandžiai ir atnaujinamas atsižvelgiant į kintančias grėsmes", "Kad nereikėtų atsarginių kopijų", "Kad būtų pakeisti darbuotojų vaidmenys"], "c": 1}, {"q": "Ką padeda įvertinti BCP bandymai?", "a": ["Produktų kainas", "Darbuotojų atlyginimus", "BCP efektyvumą", "Rinkodaros efektyvumą"], "c": 2}, {"q": "Kas yra stalo pratybos (TTX)?", "a": ["Pilnas sistemų atkūrimas iš atsarginių kopijų", "Diskusijomis grįstos pratybos, kuriose aptariamas simuliuotas incidentas", "Tiekėjų auditas", "Kasdienis IT sistemų tikrinimas"], "c": 1}, {"q": "Koks pagrindinis TTX tikslas?", "a": ["Peržiūrėti vaidmenis, atsakomybes ir BCP žingsnius", "Išjungti organizacijos tinklą", "Atkurti visas sistemas iš atsarginių kopijų", "Pakeisti incidentų valdymo komandą"], "c": 0}, {"q": "Kuo pasižymi stalo pratybos?", "a": ["Jos visada vykdomos realioje gamybinėje aplinkoje", "Jos skirtos tik atsarginėms kopijoms", "Jos reikalauja visiško sistemos gedimo", "Jos yra diskusijomis grįstos"], "c": 3}, {"q": "Kodėl TTX laikomos mažos rizikos būdu simuliuoti incidentą?", "a": ["Jos leidžia aptarti scenarijų nepertraukiant organizacijos veiklos", "Jos nereikalauja suinteresuotųjų asmenų", "Jos vykdomos tik po tikro incidento", "Jos visiškai išjungia sistemas"], "c": 0}, {"q": "Ką TTX dalyviai aptaria?", "a": ["Tik darbuotojų atostogas", "Tik finansines ataskaitas", "Hipotetinius scenarijus ir reagavimo veiksmus", "Tik tiekėjų kainas"], "c": 2}, {"q": "Ką padeda identifikuoti stalo pratybos?", "a": ["Darbuotojų atlyginimų skirtumus", "BCP plano spragas", "Rinkodaros kanalus", "Produktų paklausą"], "c": 1}, {"q": "Ką TTX padeda išaiškinti organizacijoje?", "a": ["Tiekėjų pelną", "Produktų kainas", "Atsakomybes", "Atostogų grafiką"], "c": 2}, {"q": "Kas yra simuliacijos ir realios pratybos?", "a": ["Realaus laiko incidento simuliacija, skirta testuoti praktines reagavimo galimybes", "Tik atsarginių kopijų patikra", "Diskusija be jokio scenarijaus", "Tik dokumentų peržiūra"], "c": 0}, {"q": "Koks yra pagrindinis realaus laiko simuliacijų tikslas?", "a": ["Išmokyti darbuotojus naudotis rinkodaros sistemomis", "Sukurti naują BCP nuo nulio", "Pakeisti visus tiekėjus", "Įvertinti sprendimų priėmimą, atkūrimo procedūras ir komunikaciją"], "c": 3}, {"q": "Ką simuliacijos testuoja?", "a": ["Kaip greitai parduodami produktai", "Kaip darbuotojai planuoja atostogas", "Kaip gerai komanda gali įgyvendinti BCP realiuoju laiku", "Kaip sudaromos finansinės ataskaitos"], "c": 2}, {"q": "Koks incidentas pateikiamas kaip realistiškos simuliacijos pavyzdys?", "a": ["Naujo produkto pristatymas", "Reklamos kampanija", "DDoS ataka", "Darbuotojo atostogos"], "c": 2}, {"q": "Koks dar incidentas pateikiamas kaip simuliacijos pavyzdys?", "a": ["Sistemos prastova", "Biuro perkėlimas", "Tiekėjo kainos pokytis", "Darbuotojų atranka"], "c": 0}, {"q": "Ką padeda įvertinti DDoS ar sistemos prastovos simuliacija?", "a": ["Darbuotojų produktyvumą", "Rinkodaros biudžetą", "Tiekėjų skaičių", "Atkūrimo procesų ir komunikacijos protokolų veiksmingumą"], "c": 3}, {"q": "Kuo naudingos realaus laiko simuliacijos?", "a": ["Jos padeda patobulinti incidentų valdymo žingsnius", "Jos pašalina poreikį komunikacijai", "Jos pakeičia BCP dokumentaciją", "Jos panaikina visų incidentų tikimybę"], "c": 0}, {"q": "Kas yra DRP testavimas?", "a": ["Tik komunikacijos pratybos", "Tik darbuotojų mokymai", "Tik tiekėjų vertinimas", "Išsamus organizacijos nelaimių atkūrimo galimybių testavimas"], "c": 3}, {"q": "Koks yra pagrindinis DRP testavimo tikslas?", "a": ["Patikrinti rinkodaros planą", "Pakeisti BCP struktūrą", "Įvertinti darbuotojų skaičių", "Išbandyti pilną sistemų ir paslaugų atkūrimą iš atsarginių kopijų"], "c": 3}, {"q": "Ką simuliuoja viso masto atkūrimo testas?", "a": ["Tik tiekėjo vėlavimą", "Pilną sistemos gedimą", "Tik komunikacijos sutrikimą", "Tik vieno darbuotojo klaidą"], "c": 1}, {"q": "Ką apima viso masto atkūrimo testas?", "a": ["Tik darbuotojų komunikaciją", "Paslaugų ir duomenų atkūrimą iš atsarginių kopijų", "Tik dokumentų archyvavimą", "Tik tiekėjų apklausą"], "c": 1}, {"q": "Kokius tikslus reikia patikrinti atliekant viso masto atkūrimo testą?", "a": ["TTX ir NIS2", "BCP ir SLA", "SLA ir BIA", "RTO ir RPO"], "c": 3}, {"q": "Ką reiškia RTO šiame kontekste?", "a": ["Reagavimo komandos tikslą", "Atkūrimo laiko tikslą", "Rizikos vertinimo terminą", "Atkūrimo taško tikslą"], "c": 1}, {"q": "Ką reiškia RPO šiame kontekste?", "a": ["Rizikos valdymo objektą", "Atkūrimo taško tikslą", "Komunikacijos protokolą", "Atkūrimo laiko tikslą"], "c": 1}, {"q": "Kodėl viso masto atkūrimo testas laikomas realiausiu?", "a": ["Jis nereikalauja atsarginių kopijų", "Jis tikrina tik komunikaciją", "Jis tikrina, ar visos sistemos gali būti atkurtos išlaikant duomenų vientisumą", "Jis vykdomas tik teoriškai"], "c": 2}, {"q": "Ką reikia vertinti po kiekvieno BCP bandymo?", "a": ["Tik tiekėjų sutartis", "Kaip organizacija reagavo į scenarijų", "Tik darbuotojų skaičių", "Tik finansinius rezultatus"], "c": 1}, {"q": "Ką apima reagavimo efektyvumo vertinimas?", "a": ["Tiekėjų skaičių", "Rinkodaros kampanijos pasiekiamumą", "Darbuotojų atlyginimų dydį", "Sistemų atkūrimo greitį ir komunikacijos veikimą"], "c": 3}, {"q": "Ką reikia dokumentuoti vertinant BCP bandymo rezultatus?", "a": ["Sritis, kuriose BCP buvo nepakankamas arba nesuveikė", "Tik sėkmingus veiksmus", "Tik techninės įrangos kainas", "Tik darbuotojų klaidas"], "c": 0}, {"q": "Ką reikia pateikti nustačius BCP spragas?", "a": ["Darbuotojų atostogų grafiką", "Rekomendacijas tobulinimui", "Tiekėjų kainoraštį", "Naują rinkodaros planą"], "c": 1}, {"q": "Kodėl svarbu matuoti sistemų atkūrimo laiką?", "a": ["Kad būtų galima įvertinti reagavimo efektyvumą", "Kad būtų galima suplanuoti reklamą", "Kad būtų galima pakeisti tiekėją", "Kad būtų galima apskaičiuoti atlyginimus"], "c": 0}, {"q": "Kodėl svarbu vertinti komunikacijos efektyvumą po bandymo?", "a": ["Kad būtų pakeistas RPO", "Kad būtų sukurtas naujas produktas", "Kad būtų nustatyta, kaip veikė vidinė ir išorinė komunikacija", "Kad būtų nustatytas darbuotojų skaičius"], "c": 2}, {"q": "Ką reiškia BCP plano koregavimas?", "a": ["BCP atnaujinimą remiantis išmoktomis bandymų pamokomis", "BCP pakeitimą tik po tikro incidento", "BCP perdavimą tiekėjui", "BCP ištrynimą"], "c": 0}, {"q": "Kada BCP turėtų būti koreguojamas?", "a": ["Tik po darbuotojų kaitos", "Remiantis bandymų rezultatais ir besikeičiančiomis grėsmėmis", "Tik gavus tiekėjo prašymą", "Tik kartą per dešimt metų"], "c": 1}, {"q": "Kas yra nuolatinė BCP stebėsena?", "a": ["Tik TTX vykdymas", "Tik atsarginių kopijų kūrimas", "Vienkartinis dokumento sukūrimas", "Reguliarus BCP peržiūrėjimas ir koregavimas"], "c": 3}, {"q": "Kodėl BCP turi būti nuolat atnaujinamas dokumentas?", "a": ["Kad nereikėtų vertinti grėsmių", "Kad nereikėtų atlikti bandymų", "Kad jis išliktų aktualus ir veiksmingas", "Kad būtų išvengta komunikacijos"], "c": 2}, {"q": "Ką reikia padaryti po kiekvieno bandymo pastebėjus silpnybių?", "a": ["Sustabdyti visus bandymus", "Atlikti plano korekcijas", "Ignoruoti silpnybes", "Ištrinti BCP"], "c": 1}, {"q": "Kokia grėsmė gali lemti BCP atnaujinimą?", "a": ["Produktų dizaino pakeitimas", "Biuro baldų keitimas", "Besikeičiančios kibernetinės grėsmės", "Darbuotojų atostogos"], "c": 2}, {"q": "Ką turi užtikrinti nuolatinė organizacijos saugumo būklės stebėsena?", "a": ["Kad nereikėtų komunikacijos", "Kad BCP išliktų aktualus ir veiksmingas", "Kad nebūtų atliekamos simuliacijos", "Kad nereikėtų DRP"], "c": 1}, {"q": "Kuris bandymas yra labiausiai diskusinis?", "a": ["Realaus laiko simuliacija", "TTX", "Viso masto atkūrimo testas", "DRP atkūrimo testas"], "c": 1}, {"q": "Kuris bandymas orientuotas į praktines reagavimo galimybes realiuoju laiku?", "a": ["TTX", "Simuliacija", "Dokumento peržiūra", "Ataskaitos skaitymas"], "c": 1}, {"q": "Kuris bandymas orientuotas į pilną sistemų ir paslaugų atkūrimą?", "a": ["Diskusija", "DRP testavimas", "Komunikacijos pratybos", "TTX"], "c": 1}, {"q": "Kuris bandymas paprastai mažiausiai trikdo organizacijos veiklą?", "a": ["Stalo pratybos (TTX)", "Viso masto atkūrimo testas", "Sistemos gedimo simuliacija", "Pilnas DRP testas"], "c": 0}, {"q": "Ką TTX metu peržiūri suinteresuotieji asmenys?", "a": ["Darbuotojų atlyginimus", "Rinkodaros biudžetą", "Vaidmenis, atsakomybes ir BCP žingsnius", "Tiekėjų pelningumą"], "c": 2}, {"q": "Ką realaus laiko simuliacijos leidžia stebėti?", "a": ["Komandos sprendimų priėmimą incidento metu", "Tik darbuotojų skaičių", "Tik tiekėjų veiklą", "Tik dokumentų struktūrą"], "c": 0}, {"q": "Ką DRP testas padeda patikrinti be atkūrimo procedūrų?", "a": ["Ar pasirašytos visos SLA", "Ar veikia rinkodaros kampanija", "Ar laikomasi RTO ir RPO", "Ar darbuotojai turi atostogų planus"], "c": 2}, {"q": "Kas yra vienas svarbiausių BCP bandymų rezultatų?", "a": ["Naujas įmonės logotipas", "Naujas darbuotojų grafikas", "Identifikuotos spragos ir tobulinimo poreikiai", "Nauja reklamos kampanija"], "c": 2}, {"q": "Koks ciklas geriausiai apibūdina BCP tobulinimą?", "a": ["Bandymas → vertinimas → spragų nustatymas → plano koregavimas", "Bandymas → plano ištrynimas", "Bandymas → komunikacijos nutraukimas", "Bandymas → tiekėjų pašalinimas"], "c": 0}, {"q": "Ką reikia daryti su nustatytu neefektyvumu po bandymo?", "a": ["Nutraukti testavimą", "Dokumentuoti ir pateikti rekomendacijas tobulinimui", "Ignoruoti jį", "Pašalinti BCP"], "c": 1}, {"q": "Koks yra pagrindinis nuolatinio tobulinimo principas?", "a": ["BCP keičia tik tiekėjai", "BCP koreguojamas pagal bandymų rezultatus ir besikeičiančias grėsmes", "BCP keičiamas tik po realaus incidento", "BCP niekada nekeičiamas"], "c": 1}, {"q": "Kodėl BCP bandymai turi būti atliekami praktiškai?", "a": ["Kad būtų sumažintas komunikacijos poreikis", "Kad būtų sukurtas naujas planas", "Kad būtų pakeistos visos sistemos", "Kad būtų patikrinta, kaip planas veikia realistiško scenarijaus metu"], "c": 3}, {"q": "Kuo TTX skiriasi nuo realaus laiko simuliacijos?", "a": ["Jie nesiskiria", "TTX visada atkuria visas sistemas, o simuliacija tik diskutuoja", "TTX remiasi diskusija, o simuliacija testuoja praktinį reagavimą realiuoju laiku", "TTX vyksta tik po incidento"], "c": 2}, {"q": "Kuo DRP testas skiriasi nuo TTX?", "a": ["DRP skirtas tik komunikacijai", "DRP testas tikrina sistemų ir paslaugų atkūrimą, o TTX daugiausia remiasi diskusija", "Jie yra identiški", "TTX tikrina atsargines kopijas, o DRP tik diskutuoja"], "c": 1}, {"q": "Koks yra pagrindinis bandymų rezultato panaudojimo tikslas?", "a": ["Sumažinti darbuotojų skaičių", "Pagerinti BCP ir pašalinti nustatytas silpnybes", "Pakeisti organizacijos pavadinimą", "Sukurti naują rinkodaros strategiją"], "c": 1}, {"q": "Ką reikia užtikrinti, kad BCP išliktų veiksmingas?", "a": ["Tik dokumento saugojimą", "Nuolatinę stebėseną, bandymus ir koregavimą", "Tik vienkartinį testą", "Tik atsarginių kopijų kūrimą"], "c": 1}]; let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10)}
function startQuiz(){pick10();current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;const item=quiz[current];document.getElementById('progress').textContent=`Klausimas ${current+1} / ${quiz.length}`;
document.getElementById('question').textContent=item.q;const box=document.getElementById('answers');box.innerHTML='';
item.a.forEach((ans,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=ans;b.onclick=()=>choose(i);box.appendChild(b)});
document.getElementById('next').disabled=true;document.getElementById('next').textContent=current===quiz.length-1?'Baigti →':'Kitas klausimas →'}
function choose(i){if(answered)return;answered=true;const item=quiz[current];const buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);
if(i===item.c){buttons[i].classList.add('correct');score++}else{buttons[i].classList.add('wrong');buttons[item.c].classList.add('correct')}document.getElementById('next').disabled=false}
document.getElementById('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${score} / 10`;document.getElementById('percent').textContent=`${score*10}%`}};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('darkMode',dark)};
if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'} startQuiz();
</script>
</body></html>
