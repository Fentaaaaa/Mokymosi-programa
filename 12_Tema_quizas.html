<!DOCTYPE html>
<html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>12 Tema – Modernūs tinklai</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#d9dee8;--accent:#4f46e5}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aab3c2;--border:#374151;--accent:#818cf8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:25px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}
button{font:inherit}#themeBtn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.progress{color:var(--muted);font-size:14px;margin-bottom:12px}.question{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:20px}
.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.answer.correct{background:#dcfce7;color:#166534;border-color:#22c55e}
.answer.wrong{background:#fee2e2;color:#991b1b;border-color:#ef4444}body.dark .answer.correct{background:#14532d;color:#dcfce7}
body.dark .answer.wrong{background:#7f1d1d;color:#fee2e2}.next{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;cursor:pointer;font-weight:700;font-size:16px}
.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:46px;font-weight:800;margin:10px 0}
.small{color:var(--muted)}.hidden{display:none}.restart{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
</style></head><body><div class="container">
<div class="top"><div><h1>12 Tema – Modernūs tinklai</h1><div class="subtitle">10 random questions per attempt</div></div>
<button id="themeBtn">🌙 Dark mode</button></div>
<div id="quiz" class="card"><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="answers" id="answers"></div>
<button class="next" id="next" disabled>Kitas klausimas →</button></div>
<div id="result" class="card result hidden"><h2>Quiz baigtas!</h2><div class="score" id="score"></div><div class="small" id="percent"></div>
<button class="restart" onclick="startQuiz()">Bandyti dar kartą</button></div></div>
<script>
const bank=[{"q": "Kokie protokolai naudojami dinamiškam maršrutizavimui?", "a": ["HTTP, FTP, SMTP ir DNS", "SSH, Telnet, RDP ir SMB", "TCP, UDP, ICMP ir ARP", "BGP, OSPF, IS-IS ir EIGRP"], "c": 3}, {"q": "Kam naudojami maršrutizatoriai?", "a": ["Tik duomenų šifravimui", "Tik vartotojų autentifikacijai", "Tik belaidžiam ryšiui", "Komunikacijai tarp skirtingų tinklų ir transliavimo domenų"], "c": 3}, {"q": "Kodėl dideliuose tinkluose statinių maršrutų valdymas yra sudėtingas?", "a": ["Jie visada naudoja belaidį ryšį", "Jie negali perduoti IP paketų", "Reikia daug rankiniu būdu valdomų maršrutų", "Statiniai maršrutai neveikia mažame tinkle"], "c": 2}, {"q": "Kuris protokolas naudojamas globalaus interneto maršrutizavimui?", "a": ["OSPF", "EIGRP", "BGP", "IS-IS"], "c": 2}, {"q": "Ką reiškia BGP?", "a": ["Broad Global Protocol", "Border Gateway Protocol", "Basic Gateway Process", "Backup Gateway Protocol"], "c": 1}, {"q": "Kas yra autonominė sistema BGP kontekste?", "a": ["Vienas kompiuteris", "Tinklo administracinė sistema, dalyvaujanti maršrutų apsikeitime", "Vienas VPN tunelis", "Vienas belaidis prieigos taškas"], "c": 1}, {"q": "Ką BGP atlieka tarp autonominių sistemų?", "a": ["Šifruoja visą interneto srautą", "Valdo Wi-Fi slaptažodžius", "Sukuria VPN vartotojus", "Apsikeičia prefiksais ir parenka maršrutus"], "c": 3}, {"q": "Kas yra BGP prefix užgrobimas?", "a": ["DNS įrašo pakeitimas", "VPN tunelio gedimas", "Situacija, kai IPT paskelbia, kad konkretus adresų blokas priklauso jam, nors jis priklauso kitam savininkui", "Situacija, kai pakeičiamas Wi-Fi slaptažodis"], "c": 2}, {"q": "Kokią pasekmę gali sukelti BGP prefix užgrobimas?", "a": ["Dalis interneto srauto gali būti nukreipta per netinkamą infrastruktūrą", "Sugenda tik vienas kompiuteris", "Panaikinami visi IP adresai", "Visi Wi-Fi tinklai automatiškai išsijungia"], "c": 0}, {"q": "Kodėl nuo BGP prefix užgrobimo sunku apsisaugoti?", "a": ["BGP skirtas tik Wi-Fi", "BGP veikia tik lokaliuose tinkluose", "BGP nenaudoja IP adresų", "BGP buvo sukurtas neturint saugumo tarp pirminių reikalavimų"], "c": 3}, {"q": "Ką reiškia NFV?", "a": ["Tinklo filtravimo versija", "Naujas failų valdymo protokolas", "Nulinio funkcionalumo valdymas", "Tinklo funkcijų virtualizavimas"], "c": 3}, {"q": "Ką reiškia SDN?", "a": ["Statinis domenų tinklas", "Serverių duomenų navigacija", "Saugus duomenų numeravimas", "Programiškai aprašytas tinklas"], "c": 3}, {"q": "Kuo SDN modelis skiriasi nuo klasikinio tinklo modelio?", "a": ["SDN naudoja tik statinius maršrutus", "SDN naudoja centralizuotą valdymo plotmę", "SDN neturi valdymo plotmės", "SDN veikia tik belaidžiuose tinkluose"], "c": 1}, {"q": "Koks SDN privalumas konfigūruojant tinklą?", "a": ["Konfigūracijos negalima keisti", "Kiekvienas įrenginys turi būti konfigūruojamas atskirai", "Pakeitimai gali būti įgyvendinti visame tinkle centralizuotai", "Veikia tik viename maršrutizatoriuje"], "c": 2}, {"q": "Kuris yra SDN pavyzdys?", "a": ["Aircrack-ng", "OpenVPN", "OpenDayLight", "WireGuard"], "c": 2}, {"q": "Kas yra underlay tinklas?", "a": ["Pamatinis tinklas, ant kurio gali veikti overlay tinklas", "Tik belaidis tinklas", "Tik VPN vartotojų tinklas", "Tik ugniasienės tinklas"], "c": 0}, {"q": "Kodėl didelio masto debesijos tinkluose naudojamas overlay?", "a": ["Jis pakeičia visas ugniasienes", "Jis leidžia kurti lanksčias topologijas ant pamatinio tinklo", "Jis skirtas tik Wi-Fi", "Jis panaikina IP adresus"], "c": 1}, {"q": "Kas yra overlay tinklas?", "a": ["Fizinis kabelių tinklas", "Tik belaidis tinklas", "Tik DNS serverių tinklas", "Tinklas, konfigūruojamas ant underlay tinklo su papildomu paketų inkapsuliavimu"], "c": 3}, {"q": "Koks yra vienas overlay tinklų privalumas?", "a": ["Nereikia maršrutizavimo", "Mažesnis IP adresų skaičius", "Lanksčios tinklo topologijos ant atsparaus pamatinio tinklo", "Nereikia saugumo politikų"], "c": 2}, {"q": "Kaip overlay gali padėti daugiaklientėje aplinkoje?", "a": ["Sujungti visus klientus į vieną tinklą", "Pašalinti visus klientus", "Suteikti lankstesnę kontrolę klientams ir mažinti vieno kliento poveikį kitam", "Išjungti segmentavimą"], "c": 2}, {"q": "Kokia technologija naudojama tinklo inkapsuliacijai?", "a": ["VXLAN", "POP3", "SMTP", "DNSSEC"], "c": 0}, {"q": "Kokį protokolą naudoja VXLAN?", "a": ["UDP", "TCP tik", "ICMP tik", "SMTP"], "c": 0}, {"q": "Kokią VLAN apribojimo problemą sprendžia VXLAN?", "a": ["IPv4 adresų trūkumą", "Wi-Fi slaptažodžių trūkumą", "VPN vartotojų skaičių", "4096 VLAN apribojimą"], "c": 3}, {"q": "Kas yra VTEP?", "a": ["VPN slaptažodis", "BGP maršrutas", "Virtualus tunelio mazgas, naudojamas komunikacijai su underlay tinklu", "Wi-Fi prieigos taškas"], "c": 2}, {"q": "Kam naudojama mikrosegmentacija?", "a": ["Saugumo riboms valdyti be vietinių ugniasienių serveriuose ar kompiuteriuose", "Tik IP adresams priskirti", "Tik Wi-Fi signalui stiprinti", "Tik VPN slaptažodžiams valdyti"], "c": 0}, {"q": "Kuo remiasi mikrosegmentacija?", "a": ["Tik VPN tuneliais", "Tinklo valdikliais ir resursų grupavimu", "Tik DNS įrašais", "Tik fiziniais kabeliais"], "c": 1}, {"q": "Koks pateiktas mikrosegmentavimo pavyzdys viešajame debesyje?", "a": ["Aircrack-ng", "Azure Application Security Groups", "OpenVPN", "BGP"], "c": 1}, {"q": "Kuo rėmėsi tradiciniai tinklo saugumo modeliai?", "a": ["Tinklo perimetro apsauga", "Tik aplikacijų apsauga", "Tik VPN paslaugomis", "Nulinio pasitikėjimo principu"], "c": 0}, {"q": "Kaip perimetro apsaugos modelyje organizuojamas tinklas?", "a": ["Nenaudojamos jokios zonos", "Jis padalinamas į zonas", "Visas tinklas tampa vienu VPN", "Visi įrenginiai izoliuojami atskirai"], "c": 1}, {"q": "Kokia prielaida būdinga perimetro modelio zonoms?", "a": ["Visi ryšiai yra šifruojami automatiškai", "Zonos viduje įrenginiai gali bendrauti gana nevaržomai", "Įrenginiai negali komunikuoti", "Kiekvienas ryšys tikrinamas kiekvieną kartą"], "c": 1}, {"q": "Koks yra vienas perimetro apsaugos modelio iššūkis?", "a": ["Perimetro modelis veikia tik debesyje", "Grėsmės gali patekti ne tik iš išorinio tinklo", "Perimetro modelis neturi zonų", "Jis skirtas tik Wi-Fi"], "c": 1}, {"q": "Kodėl perimetro modelis tampa sudėtingesnis?", "a": ["Visi vartotojai dirba tik biure", "Tinklai tampa mažesni", "Nenaudojamos SaaS aplikacijos", "Infrastruktūra keliasi į nutolusius duomenų centrus ir debesis, o vartotojai dirba ne tik biuruose"], "c": 3}, {"q": "Koks yra pagrindinis nulinio pasitikėjimo modelio principas?", "a": ["Pasitikėti tik biuro įrenginiais", "Pasitikėti visais vidinio tinklo vartotojais", "Jokio numanomo pasitikėjimo", "Pasitikėti tik administratoriais"], "c": 2}, {"q": "Kaip tikrinamas vartotojas ar įrenginys Zero Trust modelyje?", "a": ["Tik pirmą kartą per metus", "Tik prisijungus prie biuro Wi-Fi", "Kiekvieną kartą bandant pasiekti resursą", "Tik po incidento"], "c": 2}, {"q": "Kuo labiau remiasi Zero Trust prieigos sprendimai?", "a": ["Tik fizine vartotojo vieta", "Tik tinklo kabelio tipu", "Autentifikacija ir autorizacija, o ne vartotojo ar įrenginio lokacija", "Tik IP adreso lokacija"], "c": 2}, {"q": "Kokios politikos naudojamos Zero Trust modelyje?", "a": ["Tik VPN politikos", "Tik popierinės politikos", "Tik statinės politikos", "Dinaminės politikos"], "c": 3}, {"q": "Kaip valdoma prieiga Zero Trust modelyje?", "a": ["Tik per fizinį kabelį", "Per aplikaciją", "Tik per Wi-Fi signalą", "Tik per DNS"], "c": 1}, {"q": "Kam naudojamas VPN?", "a": ["Tik Wi-Fi slaptažodžiams", "Tik DNS vardams keisti", "Saugiam tinklo ryšiui ir nuotoliniam prisijungimui", "Tik BGP prefiksams skelbti"], "c": 2}, {"q": "Koks yra vienas VPN privalumas?", "a": ["Mažesnis tinklo segmentavimas", "Nereikia autentifikacijos", "Nereikia šifravimo", "Padidintas saugumas"], "c": 3}, {"q": "Koks VPN privalumas susijęs su kaina?", "a": ["VPN gali būti pigesnis už dedikuotus sujungimus", "VPN neturi jokios įtakos kainai", "VPN naudojamas tik nemokamuose tinkluose", "VPN visada brangesnis už dedikuotus sujungimus"], "c": 0}, {"q": "Koks VPN privalumas susijęs su plėtra?", "a": ["Nėra plečiamumo", "Plečiamumas, ypač naudojant SD-WAN", "Tik vieno vartotojo plėtra", "Tik fizinių kabelių plėtra"], "c": 1}, {"q": "Koks VPN tipas jungia vieną mazgą su kitu mazgu?", "a": ["LAN to LAN only", "Host to Site", "Host to Host", "Site to Site"], "c": 2}, {"q": "Koks VPN tipas jungia mazgą su lokacija?", "a": ["Site to Site", "Site to Hostless", "Host to Site", "Host to Host"], "c": 2}, {"q": "Koks VPN tipas jungia dvi lokacijas?", "a": ["Host to Host", "Site to Site", "Host to Site", "User to Cloud"], "c": 1}, {"q": "Kuri technologija minima kaip plačiai paplitusi VPN technologija?", "a": ["OSPF", "BGP", "OpenVPN", "VXLAN"], "c": 2}, {"q": "Kuri technologija yra minima kartu su OpenVPN?", "a": ["DNS", "SMTP", "WireGuard", "EIGRP"], "c": 2}, {"q": "Kokios dar VPN technologijos paminėtos medžiagoje?", "a": ["IPsec, PPTP, SSTP ir L2TP", "BGP, OSPF ir EIGRP", "VXLAN, NVGRE ir GENEVE", "HTTP, FTP ir SMTP"], "c": 0}, {"q": "Kokie du pagrindiniai IPsec protokolų mechanizmai minimi?", "a": ["AH ir ESP", "VXLAN ir NVGRE", "WPA2 ir WPA3", "BGP ir OSPF"], "c": 0}, {"q": "Ką užtikrina Authentication Header (AH)?", "a": ["Tik vartotojo autentifikaciją", "Pilną paketų šifravimą", "Tik VPN tunelio sukūrimą", "Duomenų šaltinio validavimą, apsaugą nuo pakartojimo atakų ir integralumą"], "c": 3}, {"q": "Ką užtikrina Encapsulating Security Payload (ESP)?", "a": ["Paketų šifravimą, konfidencialumą, integralumą ir apsaugą nuo pakartojimo atakų", "Tik Wi-Fi autentifikaciją", "Tik maršrutų parinkimą", "Tik šaltinio validavimą"], "c": 0}, {"q": "Kuo skiriasi IPsec transportinis režimas?", "a": ["Originalus IP antraštės laukas išsaugomas", "Visas IP paketas tampa naujo paketo duomenimis", "Nenaudojamas IP", "Naudojamas tik Wi-Fi"], "c": 0}, {"q": "Kuo pasižymi IPsec tunelinis režimas?", "a": ["Jis skirtas tik DNS", "Visas originalus IP paketas inkapsuliuojamas ir tampa naujo IP paketo duomenų dalimi", "Originalus IP paketas visada paliekamas nepakitęs", "Jis nenaudoja inkapsuliacijos"], "c": 1}, {"q": "Kokį standartą apibrėžia bevielių tinklų veikimą?", "a": ["IEEE 802.3 tik", "IEEE 802.11", "NIS2", "ISO 27001"], "c": 1}, {"q": "Kokia yra viena belaidžių tinklų saugumo problema?", "a": ["Belaidžiai tinklai nenaudoja IP", "Jie neturi autentifikacijos", "Belaidžiai tinklai negali būti atakuojami", "Radijo bangos yra atvirai transliuojamos ir gali būti stebimos"], "c": 3}, {"q": "Kokia papildoma rizika būdinga belaidžiams tinklams?", "a": ["Galimybė apsimesti legitymiu prieigos tašku", "BGP prefix užgrobimas", "VPN maršrutų perrašymas", "DNS zonos perkėlimas"], "c": 0}, {"q": "Kokie belaidžio tinklo saugumo mechanizmai paminėti?", "a": ["WEP, WPA(2) Personal, WPA(2) Enterprise ir WPA3", "BGP, OSPF, IS-IS ir EIGRP", "FTP, SMTP ir POP3", "AH, ESP ir VXLAN"], "c": 0}, {"q": "Koks įrankis minimas bevielio tinklo saugumo kontekste?", "a": ["Aircrack-ng", "Cumulus", "WireGuard", "OpenDayLight"], "c": 0}, {"q": "Ką Aircrack-ng scenarijuje galima atlikti su tinklo adapteriu?", "a": ["Paketų injekciją, naudojant stebėjimo režimą", "BGP prefiksų skelbimą", "SDN valdiklio konfigūravimą", "VXLAN VTEP kūrimą"], "c": 0}, {"q": "Kas minima kaip Aircrack-ng scenarijaus dalis?", "a": ["SDN maršrutų centralizavimas", "BGP prefix užgrobimas", "Deautentifikacijos ataka", "DNS tuneliavimas"], "c": 2}, {"q": "Kas užfiksuojama aukai iš naujo prisijungus prie belaidžio prieigos taško?", "a": ["BGP prefiksas", "IPsec maršrutas", "VXLAN VTEP", "Autentifikacijos paketas"], "c": 3}, {"q": "Kokia apsaugos priemonė rekomenduojama belaidžiam tinklui?", "a": ["WPA3 naudojimas", "Autentifikacijos atsisakymas", "WEP naudojimas visur", "Atviro Wi-Fi naudojimas"], "c": 0}, {"q": "Kokia slaptažodžių praktika rekomenduojama?", "a": ["Slaptažodžio nenaudojimas", "Vieno trumpo slaptažodžio naudojimas visiems", "Sudėtingų slaptažodžių naudojimas", "Tik numatytojo slaptažodžio naudojimas"], "c": 2}, {"q": "Kokia fizinė priemonė gali sumažinti belaidžio tinklo poveikį?", "a": ["Prieigos taško siųstuvo galios ribojimas", "Wi-Fi kanalo panaikinimas", "SSID pašalinimas", "Siųstuvo galios didinimas iki maksimumo"], "c": 0}, {"q": "Kokia papildoma belaidžio tinklo apsaugos priemonė paminėta?", "a": ["BGP filtravimas", "MAC adresų filtravimas", "OSPF autentifikacija", "VXLAN inkapsuliacija"], "c": 1}];let quiz=[],current=0,score=0,answered=false;
function pick10(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10)}
function startQuiz(){pick10();current=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){answered=false;let item=quiz[current];document.getElementById('progress').textContent=`Klausimas ${current+1} / ${quiz.length}`;document.getElementById('question').textContent=item.q;
let box=document.getElementById('answers');box.innerHTML='';item.a.forEach((ans,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=ans;b.onclick=()=>choose(i);box.appendChild(b)});
document.getElementById('next').disabled=true;document.getElementById('next').textContent=current===quiz.length-1?'Baigti →':'Kitas klausimas →'}
function choose(i){if(answered)return;answered=true;let item=quiz[current],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);
if(i===item.c){buttons[i].classList.add('correct');score++}else{buttons[i].classList.add('wrong');buttons[item.c].classList.add('correct')}document.getElementById('next').disabled=false}
document.getElementById('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=`${score} / 10`;document.getElementById('percent').textContent=`${score*10}%`}};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');let dark=document.body.classList.contains('dark');document.getElementById('themeBtn').textContent=dark?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('darkMode',dark)};
if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}startQuiz();
</script></body></html>
