<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic 50 — Web Application Vulnerability Scanning</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>Topic 50 — Web Application Vulnerability Scanning</h1><div class="subtitle">DVWA, OWASP ZAP, WAF and OWASP Juice Shop</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 50 temos tema?", "a": ["Įsilaužimo į tinklą atakos", "Tapatybių valdymas", "Pažeidžiamumų paieška su Metasploit", "Web aplikacijų pažeidžiamumų paieška"], "c": 3}, {"q": "Kokia paskaitos trukmė?", "a": ["6 valandos", "4 valandos", "2 valandos", "8 valandos"], "c": 1}, {"q": "Koks paskaitos formatas?", "a": ["Praktinė veikla", "Tik teorija", "Teorija ir praktinė veikla", "Egzaminas"], "c": 0}, {"q": "Kokia pirmoji praktinė tema?", "a": ["DNS konfigūravimas", "Pažeidžiamumų paieška DVWA", "SIEM diegimas", "DLP konfigūravimas"], "c": 1}, {"q": "Kokia antroji praktinė tema?", "a": ["Metasploit konfigūravimas", "EDR diegimas", "Pažeidžiamumų paieška Juice Shop (TryHackMe)", "RADIUS diegimas"], "c": 2}, {"q": "Kokia trečioji praktinė tema?", "a": ["VPN diegimas", "DNS apsauga", "802.1X konfigūravimas", "Nesaugios aplikacijos apsaugojimas su WAF"], "c": 3}, {"q": "Ką reiškia DVWA?", "a": ["Digital Vulnerability Web Analyzer", "Dynamic Web Vulnerability Assessment", "Damn Virtual Web Appliance", "Damn Vulnerable Web Application"], "c": 3}, {"q": "Kaip apibūdinama DVWA?", "a": ["Pažeidžiamumų skanavimo sistema", "Pažeidžiama internetinė aplikacija", "WAF sprendimas", "Pažeidžiama operacinė sistema"], "c": 1}, {"q": "Kaip apibūdinama Metasploitable, palyginti su DVWA?", "a": ["Abi yra web aplikacijos", "Metasploitable yra pažeidžiama operacinė sistema, o DVWA – pažeidžiama internetinė aplikacija", "Abi yra WAF sistemos", "Metasploitable yra WAF, o DVWA – OS"], "c": 1}, {"q": "Kokios technologijos nurodytos DVWA kontekste?", "a": ["C# ir SQL Server", "Java ir PostgreSQL", "Python ir MongoDB", "PHP ir MySQL"], "c": 3}, {"q": "Kur įdiegta DVWA praktinėje aplinkoje?", "a": ["Tiesiogiai vartotojo naršyklėje", "Google Classroom", "Tik Kali Linux viduje", "Atskiroje testinėje mašinoje šalia Kali Linux"], "c": 3}, {"q": "Kokia sistema minima šalia DVWA kaip praktinės aplinkos dalis?", "a": ["Windows Server", "Kali Linux", "OPNsense", "Metasploitable"], "c": 1}, {"q": "Koks įrankis naudojamas automatizuotam DVWA skenavimui?", "a": ["OpenVAS", "OWASP ZAP", "Metasploit", "Nessus"], "c": 1}, {"q": "Koks DVWA skenavimo pobūdis nurodytas užduotyje?", "a": ["Tik dokumentacijos skaitymas", "Tik konfigūracijos auditas", "Tik rankinis testavimas", "Automatizuotas skenavimas"], "c": 3}, {"q": "Ką reikia atlikti su DVWA pagal pirmą užduotį?", "a": ["Paleisti SIEM", "Atlikti automatizuotą aplikacijos skanavimą pasinaudojus OWASP ZAP", "Įdiegti DNS", "Sukurti VPN"], "c": 1}, {"q": "Koks įrankis naudojamas DVWA skenavimui pagal užduotį?", "a": ["WAF", "Kali Linux", "Juice Shop", "OWASP ZAP"], "c": 3}, {"q": "Ką reikia atlikti po pirmojo DVWA skenavimo?", "a": ["Sukonfigūruoti WAF ir atlikti OWASP ZAP skanavimą dar vieną kartą", "Išjungti Kali Linux", "Pašalinti DVWA", "Įdiegti Metasploitable"], "c": 0}, {"q": "Koks tikslas pakartoti OWASP ZAP skenavimą po WAF konfigūravimo?", "a": ["Palyginti, kaip keičiasi rezultatai", "Patikrinti DNS adresą", "Sukurti naują vartotoją", "Pakeisti operacinę sistemą"], "c": 0}, {"q": "Koks klausimas pateikiamas po antrojo skenavimo?", "a": ["Kaip keičiasi rezultatai?", "Koks vartotojo slaptažodis?", "Koks DNS serveris?", "Kiek yra procesorių?"], "c": 0}, {"q": "Kas yra WAF?", "a": ["Operacinė sistema", "Apsaugos sprendimas web aplikacijai", "Skanavimo įrankis", "Pažeidžiama aplikacija"], "c": 1}, {"q": "Koks WAF tikslas šiame praktiniame darbe?", "a": ["Pakeisti Kali Linux", "Sukurti pažeidžiamą aplikaciją", "Paleisti TryHackMe", "Apsaugoti nesaugią aplikaciją ir palyginti skenavimo rezultatus"], "c": 3}, {"q": "Koks procesas leidžia įvertinti WAF poveikį?", "a": ["Skenuoti prieš ir po WAF konfigūravimo ir palyginti rezultatus", "Tik paleisti Kali Linux", "Tik peržiūrėti HTML", "Tik paleisti WAF"], "c": 0}, {"q": "Kokia aplikacija naudojama WAF praktikoje?", "a": ["DVWA", "Metasploitable", "Juice Shop", "Kali Linux"], "c": 0}, {"q": "Koks įrankis naudojamas rezultatams tikrinti prieš ir po WAF?", "a": ["Nessus", "Metasploit", "OWASP ZAP", "OpenVAS"], "c": 2}, {"q": "Kas yra OWASP Juice Shop?", "a": ["Skanavimo serveris", "Pažeidžiama programa", "WAF", "Operacinė sistema"], "c": 1}, {"q": "Kokiame kontekste minima OWASP Juice Shop?", "a": ["Kaip dar viena pažeidžiama programa", "Kaip WAF", "Kaip antivirusas", "Kaip DNS serveris"], "c": 0}, {"q": "Kur nurodoma Juice Shop praktika?", "a": ["Google Classroom", "Guacamole", "GitHub Pages", "TryHackMe"], "c": 3}, {"q": "Koks konkretus mokymosi kambarys nurodytas Juice Shop praktikai?", "a": ["Metasploit", "DVWA Basics", "OWASP Juice Shop", "OpenVAS"], "c": 2}, {"q": "Kokia platforma naudojama Juice Shop kambariui?", "a": ["Guacamole", "OWASP ZAP", "Kali Linux", "TryHackMe"], "c": 3}, {"q": "Kuris teiginys teisingai palygina DVWA ir Metasploitable?", "a": ["DVWA yra pažeidžiama web aplikacija, o Metasploitable – pažeidžiama operacinė sistema", "Abi yra WAF", "Abi yra skanavimo įrankiai", "DVWA yra OS, o Metasploitable – web aplikacija"], "c": 0}, {"q": "Kuri sistema yra web aplikacija, o ne operacinė sistema?", "a": ["DVWA", "Kali Linux", "Metasploitable", "Guacamole"], "c": 0}, {"q": "Kuri sistema yra operacinės sistemos atvaizdas, o ne web aplikacija?", "a": ["Juice Shop", "OWASP ZAP", "DVWA", "Metasploitable"], "c": 3}, {"q": "Kuri technologijų pora nurodyta DVWA aprašyme?", "a": ["PHP ir MongoDB", "Python ir PostgreSQL", "PHP ir MySQL", "Java ir MySQL"], "c": 2}, {"q": "Kokia laboratorinė sistema minima kaip DVWA kaimynystė praktinėje aplinkoje?", "a": ["Metasploitable", "Kali Linux", "OpenVAS", "Windows Server"], "c": 1}, {"q": "Kokia yra pirmoji DVWA užduoties seka?", "a": ["WAF konfigūravimas prieš bet kokį skenavimą", "Metasploit paleidimas", "Automatizuotas skenavimas su OWASP ZAP", "Juice Shop paleidimas"], "c": 2}, {"q": "Kokia yra antroji DVWA užduoties seka?", "a": ["Sukonfigūruoti WAF ir pakartoti OWASP ZAP skenavimą", "Paleisti OpenVAS", "Pakeisti aplikaciją", "Pašalinti WAF"], "c": 0}, {"q": "Ką leidžia palyginti du OWASP ZAP skenavimai?", "a": ["Dviejų DNS serverių veikimą", "Dviejų operacinių sistemų greitį", "Rezultatus prieš ir po WAF konfigūravimo", "Dviejų vartotojų paskyras"], "c": 2}, {"q": "Koks praktinis principas nagrinėjamas naudojant WAF?", "a": ["Tinklo topologijos kūrimas", "Pašto serverio konfigūravimas", "Nesaugios aplikacijos apsauga", "Operacinės sistemos diegimas"], "c": 2}, {"q": "Kokia praktinė veikla atliekama su Juice Shop?", "a": ["EDR diegimas", "WAF konfigūravimas", "DNS konfigūravimas", "Pažeidžiamumų paieška"], "c": 3}, {"q": "Kokia aplikacija yra specialiai pažeidžiama mokymosi reikmėms pagal pateiktą medžiagą?", "a": ["OWASP ZAP", "DVWA", "Kali Linux", "WAF"], "c": 1}, {"q": "Kokia kita specialiai pažeidžiama programa minima?", "a": ["OWASP Juice Shop", "Metasploit", "OpenVAS", "Guacamole"], "c": 0}, {"q": "Koks skanavimo įrankis naudojamas DVWA praktikoje?", "a": ["Metasploitable", "OWASP ZAP", "WAF", "OWASP Juice Shop"], "c": 1}, {"q": "Kokia apsaugos technologija įtraukiama po pirmojo skenavimo?", "a": ["Metasploit", "OpenVAS", "RADIUS", "WAF"], "c": 3}, {"q": "Koks pagrindinis mokymosi ciklas pateiktas DVWA užduotyje?", "a": ["Įdiegti, pašalinti ir pamiršti aplikaciją", "Tik konfigūruoti WAF", "Tik skenuoti vieną kartą", "Skenuoti, apsaugoti su WAF, skenuoti dar kartą ir palyginti rezultatus"], "c": 3}, {"q": "Koks praktinės veiklos formatas nurodytas temoje?", "a": ["Teorija ir diskusija", "Egzaminas", "Praktinė veikla", "Tik teorija"], "c": 2}, {"q": "Kiek laiko numatyta praktinei veiklai?", "a": ["8 valandos", "4 valandos", "1 valanda", "2 valandos"], "c": 1}, {"q": "Kokia aplikacija naudojama automatizuotam OWASP ZAP skenavimui?", "a": ["Kali Linux", "Metasploitable", "Juice Shop", "DVWA"], "c": 3}, {"q": "Kokia aplikacija naudojama atskirai praktikai TryHackMe?", "a": ["OWASP Juice Shop", "DVWA", "OpenVAS", "Metasploitable"], "c": 0}, {"q": "Koks sprendimas naudojamas nesaugiai aplikacijai apsaugoti?", "a": ["Metasploit", "OpenVAS", "WAF", "TryHackMe"], "c": 2}, {"q": "Koks tikslas palyginti rezultatus po WAF įdiegimo?", "a": ["Įvertinti, kaip pasikeičia skenavimo rezultatai", "Patikrinti DNS", "Nustatyti OS versiją", "Patikrinti vartotojo paskyrą"], "c": 0}, {"q": "Koks įrankis yra skanavimo įrankis šioje praktikoje?", "a": ["Juice Shop", "DVWA", "WAF", "OWASP ZAP"], "c": 3}, {"q": "Kuri iš šių yra pažeidžiama internetinė aplikacija?", "a": ["DVWA", "WAF", "OWASP ZAP", "Kali Linux"], "c": 0}, {"q": "Kuri iš šių yra dar viena pažeidžiama programa, naudojama TryHackMe?", "a": ["Metasploit", "OWASP Juice Shop", "OpenVAS", "Kali Linux"], "c": 1}, {"q": "Kokia tema apima nesaugios aplikacijos apsaugą?", "a": ["Metasploit exploit'ų kūrimas", "DNS zonos valdymas", "WAF konfigūravimas", "802.1X autentifikacija"], "c": 2}, {"q": "Koks metodas naudojamas WAF poveikiui praktiškai įvertinti?", "a": ["Pakartotinis OWASP ZAP skenavimas", "Tik vartotojo apklausa", "Tik sistemos perkrovimas", "Tik DNS patikra"], "c": 0}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
