<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic 45 — Employee Cybersecurity Training</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe4ec;--accent:#2563eb;--green:#16a34a;--greenbg:#dcfce7;--red:#dc2626;--redbg:#fee2e2}
body.dark{--bg:#101318;--card:#191d24;--text:#f3f4f6;--muted:#a7afbd;--border:#303642;--accent:#60a5fa;--green:#4ade80;--greenbg:#153b24;--red:#f87171;--redbg:#431b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.container{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.theme{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.question{font-size:21px;line-height:1.4;margin:0 0 20px;font-weight:700}.answers{display:grid;gap:11px}
.answer{width:100%;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:11px;background:transparent;color:var(--text)}
.answer:hover:not(:disabled){border-color:var(--accent);background:rgba(37,99,235,.06)}.answer.correct{background:var(--greenbg);border-color:var(--green)}.answer.wrong{background:var(--redbg);border-color:var(--red)}.answer:disabled{cursor:default}
.next{margin-top:18px;width:100%;padding:13px 16px;border-radius:11px;background:var(--accent);color:#fff;border:0;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:44px;font-weight:800;margin:15px 0 5px}.percent{font-size:22px;color:var(--muted)}
.retry{margin-top:22px;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-weight:700}
@media(max-width:560px){h1{font-size:23px}.card{padding:18px}.question{font-size:19px}}
</style></head><body><div class="container">
<div class="top"><div><h1>Topic 45 — Employee Cybersecurity Training</h1><div class="subtitle">Security awareness, phishing simulations, compliance and practical training</div></div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button></div><div id="quiz"></div></div>
<script>
const bank=[{"q": "Kokia pagrindinė 45 temos tema?", "a": ["EDR sprendimai darbo vietoms", "Centralizuotas tapatybių valdymas", "Darbuotojų kibernetinio saugumo mokymų organizavimas", "Fizinė darbo vietos apsauga"], "c": 2}, {"q": "Kokia paskaitos trukmė?", "a": ["4 valandos", "2 valandos", "6 valandos", "8 valandos"], "c": 0}, {"q": "Koks paskaitos formatas?", "a": ["Tik teorija", "Egzaminas", "Tik praktika", "Teorija + praktika"], "c": 3}, {"q": "Kokia viena iš paskaitos temų?", "a": ["Tinklo topologijų projektavimas", "DNS serverių administravimas", "Darbuotojų kibernetinės saugos mokymų temos", "SIEM taisyklių kūrimas"], "c": 2}, {"q": "Kokia tema susijusi su atitiktimi?", "a": ["VPN protokolų atitiktis", "Darbuotojų mokymų svarba atitikčiai", "Serverių inventorizacija", "DNS atitiktis"], "c": 1}, {"q": "Kokia praktinių mokymų kryptis nagrinėjama?", "a": ["Tik serverių grūdinimas", "Praktiniai darbuotojų saugos mokymai", "Tik tinklo skenavimas", "Tik programavimo mokymai"], "c": 1}, {"q": "Kodėl darbuotojai dažnai apibūdinami kaip silpniausia saugumo grandis?", "a": ["Darbuotojai negali naudoti MFA", "Darbuotojai neturi kompiuterių", "Darbuotojai neturi prieigos prie informacijos", "Beveik kiekvienas žymesnis įsilaužimas ar informacijos nutekinimas turi socialinės inžinerijos dedamąją"], "c": 3}, {"q": "Ar patyrę informacinės saugos vartotojai gali pasimauti ant sofistikuotų socialinės inžinerijos atakų?", "a": ["Taip", "Tik nauji darbuotojai", "Tik administratoriai", "Ne"], "c": 0}, {"q": "Kaip gerus saugumo pagrindus turintys darbuotojai gali prisidėti prie saugumo?", "a": ["Jie gali pakeisti visas saugumo sistemas", "Jie gali panaikinti socialinę inžineriją", "Jie gali pakeisti SOC komandą", "Jie gali tapti stipria gynybine linija"], "c": 3}, {"q": "Kodėl mokymai neturėtų bandyti paversti kiekvieno darbuotojo saugumo specialistu?", "a": ["Saugumo specialistų organizacijose nebūna", "Darbuotojai negali naudotis kompiuteriais", "Organizacijos darbuotojai nėra saugumo specialistai", "Mokymai skirti tik administratoriams"], "c": 2}, {"q": "Kas laikoma geriausiais baziniais saugumo mokymais kiekvienam darbuotojui?", "a": ["Tik pažangus įsilaužimų testavimas", "Tik kriptografija", "Bazinė saugumo higiena ir saugus darbas kompiuteriu", "Tik tinklo administravimas"], "c": 2}, {"q": "Koks dar svarbus mokymų tikslas?", "a": ["Grėsmių atpažinimas ir aiški informacija, kaip bei kur pranešti apie potencialų incidentą", "Išmokti administruoti DNS", "Išmokti programuoti antivirusą", "Išmokti kurti VPN"], "c": 0}, {"q": "Kuri bazinė darbo su kompiuteriu užduotis minima mokymų temose?", "a": ["SQL optimizavimas", "Slaptažodžių sudėtingumas", "Tinklo maršrutizavimas", "DNS zonų kūrimas"], "c": 1}, {"q": "Kokia MFA tema turi būti mokoma?", "a": ["MFA išjungimas viešuose tinkluose", "MFA naudojimo svarba", "Tik MFA serverio diegimas", "MFA pašalinimas"], "c": 1}, {"q": "Koks fizinis saugumo veiksmas minimas?", "a": ["Monitoriaus išjungimas kartą per savaitę", "VPN išjungimas", "Kompiuterio perkėlimas į serverinę", "Kompiuterio ekrano užrakinimas atsitraukiant nuo darbo vietos"], "c": 3}, {"q": "Kas yra informacijos klasifikavimo politikos?", "a": ["Antivirusinių aprašų taisyklės", "DNS zonų taisyklės", "Politikos, apibrėžiančios informacijos žymas ir tai, kokią informaciją galima dalintis su žmonėmis už organizacijos ribų", "VPN konfigūracijos taisyklės"], "c": 2}, {"q": "Kodėl svarbu mokyti apie informacijos jautrumą ir slaptumą?", "a": ["Darbuotojai gali nežinoti, kokia informacija yra jautri", "Kad darbuotojai galėtų administruoti serverius", "Kad būtų galima kurti DNS zonas", "Kad būtų galima išjungti MFA"], "c": 0}, {"q": "Kokios specifinės žinios gali būti reikalingos pagal organizacijos veiklos šaką?", "a": ["Tik VPN protokolai", "Tik programavimo kalbos", "Finansų, sveikatos apsaugos ir kitų griežtai reguliuojamų organizacijų saugumo kriterijai", "Tik tinklo topologijos"], "c": 2}, {"q": "Kokia svarbi mokymų dedamoji minima visiems darbuotojams?", "a": ["Slaptažodžių dalinimasis", "Administratoriaus teisių suteikimas visiems", "Pareigingumo jausmo diegimas, kad darbuotojai nebūtų abejingi pastebėję potencialų incidentą", "Saugumo priemonių išjungimas"], "c": 2}, {"q": "Kodėl reikia periodiškai supažindinti darbuotojus su naujomis techninėmis saugumo priemonėmis?", "a": ["Kad būtų galima išjungti saugumo agentus", "Kad darbuotojai suprastų naujai diegiamas saugumo priemones", "Kad būtų galima atsisakyti mokymų", "Kad darbuotojai administruotų visas sistemas"], "c": 1}, {"q": "Kas turi būti aiškiai apibrėžta darbuotojams incidento atveju?", "a": ["Tvarka, pagal kurią darbuotojai turi pranešti apie saugumo incidentus", "Tik VPN adresas", "Tik administratoriaus slaptažodis", "Tik antiviruso versija"], "c": 0}, {"q": "Kaip organizacijos dažnai organizuoja darbuotojų kibernetinio saugumo mokymus?", "a": ["Tik organizuoja mokymus IT skyriuje", "Naudoja informacines sistemas, leidžiančias darbuotojui mokytis patogiu metu", "Tik rengia metinį susirinkimą", "Tik siunčia PDF dokumentą"], "c": 1}, {"q": "Iš ko paprastai susideda tokie mokymai?", "a": ["Tik vaizdo konferencijų", "Tik praktinių laboratorijų", "Tik el. laiškų", "Teksto, vaizdo įrašų ir po skyrių atliekamų testų"], "c": 3}, {"q": "Koks testų tikslas po mokymų skyriaus?", "a": ["Patikrinti DNS", "Sukurti naują vartotoją", "Patikrinti, kaip darbuotojas įsisavino pateiktą informaciją", "Įdiegti antivirusą"], "c": 2}, {"q": "Ką informacinė sistema gali fiksuoti po mokymų?", "a": ["Kiek darbuotojų turi VPN", "Kokia dalis darbuotojų yra praėjusi mokymus", "Kiek darbuotojų naudoja DNS", "Kiek darbuotojų turi serverius"], "c": 1}, {"q": "Kam mokymai tipiškai privalomi?", "a": ["Tik IT administratoriams", "Naujiems įmonės darbuotojams", "Tik išoriniams klientams", "Tik vadovams"], "c": 1}, {"q": "Koks periodiškumas dažniausiai minimas?", "a": ["Kas penkerius metus", "Kartą per metus", "Kasdien", "Kartą per valandą"], "c": 1}, {"q": "Ar bendriniai mokymų standartai būtinai pakankami efektyviai saugos pasaulėžiūrai suformuoti?", "a": ["Tik IT įmonėse", "Tik mažose įmonėse", "Ne, nebūtinai", "Taip, visada"], "c": 2}, {"q": "Kuo darbuotojų mokymas gali būti svarbus be informacijos saugumo?", "a": ["Jis panaikina MFA poreikį", "Jis gali būti reikalingas gauti ar išlaikyti industrijoje vertinamas sertifikacijas", "Jis pakeičia antivirusą", "Jis pakeičia auditus"], "c": 1}, {"q": "Kokia sertifikacija minima kaip susijusi su informacijos saugos valdymu?", "a": ["ISO 9001 tik", "PCI DSS tik", "NIST CSF tik", "ISO 27001"], "c": 3}, {"q": "Ko ISO27001 ir kitos informacijos saugos valdymo sertifikacijos reikalauja darbuotojų mokymų srityje?", "a": ["Tik vieno mokymo vadovui", "Tik antiviruso diegimo", "Privalomų darbuotojų mokymų ir įrodymų apie jų pravedimą bei išklausymą", "Tik VPN konfigūracijos"], "c": 2}, {"q": "Kokia sertifikacijų reikšmė minima verslo santykiuose?", "a": ["Jos pakeičia visas saugumo sistemas", "Jos skirtos tik programavimui", "Jos panaikina darbuotojų mokymus", "Kai kurios kompanijos gali nesvarstyti organizacijos kaip partnerio be tam tikro minimalaus kokybės lygio"], "c": 3}, {"q": "Su kuo dažniausiai siejami praktiniai darbuotojų saugos mokymai?", "a": ["Gebėjimu administruoti Active Directory", "Gebėjimu identifikuoti apgaules ir phishing tipo atakas", "Gebėjimu kurti EDR", "Gebėjimu konfigūruoti DNS"], "c": 1}, {"q": "Kodėl phishing mokymai aktualūs darbuotojams?", "a": ["Phishing skirtas tik administratoriams", "Phishing veikia tik serverius", "Phishing neveikia el. paštu", "Tokio tipo atakos dažniausiai yra nutaikytos į individualius darbuotojus"], "c": 3}, {"q": "Kas yra phishing simuliacijos?", "a": ["EDR agentas", "DNS protokolas", "Praktinė saugumo mokymo proceso dalis, papildanti teorinius mokymus", "Antivirusinės programos dalis"], "c": 2}, {"q": "Kokia platforma dažniausiai naudojama darbuotojų budrumui tikrinti?", "a": ["DNS", "Elektroninis paštas", "FTP", "VPN"], "c": 1}, {"q": "Kuri platforma minima kaip phishing simuliacijų paslaugos pavyzdys?", "a": ["Apache", "KnowBe4", "MySQL", "OpenEDR"], "c": 1}, {"q": "Kokie Microsoft įrankiai gali būti naudojami phishing mokymuose?", "a": ["Tik IIS", "Tik Windows Defender Firewall", "Tik Active Directory", "Integruoti M365 įrankiai"], "c": 3}, {"q": "Kokia atviro kodo phishing simuliacijų platforma minima?", "a": ["OpenEDR", "Wazuh", "Keycloak", "GoPhish"], "c": 3}, {"q": "Kokia yra viena dažniausių phishing laiškų temų?", "a": ["VPN serverio perkrovimas", "Pranešimas apie RAM naudojimą", "DNS zonos pakeitimas", "Prašymas skubiai patvirtinti savo slaptažodį"], "c": 3}, {"q": "Kokia kita dažna phishing laiško tema?", "a": ["Prašymas atnaujinti apmokėjimo informaciją", "Pranešimas apie operacinės sistemos branduolį", "Prašymas pakeisti kompiuterio monitorių", "Pranešimas apie DNS TTL"], "c": 0}, {"q": "Koks vidinis organizacijos scenarijus gali būti naudojamas phishing laiške?", "a": ["Pranešimas apie IP adresų rezervaciją", "Pranešimas apie svarbių vidinių darbo politikų pasikeitimą", "Pranešimas apie fizinės spintos remontą", "Pranešimas apie serverio RAM"], "c": 1}, {"q": "Koks siuntų scenarijus minimas tarp phishing temų?", "a": ["Pranešimas apie DNS zoną", "Pranešimas apie nepristatytą siuntą", "Pranešimas apie antiviruso versiją", "Pranešimas apie VPN sertifikatą"], "c": 1}, {"q": "Koks failų dalinimosi scenarijus minimas?", "a": ["Pranešimas apie DHCP", "Pranešimas apie BIOS atnaujinimą", "Pranešimas apie DNS failą", "Pranešimas apie pasidalintus failus Dropbox ar kitoje failų dalinimosi platformoje"], "c": 3}, {"q": "Koks finansinis scenarijus minimas?", "a": ["Pranešimas apie antiviruso aprašą", "Pranešimas apie operacinės sistemos licenciją", "Pranešimas apie VPN", "Priminimas apie neapmokėtą sąskaitą"], "c": 3}, {"q": "Iš ko susideda gera phishing kampanija?", "a": ["Tik iš prisegto failo", "Tik iš nuorodos", "Iš kelių dedamųjų, apimančių įtikinamą turinį, techninę implementaciją, vartotojo reakcijos iššaukimą ir rezultatų statistiką", "Tik iš netikro domeno"], "c": 2}, {"q": "Kaip turi būti pritaikytas phishing laiško turinys?", "a": ["Visiems vienodas ir atsitiktinis", "Įtikinamas ir pritaikytas tikslinei auditorijai", "Tik labai trumpas", "Tik techninis"], "c": 1}, {"q": "Ar skirtingiems organizacijos skyriams gali būti naudojamas skirtingas phishing laiško turinys?", "a": ["Taip", "Tik IT skyriui", "Tik vadovybei", "Ne"], "c": 0}, {"q": "Kuo gali skirtis phishing laiško stilius skirtingiems darbuotojams?", "a": ["Jis visada turi būti vienodas", "Jis turi būti anoniminis", "Jis gali būti parašytas stiliumi, kurio tikimasi iš laiško siuntėjo", "Jis turi būti tik techninis"], "c": 2}, {"q": "Kas sudaro kokybišką techninę phishing laiško implementaciją?", "a": ["Tik didelis šriftas", "Tik spalvotas logotipas", "Realistiškas domenas, tinkami SPF/DKIM/DMARC nustatymai ar imituojamas teisėtas siuntėjas", "Tik trumpa nuoroda"], "c": 2}, {"q": "Koks domeno scenarijus gali būti naudojamas simuliacijoje?", "a": ["Tik viešas DNS resolveris", "Atskirai įgytas domenas, vizualiai panašus į tikrąjį įmonės domeną", "Tik localhost", "Tik įmonės DNS serveris"], "c": 1}, {"q": "Kokia vartotojo reakcija yra pagrindinis phishing testo tikslas?", "a": ["Kad vartotojas įdiegtų VPN", "Kad vartotojas būtų suinteresuotas paspausti nuorodą ar paleisti prisegtą failą", "Kad vartotojas pakeistų DNS", "Kad vartotojas išjungtų kompiuterį"], "c": 1}, {"q": "Koks netikras puslapis gali būti naudojamas simuliacijoje?", "a": ["BIOS langas", "Prisijungimo puslapis, atrodantis kaip kompanijos prisijungimo langas", "DHCP serverio puslapis", "DNS administravimo puslapis"], "c": 1}, {"q": "Ką organizacija turi rinkti po phishing testo?", "a": ["Tik el. laiškų skaičių", "Tikslią statistiką apie testo sėkmę", "Tik IP adresus", "Tik vartotojų slaptažodžius"], "c": 1}, {"q": "Ką darbuotojai turi žinoti po teorinių mokymų?", "a": ["Kaip administruoti DNS", "Kaip tiksliai elgtis įtariant phishing ataką", "Kaip programuoti phishing platformą", "Kaip kurti domenų mišką"], "c": 1}, {"q": "Kokia platforma nagrinėjama praktinėje dalyje?", "a": ["Wazuh", "GoPhish", "OpenEDR", "Entra ID"], "c": 1}, {"q": "Koks pirmas GoPhish praktinės užduoties etapas?", "a": ["Įdiegti EDR", "Sukurti Active Directory mišką", "Išjungti el. paštą", "Sukurti naują phishing kampaniją"], "c": 3}, {"q": "Koks kampanijos tikslas nurodomas praktinėje užduotyje?", "a": ["Išbandyti VPN", "Patikrinti DNS", "Gauti aukos prisijungimo informaciją", "Sukurti naują serverį"], "c": 2}, {"q": "Ką reikia atlikti su egzistuojančiais GoPhish šablonais?", "a": ["Juos išanalizuoti", "Juos įdiegti kaip EDR", "Juos konvertuoti į DNS", "Juos ištrinti"], "c": 0}, {"q": "Koks kitas kampanijos kūrimo etapas?", "a": ["Sukurti DNS zoną", "Pasirinkti šabloną ir sukurti žinutę", "Įdiegti WordPress", "Sukurti VPN"], "c": 1}, {"q": "Kam praktinėje užduotyje paleidžiama phishing kampanija?", "a": ["Visiems viešiems vartotojams", "Tik EDR agentui", "Asmeniniam ir lektoriaus el. paštui", "Tik DNS serveriui"], "c": 2}, {"q": "Kas daroma su surinktais phishing testo rezultatais?", "a": ["Jie siunčiami viešai", "Jie naudojami DNS konfigūracijai", "Jie iškart ištrinami", "Jie analizuojami kartu su dėstytoju"], "c": 3}, {"q": "Kokia diskusija numatyta praktinės užduoties pabaigoje?", "a": ["Kaip įdiegti EDR", "Kaip pakeisti operacinę sistemą", "Kaip galima patobulinti phishing kampaniją", "Kaip sukurti DNS serverį"], "c": 2}];let quiz=[],index=0,score=0,answered=false;
function toggleTheme(){document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');localStorage.setItem('darkMode',d?'1':'0');document.getElementById('themeBtn').textContent=d?'☀️ Light mode':'🌙 Dark mode'}
if(localStorage.getItem('darkMode')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,10);index=0;score=0;answered=false;render()}
function render(){let x=quiz[index];document.getElementById('quiz').innerHTML=`<div class="progress">Question ${index+1} of ${quiz.length}</div><div class="card"><div class="question">${esc(x.q)}</div><div class="answers">${x.a.map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><button class="next" id="next" onclick="next()" disabled>${index===quiz.length-1?'Finish →':'Next question →'}</button></div>`}
function answer(c){if(answered)return;answered=true;let x=quiz[index],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.disabled=true;if(i===x.c)b.classList.add('correct')});if(c===x.c)score++;else bs[c].classList.add('wrong');document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index===quiz.length-1){result();return}index++;answered=false;render()}
function result(){document.getElementById('quiz').innerHTML=`<div class="card result"><div class="progress">Quiz completed</div><h2>Your result</h2><div class="score">${score} / 10</div><div class="percent">${score*10}%</div><button class="retry" onclick="start()">Try again</button></div>`}
start();
</script></body></html>
